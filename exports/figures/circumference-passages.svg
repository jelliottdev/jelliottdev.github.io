<svg xmlns="http://www.w3.org/2000/svg" width="360" height="584" viewBox="0 0 360 584" role="img" aria-labelledby="title desc">
<title id="title">Circumference across three known passages</title>
<desc id="desc">LP1-10 introduces the circumference through consumption, preservation and adherence. LP1-14 associates the I with the voice of the circumference. LP2-57 asks for circumferences to be shed, beside inward divinity and emergence. This is a map of textual occurrences, not a sequence of cipher operations.</desc>
<rect width="360" height="584" fill="#ffffff"/>
<g font-family="Arial, sans-serif" fill="#292d2f">
<text x="18" y="30" font-size="19" font-weight="bold">One term, three contexts</text>
<text x="18" y="54" font-size="13" fill="#586268">Paraphrases of the known readings</text>
<g stroke="#b6c0c4" fill="#fff"><rect x="18" y="74" width="324" height="144" rx="2"/><rect x="18" y="234" width="324" height="144" rx="2"/><rect x="18" y="394" width="324" height="144" rx="2"/></g>
<g font-size="13" fill="#325768" font-weight="bold"><text x="32" y="98">LP1-10 · THE LOSS OF DIVINITY</text><text x="32" y="258">LP1-14 · SECOND KOAN</text><text x="32" y="418">LP2-57 · PARABLE</text></g>
<g font-size="18" font-weight="bold"><text x="32" y="127">Behavior</text><text x="32" y="287">The inner voice</text><text x="32" y="447">Shedding and emergence</text></g>
<g font-size="15"><text x="32" y="153">Consumption, preservation, adherence:</text><text x="32" y="176">three behaviors attributed to</text><text x="32" y="199">the circumference.</text>
<text x="32" y="313">The I is the circumference’s voice.</text><text x="32" y="336">The student's denial becomes</text><text x="32" y="359">the master's example.</text>
<text x="32" y="473">The term becomes plural:</text><text x="32" y="496">circumferences to shed, beside</text><text x="32" y="519">divinity within and emergence.</text></g>
<text x="18" y="565" font-size="12" fill="#586268">Textual connections; no cipher operation is specified.</text>
</g></svg>
