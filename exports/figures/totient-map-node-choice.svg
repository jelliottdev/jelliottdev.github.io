<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
<title id="title">The same SOON key does not fix the next axis</title><desc id="desc">Three documented nodes transform to L R EA and decrypt the same SOON block. Their centers give different predictions under the axis formula: horizontal, diagonal, diagonal.</desc>
<rect width="390" height="660" fill="white"/><g font-family="sans-serif" fill="#243842">
<text x="20" y="30" font-size="21">Same key, different next axis</text>
<text x="20" y="56" font-size="14">Three nodes documented in the source</text>
<g fill="#f3f5f4" stroke="#ccd5d8"><rect x="20" y="78" width="350" height="94" rx="3"/><rect x="20" y="184" width="350" height="94" rx="3"/><rect x="20" y="290" width="350" height="94" rx="3"/></g>
<text x="35" y="104" font-size="17">L – C – EA · center (25,7)</text><text x="35" y="132" font-size="14">φ(5) = 4 → R</text><text x="35" y="155" font-size="15" fill="#235c74">Next axis: horizontal · score 0</text>
<text x="35" y="210" font-size="17">L – I – EA · center (20,15)</text><text x="35" y="238" font-size="14">φ(10) = 4 → R</text><text x="35" y="261" font-size="15" fill="#855a2c">Next axis: diagonal · score −1</text>
<text x="35" y="316" font-size="17">L – EO – EA · center (25,14)</text><text x="35" y="344" font-size="14">φ(12) = 4 → R</text><text x="35" y="367" font-size="15" fill="#855a2c">Next axis: diagonal · score −1</text>
<path d="M195 391v28" stroke="#627984" stroke-width="2"/><path d="m190 414 5 7 5-7" fill="none" stroke="#627984" stroke-width="2"/>
<text x="20" y="450" font-size="18">All three derive L – R – EA</text><text x="20" y="480" font-size="15">Signature (0, −1, 0) → phase 2</text><text x="20" y="507" font-size="15">Aligned key EA – L – R</text><text x="20" y="534" font-size="15">X D W H − repeated key → S O O N</text>
<path d="M20 558h350" stroke="#ccd5d8"/>
<text x="20" y="587" font-size="15">The node choice still matters.</text><text x="20" y="613" font-size="14">A matching word does not select which</text><text x="20" y="635" font-size="14">of these centers supplies the next-axis rule.</text></g></svg>
