<svg xmlns="http://www.w3.org/2000/svg" width="360" height="340" viewBox="0 0 360 340" role="img" aria-labelledby="title desc">
<title id="title">Two orders, twenty-nine shifts each</title><desc id="desc">A fixed rune stream branches into original and reversed order. Each has shifts zero to twenty-eight. Together these make fifty-eight configurations.</desc>
<rect width="360" height="340" fill="#ffffff"/>
<g fill="none" stroke="#70818a" stroke-width="2"><path d="M180 76V102H90V126M180 102H270V126M90 220V250H270V220M180 250V274"/></g>
<g fill="#fff" stroke="#a8b3b8"><rect x="60" y="22" width="240" height="54" rx="3"/><rect x="14" y="126" width="152" height="94" rx="3"/><rect x="194" y="126" width="152" height="94" rx="3"/></g>
<g fill="#263b45" text-anchor="middle" font-family="Arial, sans-serif" font-size="17"><text x="180" y="55">One fixed rune stream</text><text x="90" y="155">Original order</text><text x="270" y="155">Reversed order</text><text x="90" y="181" font-size="15">Shifts 0–28</text><text x="270" y="181" font-size="15">Shifts 0–28</text><text x="90" y="206" font-size="15">29 configurations</text><text x="270" y="206" font-size="15">29 configurations</text><text x="180" y="298" font-size="21" font-weight="bold">29 + 29 = 58</text><text x="180" y="324" font-size="15">Configurations, not findings</text></g>
</svg>
