<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 535" role="img" aria-labelledby="title desc">
<title id="title">One ciphertext, different allowed keys</title>
<desc id="desc">For ciphertext zero one modulo three, all nine plaintext pairs fit when any two-symbol key is allowed. Only three fit a repeated one-symbol key.</desc>
<rect width="360" height="535" fill="white"/>
<style>text{font:14px Arial,sans-serif;fill:#253d49}.small{font-size:12px}.head{font-weight:bold}</style>
<text x="14" y="25" class="head">Observed ciphertext: 0 1</text>
<text x="14" y="48">C = P + K, coordinate by coordinate mod 3</text>
<text x="14" y="85" class="head">Plaintext P</text>
<text x="126" y="85" class="head">Required K</text>
<text x="240" y="85" class="head">Repeated?</text>
<text x="28" y="118">0 0</text>
<text x="143" y="118">0 1</text>
<text x="260" y="118">No</text>
<rect x="10" y="135" width="338" height="32" fill="#e8eff3"/>
<text x="28" y="156">0 1</text>
<text x="143" y="156">0 0</text>
<text x="260" y="156">Yes</text>
<text x="28" y="194">0 2</text>
<text x="143" y="194">0 2</text>
<text x="260" y="194">No</text>
<text x="28" y="232">1 0</text>
<text x="143" y="232">2 1</text>
<text x="260" y="232">No</text>
<text x="28" y="270">1 1</text>
<text x="143" y="270">2 0</text>
<text x="260" y="270">No</text>
<rect x="10" y="287" width="338" height="32" fill="#e8eff3"/>
<text x="28" y="308">1 2</text>
<text x="143" y="308">2 2</text>
<text x="260" y="308">Yes</text>
<rect x="10" y="325" width="338" height="32" fill="#e8eff3"/>
<text x="28" y="346">2 0</text>
<text x="143" y="346">1 1</text>
<text x="260" y="346">Yes</text>
<text x="28" y="384">2 1</text>
<text x="143" y="384">1 0</text>
<text x="260" y="384">No</text>
<text x="28" y="422">2 2</text>
<text x="143" y="422">1 2</text>
<text x="260" y="422">No</text>
<text x="14" y="467">Any two-symbol key: all 9 plaintexts fit.</text>
<text x="14" y="490">Repeated one-symbol key: only 3 fit.</text>
<text x="14" y="518" class="small">A mathematical example, not manuscript evidence.</text>
</svg>
