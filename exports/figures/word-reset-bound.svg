<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 430" role="img" aria-labelledby="title desc"><title id="title">Two word-local models preserve different things</title><desc id="desc">A shared deterministic reset maps equal words to equal outputs. A shared symbol map followed by independent shuffling preserves symbol counts instead of order.</desc><rect width="360" height="430" fill="#ffffff"/><g fill="#25343b" font-family="system-ui,sans-serif"><text x="20" y="32" font-size="18" font-weight="600">Same word, same context</text><text x="20" y="62" font-size="14">Deterministic reset</text><g font-size="21" font-family="monospace"><text x="25" y="105">A B A → 2 5 2</text><text x="25" y="141">A B A → 2 5 2</text></g><text x="20" y="176" font-size="15">Equal input must give equal output.</text><path d="M20 198H340" stroke="#c8ced0"/><text x="20" y="230" font-size="18" font-weight="600">Same map, different shuffle</text><g font-size="21" font-family="monospace"><text x="25" y="273">A B A → 2 2 5</text><text x="25" y="309">A B A → 5 2 2</text></g><text x="20" y="346" font-size="15">Order can change; counts stay equal.</text><text x="20" y="385" font-size="14">These implications require shared rules.</text><text x="20" y="410" font-size="14">They do not prove the plaintext repeats.</text></g></svg>