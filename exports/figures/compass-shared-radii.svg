<svg xmlns="http://www.w3.org/2000/svg" width="360" height="280" viewBox="0 0 360 280" role="img" aria-labelledby="t d">
<title id="t">Horizontal dot spacing at the same native scale</title><desc id="d">LP2-33 has adjacent dot separations about 417.47 and 478.23 pixels. LP2-39 has separations 196 and 224.5 pixels. Both rows use the same horizontal plotting scale; their vertical positions are separated for readability.</desc>
<rect width="360" height="280" fill="#faf9f6"/>
<g font-family="sans-serif" fill="#243c48">
<text x="20" y="29" font-size="17" font-weight="bold">Two pages, different dot spacing</text>
<text x="20" y="54" font-size="13">Same horizontal scale · threshold 140</text>
<text x="20" y="88" font-size="15">LP2-33</text>
<path d="M115.79 111H227.75" stroke="#687e87"/>
<circle cx="115.79" cy="111" r="4"/><circle cx="167.97" cy="111" r="4"/><circle cx="227.75" cy="111" r="4"/>
<text x="112" y="101" font-size="12">A</text><text x="164" y="101" font-size="12">B</text><text x="224" y="101" font-size="12">C</text>
<text x="20" y="140" font-size="13">AB ≈ 417.47 px · BC ≈ 478.23 px</text>
<text x="20" y="174" font-size="15">LP2-39</text>
<path d="M182.19 198H234.75" stroke="#687e87"/>
<circle cx="182.19" cy="198" r="4"/><circle cx="206.69" cy="198" r="4"/><circle cx="234.75" cy="198" r="4"/>
<text x="178" y="188" font-size="12">A</text><text x="203" y="188" font-size="12">B</text><text x="231" y="188" font-size="12">C</text>
<text x="20" y="227" font-size="13">AB = 196 px · BC = 224.5 px</text>
<text x="20" y="259" font-size="12">Vertical positions separated for readability.</text>
</g></svg>
