<svg xmlns="http://www.w3.org/2000/svg" width="360" height="340" viewBox="0 0 360 340" role="img" aria-labelledby="title desc">
<title id="title">All-modulus affine palette search</title><desc id="desc">812 output pairs for inputs 2 and 3. One is identity for all moduli above 109. The other 811 reduce to 13212 candidate maps; none survive.</desc>
<rect width="360" height="340" fill="#faf9f6"/>
<g fill="#243c48" font-family="sans-serif" text-anchor="middle">
<text x="180" y="29" font-size="17" font-weight="bold">29 literal prime values</text>
<text x="180" y="55" font-size="14">Choose distinct outputs for 2 and 3</text>
<rect x="35" y="72" width="290" height="44" fill="#e8eef0" stroke="#687e87"/>
<text x="180" y="100" font-size="17">812 anchor pairs</text>
<path d="M180 117V139M90 139H270M90 139V155M270 139V155" stroke="#687e87" fill="none"/>
<text x="90" y="178" font-size="16" font-weight="bold">1 identity pair</text>
<text x="90" y="201" font-size="13">All m &gt; 109</text>
<text x="270" y="178" font-size="16" font-weight="bold">811 other pairs</text>
<text x="270" y="201" font-size="13">Divisibility witnesses</text>
<path d="M270 212V229" stroke="#687e87"/>
<text x="270" y="249" font-size="15">13,212 maps</text>
<text x="270" y="272" font-size="13">No survivors</text>
<path d="M90 213V291H270V281" stroke="#687e87" fill="none"/>
<text x="180" y="321" font-size="16" font-weight="bold">Only the identity permutation</text>
</g></svg>
