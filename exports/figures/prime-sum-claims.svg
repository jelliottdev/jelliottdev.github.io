<svg xmlns="http://www.w3.org/2000/svg" width="360" height="570" viewBox="0 0 360 570" role="img" aria-labelledby="title desc">
<title id="title">Three different claims about a prime sum</title>
<desc id="desc">Arithmetic: does the exact rune sequence total a prime? Pattern: how unusual is that result under a stated comparison? Intention: what connects the result to a deliberate choice by the authors? Each question needs its own evidence.</desc>
<rect width="360" height="570" fill="white"/>
<g fill="#f5f5f0" stroke="#bdc4c5">
<rect x="8" y="8" width="344" height="160" rx="3"/>
<rect x="8" y="190" width="344" height="160" rx="3"/>
<rect x="8" y="372" width="344" height="160" rx="3"/>
</g>
<g font-family="system-ui, sans-serif" fill="#242a2d" font-size="18">
<text x="22" y="38" font-weight="600">Arithmetic</text>
<text x="22" y="68">Does the exact sequence</text>
<text x="22" y="93">total a prime?</text>
<text x="22" y="126" fill="#365969">Check the runes, their values,</text>
<text x="22" y="151" fill="#365969">the sum, and its divisors.</text>
<text x="22" y="220" font-weight="600">Pattern</text>
<text x="22" y="250">How unusual is this result?</text>
<text x="22" y="283" fill="#365969">State the comparison and</text>
<text x="22" y="308" fill="#365969">count the other choices</text>
<text x="22" y="333" fill="#365969">that were considered.</text>
<text x="22" y="402" font-weight="600">Intention</text>
<text x="22" y="432">Was it deliberately arranged?</text>
<text x="22" y="465" fill="#365969">Look for evidence linking</text>
<text x="22" y="490" fill="#365969">the pattern to a choice</text>
<text x="22" y="515" fill="#365969">made by the authors.</text>
<text x="180" y="557" text-anchor="middle" font-size="15" fill="#596164">Different claims require different evidence.</text>
</g>
</svg>
