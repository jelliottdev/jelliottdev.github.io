<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="title desc"><title id="title">Relief printing: a schematic</title><desc id="desc">Ink on raised areas of a plate produces corresponding marks on paper. This is a simplified cross-section, not a historical reconstruction.</desc><rect width="360" height="300" fill="#faf9f5"/><g font-family="Arial, sans-serif" fill="#26343b"><text x="20" y="30" font-size="18">Plate surface, seen from the side</text><path d="M25 140V105H75V75H125V105H210V75H260V105H335V140Z" fill="#c3c7c9" stroke="#65727a"/><path d="M75 73H125M210 73H260" stroke="#245d77" stroke-width="6"/><text x="20" y="172" font-size="14">Blue: ink on raised printing areas</text><path d="M180 182V210M174 204L180 210L186 204" fill="none" stroke="#65727a" stroke-width="2"/><text x="20" y="235" font-size="18">Corresponding marks on paper</text><path d="M25 255H335" stroke="#b9b5ac" stroke-width="2"/><path d="M75 253H125M210 253H260" stroke="#245d77" stroke-width="6"/><text x="20" y="284" font-size="12">Schematic only; dimensions are not to scale.</text></g></svg>