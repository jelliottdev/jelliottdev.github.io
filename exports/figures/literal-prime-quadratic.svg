<svg xmlns="http://www.w3.org/2000/svg" width="360" height="650" viewBox="0 0 360 650" role="img" aria-labelledby="title desc">
<title id="title">How the quadratic test covers every modulus</title>
<desc id="desc">21,924 anchor choices split into 21,923 branches checked through finite divisors and one identity-anchor branch. The latter is checked through modulus 321, with a bound excluding nonidentity behavior above 321. Both routes leave only identity.</desc>
<rect width="360" height="650" fill="#ffffff"/>
<g font-family="Arial,sans-serif" fill="#263b45">
<text x="18" y="29" font-size="18" font-weight="bold">An infinite range, two cases</text>
<text x="18" y="53" font-size="13">Fixed quadratic map; full 29-prime alphabet</text>
<rect x="18" y="73" width="324" height="82" fill="#e7eef1" stroke="#315f73"/>
<text x="31" y="98" font-size="16" font-weight="bold">21,924 anchor choices</text>
<text x="31" y="122" font-size="14">Distinct images of the inputs 2, 3 and 5</text>
<text x="31" y="143" font-size="13">29 × 28 × 27 choices; every one retained</text>
<path d="M180 155V179" stroke="#315f73" stroke-width="2"/>
<rect x="18" y="179" width="324" height="158" fill="white" stroke="#9baaad"/>
<text x="31" y="205" font-size="16" font-weight="bold">21,923 finite-divisor branches</text>
<text x="31" y="230" font-size="14">Find a nonzero difference Q(x) − 6y.</text>
<text x="31" y="252" font-size="14">Any working modulus must divide it.</text>
<text x="31" y="278" font-size="14">Check every candidate coefficient:</text>
<text x="31" y="300" font-size="14">8,254,630 checks across these branches.</text>
<text x="31" y="324" font-size="14" font-weight="bold">No surviving map.</text>
<rect x="18" y="356" width="324" height="167" fill="white" stroke="#9baaad"/>
<text x="31" y="383" font-size="16" font-weight="bold">1 exact-image branch</text>
<text x="31" y="407" font-size="14">The anchors map to themselves.</text>
<text x="31" y="433" font-size="14">m = 110–321: check directly.</text>
<text x="31" y="457" font-size="14">m &gt; 321: any nonidentity shift is</text>
<text x="31" y="479" font-size="14">too large for the alphabet's span.</text>
<text x="31" y="507" font-size="14" font-weight="bold">Only identity remains.</text>
<path d="M180 523V547" stroke="#315f73" stroke-width="2"/>
<rect x="18" y="547" width="324" height="56" fill="#e7eef1" stroke="#315f73"/>
<text x="31" y="571" font-size="16" font-weight="bold">Result: identity only</text>
<text x="31" y="592" font-size="13">Every integer modulus greater than 109</text>
<text x="18" y="629" font-size="12">Not a test of partial alphabets or changing keys.</text>
</g></svg>
