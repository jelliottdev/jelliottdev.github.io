<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 440" role="img" aria-labelledby="title desc">
<title id="title">Where the 928-word carrier divides</title>
<desc id="desc">Mayfly occupies words 1–224, Wing and Tree 225–550, and Cuneiform 551–928. The halfway split after word 464 lies within Wing and Tree, on LP2-30.</desc>
<rect width="380" height="440" fill="white"/>
<style>text{font:16px Arial,sans-serif;fill:#25343a}.small{font-size:13px}</style>
<text x="20" y="28">Where the carrier divides</text>
<text x="20" y="51" class="small">928 rune-words · headings included</text>
<text x="20" y="84">Mayfly</text>
<text x="360" y="84" text-anchor="end" class="small">words 1–224</text>
<rect x="20" y="96" width="340" height="24" fill="#eef1f2"/>
<rect x="20.000" y="96" width="82.069" height="24" fill="#42687b"/>
<text x="20" y="139" class="small">LP2-23–26 · 224 words</text>
<text x="20" y="167">Wing and Tree</text>
<text x="360" y="167" text-anchor="end" class="small">words 225–550</text>
<rect x="20" y="179" width="340" height="24" fill="#eef1f2"/>
<rect x="102.069" y="179" width="119.440" height="24" fill="#42687b"/>
<text x="20" y="222" class="small">LP2-27–32 · 326 words</text>
<text x="20" y="250">Cuneiform</text>
<text x="360" y="250" text-anchor="end" class="small">words 551–928</text>
<rect x="20" y="262" width="340" height="24" fill="#eef1f2"/>
<rect x="221.509" y="262" width="138.491" height="24" fill="#42687b"/>
<text x="20" y="305" class="small">LP2-33–39 · 378 words</text>
<path d="M190 94 V294" stroke="#9a5526" stroke-width="2" stroke-dasharray="5 4"/>
<text x="20" y="325">Halfway: after word 464</text>
<text x="20" y="350" class="small">LP2-30 · final printed row</text>
<text x="20" y="374" class="small">An ordinary word separator, not a group boundary.</text>
<text x="20" y="413" class="small">Shared scale: all 928 positions on every row.</text>
</svg>
