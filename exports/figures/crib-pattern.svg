<svg xmlns="http://www.w3.org/2000/svg" width="360" height="440" viewBox="0 0 360 440" role="img" aria-labelledby="title desc">
<title id="title">Fixed substitution: compare repeated positions</title><desc id="desc">One manuscript token and three hypothetical candidate mappings. Only the first candidate preserves all equalities and differences.</desc>
<rect width="360" height="440" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#243d4a">
<text x="12" y="20" font-size="14" font-weight="bold">LP2-42: archived token</text>
<rect x="12" y="30" width="58" height="36" rx="2" fill="#d9e8ee" stroke="#81939c"/><text x="41" y="54" text-anchor="middle" font-size="18">E</text>
<rect x="78" y="30" width="58" height="36" rx="2" fill="#f1dfc2" stroke="#81939c"/><text x="107" y="54" text-anchor="middle" font-size="18">IA</text>
<rect x="144" y="30" width="58" height="36" rx="2" fill="#d9e8ee" stroke="#81939c"/><text x="173" y="54" text-anchor="middle" font-size="18">E</text>
<rect x="210" y="30" width="58" height="36" rx="2" fill="#f1dfc2" stroke="#81939c"/><text x="239" y="54" text-anchor="middle" font-size="18">IA</text>
<rect x="276" y="30" width="58" height="36" rx="2" fill="#e4e0ef" stroke="#81939c"/><text x="305" y="54" text-anchor="middle" font-size="18">TH</text>
<text x="12" y="88" font-size="13">Pattern: 0 1 0 1 2</text>
<text x="12" y="125" font-size="14" font-weight="bold">Compatible with some fixed permutation</text>
<rect x="12" y="135" width="58" height="36" rx="2" fill="#d9e8ee" stroke="#81939c"/><text x="41" y="159" text-anchor="middle" font-size="18">F</text>
<rect x="78" y="135" width="58" height="36" rx="2" fill="#f1dfc2" stroke="#81939c"/><text x="107" y="159" text-anchor="middle" font-size="18">U</text>
<rect x="144" y="135" width="58" height="36" rx="2" fill="#d9e8ee" stroke="#81939c"/><text x="173" y="159" text-anchor="middle" font-size="18">F</text>
<rect x="210" y="135" width="58" height="36" rx="2" fill="#f1dfc2" stroke="#81939c"/><text x="239" y="159" text-anchor="middle" font-size="18">U</text>
<rect x="276" y="135" width="58" height="36" rx="2" fill="#e4e0ef" stroke="#81939c"/><text x="305" y="159" text-anchor="middle" font-size="18">TH</text>
<text x="12" y="193" font-size="13">E → F; IA → U; TH → TH</text>
<text x="12" y="230" font-size="14" font-weight="bold">Conflict: one input, two outputs</text>
<rect x="12" y="240" width="58" height="36" rx="2" fill="#d9e8ee" stroke="#81939c"/><text x="41" y="264" text-anchor="middle" font-size="18">F</text>
<rect x="78" y="240" width="58" height="36" rx="2" fill="#f1dfc2" stroke="#81939c"/><text x="107" y="264" text-anchor="middle" font-size="18">U</text>
<rect x="144" y="240" width="58" height="36" rx="2" fill="#d9e8ee" stroke="#81939c"/><text x="173" y="264" text-anchor="middle" font-size="18">F</text>
<rect x="210" y="240" width="58" height="36" rx="2" fill="#e4e0ef" stroke="#81939c"/><text x="239" y="264" text-anchor="middle" font-size="18">TH</text>
<rect x="276" y="240" width="58" height="36" rx="2" fill="#e1e9d5" stroke="#81939c"/><text x="305" y="264" text-anchor="middle" font-size="18">O</text>
<text x="12" y="298" font-size="13">IA would become both U and TH</text>
<text x="12" y="335" font-size="14" font-weight="bold">Conflict: different inputs merge</text>
<rect x="12" y="345" width="58" height="36" rx="2" fill="#d9e8ee" stroke="#81939c"/><text x="41" y="369" text-anchor="middle" font-size="18">F</text>
<rect x="78" y="345" width="58" height="36" rx="2" fill="#d9e8ee" stroke="#81939c"/><text x="107" y="369" text-anchor="middle" font-size="18">F</text>
<rect x="144" y="345" width="58" height="36" rx="2" fill="#d9e8ee" stroke="#81939c"/><text x="173" y="369" text-anchor="middle" font-size="18">F</text>
<rect x="210" y="345" width="58" height="36" rx="2" fill="#d9e8ee" stroke="#81939c"/><text x="239" y="369" text-anchor="middle" font-size="18">F</text>
<rect x="276" y="345" width="58" height="36" rx="2" fill="#f1dfc2" stroke="#81939c"/><text x="305" y="369" text-anchor="middle" font-size="18">U</text>
<text x="12" y="403" font-size="13">E and IA would both become F</text>
</g></svg>
