<svg xmlns="http://www.w3.org/2000/svg" width="360" height="270" viewBox="0 0 360 270" role="img" aria-labelledby="t d">
<title id="t">Why LP2-55 admits two extra maps</title><desc id="d">The page's prime 2 maps to 59 or 103. Its other 24 observed prime values remain unchanged. Neither target was present in the input, avoiding a collision on this page only.</desc>
<rect width="360" height="270" fill="#ffffff"/>
<g fill="#243c48" font-family="sans-serif" text-anchor="middle">
<text x="180" y="30" font-size="18" font-weight="bold">LP2-55: two exceptions</text>
<text x="180" y="55" font-size="14">One changed rune value in each map</text>
<rect x="20" y="80" width="95" height="65" fill="#e8eef0" stroke="#687e87"/>
<text x="67" y="108" font-size="17">F</text><text x="67" y="132" font-size="16">prime 2</text>
<path d="M115 112H160V89H220M160 112V140H220" fill="none" stroke="#687e87"/>
<text x="280" y="94" font-size="16">T · 59</text>
<text x="280" y="145" font-size="16">Y · 103</text>
<text x="180" y="187" font-size="15" font-weight="bold">24 observed odd primes: unchanged</text>
<text x="180" y="220" font-size="14">59 and 103 are absent from the input.</text>
<text x="180" y="244" font-size="14">No collision on this page’s support.</text>
</g></svg>
