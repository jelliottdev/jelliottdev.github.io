<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" role="img" aria-labelledby="title desc">
<title id="title">Reorder columns, then choose a reading direction</title>
<desc id="desc">An invented two-row grid ABCD and EFGH is reordered by source columns 2, 0, 3, 1 into CADB and GEHF. Reading across rows gives CADBGEHF. Reading down columns gives CGAEDHBF.</desc>
<rect width="360" height="520" fill="white"/>
<g font-family="Arial, sans-serif" fill="#263238">
<text x="16" y="30" font-size="20" font-weight="bold">Same grid, different readout</text>
<text x="16" y="55" font-size="15">Illustrative letters, not manuscript text</text>
<text x="16" y="91" font-size="18" font-weight="bold">1. Original columns</text>
<text x="54" y="118" text-anchor="middle" font-size="15">0</text>
<rect x="20" y="127" width="68" height="40" rx="2" fill="#eef3f5" stroke="#a1b2ba"/>
<text x="54" y="155" text-anchor="middle" font-size="24">A</text>
<rect x="20" y="171" width="68" height="40" rx="2" fill="#eef3f5" stroke="#a1b2ba"/>
<text x="54" y="199" text-anchor="middle" font-size="24">E</text>
<text x="134" y="118" text-anchor="middle" font-size="15">1</text>
<rect x="100" y="127" width="68" height="40" rx="2" fill="#eef3f5" stroke="#a1b2ba"/>
<text x="134" y="155" text-anchor="middle" font-size="24">B</text>
<rect x="100" y="171" width="68" height="40" rx="2" fill="#eef3f5" stroke="#a1b2ba"/>
<text x="134" y="199" text-anchor="middle" font-size="24">F</text>
<text x="214" y="118" text-anchor="middle" font-size="15">2</text>
<rect x="180" y="127" width="68" height="40" rx="2" fill="#eef3f5" stroke="#a1b2ba"/>
<text x="214" y="155" text-anchor="middle" font-size="24">C</text>
<rect x="180" y="171" width="68" height="40" rx="2" fill="#eef3f5" stroke="#a1b2ba"/>
<text x="214" y="199" text-anchor="middle" font-size="24">G</text>
<text x="294" y="118" text-anchor="middle" font-size="15">3</text>
<rect x="260" y="127" width="68" height="40" rx="2" fill="#eef3f5" stroke="#a1b2ba"/>
<text x="294" y="155" text-anchor="middle" font-size="24">D</text>
<rect x="260" y="171" width="68" height="40" rx="2" fill="#eef3f5" stroke="#a1b2ba"/>
<text x="294" y="199" text-anchor="middle" font-size="24">H</text>
<text x="16" y="259" font-size="18" font-weight="bold">2. Take columns 2, 0, 3, 1</text>
<text x="54" y="286" text-anchor="middle" font-size="15">2</text>
<rect x="20" y="295" width="68" height="40" rx="2" fill="#eef3f5" stroke="#a1b2ba"/>
<text x="54" y="323" text-anchor="middle" font-size="24">C</text>
<rect x="20" y="339" width="68" height="40" rx="2" fill="#eef3f5" stroke="#a1b2ba"/>
<text x="54" y="367" text-anchor="middle" font-size="24">G</text>
<text x="134" y="286" text-anchor="middle" font-size="15">0</text>
<rect x="100" y="295" width="68" height="40" rx="2" fill="#eef3f5" stroke="#a1b2ba"/>
<text x="134" y="323" text-anchor="middle" font-size="24">A</text>
<rect x="100" y="339" width="68" height="40" rx="2" fill="#eef3f5" stroke="#a1b2ba"/>
<text x="134" y="367" text-anchor="middle" font-size="24">E</text>
<text x="214" y="286" text-anchor="middle" font-size="15">3</text>
<rect x="180" y="295" width="68" height="40" rx="2" fill="#eef3f5" stroke="#a1b2ba"/>
<text x="214" y="323" text-anchor="middle" font-size="24">D</text>
<rect x="180" y="339" width="68" height="40" rx="2" fill="#eef3f5" stroke="#a1b2ba"/>
<text x="214" y="367" text-anchor="middle" font-size="24">H</text>
<text x="294" y="286" text-anchor="middle" font-size="15">1</text>
<rect x="260" y="295" width="68" height="40" rx="2" fill="#eef3f5" stroke="#a1b2ba"/>
<text x="294" y="323" text-anchor="middle" font-size="24">B</text>
<rect x="260" y="339" width="68" height="40" rx="2" fill="#eef3f5" stroke="#a1b2ba"/>
<text x="294" y="367" text-anchor="middle" font-size="24">F</text>
<text x="16" y="429" font-size="17">Across rows → CADBGEHF</text>
<text x="16" y="460" font-size="17">Down columns ↓ CGAEDHBF</text>
<text x="16" y="499" font-size="15">All eight letters occur once in both outputs.</text>
</g></svg>
