<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 450" role="img" aria-labelledby="title desc"><title id="title">Welcome: rune positions and consumed key positions</title><desc id="desc">At rune 47, subtract 26 from F and advance the key counter from 47 to 48. At rune 48, copy F and keep the counter at 48. At rune 49, subtract 23 from E and advance the counter to 49. All positions are zero based.</desc><rect width="360" height="450" fill="#ffffff"/><g font-family="Arial, sans-serif" fill="#26343b"><text x="18" y="28" font-size="18">One interruption in the Welcome</text><text x="18" y="51" font-size="13">Positions start at zero. Key length: 8.</text>
<rect x="18" y="70" width="324" height="100" fill="#fff" stroke="#b5bec4"/><text x="30" y="93" font-size="15" font-weight="bold">Rune position 47</text><text x="30" y="117" font-size="16">F (0) − 26 → O (3)</text><text x="30" y="139" font-size="13">Consumed-key counter: 47 → 48</text><text x="30" y="159" font-size="13">Key slot 7: subtract 26</text><path d="M180 173v12m-4 -4l4 4 4 -4" fill="none" stroke="#245d77" stroke-width="2"/><rect x="18" y="188" width="324" height="100" fill="#e8eef2" stroke="#b5bec4"/><text x="30" y="211" font-size="15" font-weight="bold">Rune position 48</text><text x="30" y="235" font-size="16">F (0) → F (0): copied</text><text x="30" y="257" font-size="13">Consumed-key counter: 48 → 48</text><text x="30" y="277" font-size="13">Key slot 0 stays unused</text><path d="M180 291v12m-4 -4l4 4 4 -4" fill="none" stroke="#245d77" stroke-width="2"/><rect x="18" y="306" width="324" height="100" fill="#fff" stroke="#b5bec4"/><text x="30" y="329" font-size="15" font-weight="bold">Rune position 49</text><text x="30" y="353" font-size="16">E (18) − 23 → A (24)</text><text x="30" y="375" font-size="13">Consumed-key counter: 48 → 49</text><text x="30" y="395" font-size="13">Key slot 0: subtract 23</text><text x="18" y="432" font-size="13">Only transformed runes consume key values.</text></g></svg>
