<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 570" role="img" aria-labelledby="title desc">
<title id="title">Split, rearrange and regroup coordinates</title>
<desc id="desc">A three by three square labels rows and columns zero to two and places A through I in row order. FACE has rows 1 0 0 1 and columns 2 0 2 1. Joining rows then columns gives pairs 10, 01, 20, 21, which map to DBGH. This is an invented example.</desc>
<rect width="360" height="570" fill="white"/>
<style>text{font:16px Arial,sans-serif;fill:#253d49}.head{font-weight:bold}.small{font-size:13px}</style>
<text x="16" y="27" class="head">Split, rearrange, regroup</text>
<text x="114" y="58">0</text>
<text x="168" y="58">1</text>
<text x="222" y="58">2</text>
<text x="69" y="92">0</text>
<rect x="96" y="65" width="54" height="42" fill="#eef2f4" stroke="#bdc9d0"/>
<text x="114" y="92">A</text>
<rect x="150" y="65" width="54" height="42" fill="#eef2f4" stroke="#bdc9d0"/>
<text x="168" y="92">B</text>
<rect x="204" y="65" width="54" height="42" fill="#eef2f4" stroke="#bdc9d0"/>
<text x="222" y="92">C</text>
<text x="69" y="134">1</text>
<rect x="96" y="107" width="54" height="42" fill="#eef2f4" stroke="#bdc9d0"/>
<text x="114" y="134">D</text>
<rect x="150" y="107" width="54" height="42" fill="#eef2f4" stroke="#bdc9d0"/>
<text x="168" y="134">E</text>
<rect x="204" y="107" width="54" height="42" fill="#eef2f4" stroke="#bdc9d0"/>
<text x="222" y="134">F</text>
<text x="69" y="176">2</text>
<rect x="96" y="149" width="54" height="42" fill="#eef2f4" stroke="#bdc9d0"/>
<text x="114" y="176">G</text>
<rect x="150" y="149" width="54" height="42" fill="#eef2f4" stroke="#bdc9d0"/>
<text x="168" y="176">H</text>
<rect x="204" y="149" width="54" height="42" fill="#eef2f4" stroke="#bdc9d0"/>
<text x="222" y="176">I</text>
<text x="20" y="224">Input: F    A    C    E</text>
<text x="20" y="255">Rows: 1    0    0    1</text>
<text x="20" y="284">Cols:  2    0    2    1</text>
<text x="20" y="326">Join rows, then columns:</text>
<text x="20" y="355">1 0 0 1  2 0 2 1</text>
<text x="20" y="397">Regroup into coordinate pairs:</text>
<text x="20" y="426">(1,0)  (0,1)  (2,0)  (2,1)</text>
<text x="20" y="468">Look up each pair: D  B  G  H</text>
<text x="20" y="513" class="small">Decode by splitting the paired coordinates</text>
<text x="20" y="533" class="small">into equal row and column halves.</text>
<text x="20" y="558" class="small">Invented alphabet; no manuscript claim.</text>
</svg>
