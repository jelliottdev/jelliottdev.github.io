<svg xmlns="http://www.w3.org/2000/svg" width="360" height="530" viewBox="0 0 360 530" role="img" aria-labelledby="title desc">
<title id="title">How the second koan turns a denial into an example</title>
<desc id="desc">The master describes an inner voice. The student forms an inward denial. The master points to that thought as an instance. The story reports a thought, while its interpretation as the circumference remains the master's claim.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#365969"/></marker></defs>
<rect width="360" height="530" fill="#fff"/>
<g fill="#f3f5f6" stroke="#bdc4c5"><rect x="8" y="8" width="344" height="126" rx="3"/><rect x="8" y="184" width="344" height="126" rx="3"/><rect x="8" y="360" width="344" height="126" rx="3"/></g>
<g font-family="system-ui, sans-serif" fill="#242a2d" font-size="18">
<text x="22" y="38" font-weight="600">1. The master makes a claim</text><text x="22" y="69">He describes the I as an inner</text><text x="22" y="94">voice, and connects it to the</text><text x="22" y="119">circumference.</text>
<text x="22" y="214" font-weight="600">2. The student thinks a denial</text><text x="22" y="245">The narrator reports a thought</text><text x="22" y="270">denying that such a voice</text><text x="22" y="295">is present.</text>
<text x="22" y="390" font-weight="600">3. That thought is the example</text><text x="22" y="421">The master uses the response</text><text x="22" y="446">as an instance of the thing</text><text x="22" y="471">the student denies.</text>
<text x="180" y="517" text-anchor="middle" font-size="15" fill="#596164">Paraphrase of LP1-14–15</text>
</g><g fill="none" stroke="#365969" stroke-width="2" marker-end="url(#arrow)"><path d="M180 140 V176"/><path d="M180 316 V352"/></g></svg>
