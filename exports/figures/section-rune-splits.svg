<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 210" role="img" aria-labelledby="title desc">
<title id="title">Within-page section breaks</title>
<desc id="desc">The three pages whose rune streams split at a section mark: LP1-16 at 82 of 89 runes, LP2-33 at 91 of 214, and LP2-39 at 119 of 240.</desc>
<rect width="420" height="210" fill="#fff"/>
<text x="8" y="26" font-family="system-ui,sans-serif" font-size="13" fill="#202b31">LP1-16</text>
<rect x="96" y="12" width="310" height="18" fill="#d9e2e6"/>
<rect x="96" y="12" width="285.62" height="18" fill="#35596b"/>
<path d="M 381.62 9 V 34" stroke="#17262e" stroke-width="1.5"/>
<text x="96" y="51" font-family="system-ui,sans-serif" font-size="11" fill="#35454d">Instruction: 82</text>
<text x="406" y="51" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#35454d">KT2: 7</text>
<text x="8" y="94" font-family="system-ui,sans-serif" font-size="13" fill="#202b31">LP2-33</text>
<rect x="96" y="80" width="310" height="18" fill="#d9e2e6"/>
<rect x="96" y="80" width="131.82" height="18" fill="#35596b"/>
<path d="M 227.82 77 V 102" stroke="#17262e" stroke-width="1.5"/>
<text x="96" y="119" font-family="system-ui,sans-serif" font-size="11" fill="#35454d">WT 3 dots: 91</text>
<text x="406" y="119" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#35454d">Cuneiform: 123</text>
<text x="8" y="162" font-family="system-ui,sans-serif" font-size="13" fill="#202b31">LP2-39</text>
<rect x="96" y="148" width="310" height="18" fill="#d9e2e6"/>
<rect x="96" y="148" width="153.71" height="18" fill="#35596b"/>
<path d="M 249.71 145 V 170" stroke="#17262e" stroke-width="1.5"/>
<text x="96" y="187" font-family="system-ui,sans-serif" font-size="11" fill="#35454d">Cuneiform: 119</text>
<text x="406" y="187" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#35454d">Cunieform 3 dots: 121</text>
</svg>
