<svg xmlns="http://www.w3.org/2000/svg" width="720" height="840" viewBox="0 0 720 840" role="img" aria-labelledby="title desc">
<title id="title">2013 Twitter to Gematria Primus: verified byte path</title>
<desc id="desc">Six steps connect 988 offset-tagged lines to reconstructed Twitter bytes, XOR with archived audio, the Gematria JPEG, OutGuess extraction and a four-line whitespace message.</desc>
<rect width="720" height="840" fill="#fff"/>
<text x="40" y="42" font-family="Georgia,serif" font-size="29" fill="#20242a">From Twitter bytes to Gematria Primus</text>
<rect x="40" y="70" width="640" height="92" fill="#f5f7f8" stroke="#c8d0d6"/>
<text x="58" y="99" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#203f56">Offset-tagged posts</text>
<text x="58" y="122" font-family="Arial,sans-serif" font-size="15" fill="#20242a">988 rows · pinned full.txt</text>
<text x="58" y="145" font-family="Arial,sans-serif" font-size="13" fill="#5c626b">Sort by offset; require contiguous, nonoverlapping bytes</text>
<path d="M360 165 v25 m-6 -7 6 7 6 -7" fill="none" stroke="#315d76" stroke-width="2"/>
<rect x="40" y="195" width="640" height="92" fill="#f5f7f8" stroke="#c8d0d6"/>
<text x="58" y="224" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#203f56">twitter.bin</text>
<text x="58" y="247" font-family="Arial,sans-serif" font-size="15" fill="#20242a">64,167 bytes</text>
<text x="58" y="270" font-family="Arial,sans-serif" font-size="13" fill="#5c626b">Matches the archived intermediate exactly</text>
<path d="M360 290 v25 m-6 -7 6 7 6 -7" fill="none" stroke="#315d76" stroke-width="2"/>
<rect x="40" y="320" width="640" height="92" fill="#f5f7f8" stroke="#c8d0d6"/>
<text x="58" y="349" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#203f56">XOR with 761.mp3</text>
<text x="58" y="372" font-family="Arial,sans-serif" font-size="15" fill="#20242a">first 64,167 audio bytes</text>
<text x="58" y="395" font-family="Arial,sans-serif" font-size="13" fill="#5c626b">One audio byte per reconstructed tweet byte</text>
<path d="M360 415 v25 m-6 -7 6 7 6 -7" fill="none" stroke="#315d76" stroke-width="2"/>
<rect x="40" y="445" width="640" height="92" fill="#f5f7f8" stroke="#c8d0d6"/>
<text x="58" y="474" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#203f56">gematria.jpg</text>
<text x="58" y="497" font-family="Arial,sans-serif" font-size="15" fill="#20242a">598 × 842 pixels</text>
<text x="58" y="520" font-family="Arial,sans-serif" font-size="13" fill="#5c626b">Matches the archived JPEG exactly</text>
<path d="M360 540 v25 m-6 -7 6 7 6 -7" fill="none" stroke="#315d76" stroke-width="2"/>
<rect x="40" y="570" width="640" height="92" fill="#f5f7f8" stroke="#c8d0d6"/>
<text x="58" y="599" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#203f56">OutGuess payload</text>
<text x="58" y="622" font-family="Arial,sans-serif" font-size="15" fill="#20242a">1,443 bytes</text>
<text x="58" y="645" font-family="Arial,sans-serif" font-size="13" fill="#5c626b">Fresh local extraction matched archived signed bytes</text>
<path d="M360 665 v25 m-6 -7 6 7 6 -7" fill="none" stroke="#315d76" stroke-width="2"/>
<rect x="40" y="695" width="640" height="92" fill="#f5f7f8" stroke="#c8d0d6"/>
<text x="58" y="724" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#203f56">Space/tab rows</text>
<text x="58" y="747" font-family="Arial,sans-serif" font-size="15" fill="#20242a">4 rows · 552 bits</text>
<text x="58" y="770" font-family="Arial,sans-serif" font-size="13" fill="#5c626b">ASCII text is a separate layer within the payload</text>
</svg>
