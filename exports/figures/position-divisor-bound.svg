<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" role="img" aria-labelledby="title desc">
<title id="title">Three occurrences eliminate the unknown origin</title><desc id="desc">F occurs at positions 7, 17, and 58 on LP2-00. A divisor q of N plus each position must divide both 10 and 51. Their gcd is one, so no q greater than one works at unit stride.</desc>
<rect width="360" height="470" fill="#ffffff"/>
<g fill="#25343b" font-family="system-ui,sans-serif">
<text x="20" y="32" font-size="18" font-weight="600">LP2-00: three F occurrences</text>
<text x="20" y="58" font-size="13">Zero-based rune positions; unit stride</text>
<g font-size="17" text-anchor="middle">
<rect x="20" y="80" width="94" height="60" fill="#e8eef1"/><rect x="133" y="80" width="94" height="60" fill="#e8eef1"/><rect x="246" y="80" width="94" height="60" fill="#e8eef1"/>
<text x="67" y="106">F</text><text x="67" y="130">7</text><text x="180" y="106">F</text><text x="180" y="130">17</text><text x="293" y="106">F</text><text x="293" y="130">58</text>
</g>
<text x="20" y="177" font-size="15">The same q must divide all three:</text>
<g font-size="19" text-anchor="middle"><text x="67" y="205">N + 7</text><text x="180" y="205">N + 17</text><text x="293" y="205">N + 58</text></g>
<path d="M180 222v28m-6-6 6 6 6-6" stroke="#386074" fill="none" stroke-width="2"/>
<text x="20" y="280" font-size="15">Subtract the first from the others.</text>
<text x="20" y="309" font-size="19">q divides 10 and 51</text>
<text x="20" y="344" font-size="19" font-weight="600">gcd(10, 51) = 1</text>
<text x="20" y="373" font-size="16">No divisor q &gt; 1 can satisfy this.</text>
<path d="M20 395H340" stroke="#c8ced0"/>
<text x="20" y="421" font-size="14">With stride s, the gaps are 10s and 51s.</text>
<text x="20" y="447" font-size="14">Then q must divide s — a different bound.</text>
</g></svg>