<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 730" role="img" aria-labelledby="title desc">
<title id="title">Ordinary Atbash: complete index pairs</title>
<desc id="desc">Each pair sums to 28. Indices 0 through 13 exchange with 28 through 15. Index 14 maps to itself. Labels represent whole runes.</desc>
<rect width="480" height="730" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#20242a">
<text x="24" y="36" font-size="25">Ordinary Atbash</text>
<text x="24" y="65" font-size="19">Output index = 28 − input index</text>
<text x="24" y="103" font-size="18" fill="#5c626b">Index · rune label</text>
<text x="304" y="103" font-size="18" fill="#5c626b">Index · rune label</text>
<path d="M24 148H456" stroke="#dce0e4"/>
<text x="40" y="136" font-size="22">0 · F</text>
<text x="232" y="136" font-size="24" text-anchor="middle">↔</text>
<text x="320" y="136" font-size="22">28 · EA</text>
<path d="M24 184H456" stroke="#dce0e4"/>
<text x="40" y="172" font-size="22">1 · U</text>
<text x="232" y="172" font-size="24" text-anchor="middle">↔</text>
<text x="320" y="172" font-size="22">27 · IA</text>
<path d="M24 220H456" stroke="#dce0e4"/>
<text x="40" y="208" font-size="22">2 · TH</text>
<text x="232" y="208" font-size="24" text-anchor="middle">↔</text>
<text x="320" y="208" font-size="22">26 · Y</text>
<path d="M24 256H456" stroke="#dce0e4"/>
<text x="40" y="244" font-size="22">3 · O</text>
<text x="232" y="244" font-size="24" text-anchor="middle">↔</text>
<text x="320" y="244" font-size="22">25 · AE</text>
<path d="M24 292H456" stroke="#dce0e4"/>
<text x="40" y="280" font-size="22">4 · R</text>
<text x="232" y="280" font-size="24" text-anchor="middle">↔</text>
<text x="320" y="280" font-size="22">24 · A</text>
<path d="M24 328H456" stroke="#dce0e4"/>
<text x="40" y="316" font-size="22">5 · C</text>
<text x="232" y="316" font-size="24" text-anchor="middle">↔</text>
<text x="320" y="316" font-size="22">23 · D</text>
<path d="M24 364H456" stroke="#dce0e4"/>
<text x="40" y="352" font-size="22">6 · G</text>
<text x="232" y="352" font-size="24" text-anchor="middle">↔</text>
<text x="320" y="352" font-size="22">22 · OE</text>
<path d="M24 400H456" stroke="#dce0e4"/>
<text x="40" y="388" font-size="22">7 · W</text>
<text x="232" y="388" font-size="24" text-anchor="middle">↔</text>
<text x="320" y="388" font-size="22">21 · NG</text>
<path d="M24 436H456" stroke="#dce0e4"/>
<text x="40" y="424" font-size="22">8 · H</text>
<text x="232" y="424" font-size="24" text-anchor="middle">↔</text>
<text x="320" y="424" font-size="22">20 · L</text>
<path d="M24 472H456" stroke="#dce0e4"/>
<text x="40" y="460" font-size="22">9 · N</text>
<text x="232" y="460" font-size="24" text-anchor="middle">↔</text>
<text x="320" y="460" font-size="22">19 · M</text>
<path d="M24 508H456" stroke="#dce0e4"/>
<text x="40" y="496" font-size="22">10 · I</text>
<text x="232" y="496" font-size="24" text-anchor="middle">↔</text>
<text x="320" y="496" font-size="22">18 · E</text>
<path d="M24 544H456" stroke="#dce0e4"/>
<text x="40" y="532" font-size="22">11 · J</text>
<text x="232" y="532" font-size="24" text-anchor="middle">↔</text>
<text x="320" y="532" font-size="22">17 · B</text>
<path d="M24 580H456" stroke="#dce0e4"/>
<text x="40" y="568" font-size="22">12 · EO</text>
<text x="232" y="568" font-size="24" text-anchor="middle">↔</text>
<text x="320" y="568" font-size="22">16 · T</text>
<path d="M24 616H456" stroke="#dce0e4"/>
<text x="40" y="604" font-size="22">13 · P</text>
<text x="232" y="604" font-size="24" text-anchor="middle">↔</text>
<text x="320" y="604" font-size="22">15 · S</text>
<path d="M24 652H456" stroke="#dce0e4"/>
<text x="40" y="640" font-size="22">14 · X</text>
<text x="232" y="640" font-size="24" text-anchor="middle">↔</text>
<text x="320" y="640" font-size="22">14 · X</text>
<text x="24" y="687" font-size="18">The middle pair is one unchanged symbol.</text>
<text x="24" y="715" font-size="18">Substitute symbols; keep their text positions.</text>
</g></svg>
