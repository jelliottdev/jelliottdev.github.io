<svg xmlns="http://www.w3.org/2000/svg" width="360" height="470" viewBox="0 0 360 470" role="img" aria-labelledby="title desc"><title id="title">Same counts, same whole-stream IoC</title><desc id="desc">Original, reversal and uniform shift have counts three and two, giving IoC two fifths. A repeating shift changes counts to two, two and one, giving one fifth. Numbers are rune indices; colors identify equal indices.</desc><rect width="360" height="470" fill="#faf9f5"/><g font-family="Arial, sans-serif" fill="#263b45">
<text x="16" y="25" font-size="17" font-weight="bold">Original</text>
<rect x="16" y="35" width="38" height="38" rx="3" fill="#dce8ee" stroke="#89969c"/><text x="35" y="60" text-anchor="middle" font-size="18">0</text>
<rect x="62" y="35" width="38" height="38" rx="3" fill="#dce8ee" stroke="#89969c"/><text x="81" y="60" text-anchor="middle" font-size="18">0</text>
<rect x="108" y="35" width="38" height="38" rx="3" fill="#f2e4ce" stroke="#89969c"/><text x="127" y="60" text-anchor="middle" font-size="18">1</text>
<rect x="154" y="35" width="38" height="38" rx="3" fill="#dce8ee" stroke="#89969c"/><text x="173" y="60" text-anchor="middle" font-size="18">0</text>
<rect x="200" y="35" width="38" height="38" rx="3" fill="#f2e4ce" stroke="#89969c"/><text x="219" y="60" text-anchor="middle" font-size="18">1</text>
<text x="267" y="51" font-size="14">IoC</text><text x="267" y="73" font-size="21">2/5</text><text x="16" y="99" font-size="15">Counts: 3 + 2</text>
<text x="16" y="131" font-size="17" font-weight="bold">Reverse order</text>
<rect x="16" y="141" width="38" height="38" rx="3" fill="#f2e4ce" stroke="#89969c"/><text x="35" y="166" text-anchor="middle" font-size="18">1</text>
<rect x="62" y="141" width="38" height="38" rx="3" fill="#dce8ee" stroke="#89969c"/><text x="81" y="166" text-anchor="middle" font-size="18">0</text>
<rect x="108" y="141" width="38" height="38" rx="3" fill="#f2e4ce" stroke="#89969c"/><text x="127" y="166" text-anchor="middle" font-size="18">1</text>
<rect x="154" y="141" width="38" height="38" rx="3" fill="#dce8ee" stroke="#89969c"/><text x="173" y="166" text-anchor="middle" font-size="18">0</text>
<rect x="200" y="141" width="38" height="38" rx="3" fill="#dce8ee" stroke="#89969c"/><text x="219" y="166" text-anchor="middle" font-size="18">0</text>
<text x="267" y="157" font-size="14">IoC</text><text x="267" y="179" font-size="21">2/5</text><text x="16" y="205" font-size="15">Counts: 3 + 2</text>
<text x="16" y="237" font-size="17" font-weight="bold">Add 1 everywhere</text>
<rect x="16" y="247" width="38" height="38" rx="3" fill="#f2e4ce" stroke="#89969c"/><text x="35" y="272" text-anchor="middle" font-size="18">1</text>
<rect x="62" y="247" width="38" height="38" rx="3" fill="#f2e4ce" stroke="#89969c"/><text x="81" y="272" text-anchor="middle" font-size="18">1</text>
<rect x="108" y="247" width="38" height="38" rx="3" fill="#e1e9d7" stroke="#89969c"/><text x="127" y="272" text-anchor="middle" font-size="18">2</text>
<rect x="154" y="247" width="38" height="38" rx="3" fill="#f2e4ce" stroke="#89969c"/><text x="173" y="272" text-anchor="middle" font-size="18">1</text>
<rect x="200" y="247" width="38" height="38" rx="3" fill="#e1e9d7" stroke="#89969c"/><text x="219" y="272" text-anchor="middle" font-size="18">2</text>
<text x="267" y="263" font-size="14">IoC</text><text x="267" y="285" font-size="21">2/5</text><text x="16" y="311" font-size="15">Counts: 3 + 2</text>
<text x="16" y="343" font-size="17" font-weight="bold">Subtract repeating [0, 1]</text>
<rect x="16" y="353" width="38" height="38" rx="3" fill="#dce8ee" stroke="#89969c"/><text x="35" y="378" text-anchor="middle" font-size="18">0</text>
<rect x="62" y="353" width="38" height="38" rx="3" fill="#eadfea" stroke="#89969c"/><text x="81" y="378" text-anchor="middle" font-size="18">28</text>
<rect x="108" y="353" width="38" height="38" rx="3" fill="#f2e4ce" stroke="#89969c"/><text x="127" y="378" text-anchor="middle" font-size="18">1</text>
<rect x="154" y="353" width="38" height="38" rx="3" fill="#eadfea" stroke="#89969c"/><text x="173" y="378" text-anchor="middle" font-size="18">28</text>
<rect x="200" y="353" width="38" height="38" rx="3" fill="#f2e4ce" stroke="#89969c"/><text x="219" y="378" text-anchor="middle" font-size="18">1</text>
<text x="267" y="369" font-size="14">IoC</text><text x="267" y="391" font-size="21">1/5</text><text x="16" y="417" font-size="15">Counts: 2 + 2 + 1</text>
<text x="16" y="452" font-size="14">Invented example · Numbers are rune indices</text></g></svg>
