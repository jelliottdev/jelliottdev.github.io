<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 480" role="img" aria-labelledby="title desc">
<title id="title">Prefixes and the stored rune alphabet</title>
<desc id="desc">Four populations, each on a zero to one hundred percent scale. The colored portion counts entries containing at least one symbol outside the stored alphabet. Exact counts accompany every bar.</desc>
<rect width="380" height="480" fill="white"/>
<style>text{font:13px Arial,sans-serif;fill:#25343a}.note{font-size:12px}</style>
<text x="18" y="27">Prefixes and the stored rune alphabet</text>
<text x="18" y="50" class="note">Colored: at least one outside-alphabet symbol</text>
<text x="18" y="85">Eligible prefixes · count every path</text>
<rect x="18" y="97" width="344" height="17" fill="#e6eaec"/>
<rect x="18" y="97" width="343.8520" height="17" fill="#42687b"/>
<text x="18" y="134">25,554 / 25,565 entries (99.96%)</text>
<text x="18" y="168">Eligible prefixes · identical bytes counted once</text>
<rect x="18" y="180" width="344" height="17" fill="#e6eaec"/>
<rect x="18" y="180" width="343.8520" height="17" fill="#42687b"/>
<text x="18" y="217">25,552 / 25,563 entries (99.96%)</text>
<text x="18" y="251">Short files · count every path</text>
<rect x="18" y="263" width="344" height="17" fill="#e6eaec"/>
<rect x="18" y="263" width="282.4633" height="17" fill="#42687b"/>
<text x="18" y="300">280 / 341 entries (82.11%)</text>
<text x="18" y="334">Short files · identical bytes counted once</text>
<rect x="18" y="346" width="344" height="17" fill="#e6eaec"/>
<rect x="18" y="346" width="342.7758" height="17" fill="#42687b"/>
<text x="18" y="383">280 / 281 entries (99.64%)</text>
<text x="18" y="425" class="note">Eligible: first 2,902 nonempty literal-space tokens.</text>
<text x="18" y="445" class="note">Short files: all available tokens, including empty files.</text>
<text x="18" y="465" class="note">A symbol difference does not identify a language.</text>
</svg>
