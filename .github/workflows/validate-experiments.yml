name: Validate experiment registry
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      science: ${{ steps.scope.outputs.science }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select validation lane
        id: scope
        run: node scripts/ci_validation_scope.cjs
  validate:
    needs: scope
    # Scientific checks include change-specific bundle replay. A later push must
    # not cancel those checks; application-only updates can replace each other.
    concurrency:
      group: validate-${{ github.workflow }}-${{ needs.scope.outputs.science == 'true' && github.sha || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select conservative validation scope
        id: scope
        run: node scripts/ci_validation_scope.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-line-gap-measurements.txt
      - name: Test immutable authored source retention
        run: python -m unittest discover -s scripts -p test_archive_authored_sources.py
      - name: Check current and retained authored source revisions
        shell: bash
        env:
          ARCHIVE_EVENT: ${{ github.event_name }}
          ARCHIVE_PR_BASE: ${{ github.event.pull_request.base.sha }}
          ARCHIVE_PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          manifest='data/authored-source-archive.json'
          base=''
          if [[ "$ARCHIVE_EVENT" == 'pull_request' ]]; then
            base="$ARCHIVE_PR_BASE"
          elif [[ "$ARCHIVE_EVENT" == 'push' ]]; then
            base="$ARCHIVE_PUSH_BASE"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            base="$(git rev-parse HEAD^)"
          fi
          if [[ "$ARCHIVE_EVENT" == 'pull_request' || "$ARCHIVE_EVENT" == 'push' ]]; then
            [[ "$base" =~ ^[a-f0-9]{40}$ ]] || { echo 'Missing or invalid archive event baseline'; exit 1; }
          fi
          if [[ -n "$base" && ! "$base" =~ ^0{40}$ ]]; then
            [[ "$base" =~ ^[a-f0-9]{40}$ ]] || { echo 'Invalid archive baseline revision'; exit 1; }
            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$base"
            fi
            git cat-file -e "$base^{commit}"
            if git cat-file -e "$base:$manifest" 2>/dev/null; then
              baseline_bytes="$(git cat-file -s "$base:$manifest")"
              [[ "$baseline_bytes" =~ ^[0-9]+$ && "$baseline_bytes" -le 2097152 ]] || { echo 'Archive baseline manifest exceeds its bound'; exit 1; }
              baseline="$(mktemp "${RUNNER_TEMP}/authored-source-baseline.XXXXXX.json")"
              trap 'rm -f -- "$baseline"' EXIT
              git show "$base:$manifest" > "$baseline"
              python scripts/archive_authored_sources.py --baseline-manifest "$baseline"
            else
              # The first introduction has no historical manifest to retain.
              python scripts/archive_authored_sources.py
            fi
          else
            python scripts/archive_authored_sources.py
          fi
      - name: Run all unconditional Node checks
        run: node scripts/run_node_checks.cjs
      - run: python scripts/test_finite_search_audit.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_factored_finite_search_audit.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_reproduce_family.py
        if: steps.scope.outputs.science == 'true'
      - run: python -m pip install -r scripts/requirements-line-gap-measurements.txt
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/check_recorded_row_routes.py --self-test
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/check_download_catalog.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_download_catalog.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_staged_catalog.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_access_export_bookkeeping.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_export_reproducibility.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/ci_experiment_bundles.py
        if: steps.scope.outputs.science == 'true'
      - run: python tests/test_experiment_bundle_selection.py
        if: steps.scope.outputs.science == 'true'
      - run: python tests/test_bundle_ci_dispatch.py
        if: steps.scope.outputs.science == 'true'
      - run: python tests/test_prior_work.py
        if: steps.scope.outputs.science == 'true'
      - run: python research/test_refresh_command_queue.py
        if: steps.scope.outputs.science == 'true'
      - run: python research/refresh_command_queue.py --check
        if: steps.scope.outputs.science == 'true'
      - run: python tests/test_source_batches.py
        if: steps.scope.outputs.science == 'true'
      - run: python tests/test_pending_source_selection.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_research_map.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/build_research_map.py --check
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_line_gap_measurements.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/build_line_gap_measurements.py --data-only --check
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_corpus_comparison_render.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_corpus_pipeline.py
