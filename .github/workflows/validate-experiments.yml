name: Validate experiment registry
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select conservative validation scope
        id: scope
        run: node scripts/ci_validation_scope.cjs
      - name: Run all unconditional Node checks
        run: node scripts/run_node_checks.cjs
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.science == 'true'
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-line-gap-measurements.txt
      - run: python scripts/test_finite_search_audit.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_factored_finite_search_audit.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_reproduce_family.py
        if: steps.scope.outputs.science == 'true'
      - run: python -m pip install -r scripts/requirements-line-gap-measurements.txt
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/check_recorded_row_routes.py --self-test
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/check_download_catalog.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_download_catalog.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_staged_catalog.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_access_export_bookkeeping.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_export_reproducibility.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/ci_experiment_bundles.py
        if: steps.scope.outputs.science == 'true'
      - run: python tests/test_experiment_bundle_selection.py
        if: steps.scope.outputs.science == 'true'
      - run: python tests/test_bundle_ci_dispatch.py
        if: steps.scope.outputs.science == 'true'
      - run: python tests/test_prior_work.py
        if: steps.scope.outputs.science == 'true'
      - run: python research/test_refresh_command_queue.py
        if: steps.scope.outputs.science == 'true'
      - run: python research/refresh_command_queue.py --check
        if: steps.scope.outputs.science == 'true'
      - run: python tests/test_source_batches.py
        if: steps.scope.outputs.science == 'true'
      - run: python tests/test_pending_source_selection.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_research_map.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/build_research_map.py --check
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_line_gap_measurements.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/build_line_gap_measurements.py --data-only --check
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_corpus_comparison_render.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_corpus_pipeline.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_decoder_skip_controls.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_search_maximum_controls.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/check_experiment_authoring.py --github-event --fetch-base
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_experiment_authoring.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/build_local_run_inputs.py --check
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_local_run_inputs.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_wulfic_browser_followups.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_browser_followups.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_verify_controls.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_browser_followups_interrupted.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_word_prime_followups.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_word_pair_followups.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_direct_reading_followups.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_authored_language_followups.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_browser_followups_finite.py
