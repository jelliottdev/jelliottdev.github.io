name: Validate experiment registry
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node services/idea-assistant/test-worker.mjs
      - run: node scripts/test_assistant.cjs
      - run: node scripts/test_search.cjs
      - run: python scripts/test_experiments.py
      - run: python scripts/build_experiments.py
      - run: python scripts/build_assistant.py
      - run: python scripts/build_reading_guides.py
      - run: python scripts/build_articles.py
      - run: python scripts/test_article_exports.py
      - run: python scripts/reproduce_reading.py --check-all
      - run: python scripts/reproduce_cover_chain.py
      - run: python scripts/check_number_examples.py
      - run: python scripts/reproduce_prime_sums.py
      - run: python scripts/test_rune_ioc.py
      - run: python scripts/rune_ioc.py --check
      - run: python scripts/inspect_visual_records.py
      - name: Check that published exports match reviewed records
        run: git diff --exit-code -- data/experiments.json reference/experiments.html data/assistant-index.json data/articles.json reference/articles articles/readings
