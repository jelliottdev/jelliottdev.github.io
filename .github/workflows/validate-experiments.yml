name: Validate experiment registry
on:
  push:
  pull_request:
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/check_download_catalog.py
      - run: python scripts/test_download_catalog.py
      - run: python scripts/test_staged_catalog.py
      - run: python scripts/test_export_reproducibility.py
      - run: python scripts/test_experiment_bundles.py
      - run: python tests/test_experiment_bundle_selection.py
      - run: python tests/test_prior_work.py
      - run: python tests/test_source_batches.py
      - run: node services/idea-assistant/test-worker.mjs
      - run: node scripts/test_assistant.cjs
      - run: node scripts/test_assistant_retrieval.cjs
      - run: node scripts/test_research_index.cjs
      - run: node scripts/test_experiment_support_state.cjs
      - run: node scripts/test_experiment_detail_loading.cjs
      - run: node scripts/test_experiment_article_links.cjs
      - run: node scripts/test_checker_copy_state.cjs
      - run: node scripts/test_checker_loading.cjs
      - run: node scripts/test_checker_cards.cjs
      - run: node scripts/test_checker_cache.cjs
      - run: node scripts/test_checker_payload.cjs
      - run: node scripts/test_keyboard_focus.cjs
      - run: node scripts/test_reader_state.cjs
      - run: node scripts/test_image_dialog_state.cjs
      - run: node scripts/test_route_image_modal.cjs
      - run: node scripts/test_download_verification.cjs
      - run: node scripts/test_wiki_section_focus.cjs
      - run: node scripts/test_affine_lag_example.cjs
      - run: node scripts/test_scientific_figure_states.cjs
      - run: node scripts/test_search.cjs
      - run: node scripts/test_page_links.cjs
      - run: node scripts/test_guide_index.cjs
      - run: node scripts/test_article_loading.cjs
      - run: python scripts/test_corpus_comparison_render.py
      - run: python scripts/test_corpus_pipeline.py
      - run: python scripts/test_decoder_skip_controls.py
      - run: python scripts/test_search_maximum_controls.py
      - run: python scripts/test_experiments.py
      - run: python scripts/test_experiment_article_links.py
      - run: python scripts/test_public_attempt_inventory.py
      - run: python scripts/test_suite_registry.py
      - run: python scripts/test_new_experiment.py
      - run: python scripts/build_experiments.py
      - run: python scripts/test_page_notes.py
      - run: python scripts/build_page_notes.py
      - run: python scripts/build_assistant.py
      - run: python scripts/build_reading_guides.py
      - run: python scripts/build_articles.py
      - run: python scripts/check_article_links.py
      - run: python scripts/test_article_links.py
      - run: python scripts/test_article_exports.py
      - run: python scripts/test_reading_concordance.py
      - run: python scripts/test_reference_bundle.py
      - run: python scripts/reproduce_reading.py --check-all
      - run: python scripts/reproduce_cover_chain.py
      - run: python scripts/check_number_examples.py
      - run: python scripts/reproduce_prime_sums.py
      - run: python scripts/test_rune_entropy.py
      - run: python scripts/test_rune_lag_matches.py
      - run: python scripts/test_rune_ngrams.py
      - run: python scripts/test_rune_ioc.py
      - run: python scripts/rune_ioc.py --check
      - run: python scripts/inspect_visual_records.py
      - run: python research/source-intake/audit-r18-jpeg-fingerprints.py --check
      - run: python scripts/test_visual_report.py
      - run: python scripts/test_measure_region.py
      - name: Check that published exports match reviewed records
        run: git diff --exit-code -- data/index.json data/pages data/experiments.json data/experiment-index.json data/checker-records.json reference/experiments reference/experiments.html data/assistant-index.json data/articles.json data/article-search.json reference/articles articles/readings
