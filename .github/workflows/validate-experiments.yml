        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_build_research.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_record_line_endings.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_experiment_content.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_new_experiment.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_prefix_evidence_gate.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/published_program_projection.py --reproduce-archive
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_archived_recipe_presentation.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_research_questions.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_published_count_evidence.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_published_program_projection.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/build_published_count_evidence.py --check
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_published_evidence_history.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/build_published_evidence_history.py --check
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_experiments.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_experiment_article_links.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_public_attempt_inventory.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_suite_registry.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/build_experiments.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_page_notes.py
