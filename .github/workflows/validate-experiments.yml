name: Validate experiment registry
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_experiments.py
      - run: python scripts/build_experiments.py
      - name: Check that published exports match reviewed records
        run: git diff --exit-code -- data/experiments.json reference/experiments.html
