      - run: python scripts/test_reference_bundle.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/reproduce_reading.py --check-all
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/reproduce_cover_chain.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/check_number_examples.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/reproduce_prime_sums.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_rune_entropy.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_rune_lag_matches.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_rune_ngrams.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_rune_ioc.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/rune_ioc.py --check
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/inspect_visual_records.py
        if: steps.scope.outputs.science == 'true'
      - run: python research/source-intake/audit-r18-jpeg-fingerprints.py --check
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_visual_report.py
        if: steps.scope.outputs.science == 'true'
      - run: python scripts/test_measure_region.py
        if: steps.scope.outputs.science == 'true'
      - name: Check that published exports match reviewed records
        if: steps.scope.outputs.science == 'true'
        run: git diff --exit-code -- data/index.json data/pages data/experiments.json data/experiment-index.json data/checker-records.json reference/experiments reference/experiments.html data/assistant-index.json data/articles.json data/article-search.json reference/articles articles/readings
