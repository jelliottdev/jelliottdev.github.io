<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liberpedia reader</title><link rel="stylesheet" href="manuscript-reader.css?v=20261025-reader-controls"><script src="reader/source-rows.js" defer></script><script src="reader/reader-address.js?v=complete-current-1" defer></script><script src="reader/manuscript-search.js" defer></script><script src="manuscript-reader.js?v=20261025-row-focus" defer></script><link rel="stylesheet" href="site-navigation.css?v=complete-current-1"><script src="site-navigation.js?v=record-panel-20261024" defer></script></head><body data-sidebar-page="reader">
<header id="bar"><button class="site-menu" type="button" aria-label="Open navigation" aria-controls="site-sidebar" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg></button>
 <a class="brand" href="index.html">Liberpedia</a>
 <nav aria-label="Pages"><button id="prev" class="icon" aria-label="Previous page" title="Previous page"></button><button id="goto" aria-haspopup="dialog" title="Go to or search"><span id="location">LP2 15</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg></button><button id="next" class="icon" aria-label="Next page" title="Next page"></button></nav>
 <div id="views" role="group" aria-label="View"><button data-view="image">Image</button><button data-view="text">Text</button><button data-view="compare" class="desktop">Compare</button></div>
 <button id="options-button" class="icon" aria-label="Reading options" title="Reading options" aria-haspopup="dialog"></button>
</header>
<main id="viewport" tabindex="-1" aria-label="Manuscript"><div id="flow"></div></main>
<dialog id="finder" aria-label="Go to or search"><div class="search-head"><input id="query" aria-label="Go to or search" placeholder="Page, line, word or phrase" type="text" autocomplete="off" spellcheck="false"><button id="finder-close" class="icon" aria-label="Close search"></button></div><div class="search-controls"><label>Text layer <select id="search-layer"><option value="all">All stored text</option><option value="raw">Archived runes</option><option value="latin">Latin rune labels</option><option value="reviewed">Reviewed derivative</option><option value="literal">Literal decoded text</option><option value="context">Contextual readings</option><option value="visible">Visible cover text</option></select></label><button id="search-cancel" type="button" hidden>Cancel search</button></div><div id="suggestions"></div><p id="address-help">15:4 <span>line</span>　15:4:2-6 <span>words</span>　15-17 <span>pages</span></p></dialog>
<dialog id="options" aria-labelledby="options-title"><header><h2 id="options-title">Reading options</h2><button id="options-close" class="icon" aria-label="Close reading options"></button></header>
 <div class="option-row"><span>Navigation</span><div class="choice" role="group" aria-label="Navigation"><button data-navigation="turn">Turn pages</button><button data-navigation="scroll">Scroll</button></div></div>
 <div id="range-option" hidden><span id="range-label"></span><button id="clear-range">Read all pages</button></div>
 <div class="option-row"><span>Text</span><div id="text-versions" class="choice" role="group" aria-label="Text version"></div></div>
 <div class="option-row"><label for="size">Size</label><input id="size" type="range" min="16" max="32" value="23"></div>
 <label class="check"><input type="checkbox" id="numbering" checked>Line numbers</label>
 <label class="check"><input type="checkbox" id="wrapping" checked>Wrap long lines</label>
 <div class="option-row image-options"><span>Image</span><div class="choice"><button id="fit-page">Fit page</button><button id="fit-width">Fit width</button><button id="zoom-out" class="icon" aria-label="Zoom out"></button><button id="zoom-in" class="icon" aria-label="Zoom in"></button></div></div>
 <div class="option-links"><button id="reference-button">Page reference</button><button id="copy-text">Copy page text</button><button id="full">Fullscreen</button></div>
</dialog>
<dialog id="reference" aria-labelledby="reference-title"><header><h2 id="reference-title">Page reference</h2><button id="reference-close" class="icon" aria-label="Close page reference"></button></header><div class="choice reference-tabs"><button data-tab="notes">Notes</button><button data-tab="alphabet">Alphabet</button><button data-tab="files">Files</button></div><div id="reference-body"></div></dialog>
<div id="selection" hidden><span id="selection-label"></span><button id="copy-location">Copy link</button><button id="clear-selection" class="icon" aria-label="Clear selected location"></button></div>
<div id="toast" role="status" aria-live="polite"></div>
