<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" role="img" aria-labelledby="title desc">
  <title id="title">Best every-n result against complete shuffled searches</title>
  <desc id="desc">The best observed score is minus 7.151. The shuffled-search maxima range from minus 7.219 to minus 6.963, with a median of minus 7.122. In 182 of 256 complete control searches, the best score met or exceeded the observed best.</desc>
  <rect width="340" height="240" fill="#fff"/>
  <text x="16" y="28" font-size="17" font-family="system-ui,sans-serif" font-weight="650" fill="#202c35">Best of all 868 settings</text>
  <text x="16" y="50" font-size="14" font-family="system-ui,sans-serif" fill="#52616b">Higher score = more English-like</text>
  <text x="16" y="82" font-size="15" font-family="system-ui,sans-serif" fill="#202c35">Observed: step 24, phase 2</text>
  <line x1="60" y1="105" x2="315" y2="105" stroke="#d7dee2" stroke-width="2"/>
  <circle cx="144" cy="105" r="6" fill="#245c78"/>
  <text x="154" y="111" font-size="15" font-family="system-ui,sans-serif" font-weight="650" fill="#245c78">−7.151</text>
  <text x="16" y="144" font-size="15" font-family="system-ui,sans-serif" fill="#202c35">256 shuffled full searches</text>
  <line x1="60" y1="166" x2="315" y2="166" stroke="#d7dee2" stroke-width="2"/>
  <line x1="86" y1="166" x2="304" y2="166" stroke="#788b95" stroke-width="5" stroke-linecap="round"/>
  <circle cx="169" cy="166" r="5" fill="#3e5866"/>
  <text x="16" y="193" font-size="14" font-family="system-ui,sans-serif" fill="#52616b">Line = range; dot = median</text>
  <text x="16" y="221" font-size="15" font-family="system-ui,sans-serif" font-weight="600" fill="#202c35">182 / 256 met or beat observed.</text>
</svg>
