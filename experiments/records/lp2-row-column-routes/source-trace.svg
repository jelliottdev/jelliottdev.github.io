<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 430" role="img" aria-labelledby="title desc"><title id="title">LP2-31 column-first source trace</title><desc id="desc">First six actual output positions from a saved column-first route. Each points to the first rune of the next archived row. Full routes preserve every source position.</desc><rect width="360" height="430" fill="#faf9f5"/><g font-family="sans-serif" fill="#243c48"><text x="20" y="30" font-size="20">LP2-31: column-first route</text><text x="20" y="55" font-size="13">Down each column, then move right</text><text x="20" y="86" font-size="13">Step</text><text x="90" y="86" font-size="13">Source line : rune</text><text x="273" y="86" font-size="13">Index</text><path d="M20 133 H330" stroke="#dce0df"/><text x="20" y="120" font-size="16">1</text><text x="90" y="120" font-size="16">1 : 1</text><text x="273" y="120" font-size="16">2</text><path d="M20 170 H330" stroke="#dce0df"/><text x="20" y="157" font-size="16">2</text><text x="90" y="157" font-size="16">2 : 1</text><text x="273" y="157" font-size="16">8</text><path d="M20 207 H330" stroke="#dce0df"/><text x="20" y="194" font-size="16">3</text><text x="90" y="194" font-size="16">3 : 1</text><text x="273" y="194" font-size="16">27</text><path d="M20 244 H330" stroke="#dce0df"/><text x="20" y="231" font-size="16">4</text><text x="90" y="231" font-size="16">4 : 1</text><text x="273" y="231" font-size="16">20</text><path d="M20 281 H330" stroke="#dce0df"/><text x="20" y="268" font-size="16">5</text><text x="90" y="268" font-size="16">5 : 1</text><text x="273" y="268" font-size="16">17</text><path d="M20 318 H330" stroke="#dce0df"/><text x="20" y="305" font-size="16">6</text><text x="90" y="305" font-size="16">6 : 1</text><text x="273" y="305" font-size="16">19</text><text x="20" y="350" font-size="13">Full route: 269 positions, each used once</text><text x="20" y="376" font-size="13">Rows are left-aligned by rune ordinal.</text><text x="20" y="402" font-size="13">Rune indices use alphabet positions 0–28.</text></g></svg>
