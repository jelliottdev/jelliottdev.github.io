<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 350 326">
<title id="title">The best manuscript trigram score compared with 256 full-search shuffles</title>
<desc id="desc">The manuscript best is 225. In 222 of 256 shuffled-page searches, the best score was at least this high.</desc>
<rect width="350" height="326" fill="#fff"/>
<style>text{font-family:Arial,sans-serif;fill:#26343c;font-size:13px}.title{font-size:18px;font-weight:700}.strong{font-size:14px;font-weight:700}.muted{fill:#536571}</style>
<text x="16" y="27" class="title">The selected trigram score</text>
<text x="16" y="53" class="strong">Manuscript: 225</text>
<text x="16" y="74">222 of 256 shuffled searches reached it</text>
<text x="16" y="104" class="muted">Best score in each complete shuffled search</text>
<text x="16" y="141">Below 200</text>
<rect x="113" y="128" width="190" height="17" fill="#edf1f3"/>
<rect x="113" y="128" width="6" height="17" fill="#718d9d"/>
<text x="313" y="141">3</text>
<text x="16" y="177">200–249</text>
<rect x="113" y="164" width="190" height="17" fill="#edf1f3"/>
<rect x="113" y="164" width="190" height="17" fill="#718d9d"/>
<text x="313" y="177">92</text>
<text x="16" y="213">250–299</text>
<rect x="113" y="200" width="190" height="17" fill="#edf1f3"/>
<rect x="113" y="200" width="180" height="17" fill="#718d9d"/>
<text x="313" y="213">87</text>
<text x="16" y="249">300–349</text>
<rect x="113" y="236" width="190" height="17" fill="#edf1f3"/>
<rect x="113" y="236" width="126" height="17" fill="#718d9d"/>
<text x="313" y="249">61</text>
<text x="16" y="285">350 or more</text>
<rect x="113" y="272" width="190" height="17" fill="#edf1f3"/>
<rect x="113" y="272" width="27" height="17" fill="#718d9d"/>
<text x="313" y="285">13</text>
<text x="16" y="316" class="muted">Same 377 settings searched in every shuffle.</text>
</svg>
