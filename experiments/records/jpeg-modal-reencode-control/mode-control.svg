<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" role="img" aria-labelledby="t d">
  <title id="t">Nonzero modal-byte pages after fixed JPEG re-encodes</title>
  <desc id="d">Of 58 pages, the original files have four with a nonzero modal byte. Re-encoding at quality 75 gives 23, quality 85 gives 23, and quality 95 gives five.</desc>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#26343d}.heading{font-size:18px;font-weight:700}.sub{font-size:14px;fill:#53616a}.label{font-size:15px}.value{font-size:15px;font-weight:700}.foot{font-size:12px;fill:#53616a}</style>
  <rect width="360" height="380" fill="#fff"/>
  <text class="heading" x="16" y="30">Does the four-page class last?</text>
  <text class="sub" x="16" y="54">Nonzero modal-byte files, of 58 LP2 pages</text>
  <g>
    <text class="label" x="16" y="100">Original</text><rect x="133" y="80" width="33" height="25" fill="#315c74"/><text class="value" x="176" y="100">4</text>
    <text class="label" x="16" y="162">Quality 75</text><rect x="133" y="142" width="190" height="25" fill="#81949e"/><text class="value" x="331" y="162">23</text>
    <text class="label" x="16" y="224">Quality 85</text><rect x="133" y="204" width="190" height="25" fill="#81949e"/><text class="value" x="331" y="224">23</text>
    <text class="label" x="16" y="286">Quality 95</text><rect x="133" y="266" width="41" height="25" fill="#81949e"/><text class="value" x="184" y="286">5</text>
  </g>
  <path d="M16 318H344" stroke="#c7cfd3"/>
  <text class="foot" x="16" y="340">Pillow 11.3.0 · fixed chroma setting</text>
  <text class="foot" x="16" y="358">Decoded pages re-encoded at 75, 85 and 95</text>
</svg>
