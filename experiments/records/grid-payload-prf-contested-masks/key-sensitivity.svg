<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 310" role="img" aria-labelledby="title desc">
  <title id="title">How many of the 64 payload readings change each key family?</title>
  <desc id="desc">Ten generators produce 64 distinct keys. Four truncated 32-byte generators produce only two keys, and AES-128-CTR produces one, because all six contested bytes lie beyond its first 16 bytes.</desc>
  <rect width="420" height="310" fill="#f4f6f7"/>
  <g fill="#20323c" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="20" y="34" font-size="18" font-weight="700">The six bytes do not affect every key</text>
    <text x="20" y="58" font-size="14" fill="#52626d">Distinct keys from 64 payload readings</text>
    <text x="20" y="96" font-size="15">10 full-payload generators</text>
    <text x="20" y="156" font-size="15">4 truncated 32-byte generators</text>
    <text x="20" y="216" font-size="15">AES-128-CTR</text>
  </g>
  <g stroke="#c6d0d5" stroke-width="1"><path d="M20 275H400"/><path d="M20 260v30M115 260v30M210 260v30M305 260v30M400 260v30"/></g>
  <g fill="#536a78"><rect x="20" y="105" width="380" height="24"/><rect x="20" y="165" width="12" height="24"/><rect x="20" y="225" width="6" height="24"/></g>
  <g fill="#20323c" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="700">
    <text x="365" y="123" fill="#fff">64</text><text x="39" y="183">2</text><text x="33" y="243">1</text>
  </g>
  <g fill="#52626d" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
    <text x="16" y="305">0</text><text x="104" y="305">16</text><text x="199" y="305">32</text><text x="294" y="305">48</text><text x="386" y="305">64</text>
  </g>
</svg>
