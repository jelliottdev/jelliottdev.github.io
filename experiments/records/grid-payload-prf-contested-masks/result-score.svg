<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 350" role="img" aria-labelledby="title desc">
  <title id="title">Contested-byte payload screen scores</title>
  <desc id="desc">A planted key scored minus 4.17 and passed. The best of 3,840 source decoder calls scored minus 6.872, slightly above the shuffled-text maximum of minus 7.001 but below the required minus 5.5.</desc>
  <rect width="440" height="350" fill="#f4f6f7"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#20323c">
    <text x="20" y="32" font-size="18" font-weight="700">The best candidate missed the threshold</text>
    <text x="20" y="76" font-size="15">Planted key the decoder can find</text>
    <text x="20" y="140" font-size="15">Best of 3,840 manuscript cases</text>
    <text x="20" y="204" font-size="15">Highest of 200 shuffled controls</text>
  </g>
  <g stroke="#bbc8cf" stroke-width="2" fill="none">
    <path d="M62 105H378M62 169H378M62 233H378"/>
    <path d="M62 273H378"/>
    <path d="M62 267v12M141 267v12M220 267v12M299 267v12M378 267v12"/>
  </g>
  <path d="M260 91v157" stroke="#9b5960" stroke-width="2" stroke-dasharray="5 5"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#52626d" font-size="13">
    <text x="49" y="297">−8</text><text x="128" y="297">−7</text><text x="207" y="297">−6</text>
    <text x="286" y="297">−5</text><text x="365" y="297">−4</text>
    <text x="154" y="328">Dashed line: required score −5.5</text>
  </g>
  <circle cx="365" cy="105" r="8" fill="#326780"/>
  <text x="305" y="99" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="700" font-size="15" fill="#326780">−4.17</text>
  <circle cx="151" cy="169" r="8" fill="#536a78"/>
  <text x="162" y="174" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="700" font-size="15" fill="#20323c">−6.872</text>
  <circle cx="141" cy="233" r="6" fill="#82929b"/>
  <text x="152" y="238" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#52626d">−7.001</text>
</svg>
