<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 232" role="img" aria-labelledby="title desc">
<title id="title">PRNG screen: best candidate below required score</title>
<desc id="desc">The planted control scores above the threshold; the strongest of 52,556 manuscript decodes remains below it. Higher scores are better.</desc>
<rect width="720" height="232" fill="#fff"/>
<style>text{font:14px system-ui,sans-serif;fill:#24292d}.small{font-size:12px;fill:#59636a}</style>
<text x="16" y="47">Planted control</text>
<line x1="190" x2="640" y1="42" y2="42" stroke="#dce0e2" stroke-width="8"/>
<circle cx="602.0" cy="42" r="8" fill="#316681"/>
<text x="653" y="47">-4.155</text>
<text x="16" y="102">Best manuscript candidate</text>
<line x1="190" x2="640" y1="97" y2="97" stroke="#dce0e2" stroke-width="8"/>
<circle cx="367.1" cy="97" r="8" fill="#798995"/>
<text x="653" y="102">-6.347</text>
<text x="16" y="157">Required score</text>
<line x1="190" x2="640" y1="152" y2="152" stroke="#dce0e2" stroke-width="8"/>
<circle cx="457.9" cy="152" r="8" fill="#37424a"/>
<text x="653" y="157">-5.500</text>
<text class="small" x="190.0" y="211" text-anchor="middle">-8</text>
<text class="small" x="297.1" y="211" text-anchor="middle">-7</text>
<text class="small" x="404.3" y="211" text-anchor="middle">-6</text>
<text class="small" x="511.4" y="211" text-anchor="middle">-5</text>
<text class="small" x="618.6" y="211" text-anchor="middle">-4</text>
<text class="small" x="190" y="226">Lower</text>
<text class="small" x="639" y="226" text-anchor="end">Higher English score →</text>
</svg>
