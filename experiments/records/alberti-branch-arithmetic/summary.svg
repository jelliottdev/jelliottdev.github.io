<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 530" role="img" aria-labelledby="title desc">
<title id="title">Alberti branch arithmetic audit</title>
<desc id="desc">The page row has 19 runes. Posted raw short sums reproduce, but standard modulo 31 turns the right sums into 29 and 23 rather than the posted 2 and 8.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#263039}.card{fill:#f5f7f8;stroke:#c6d0d6}.small{fill:#53636d;font-size:14px}.heading{font-weight:650;font-size:19px}.number{font-size:23px;font-weight:700}</style>
<rect width="360" height="530" fill="white"/>
<text x="16" y="34" class="heading">Source arithmetic, checked</text>
<rect class="card" x="16" y="50" width="328" height="98" rx="4"/>
<text x="28" y="76" class="small">LP2-39 source row</text>
<text x="28" y="110" class="number">19 runes · 4 separators</text>
<text x="28" y="134" class="small">3+4+6+5+1</text>
<rect class="card" x="16" y="162" width="328" height="98" rx="4"/>
<text x="28" y="188" class="small">Left plant · short groups</text>
<text x="28" y="222" class="number">[-13, -17]</text>
<text x="28" y="246" class="small">Posted totals reproduce</text>
<rect class="card" x="16" y="274" width="328" height="98" rx="4"/>
<text x="28" y="300" class="small">Right plant · short groups</text>
<text x="28" y="334" class="number">[-33, -39]</text>
<text x="28" y="358" class="small">Posted totals reproduce</text>
<rect class="card" x="16" y="386" width="328" height="98" rx="4"/>
<text x="28" y="412" class="small">Right totals modulo 31</text>
<text x="28" y="446" class="number">[29, 23]</text>
<text x="28" y="470" class="small">Posted +2, +8 are opposite signs</text>
<text x="16" y="518" class="small">Arithmetic only; no disk reading tested</text>
</svg>
