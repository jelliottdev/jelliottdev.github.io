<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 270" role="img" aria-labelledby="title desc">
<title id="title">Cross-section difference peak against the same complete search on shuffled sections</title>
<desc id="desc">The strongest cross-section score is 6.01. It is close to the shuffle median 6.03; 53 of 99 shuffled complete searches have a score at least as high. The strongest all-pair score, 11.32, comes instead from adjacent runes in the same section.</desc>
<rect width="320" height="270" fill="#f5f6f7"/>
<text x="16" y="28" fill="#1c2830" font-size="17" font-weight="700" font-family="Arial,sans-serif">Shared-key alignment</text>
<text x="16" y="58" fill="#334751" font-size="13" font-family="Arial,sans-serif">Best distinct-section score: 6.01</text>
<text x="16" y="78" fill="#334751" font-size="13" font-family="Arial,sans-serif">Shuffle median: 6.03</text>
<line x1="38" y1="148" x2="290" y2="148" stroke="#687983" stroke-width="2"/>
<line x1="92.9" y1="148" x2="280.1" y2="148" stroke="#9daeb9" stroke-width="11"/>
<line x1="151.7" y1="128" x2="151.7" y2="168" stroke="#516e7d" stroke-width="3"/>
<circle cx="150.7" cy="148" r="8" fill="#bb5e48" stroke="#fff" stroke-width="2"/>
<text x="36" y="184" fill="#536570" font-size="13" font-family="Arial,sans-serif">4</text>
<text x="149" y="184" fill="#536570" font-size="13" font-family="Arial,sans-serif">6</text>
<text x="261" y="184" fill="#536570" font-size="13" font-family="Arial,sans-serif">8</text>
<text x="16" y="218" fill="#1c2830" font-size="14" font-weight="700" font-family="Arial,sans-serif">53 of 99 shuffled searches</text>
<text x="16" y="238" fill="#334751" font-size="13" font-family="Arial,sans-serif">matched or exceeded the observed peak.</text>
<text x="16" y="257" fill="#536570" font-size="12" font-family="Arial,sans-serif">Post-observation diagnostic · source-defined score</text>
</svg>