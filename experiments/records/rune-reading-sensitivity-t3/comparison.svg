<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 276" role="img" aria-labelledby="title desc">
<title id="title">Adjacent rune repeats after changing 450 disputed readings</title>
<desc id="desc">The stored stream has 86 adjacent repeats. Replacing all 450 O/A/AE machine disagreements with the source alternatives gives 103. A German comparison floor used by the source corresponds to 126. These alternatives are not verified corrections.</desc>
<rect width="340" height="276" fill="#f3f5f6"/>
<text x="20" y="30" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1f303b">Adjacent rune repeats</text>
<text x="20" y="51" font-family="Arial,sans-serif" font-size="13" fill="#52636e">12,956 runes · one conditional comparison</text>
<g font-family="Arial,sans-serif">
<text x="20" y="83" font-size="14" fill="#24313a">Stored runes</text>
<rect x="20" y="93" width="151.11" height="14" rx="2" fill="#6e8490"/>
<text x="179.11" y="105" font-size="14" fill="#24313a">86</text>
<text x="20" y="144" font-size="14" fill="#24313a">450 hypothetical changes</text>
<rect x="20" y="154" width="180.99" height="14" rx="2" fill="#285b78"/>
<text x="208.99" y="166" font-size="14" fill="#24313a">103</text>
<text x="20" y="205" font-size="14" fill="#24313a">Source German comparison</text>
<rect x="20" y="215" width="221.40" height="14" rx="2" fill="#929da5"/>
<text x="249.40" y="227" font-size="14" fill="#24313a">126</text>
</g>
<text x="20" y="260" font-family="Arial,sans-serif" font-size="13" fill="#52636e">450 changes: +17 repeats. Floor: +40.</text>
</svg>
