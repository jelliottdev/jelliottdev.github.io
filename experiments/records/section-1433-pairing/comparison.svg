<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="t d">
  <title id="t">The 1,433-rune best reading is ordinary under shifted controls</title>
  <desc id="d">The best printed-order index of coincidence is 0.034813, nearly the median 0.034799 among 999 trials that repeat selection over all three pairings and four operations. In 465 trials, the score was at least as high.</desc>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#26343d}.head{font-weight:700;font-size:17px}.label{font-size:14px}.small{font-size:12px;fill:#53616a}.number{font-size:15px;font-weight:700}</style>
  <rect width="360" height="300" fill="#fff"/>
  <text class="head" x="16" y="29">Does the printed order stand out?</text>
  <text class="small" x="16" y="53">Best of three pairings × four operations</text>
  <text class="label" x="16" y="94">Observed best</text><text class="number" x="344" y="94" text-anchor="end">0.034813</text>
  <line x1="34" y1="145" x2="324" y2="145" stroke="#a8b4bb" stroke-width="5"/>
  <circle cx="145.5" cy="145" r="7" fill="#80939f"/>
  <path d="M150.4 118V171" stroke="#1d5c7b" stroke-width="4"/>
  <text class="small" x="34" y="195">0.034491</text><text class="small" x="324" y="195" text-anchor="end">0.035292</text>
  <text class="small" x="16" y="220">Line: observed · dot: trial median</text>
  <path d="M16 238H344" stroke="#cbd3d7"/>
  <text class="number" x="16" y="262">465 of 999 trials scored as high</text>
  <text class="small" x="16" y="283">Conditional comparison, not a cipher discovery rate</text>
</svg>
