<svg xmlns="http://www.w3.org/2000/svg" width="320" height="398" viewBox="0 0 320 398" font-family="Arial, sans-serif" role="img" aria-labelledby="title desc"><title id="title">No page cleared the source's LFSR reporting gate</title><desc id="desc">Best normalized index of coincidence over 40 LFSR settings on each of ten pages. Values range from 1.02 to 1.10; the source reports only values above 1.2. A 209-rune known-reading plant measured 2.06 and recovered exactly.</desc><rect width="320" height="398" fill="#fff"/><text x="12" y="24" font-size="17" font-weight="bold" fill="#142e3a">Keyword-seeded LFSR</text><text x="12" y="48" font-size="14" fill="#41515b">Best score on each page · gate above 1.20</text><line x1="250.0" y1="68" x2="250.0" y2="331" stroke="#a64242" stroke-width="2" stroke-dasharray="4 3"/><text x="12" y="87" font-size="14">LP2-04</text><rect x="84" y="72" width="143.1" height="18" fill="#2c6881"/><text x="266" y="87" font-size="13">1.03</text><text x="12" y="113" font-size="14">LP2-05</text><rect x="84" y="98" width="141.6" height="18" fill="#2c6881"/><text x="266" y="113" font-size="13">1.02</text><text x="12" y="139" font-size="14">LP2-06</text><rect x="84" y="124" width="145.1" height="18" fill="#2c6881"/><text x="266" y="139" font-size="13">1.05</text><text x="12" y="165" font-size="14">LP2-07</text><rect x="84" y="150" width="151.7" height="18" fill="#2c6881"/><text x="266" y="165" font-size="13">1.10</text><text x="12" y="191" font-size="14">LP2-08</text><rect x="84" y="176" width="148.2" height="18" fill="#2c6881"/><text x="266" y="191" font-size="13">1.07</text><text x="12" y="217" font-size="14">LP2-09</text><rect x="84" y="202" width="141.4" height="18" fill="#2c6881"/><text x="266" y="217" font-size="13">1.02</text><text x="12" y="243" font-size="14">LP2-10</text><rect x="84" y="228" width="143.9" height="18" fill="#2c6881"/><text x="266" y="243" font-size="13">1.04</text><text x="12" y="269" font-size="14">LP2-11</text><rect x="84" y="254" width="143.6" height="18" fill="#2c6881"/><text x="266" y="269" font-size="13">1.04</text><text x="12" y="295" font-size="14">LP2-12</text><rect x="84" y="280" width="144.5" height="18" fill="#2c6881"/><text x="266" y="295" font-size="13">1.04</text><text x="12" y="321" font-size="14">LP2-13</text><rect x="84" y="306" width="143.2" height="18" fill="#2c6881"/><text x="266" y="321" font-size="13">1.04</text><text x="12" y="353" font-size="14" fill="#203944">0 of 400 settings cleared the gate.</text><text x="12" y="377" font-size="13" fill="#465964">Known-reading control: 2.06; exact recovery.</text></svg>
