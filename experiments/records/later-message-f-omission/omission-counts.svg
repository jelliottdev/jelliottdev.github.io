<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 226" role="img" aria-labelledby="t d">
<title id="t">Signed-message lengths before and after one rune omission</title>
<desc id="d">Under one GP transliteration, 2016 has 177 runes and 2017 has 45. Removing F leaves prime lengths 173 and 41. Removing W also leaves prime lengths, 173 and 43.</desc>
<rect width="360" height="226" fill="#f5f6f7"/>
<text x="14" y="29" fill="#202a30" font-family="system-ui,sans-serif" font-size="17" font-weight="700">Prime lengths after omission</text>
<text x="14" y="52" fill="#52616a" font-family="system-ui,sans-serif" font-size="12">Signed-message bodies · declared GP encoding</text>
<text x="14" y="85" fill="#52616a" font-family="system-ui,sans-serif" font-size="12">Rule</text>
<text x="232" y="85" fill="#52616a" font-family="system-ui,sans-serif" font-size="12">2016</text>
<text x="301" y="85" fill="#52616a" font-family="system-ui,sans-serif" font-size="12">2017</text>
<text x="14" y="115" fill="#202a30" font-family="system-ui,sans-serif" font-size="14" font-weight="400">Original</text>
<text x="236" y="115" fill="#202a30" font-family="system-ui,sans-serif" font-size="14" font-weight="400">177</text>
<text x="305" y="115" fill="#202a30" font-family="system-ui,sans-serif" font-size="14" font-weight="400">45</text>
<rect x="10" y="128" width="340" height="27" fill="#e3eef3"/>
<text x="14" y="148" fill="#202a30" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Omit F</text>
<text x="236" y="148" fill="#202a30" font-family="system-ui,sans-serif" font-size="14" font-weight="700">173</text>
<text x="305" y="148" fill="#202a30" font-family="system-ui,sans-serif" font-size="14" font-weight="700">41</text>
<rect x="10" y="161" width="340" height="27" fill="#e3eef3"/>
<text x="14" y="181" fill="#202a30" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Omit W</text>
<text x="236" y="181" fill="#202a30" font-family="system-ui,sans-serif" font-size="14" font-weight="700">173</text>
<text x="305" y="181" fill="#202a30" font-family="system-ui,sans-serif" font-size="14" font-weight="700">43</text>
<text x="14" y="215" fill="#52616a" font-family="system-ui,sans-serif" font-size="12">2 of 29 single-rune omissions give two primes.</text>
</svg>
