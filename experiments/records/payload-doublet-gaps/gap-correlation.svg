<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400" role="img" aria-labelledby="title desc">
<title id="title">Payload readings against doublet-gap distances</title>
<desc id="desc">Seven fixed byte readings compared by absolute Spearman correlation to 85 consecutive doublet gaps; all remain below the published 0.5 effect-size gate.</desc>
<rect width="700" height="400" fill="#fff"/>
<g font-family="system-ui,sans-serif" fill="#243847">
<text x="20" y="32" font-size="19">Do the grid bytes track doublet spacing?</text>
<text x="20" y="54" font-size="12">Absolute rank correlation · first 85 gaps, fixed alignment</text>
<line x1="530" y1="73" x2="530" y2="344" stroke="#b35c57" stroke-dasharray="4 4"/>
<text x="536" y="77" font-size="11" fill="#934641">published gate: 0.5</text>
<text x="20" y="105" font-size="13">Single bytes</text>
<rect x="235" y="91" width="25.1" height="17" fill="#3c718b"/>
<text x="268.1" y="105" font-size="12">0.043</text>
<text x="20" y="142" font-size="13">16-bit · little endian</text>
<rect x="235" y="128" width="10.3" height="17" fill="#3c718b"/>
<text x="253.3" y="142" font-size="12">0.018</text>
<text x="20" y="179" font-size="13">16-bit · big endian</text>
<rect x="235" y="165" width="15.4" height="17" fill="#3c718b"/>
<text x="258.4" y="179" font-size="12">0.026</text>
<text x="20" y="216" font-size="13">LEB128 · forward</text>
<rect x="235" y="202" width="15.7" height="17" fill="#3c718b"/>
<text x="258.7" y="216" font-size="12">0.027</text>
<text x="20" y="253" font-size="13">LEB128 · reverse</text>
<rect x="235" y="239" width="2.3" height="17" fill="#3c718b"/>
<text x="250.0" y="253" font-size="12">0.004</text>
<text x="20" y="290" font-size="13">MSB128 · forward</text>
<rect x="235" y="276" width="23.9" height="17" fill="#3c718b"/>
<text x="266.9" y="290" font-size="12">0.040</text>
<text x="20" y="327" font-size="13">MSB128 · reverse</text>
<rect x="235" y="313" width="2.2" height="17" fill="#3c718b"/>
<text x="250.0" y="327" font-size="12">0.004</text>
<text x="20" y="382" font-size="11">Exact values, alternate target and controls are in the result table.</text>
</g></svg>
