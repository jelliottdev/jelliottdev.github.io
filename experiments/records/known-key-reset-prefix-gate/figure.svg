<svg xmlns="http://www.w3.org/2000/svg" width="400" height="436" viewBox="0 0 400 436" role="img" aria-labelledby="title description">
<title id="title">An earlier mismatch cannot be fixed by a later key reset</title>
<desc id="description">For the fixed second-koan key and Warning opening, word resets are excluded on 54 of 55 nonempty pages and line resets on all 55. LP2-54's first output index is 24, matching Warning; the second is 9 rather than 7. The word boundary falls between them, so a word reset can still change the mismatching second rune.</desc>
<rect width="400" height="436" fill="white"/>
<g fill="#222" font-family="Arial, sans-serif">
<text x="16" y="32" font-size="24" font-weight="bold">A later reset cannot repair</text>
<text x="16" y="60" font-size="24" font-weight="bold">an earlier mismatch</text>
<path d="M16 78H384" stroke="#ccc"/>
<text x="16" y="110" font-size="23">Word resets: 54 ruled out</text>
<text x="16" y="138" font-size="20">Only LP2-54 remains open.</text>
<text x="16" y="180" font-size="23">Line resets: all 55 ruled out</text>
<text x="16" y="208" font-size="20">Under this fixed opening test.</text>
<path d="M16 228H384" stroke="#ccc"/>
<text x="16" y="258" font-size="20">LP2-54: the first two letters</text>
<rect x="244" y="272" width="96" height="88" fill="#eee"/>
<text x="16" y="304" font-size="20">Saved output</text>
<text x="190" y="304" font-size="25">A</text><text x="278" y="304" font-size="25">N</text>
<text x="16" y="344" font-size="20">Warning</text>
<text x="190" y="344" font-size="25">A</text><text x="278" y="344" font-size="25">W</text>
<path d="M240 274V358" stroke="#777" stroke-dasharray="4 4"/>
<text x="16" y="391" font-size="20">The word reset falls between them.</text>
<text x="16" y="419" font-size="20">Its second letter still needs a test.</text>
</g></svg>
