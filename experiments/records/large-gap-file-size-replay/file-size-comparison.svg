<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 350" role="img" aria-labelledby="title desc">
<title id="title">Reported page groups differ by about 40 KiB, not 74 KiB</title>
<desc id="desc">The post listed 16 big-gap pages averaging 582.8 KiB and 15 comparison pages averaging 542.9 KiB. Its printed comparison mean of 508.9 is an arithmetic error. The same archived JPEGs yield 39.8 KiB difference.</desc>
<rect width="360" height="350" fill="#f7f8f9"/>
<text x="18" y="33" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#24343d">The file-size comparison</text>
<text x="18" y="57" font-family="system-ui,sans-serif" font-size="12" fill="#50626c">31 reported size labels match the archive.</text>
<text x="18" y="101" font-family="system-ui,sans-serif" font-size="14" fill="#24343d">Big-gap list</text>
<text x="340" y="101" text-anchor="end" font-family="system-ui,sans-serif" font-size="14" font-weight="650" fill="#24343d">582.8 KiB</text>
<rect x="18" y="111" width="262.3" height="17" fill="#31566e"/>
<text x="18" y="166" font-family="system-ui,sans-serif" font-size="14" fill="#24343d">Comparison list</text>
<text x="340" y="166" text-anchor="end" font-family="system-ui,sans-serif" font-size="14" font-weight="650" fill="#24343d">542.9 KiB</text>
<rect x="18" y="176" width="244.3" height="17" fill="#74838b"/>
<path d="M18 209H342" stroke="#ccd3d6"/>
<text x="18" y="240" font-family="system-ui,sans-serif" font-size="15" fill="#24343d">Corrected difference <tspan font-weight="700">39.9 KiB</tspan></text>
<text x="18" y="267" font-family="system-ui,sans-serif" font-size="14" fill="#50626c">Published claim: <tspan text-decoration="line-through">74 KiB</tspan></text>
<text x="18" y="302" font-family="system-ui,sans-serif" font-size="12" fill="#50626c">Archive: 39.8 KiB difference.</text>
<text x="18" y="320" font-family="system-ui,sans-serif" font-size="12" fill="#50626c">Fixed-label shuffle: 17.3% at least as large.</text>
<text x="18" y="338" font-family="system-ui,sans-serif" font-size="10" fill="#50626c">Neither comparison verifies the gap classification.</text>
</svg>
