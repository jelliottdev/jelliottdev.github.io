<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 333" role="img" aria-labelledby="title desc">
<title id="title">Stage R detection scores and pass line</title>
<desc id="desc">All source positive controls exceed the pass line; the best LP2 candidate and all negative controls fall below it.</desc>
<rect width="340" height="333" fill="#f6f7f8"/>
<text x="16" y="27" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#263b49">Detection score</text>
<line x1="142.0" y1="46" x2="142.0" y2="239" stroke="#405463" stroke-width="2" stroke-dasharray="5 4"/>
<text x="148.0" y="49" font-family="Arial,sans-serif" font-size="13" fill="#405463">Pass +30</text>
<text x="17" y="81" font-family="Arial,sans-serif" font-size="13" fill="#253139">Positive control minimum</text>
<text x="323" y="81" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#315d74">+169.09</text>
<line x1="30" y1="97" x2="310" y2="97" stroke="#d4d9dc" stroke-width="2"/>
<circle cx="297.8" cy="97" r="6" fill="#315d74"/>
<text x="17" y="147" font-family="Arial,sans-serif" font-size="13" fill="#253139">Best LP2 candidate</text>
<text x="323" y="147" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#263b49">+2.41</text>
<line x1="30" y1="163" x2="310" y2="163" stroke="#d4d9dc" stroke-width="2"/>
<circle cx="111.1" cy="163" r="6" fill="#263b49"/>
<text x="17" y="213" font-family="Arial,sans-serif" font-size="13" fill="#253139">Negative control maximum</text>
<text x="323" y="213" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#7a858d">-60.86</text>
<line x1="30" y1="229" x2="310" y2="229" stroke="#d4d9dc" stroke-width="2"/>
<circle cx="40.2" cy="229" r="6" fill="#7a858d"/>
<text x="30" y="272" font-family="Arial,sans-serif" font-size="13" fill="#4d5a61">−70</text>
<text x="108" y="272" font-family="Arial,sans-serif" font-size="13" fill="#4d5a61">0</text>
<text x="310" y="272" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#4d5a61">+180</text>
<line x1="16" y1="289" x2="324" y2="289" stroke="#d4d9dc"/>
<text x="16" y="309" font-family="Arial,sans-serif" font-size="13" fill="#4d5a61">Nine-rune title ceiling: +11.19.</text>
<text x="16" y="326" font-family="Arial,sans-serif" font-size="13" fill="#4d5a61">It cannot reach the +30 pass line.</text>
</svg>
