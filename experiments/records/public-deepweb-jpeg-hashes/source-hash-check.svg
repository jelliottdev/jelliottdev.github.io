<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 376" role="img" aria-labelledby="t d">
  <title id="t">Two exact JPEG byte sets, one target</title>
  <desc id="d">The published source's 75 JPEGs match its old checksum table and give no LP2-56 target digest. A separate follow-up on 58 preserved seventh-onion JPEGs also gives no target digest. Both SHA-512 and BLAKE2b-512 were checked for each file.</desc>
  <rect width="340" height="376" fill="#f5f6f7"/>
  <text x="18" y="31" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#202a32">Two JPEG byte sets</text>
  <text x="18" y="59" font-family="Arial,sans-serif" font-size="13" fill="#52616b">Full-file hashes vs the LP2-56 target</text>
  <line x1="18" x2="322" y1="76" y2="76" stroke="#b9c4ca"/>
  <text x="18" y="106" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#202a32">Published source: 75 files</text>
  <text x="18" y="129" font-family="Arial,sans-serif" font-size="13" fill="#52616b">All 75 match its saved checksum table</text>
  <rect x="18" y="143" width="304" height="21" fill="#27556f"/>
  <text x="18" y="188" font-family="Arial,sans-serif" font-size="14" fill="#202a32">SHA-512</text>
  <text x="304" y="188" text-anchor="end" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#202a32">0 / 75</text>
  <text x="18" y="214" font-family="Arial,sans-serif" font-size="14" fill="#202a32">BLAKE2b-512</text>
  <text x="304" y="214" text-anchor="end" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#202a32">0 / 75</text>
  <line x1="18" x2="322" y1="233" y2="233" stroke="#b9c4ca"/>
  <text x="18" y="263" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#202a32">Separate archive: 58 files</text>
  <text x="18" y="286" font-family="Arial,sans-serif" font-size="13" fill="#52616b">Different JPEG bytes; follow-up check</text>
  <text x="18" y="316" font-family="Arial,sans-serif" font-size="14" fill="#202a32">SHA-512</text>
  <text x="304" y="316" text-anchor="end" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#202a32">0 / 58</text>
  <text x="18" y="342" font-family="Arial,sans-serif" font-size="14" fill="#202a32">BLAKE2b-512</text>
  <text x="304" y="342" text-anchor="end" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#202a32">0 / 58</text>
</svg>
