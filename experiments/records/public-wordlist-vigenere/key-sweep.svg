<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 178" role="img" aria-labelledby="title desc">
  <title id="title">Public fixed-key sweep</title>
  <desc id="desc">Forty-three archived keys times 55 rune-bearing unsolved pages yield 2,365 decoded page starts. Zero of 21,285 exact comparisons matched nine fixed known-reading openings.</desc>
  <rect width="620" height="178" fill="#f2f4f5"/>
  <path d="M30 69h560M30 137h560" stroke="#cbd2d7"/>
  <g fill="#263e4c" font-family="system-ui,sans-serif">
    <text x="30" y="34" font-size="16" font-weight="700">Fixed source sweep</text>
    <text x="30" y="103" font-size="29" font-weight="700">43 × 55 = 2,365</text>
    <text x="30" y="123" font-size="13">keys × rune-bearing pages = decoded starts</text>
    <text x="30" y="163" font-size="16" font-weight="700">Known 12-rune opening matches: 0 of 21,285</text>
  </g>
</svg>
