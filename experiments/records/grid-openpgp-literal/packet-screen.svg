<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 234" role="img" aria-labelledby="title desc">
<title id="title">OpenPGP literal-data packet screen</title>
<desc id="desc">Of 16,384 byte readings, 12,288 lack the literal-data tag, 4,096 begin with the tag but have trailing bytes, and none forms a complete packet.</desc>
<rect width="520" height="234" fill="#f5f7f8"/>
<g font-family="Arial, sans-serif" fill="#20323d">
<text x="20" y="32" font-size="19" font-weight="700">A matching first byte is not a packet</text>
<text x="20" y="54" font-size="13">16,384 fixed readings of the 256-cell grid</text>
<text x="20" y="89" font-size="14">No literal-data tag</text>
<rect x="20" y="100" width="360" height="22" fill="#637783"/>
<text x="392" y="117" font-size="14" font-weight="700">12,288</text>
<text x="20" y="151" font-size="14">Tag present; framing fails</text>
<rect x="20" y="162" width="120" height="22" fill="#285b74"/>
<text x="152" y="179" font-size="14" font-weight="700">4,096</text>
<text x="20" y="217" font-size="13">Complete packets: 0</text>
</g></svg>
