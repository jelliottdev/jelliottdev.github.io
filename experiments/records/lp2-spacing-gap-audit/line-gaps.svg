<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc">
<title id="title">LP2 line-gap measurement, original 2400-pixel-wide images</title>
<desc id="desc">The LP2-15 number panel has 62, 61 and 79 blank-pixel rows between its four rows. The last gap is 17 pixels wider than either earlier panel gap. Adjacent text controls measure 73 to 75 pixels.</desc>
<rect width="760" height="450" fill="#faf9f5"/>
<text x="32" y="43" font-family="Georgia,serif" font-size="25" fill="#172b32">A wide gap before the fourth number row</text>
<text x="32" y="68" font-family="Arial,sans-serif" font-size="14" fill="#49575c">Blank rows between printed line boxes · original JPEG pixels</text>
<text x="32" y="112" font-family="Arial,sans-serif" font-size="15" fill="#25363d">LP2-15 number panel, row 1 → 2</text>
<rect x="32" y="121" width="434" height="15" fill="#546c78"/>
<text x="482" y="134" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#546c78">62 px</text>
<text x="32" y="169" font-family="Arial,sans-serif" font-size="15" fill="#25363d">LP2-15 number panel, row 2 → 3</text>
<rect x="32" y="178" width="427" height="15" fill="#546c78"/>
<text x="475" y="191" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#546c78">61 px</text>
<text x="32" y="226" font-family="Arial,sans-serif" font-size="15" fill="#25363d">LP2-15 number panel, row 3 → 4</text>
<rect x="32" y="235" width="553" height="15" fill="#a6402b"/>
<text x="601" y="248" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#a6402b">79 px</text>
<text x="32" y="283" font-family="Arial,sans-serif" font-size="15" fill="#25363d">LP2-15 rune text (six gaps)</text>
<rect x="32" y="292" width="518" height="15" fill="#8e999c"/>
<text x="566" y="305" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#8e999c">74 px</text>
<text x="32" y="340" font-family="Arial,sans-serif" font-size="15" fill="#25363d">LP2-14 and LP2-16 rune text (17 gaps)</text>
<rect x="32" y="349" width="518" height="15" fill="#8e999c"/>
<text x="566" y="362" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#8e999c">74 px</text>
<text x="32" y="408" font-family="Arial,sans-serif" font-size="13" fill="#59666a">Text controls: LP2-15 = 74 px throughout; LP2-14/16 = 73–75 px.</text>
<text x="32" y="428" font-family="Arial,sans-serif" font-size="13" fill="#59666a">This establishes a layout difference, not an encoded bit or its cause.</text>
</svg>
