<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 348" role="img" aria-labelledby="title desc">
<title id="title">An expected floor is not a per-sample minimum</title>
<desc id="desc">In a three-symbol example with 81 equally likely independent keys, 24 produce zero adjacent repeats even though the expected repeat rate and minimum plaintext difference frequency are one third.</desc>
<rect width="440" height="348" fill="#f4f6f7"/>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<text x="20" y="32" font-size="17" font-weight="700" fill="#20323c">A model floor can have lower outcomes</text>
<text x="20" y="56" font-size="13" fill="#52626d">Toy model: 3 symbols · 3 adjacent positions · 81 possible keys</text>
<path d="M40 270H406" stroke="#8496a0"/>
<rect x="56" y="167" width="58" height="103" fill="#2d657f"/>
<text x="85" y="157" text-anchor="middle" font-size="14" fill="#233844">24/81</text>
<text x="85" y="293" text-anchor="middle" font-size="14" fill="#233844">0</text>
<rect x="149" y="116" width="58" height="154" fill="#7a8d98"/>
<text x="178" y="106" text-anchor="middle" font-size="14" fill="#233844">36/81</text>
<text x="178" y="293" text-anchor="middle" font-size="14" fill="#233844">1</text>
<rect x="242" y="193" width="58" height="77" fill="#7a8d98"/>
<text x="271" y="183" text-anchor="middle" font-size="14" fill="#233844">18/81</text>
<text x="271" y="293" text-anchor="middle" font-size="14" fill="#233844">2</text>
<rect x="335" y="257" width="58" height="13" fill="#7a8d98"/>
<text x="364" y="247" text-anchor="middle" font-size="14" fill="#233844">3/81</text>
<text x="364" y="293" text-anchor="middle" font-size="14" fill="#233844">3</text>
<text x="220" y="320" text-anchor="middle" font-size="14" fill="#233844">Adjacent repeats in one ciphertext</text>
<text x="220" y="340" text-anchor="middle" font-size="12" fill="#52626d">Expected count: 1 · zero remains possible (24/81)</text>
</g></svg>
