<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" role="img" aria-labelledby="title desc">
<title id="title">Fibonacci remainders repeat after 14 terms</title>
<desc id="desc">Read each row left to right: the remainders at offsets 0 through 13 are 0, 1, 1, 2, 3, 5, 8, 13, 21, 5, 26, 2, 28, 1. Offsets 14 and 15 return to 0 and 1.</desc>
<rect width="440" height="330" fill="#f7f7f3"/>
<g font-family="sans-serif" fill="#263b46">
<text x="18" y="32" font-size="21">Fibonacci shifts modulo 29</text>
<text x="18" y="59" font-size="16">Offset above; applied remainder below</text>
<rect x="19" y="78" width="52" height="69" fill="white" stroke="#d7dddf"/>
<text x="45" y="100" text-anchor="middle" font-size="14">0</text>
<text x="45" y="130" text-anchor="middle" font-size="22">0</text>
<rect x="77" y="78" width="52" height="69" fill="white" stroke="#d7dddf"/>
<text x="103" y="100" text-anchor="middle" font-size="14">1</text>
<text x="103" y="130" text-anchor="middle" font-size="22">1</text>
<rect x="135" y="78" width="52" height="69" fill="white" stroke="#d7dddf"/>
<text x="161" y="100" text-anchor="middle" font-size="14">2</text>
<text x="161" y="130" text-anchor="middle" font-size="22">1</text>
<rect x="193" y="78" width="52" height="69" fill="white" stroke="#d7dddf"/>
<text x="219" y="100" text-anchor="middle" font-size="14">3</text>
<text x="219" y="130" text-anchor="middle" font-size="22">2</text>
<rect x="251" y="78" width="52" height="69" fill="white" stroke="#d7dddf"/>
<text x="277" y="100" text-anchor="middle" font-size="14">4</text>
<text x="277" y="130" text-anchor="middle" font-size="22">3</text>
<rect x="309" y="78" width="52" height="69" fill="white" stroke="#d7dddf"/>
<text x="335" y="100" text-anchor="middle" font-size="14">5</text>
<text x="335" y="130" text-anchor="middle" font-size="22">5</text>
<rect x="367" y="78" width="52" height="69" fill="white" stroke="#d7dddf"/>
<text x="393" y="100" text-anchor="middle" font-size="14">6</text>
<text x="393" y="130" text-anchor="middle" font-size="22">8</text>
<rect x="19" y="157" width="52" height="69" fill="white" stroke="#d7dddf"/>
<text x="45" y="179" text-anchor="middle" font-size="14">7</text>
<text x="45" y="209" text-anchor="middle" font-size="22">13</text>
<rect x="77" y="157" width="52" height="69" fill="white" stroke="#d7dddf"/>
<text x="103" y="179" text-anchor="middle" font-size="14">8</text>
<text x="103" y="209" text-anchor="middle" font-size="22">21</text>
<rect x="135" y="157" width="52" height="69" fill="white" stroke="#d7dddf"/>
<text x="161" y="179" text-anchor="middle" font-size="14">9</text>
<text x="161" y="209" text-anchor="middle" font-size="22">5</text>
<rect x="193" y="157" width="52" height="69" fill="white" stroke="#d7dddf"/>
<text x="219" y="179" text-anchor="middle" font-size="14">10</text>
<text x="219" y="209" text-anchor="middle" font-size="22">26</text>
<rect x="251" y="157" width="52" height="69" fill="white" stroke="#d7dddf"/>
<text x="277" y="179" text-anchor="middle" font-size="14">11</text>
<text x="277" y="209" text-anchor="middle" font-size="22">2</text>
<rect x="309" y="157" width="52" height="69" fill="white" stroke="#d7dddf"/>
<text x="335" y="179" text-anchor="middle" font-size="14">12</text>
<text x="335" y="209" text-anchor="middle" font-size="22">28</text>
<rect x="367" y="157" width="52" height="69" fill="white" stroke="#d7dddf"/>
<text x="393" y="179" text-anchor="middle" font-size="14">13</text>
<text x="393" y="209" text-anchor="middle" font-size="22">1</text>
<text x="18" y="265" font-size="18">Offsets 14 and 15 return to 0, 1.</text>
<text x="18" y="291" font-size="16">The repeated pair restarts the cycle.</text>
<text x="18" y="317" font-size="16">Offsets 0, 14 and 28 give the same shifts.</text>
</g></svg>
