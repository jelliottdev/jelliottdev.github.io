<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 240" role="img" aria-labelledby="title desc">
<title id="title">Zero outputs under three literal ciphertext-feedback inverses</title>
<desc id="desc">Additive and Beaufort inverses both yield 86 zeroes, exactly the ciphertext doublet positions. Subtractive yields 437 zeroes at a different set of positions.</desc>
<rect width="610" height="240" fill="white"/>
<g font-family="system-ui,sans-serif" fill="#27343c">
<text x="18" y="27" font-size="18" font-weight="600">Different rules, different zero conditions</text>
<text x="18" y="48" font-size="12">12,901 within-page pairs · LP2-00–55</text>
<text x="18" y="83" font-size="14">Additive</text>
<rect x="140" y="67" width="68.8" height="20" fill="#255f79"/>
<text x="520" y="83" font-size="14">86</text>
<text x="18" y="126" font-size="14">Beaufort</text>
<rect x="140" y="110" width="68.8" height="20" fill="#255f79"/>
<text x="520" y="126" font-size="14">86</text>
<text x="18" y="169" font-size="14">Subtractive</text>
<rect x="140" y="153" width="349.6" height="20" fill="#255f79"/>
<text x="520" y="169" font-size="14">437</text>
<text x="18" y="225" font-size="12">A zero count is a structural check, not a plaintext reading.</text>
</g></svg>
