<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 246" role="img" aria-labelledby="title desc">
<title id="title">Longest consecutive run of page-index bytes</title>
<desc id="desc">A page-order table needs 56 or 57 eligible bytes in a row. The source stream has at most three; the 16,384 grid readings have at most three for the 0–55 range or five for 0–56.</desc>
<rect width="520" height="246" fill="#f5f7f8"/>
<g font-family="Arial, sans-serif" fill="#20323d">
<text x="20" y="31" font-size="19" font-weight="700">A page table needs a long run</text>
<text x="20" y="53" font-size="13">Consecutive byte values inside the proposed index range</text>
<text x="20" y="87" font-size="14">Required: 0–55</text>
<rect x="200" y="72" width="280" height="21" fill="#a9b7bd"/>
<text x="472" y="87" font-size="13" text-anchor="end">56</text>
<text x="20" y="123" font-size="14">Observed: 0–55</text>
<rect x="200" y="108" width="15" height="21" fill="#285b74"/>
<text x="225" y="123" font-size="13">3</text>
<text x="20" y="159" font-size="14">Required: 0–56</text>
<rect x="200" y="144" width="285" height="21" fill="#a9b7bd"/>
<text x="477" y="159" font-size="13" text-anchor="end">57</text>
<text x="20" y="195" font-size="14">Observed: 0–56</text>
<rect x="200" y="180" width="25" height="21" fill="#285b74"/>
<text x="235" y="195" font-size="13">5</text>
<text x="20" y="227" font-size="12">Best of 16,384 fixed readings; published source byte stream reaches only 3.</text>
</g></svg>
