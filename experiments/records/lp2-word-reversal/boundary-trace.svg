<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 370" role="img" aria-labelledby="title desc"><title id="title">Where line-boundary rules first change LP2-31 output</title><desc id="desc">Six consecutive output positions from the saved result, starting at the first difference. Values are original source rune ordinals, counted from zero.</desc><rect width="360" height="370" fill="#faf9f5"/><g fill="#243c48" font-family="sans-serif"><text x="18" y="28" font-size="19">LP2-31: two boundary rules</text><text x="18" y="53" font-size="13">Source rune ordinal at each output position</text><text x="18" y="88" font-size="13">Output</text><text x="108" y="88" font-size="13">Split lines</text><text x="233" y="88" font-size="13">Join lines</text><path d="M18 128 H340" stroke="#dce0df"/><text x="18" y="119" font-size="16">43</text><text x="108" y="119" font-size="16">44</text><text x="233" y="119" font-size="16">48</text><path d="M18 158 H340" stroke="#dce0df"/><text x="18" y="149" font-size="16">44</text><text x="108" y="149" font-size="16">43</text><text x="233" y="149" font-size="16">47</text><path d="M18 188 H340" stroke="#dce0df"/><text x="18" y="179" font-size="16">45</text><text x="108" y="179" font-size="16">48</text><text x="233" y="179" font-size="16">46</text><path d="M18 218 H340" stroke="#dce0df"/><text x="18" y="209" font-size="16">46</text><text x="108" y="209" font-size="16">47</text><text x="233" y="209" font-size="16">45</text><path d="M18 248 H340" stroke="#dce0df"/><text x="18" y="239" font-size="16">47</text><text x="108" y="239" font-size="16">46</text><text x="233" y="239" font-size="16">44</text><path d="M18 278 H340" stroke="#dce0df"/><text x="18" y="269" font-size="16">48</text><text x="108" y="269" font-size="16">45</text><text x="233" y="269" font-size="16">43</text><text x="18" y="310" font-size="13">All positions count from zero.</text><text x="18" y="333" font-size="13">Both routes retain every rune exactly once.</text><text x="18" y="356" font-size="13">These are positions, not decoded words.</text></g></svg>
