<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-labelledby="title desc"><title id="title">Doublet positions modulo seven</title><desc id="desc">The seven observed counts are 7, 10, 12, 10, 15, 18, 14. The expected count per remainder is near 12.3. The strongest of seven tested moduli is ordinary under controls.</desc><rect width="360" height="240" fill="#f4f6f7"/><g fill="#20333d" font-family="system-ui, sans-serif"><text x="14" y="28" font-size="17" font-weight="700">Where do doublets land?</text><text x="14" y="48" font-size="12">Section position, remainder after ÷ 7</text><line x1="16" x2="344" y1="98.0" y2="98.0" stroke="#8b6a54" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="25" y="135" width="28" height="49" fill="#3b6476"/><text x="39" y="129" text-anchor="middle" font-size="12">7</text><text x="39" y="204" text-anchor="middle" font-size="12">0</text><rect x="72" y="114" width="28" height="70" fill="#3b6476"/><text x="86" y="108" text-anchor="middle" font-size="12">10</text><text x="86" y="204" text-anchor="middle" font-size="12">1</text><rect x="119" y="100" width="28" height="84" fill="#3b6476"/><text x="133" y="94" text-anchor="middle" font-size="12">12</text><text x="133" y="204" text-anchor="middle" font-size="12">2</text><rect x="166" y="114" width="28" height="70" fill="#3b6476"/><text x="180" y="108" text-anchor="middle" font-size="12">10</text><text x="180" y="204" text-anchor="middle" font-size="12">3</text><rect x="213" y="79" width="28" height="105" fill="#3b6476"/><text x="227" y="73" text-anchor="middle" font-size="12">15</text><text x="227" y="204" text-anchor="middle" font-size="12">4</text><rect x="260" y="58" width="28" height="126" fill="#3b6476"/><text x="274" y="52" text-anchor="middle" font-size="12">18</text><text x="274" y="204" text-anchor="middle" font-size="12">5</text><rect x="307" y="86" width="28" height="98" fill="#3b6476"/><text x="321" y="80" text-anchor="middle" font-size="12">14</text><text x="321" y="204" text-anchor="middle" font-size="12">6</text><text x="14" y="229" font-size="12">Dashed line: expected ≈ 12.3 in each group</text></g></svg>
