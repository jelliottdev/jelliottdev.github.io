<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 264" role="img" aria-labelledby="t d" style="font-family:Arial,sans-serif">
<title id="t">The fresh ornament reader misses its solved-page gate</title>
<desc id="d">Raw reading matched 82 of 96 glyphs on LP2-56 and 89 of 109 on LP2-57. Both are below the source's 90 percent gate.</desc>
<rect width="320" height="264" fill="#fff"/>
<text x="24" y="29" fill="#222b33" font-size="17" font-weight="700">Can the reader read known text?</text>
<text x="24" y="53" fill="#4b5962" font-size="13">Held-out solved pages · no text-position hints</text>
<text x="24" y="88" fill="#263d4c" font-size="15" font-weight="700">LP2-56</text>
<text x="294" y="88" text-anchor="end" fill="#30424e" font-size="14">82/96 = 85.4%</text>
<rect x="24" y="99" width="270" height="22" fill="#e7ecef"/>
<rect x="24" y="99" width="230.62" height="22" fill="#557c8d"/>
<line x1="267.00" y1="94" x2="267.00" y2="128" stroke="#292f34" stroke-width="2"/><text x="24" y="155" fill="#263d4c" font-size="15" font-weight="700">LP2-57</text>
<text x="294" y="155" text-anchor="end" fill="#30424e" font-size="14">89/109 = 81.7%</text>
<rect x="24" y="166" width="270" height="22" fill="#e7ecef"/>
<rect x="24" y="166" width="220.46" height="22" fill="#557c8d"/>
<line x1="267.00" y1="161" x2="267.00" y2="195" stroke="#292f34" stroke-width="2"/>
<text x="24" y="218" fill="#263d4c" font-size="14" font-weight="700">Combined: 83.4%</text>
<text x="24" y="241" fill="#4b5962" font-size="13">Black marks show the required 90%.</text>
</svg>