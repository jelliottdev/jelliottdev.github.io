<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 334" role="img" aria-labelledby="title desc">
  <title id="title">Largest page-pair score compared with shuffled searches</title>
  <desc id="desc">The largest observed index of coincidence among 2,970 page-pair outputs was 0.0446. Across 256 shuffled searches, the median maximum was 0.0476 and the 95th percentile was 0.0531. In 235 of 256 shuffles, the largest score was at least the observed score.</desc>
  <rect width="340" height="334" fill="#f3f5f6"/>
  <rect x="8" y="8" width="324" height="318" rx="3" fill="#fff" stroke="#cbd4d9"/>
  <g font-family="system-ui,sans-serif">
    <text x="20" y="38" fill="#223740" font-size="18" font-weight="700">No standout page pair</text>
    <g fill="#536b75" font-size="16">
      <text x="20" y="62">Top score across 2,970</text>
      <text x="20" y="84">page-pair sums and differences</text>
    </g>
    <g fill="#223740" font-size="16">
      <text x="20" y="122">Observed</text><text x="320" y="122" text-anchor="end">0.0446</text>
      <text x="20" y="176">Shuffled median</text><text x="320" y="176" text-anchor="end">0.0476</text>
      <text x="20" y="230">Shuffled 95th percentile</text><text x="320" y="230" text-anchor="end">0.0531</text>
    </g>
    <g fill="#e4eaed">
      <rect x="20" y="132" width="300" height="16" rx="2"/>
      <rect x="20" y="186" width="300" height="16" rx="2"/>
      <rect x="20" y="240" width="300" height="16" rx="2"/>
    </g>
    <rect x="20" y="132" width="223" height="16" rx="2" fill="#2d5c72"/>
    <rect x="20" y="186" width="238" height="16" rx="2" fill="#7b8f99"/>
    <rect x="20" y="240" width="266" height="16" rx="2" fill="#a2b0b8"/>
    <line x1="20" y1="273" x2="320" y2="273" stroke="#d7dfe3"/>
    <g fill="#536b75" font-size="16">
      <text x="20" y="299">235 of 256 shuffled searches</text>
      <text x="20" y="320">reached at least this score.</text>
    </g>
  </g>
</svg>
