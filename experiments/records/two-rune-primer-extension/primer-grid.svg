<text x="20" y="645" font-size="22">Why the start still matters</text>
<text x="20" y="683">Example output errors:</text>
<rect x="20" y="704" width="50" height="46" fill="#f1f1f1"/>
<text x="45" y="733" text-anchor="middle" font-size="20">3</text>
<rect x="74" y="704" width="50" height="46" fill="#f1f1f1"/>
<text x="99" y="733" text-anchor="middle" font-size="20">5</text>
<rect x="128" y="704" width="50" height="46" fill="#f1f1f1"/>
