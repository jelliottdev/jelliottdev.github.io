<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img" aria-labelledby="title desc">
<title id="title">Planted messages miss the final score bars</title>
<desc id="desc">Four planted reads beat their individual length controls, but their score markers sit below the final thresholds used for the source text.</desc>
<rect width="360" height="480" fill="#f4f5f6"/>
<g font-family="system-ui, sans-serif" fill="#27343d">
<text x="18" y="31" font-size="17" font-weight="650">The controls missed the final gate</text>
<text x="18" y="53" font-size="12" fill="#52606b">Higher English score is farther right.</text>
<text x="18" y="95" font-size="14" font-weight="600">Every-7 selection</text>
<text x="18" y="190" font-size="14" font-weight="600">Diagonal selection</text>
<text x="18" y="285" font-size="14" font-weight="600">Line-first acrostic</text>
<text x="18" y="380" font-size="14" font-weight="600">Word-first acrostic</text>
</g>
<g stroke="#c9d2d8" stroke-width="2">
<line x1="35" x2="325" y1="124" y2="124"/><line x1="35" x2="325" y1="219" y2="219"/>
<line x1="35" x2="325" y1="314" y2="314"/><line x1="35" x2="325" y1="409" y2="409"/>
</g>
<g fill="#54758b"><circle cx="204" cy="124" r="7"/><circle cx="205" cy="219" r="7"/><circle cx="192" cy="314" r="7"/><circle cx="207" cy="409" r="7"/></g>
<g stroke="#ad4b45" stroke-width="3"><line x1="293" x2="293" y1="110" y2="138"/><line x1="293" x2="293" y1="205" y2="233"/><line x1="233" x2="233" y1="300" y2="328"/><line x1="233" x2="233" y1="395" y2="423"/></g>
<g font-family="system-ui, sans-serif" font-size="12" fill="#44525c">
<text x="181" y="151">−4.09</text><text x="269" y="151">−2.56</text>
<text x="181" y="246">−4.07</text><text x="269" y="246">−2.56</text>
<text x="169" y="341">−4.29</text><text x="209" y="341">−3.60</text>
<text x="184" y="436">−4.02</text><text x="209" y="436">−3.60</text>
</g>
<g font-family="system-ui, sans-serif" font-size="11" fill="#52606b"><text x="18" y="465">● planted read</text><text x="139" y="465" fill="#9b413c">│ final threshold</text><text x="285" y="465">higher →</text></g>
</svg>
