<svg xmlns="http://www.w3.org/2000/svg" width="360" height="790" viewBox="0 0 360 790">
<rect width="360" height="790" fill="white"/>
<g font-family="Arial,sans-serif" font-size="20" fill="#222">
<text x="20" y="34">Next-rune predictions</text>
<text x="20" y="68">None crossed the fixed gate.</text>
<line x1="20" x2="340" y1="91" y2="91" stroke="#ccc"/>
<text x="20" y="126">16 models vs a uniform guess</text>
<rect x="20" y="148" width="16" height="28" fill="#444" stroke="#777"/>
<rect x="40" y="148" width="16" height="28" fill="#444" stroke="#777"/>
<rect x="60" y="148" width="16" height="28" fill="#eee" stroke="#777"/>
<rect x="80" y="148" width="16" height="28" fill="#eee" stroke="#777"/>
<rect x="100" y="148" width="16" height="28" fill="#eee" stroke="#777"/>
<rect x="120" y="148" width="16" height="28" fill="#aaa" stroke="#777"/>
<rect x="140" y="148" width="16" height="28" fill="#aaa" stroke="#777"/>
<rect x="160" y="148" width="16" height="28" fill="#aaa" stroke="#777"/>
<rect x="180" y="148" width="16" height="28" fill="#aaa" stroke="#777"/>
<rect x="200" y="148" width="16" height="28" fill="#aaa" stroke="#777"/>
<rect x="220" y="148" width="16" height="28" fill="#aaa" stroke="#777"/>
<rect x="240" y="148" width="16" height="28" fill="#aaa" stroke="#777"/>
<rect x="260" y="148" width="16" height="28" fill="#aaa" stroke="#777"/>
<rect x="280" y="148" width="16" height="28" fill="#aaa" stroke="#777"/>
<rect x="300" y="148" width="16" height="28" fill="#aaa" stroke="#777"/>
<rect x="320" y="148" width="16" height="28" fill="#aaa" stroke="#777"/>
<text x="20" y="211">2 slightly better</text>
<text x="20" y="244">3 equivalent within tolerance</text>
<text x="20" y="277">11 worse</text>
<text x="20" y="322">Largest gain: 0.000207</text>
<text x="20" y="352">bits per rune below uniform.</text>
<text x="20" y="386">27 controls did at least as well.</text>
<line x1="20" x2="340" y1="412" y2="412" stroke="#ccc"/>
<text x="20" y="450">Combined 26-measurement test</text>
<text x="20" y="489">35 of 1,000 filtered controls</text>
<text x="20" y="520">scored at least as strongly.</text>
<text x="20" y="558">Fixed 1% gate: not passed.</text>
<line x1="20" x2="340" y1="583" y2="583" stroke="#ccc"/>
<text x="20" y="622">Packed LZMA flagged none of</text>
<text x="20" y="653">18 synthetic examples.</text>
<text x="20" y="694">Includes 12 strong patterns.</text>
<text x="20" y="725">This does not prove randomness</text>
<text x="20" y="756">or rule out a plaintext.</text>
</g></svg>
