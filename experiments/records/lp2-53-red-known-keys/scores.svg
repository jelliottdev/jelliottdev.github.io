<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 410" role="img" aria-labelledby="title desc"><title id="title">LP2-53 red passage: known-key score comparison</title><desc id="desc">The best score from 42 known-key settings is near the median maximum from 999 shuffled red passages and below the fixed English-score threshold. Nine known readings score above the threshold.</desc><style>text{font-family:Arial,sans-serif;fill:#24313b} .sm{font-size:15px} .label{font-size:16px;font-weight:600} .title{font-size:17px;font-weight:700} .guide{stroke:#d6dce0;stroke-width:1}</style><rect width="320" height="410" fill="#fff"/><text x="16" y="26" class="title">51 red runes · 42 settings</text><text x="16" y="51" class="sm">Higher score means closer to</text><text x="16" y="70" class="sm">the known English readings.</text><line x1="40.0" y1="110" x2="40.0" y2="339" class="guide"/><text x="40.0" y="102" text-anchor="middle" class="sm">-7</text><line x1="120.0" y1="110" x2="120.0" y2="339" class="guide"/><text x="120.0" y="102" text-anchor="middle" class="sm">-6</text><line x1="200.0" y1="110" x2="200.0" y2="339" class="guide"/><text x="200.0" y="102" text-anchor="middle" class="sm">-5</text><line x1="280.0" y1="110" x2="280.0" y2="339" class="guide"/><text x="280.0" y="102" text-anchor="middle" class="sm">-4</text><text x="16" y="143" class="label">Shuffled best scores</text><text x="16" y="163" class="sm">999 controls · -6.94 to -6.34</text><line x1="45.1" y1="183" x2="92.9" y2="183" stroke="#8595a0" stroke-width="12" stroke-linecap="round"/><circle cx="63.9" cy="183" r="5" fill="#24313b"/><text x="16" y="219" class="label">Best red decode</text><circle cx="65.0" cy="242" r="8" fill="#315c73"/><text x="78.0" y="247" class="sm">-6.69</text><text x="16" y="280" class="label">Nine known readings</text><text x="16" y="303" class="sm">-5.24 to -4.09</text><line x1="180.9" y1="326" x2="272.9" y2="326" stroke="#315c73" stroke-width="12" stroke-linecap="round"/><line x1="160.0" y1="174" x2="160.0" y2="199" stroke="#9a3f3f" stroke-width="2" stroke-dasharray="5 4"/><line x1="160.0" y1="232" x2="160.0" y2="255" stroke="#9a3f3f" stroke-width="2" stroke-dasharray="5 4"/><line x1="160.0" y1="315" x2="160.0" y2="339" stroke="#9a3f3f" stroke-width="2" stroke-dasharray="5 4"/><text x="16" y="370" class="sm">Dashed line: English cutoff −5.5</text><text x="16" y="395" class="sm">Black dot: shuffled median</text></svg>
