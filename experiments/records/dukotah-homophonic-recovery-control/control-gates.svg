<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 790" width="360" height="790" role="img" aria-labelledby="title desc">
<title id="title">Three known synthetic controls missed both detection gates</title>
<desc id="desc">Search-score and held-out z values are below the required value of three for all three controls. No complete class stream was recovered. No manuscript target was scored.</desc>
<rect width="360" height="790" fill="white"/>
<g fill="#242424" font-family="Arial,sans-serif" font-size="20">
<text x="20" y="32" font-size="23">Three known controls</text>
<text x="20" y="62" font-size="23">missed both gates</text>
<text x="20" y="100">Pass requires z &gt; 3.</text>
<circle cx="27" cy="139" r="6" fill="#303030"/><text x="44" y="146">Search-score z</text>
<circle cx="27" cy="173" r="6" fill="#999999"/><text x="44" y="180">Held-out z</text>
<line x1="280" y1="250" x2="280" y2="546" stroke="#777" stroke-dasharray="5 5"/>
<text x="20" y="220">12 groups</text>
<text x="20" y="247">No repeat suppression</text>
<line x1="40" y1="280" x2="320" y2="280" stroke="#e3e3e3"/>
<circle cx="149.56" cy="270" r="6" fill="#303030"/>
<circle cx="65.11" cy="290" r="6" fill="#999999"/>
<text x="20" y="340">12 groups</text>
<text x="20" y="367">Repeat suppression</text>
<line x1="40" y1="400" x2="320" y2="400" stroke="#e3e3e3"/>
<circle cx="190.87" cy="390" r="6" fill="#303030"/>
<circle cx="195.44" cy="410" r="6" fill="#999999"/>
<text x="20" y="460">18 groups</text>
<text x="20" y="487">Repeat suppression</text>
<line x1="40" y1="520" x2="320" y2="520" stroke="#e3e3e3"/>
<circle cx="135.41" cy="510" r="6" fill="#303030"/>
<circle cx="57.10" cy="530" r="6" fill="#999999"/>
<text x="40" y="580" text-anchor="middle">0</text>
<text x="120" y="580" text-anchor="middle">1</text>
<text x="200" y="580" text-anchor="middle">2</text>
<text x="280" y="580" text-anchor="middle">3</text>
<text x="20" y="621">Higher z means stronger</text>
<text x="20" y="648">separation from shuffles.</text>
<text x="20" y="690">Complete class-stream</text>
<text x="20" y="717">recovery: 0 of 3.</text>
<text x="20" y="758">No manuscript target scored.</text>
</g></svg>
