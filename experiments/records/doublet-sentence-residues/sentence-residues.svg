<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 316" role="img" aria-labelledby="title desc">
  <title id="title">Sentence-relative doublet positions modulo three</title>
  <desc id="desc">Observed counts at residues zero, one and two are 26, 23 and 37, against opportunity-weighted expectations about 29, 29 and 28. The best seven-modulus pattern is matched or exceeded in 2,068 of 5,000 controls.</desc>
  <rect width="340" height="316" fill="#f4f5f6"/>
  <text x="16" y="30" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#202b33">Strongest grouping: modulo 3</text>
  <text x="16" y="54" font-family="Arial,sans-serif" font-size="14" fill="#45545d">86 doublets · position from sentence start</text>
  <text x="16" y="86" font-family="Arial,sans-serif" font-size="14" fill="#45545d">Position 0</text>
  <rect x="115" y="70" width="130" height="23" fill="#315e78"/>
  <line x1="260" y1="67" x2="260" y2="96" stroke="#1d2730" stroke-width="2"/>
  <text x="272" y="87" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#202b33">26</text>
  <text x="16" y="129" font-family="Arial,sans-serif" font-size="14" fill="#45545d">Position 1</text>
  <rect x="115" y="113" width="115" height="23" fill="#315e78"/>
  <line x1="258" y1="110" x2="258" y2="139" stroke="#1d2730" stroke-width="2"/>
  <text x="272" y="130" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#202b33">23</text>
  <text x="16" y="172" font-family="Arial,sans-serif" font-size="14" fill="#45545d">Position 2</text>
  <rect x="115" y="156" width="185" height="23" fill="#315e78"/>
  <line x1="256" y1="153" x2="256" y2="182" stroke="#1d2730" stroke-width="2"/>
  <text x="303" y="173" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#202b33">37</text>
  <line x1="17" y1="207" x2="37" y2="207" stroke="#1d2730" stroke-width="2"/>
  <text x="45" y="212" font-family="Arial,sans-serif" font-size="13" fill="#45545d">Expected count (about 28–29)</text>
  <rect x="16" y="233" width="308" height="60" rx="4" fill="#fff" stroke="#c5ccd0"/>
  <text x="28" y="259" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#202b33">2,068 of 5,000 controls</text>
  <text x="28" y="281" font-family="Arial,sans-serif" font-size="13" fill="#45545d">as strong after the same seven-way scan</text>
</svg>
