<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 350" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
<title id="title">No excess repeated-symbol pointer run</title>
<desc id="desc">On all three number streams, the longest low-entropy base32 run is shorter than the largest of 200 shuffled controls. Only a longer run of at least 16 would be flagged by the source.</desc>
<rect x="0" y="0" width="320" height="350" fill="#f5f6f7"/>
<text x="16" y="29" font-size="17" font-weight="700" fill="#202a32">Repeated-symbol runs</text>
<text x="16" y="52" font-size="13" fill="#46545f">Length in mapped base32 characters</text>
<text x="16" y="91" font-size="14" font-weight="700" fill="#202a32">Prime values</text>
<rect x="16" y="101" width="144" height="12" rx="2" fill="#27617b"/>
<text x="166" y="112" font-size="13" fill="#202a32">16 observed</text>
<rect x="16" y="122" width="198.0" height="12" rx="2" fill="#87939b"/>
<text x="220.0" y="133" font-size="13" fill="#202a32">22 shuffled max</text>
<text x="16" y="174" font-size="14" font-weight="700" fill="#202a32">Prime index</text>
<rect x="16" y="184" width="90" height="12" rx="2" fill="#27617b"/>
<text x="112" y="195" font-size="13" fill="#202a32">10 observed</text>
<rect x="16" y="205" width="135.0" height="12" rx="2" fill="#87939b"/>
<text x="157.0" y="216" font-size="13" fill="#202a32">15 shuffled max</text>
<text x="16" y="257" font-size="14" font-weight="700" fill="#202a32">Prime totient</text>
<rect x="16" y="267" width="144" height="12" rx="2" fill="#27617b"/>
<text x="166" y="278" font-size="13" fill="#202a32">16 observed</text>
<rect x="16" y="288" width="198.0" height="12" rx="2" fill="#87939b"/>
<text x="220.0" y="299" font-size="13" fill="#202a32">22 shuffled max</text>
<line x1="16" y1="309" x2="304" y2="309" stroke="#c7cdd1"/>
<text x="16" y="331" font-size="13" fill="#46545f">Flag only if observed exceeds shuffled max.</text>
</svg>
