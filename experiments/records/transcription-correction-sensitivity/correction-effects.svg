<svg xmlns="http://www.w3.org/2000/svg" width="360" height="618" viewBox="0 0 360 618" role="img" aria-labelledby="title desc">
<title id="title">Eight reviewed corrections and the measures they change</title>
<desc id="desc">For each page, the chart shows the non-rune marks added or removed and whether ordered runes or rune tokens changed. Seven LP2 pages have mark edits but unchanged rune and token streams. LP1-10 changes rune order, leaving token length counts unchanged.</desc>
<rect width="360" height="618" fill="#faf9f5"/>
<g font-family="Arial,sans-serif" fill="#263b45">
<text x="16" y="31" font-size="18">What the corrections change</text>
<text x="16" y="54" font-size="13">The original images were not rechecked here</text>
<path d="M16 129H344" stroke="#e3e1da"/>
<text x="16" y="92" font-size="16" font-weight="bold">LP1-10</text>
<text x="151" y="92" font-size="14">Mark edits: none</text>
<text x="16" y="116" font-size="14" fill="#a74e37">Runes: changed</text>
<text x="180" y="116" font-size="14" fill="#a74e37">Tokens: changed</text>
<path d="M16 192H344" stroke="#e3e1da"/>
<text x="16" y="155" font-size="16" font-weight="bold">LP2-05</text>
<text x="151" y="155" font-size="14">Mark edits: - +1</text>
<text x="16" y="179" font-size="14" fill="#315f73">Runes: same</text>
<text x="180" y="179" font-size="14" fill="#315f73">Tokens: same</text>
<path d="M16 255H344" stroke="#e3e1da"/>
<text x="16" y="218" font-size="16" font-weight="bold">LP2-07</text>
<text x="151" y="218" font-size="14">Mark edits: . +1</text>
<text x="16" y="242" font-size="14" fill="#315f73">Runes: same</text>
<text x="180" y="242" font-size="14" fill="#315f73">Tokens: same</text>
<path d="M16 318H344" stroke="#e3e1da"/>
<text x="16" y="281" font-size="16" font-weight="bold">LP2-11</text>
<text x="151" y="281" font-size="14">Mark edits: - +1</text>
<text x="16" y="305" font-size="14" fill="#315f73">Runes: same</text>
<text x="180" y="305" font-size="14" fill="#315f73">Tokens: same</text>
<path d="M16 381H344" stroke="#e3e1da"/>
<text x="16" y="344" font-size="16" font-weight="bold">LP2-15</text>
<text x="151" y="344" font-size="14">Mark edits: . +1</text>
<text x="16" y="368" font-size="14" fill="#315f73">Runes: same</text>
<text x="180" y="368" font-size="14" fill="#315f73">Tokens: same</text>
<path d="M16 444H344" stroke="#e3e1da"/>
<text x="16" y="407" font-size="16" font-weight="bold">LP2-35</text>
<text x="151" y="407" font-size="14">Mark edits: ' +1</text>
<text x="16" y="431" font-size="14" fill="#315f73">Runes: same</text>
<text x="180" y="431" font-size="14" fill="#315f73">Tokens: same</text>
<path d="M16 507H344" stroke="#e3e1da"/>
<text x="16" y="470" font-size="16" font-weight="bold">LP2-37</text>
<text x="151" y="470" font-size="14">Mark edits: - -3, . -1</text>
<text x="16" y="494" font-size="14" fill="#315f73">Runes: same</text>
<text x="180" y="494" font-size="14" fill="#315f73">Tokens: same</text>
<path d="M16 570H344" stroke="#e3e1da"/>
<text x="16" y="533" font-size="16" font-weight="bold">LP2-38</text>
<text x="151" y="533" font-size="14">Mark edits: . +1</text>
<text x="16" y="557" font-size="14" fill="#315f73">Runes: same</text>
<text x="180" y="557" font-size="14" fill="#315f73">Tokens: same</text>
<text x="16" y="595" font-size="12">Tokens follow the published word-length rule;</text>
<text x="16" y="611" font-size="12">other delimiter rules can differ.</text>
</g></svg>
