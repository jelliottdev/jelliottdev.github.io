<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="t d">
<title id="t">LP2 ending compared with equal-length earlier windows</title>
<desc id="d">Both LP2-54–55 measures are inside the middle 95 percent of 308-rune windows from LP2-40–53. Gray marks that range; blue dots mark the ending.</desc>
<rect width="360" height="300" fill="#fff"/>
<text x="17" y="29" font-size="19" font-family="Arial, sans-serif" fill="#202d35">Same-length comparison</text>
<text x="17" y="50" font-size="13" font-family="Arial, sans-serif" fill="#52616b">LP2-54–55 versus earlier 308-rune spans</text>
<text x="17" y="82" font-size="15" font-family="Arial, sans-serif" fill="#202d35">Rune collision (IoC)</text>
<text x="330" y="82" text-anchor="end" font-size="15" font-weight="700" font-family="Arial, sans-serif" fill="#215a79">0.03382</text>
<line x1="29" x2="329" y1="106" y2="106" stroke="#ccd4d8" stroke-width="2"/>
<line x1="119.5" x2="225.5" y1="106" y2="106" stroke="#879aa5" stroke-width="12" stroke-linecap="round"/>
<circle cx="143.6" cy="106" r="8" fill="#215a79" stroke="white" stroke-width="2"/>
<text x="29" y="130" font-size="13" font-family="Arial, sans-serif" fill="#52616b">0.030</text>
<text x="329" y="130" text-anchor="end" font-size="13" font-family="Arial, sans-serif" fill="#52616b">0.040</text>
<text x="17" y="180" font-size="15" font-family="Arial, sans-serif" fill="#202d35">Adjacent equal runes</text>
<text x="330" y="180" text-anchor="end" font-size="15" font-weight="700" font-family="Arial, sans-serif" fill="#215a79">0.98%</text>
<line x1="29" x2="329" y1="204" y2="204" stroke="#ccd4d8" stroke-width="2"/>
<line x1="78.0" x2="274.1" y1="204" y2="204" stroke="#879aa5" stroke-width="12" stroke-linecap="round"/>
<circle cx="176.1" cy="204" r="8" fill="#215a79" stroke="white" stroke-width="2"/>
<text x="29" y="228" font-size="13" font-family="Arial, sans-serif" fill="#52616b">0%</text>
<text x="329" y="228" text-anchor="end" font-size="13" font-family="Arial, sans-serif" fill="#52616b">2%</text>
<line x1="17" x2="35" y1="267" y2="267" stroke="#879aa5" stroke-width="9" stroke-linecap="round"/>
<text x="46" y="272" font-size="13" font-family="Arial, sans-serif" fill="#52616b">Middle 95% of earlier spans</text>
<circle cx="25" cy="288" r="6" fill="#215a79"/>
<text x="46" y="293" font-size="13" font-family="Arial, sans-serif" fill="#52616b">LP2-54–55</text>
</svg>
