<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 305" role="img" aria-labelledby="title desc">
  <title id="title">Prime and Fibonacci extracted text compared with page shuffles</title>
  <desc id="desc">Prime positions restarted on each page score 0.025 English-score units above the shuffled median, while book-wide primes and page-local Fibonacci score about 0.057 below it. In 201 of 256 full searches, the shuffled best exceeded the observed best. Book-wide Fibonacci has only twenty runes and was not scored.</desc>
  <rect width="340" height="305" fill="#fff"/>
  <text x="16" y="29" font-size="17" font-family="system-ui,sans-serif" font-weight="650" fill="#202c35">Compared with shuffled pages</text>
  <text x="16" y="51" font-size="14" font-family="system-ui,sans-serif" fill="#52616b">Right of zero = more English-like</text>
  <line x1="180" y1="68" x2="180" y2="237" stroke="#7d8c94" stroke-width="1.5"/>
  <text x="16" y="84" font-size="15" font-family="system-ui,sans-serif" fill="#202c35">Primes, each page</text>
  <line x1="180" y1="109" x2="214" y2="109" stroke="#245c78" stroke-width="5"/>
  <circle cx="214" cy="109" r="5" fill="#245c78"/>
  <text x="224" y="114" font-size="15" font-family="system-ui,sans-serif" fill="#245c78">+0.025</text>
  <text x="16" y="139" font-size="15" font-family="system-ui,sans-serif" fill="#202c35">Primes, whole book</text>
  <line x1="102" y1="164" x2="180" y2="164" stroke="#536d7a" stroke-width="5"/>
  <circle cx="102" cy="164" r="5" fill="#536d7a"/>
  <text x="16" y="184" font-size="15" font-family="system-ui,sans-serif" fill="#536d7a">−0.057</text>
  <text x="16" y="210" font-size="15" font-family="system-ui,sans-serif" fill="#202c35">Fibonacci, each page</text>
  <line x1="102" y1="231" x2="180" y2="231" stroke="#536d7a" stroke-width="5"/>
  <circle cx="102" cy="231" r="5" fill="#536d7a"/>
  <text x="16" y="252" font-size="15" font-family="system-ui,sans-serif" fill="#536d7a">−0.056</text>
  <text x="16" y="277" font-size="14" font-family="system-ui,sans-serif" fill="#52616b">Whole-book Fibonacci: only 20 runes.</text>
  <text x="16" y="298" font-size="14" font-family="system-ui,sans-serif" fill="#52616b">201/256 shuffles met or beat the best.</text>
</svg>
