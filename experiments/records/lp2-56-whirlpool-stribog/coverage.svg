<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" role="img" aria-labelledby="title desc">
<title id="title">Two more 512-bit hashes checked against LP2-56</title>
<desc id="desc">Three hundred twenty-four distinct input byte strings were hashed with Whirlpool and Streebog-512. Four hundred twelve named variants were compared for each digest display. None matched the complete target.</desc>
<style>text{font-family:system-ui,Arial,sans-serif;fill:#27343b}.head{font-size:18px;font-weight:650}.label{font-size:15px;font-weight:600}.small{font-size:12px;fill:#596974}.count{font-size:15px;font-weight:700}.rule{stroke:#d2dadd;stroke-width:1.5}.bar{fill:#557b8d}</style>
<text x="20" y="30" class="head">Same bytes, two additional hash algorithms</text>
<text x="20" y="52" class="small">324 distinct inputs · 412 named variants · complete 64-byte target</text>
<path d="M20 72H540" class="rule"/>
<text x="20" y="99" class="label">Whirlpool</text><rect x="215" y="85" width="260" height="17" rx="2" class="bar"/><text x="489" y="99" class="count">412</text>
<text x="20" y="136" class="label">Streebog: byte order</text><rect x="215" y="122" width="260" height="17" rx="2" class="bar"/><text x="489" y="136" class="count">412</text>
<text x="20" y="173" class="label">Streebog: RFC display</text><rect x="215" y="159" width="260" height="17" rx="2" class="bar"/><text x="489" y="173" class="count">412</text>
<path d="M20 194H540" class="rule"/>
<text x="20" y="227" font-size="20" font-weight="700" fill="#285d73">0 full matches</text>
<text x="222" y="227" class="small">1,236 displayed comparisons</text>
<text x="20" y="249" class="small">RFC display reverses digest-byte presentation, not the hashed input.</text>
</svg>
