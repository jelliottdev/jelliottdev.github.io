<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 400" role="img" aria-labelledby="t d">
<title id="t">Many source screen hits, no distinct peak</title>
<desc id="d">Observed source-threshold hit counts sit within the ranges from 19 complete searches on within-page shuffled rune orders for both source branches.</desc>
<rect width="340" height="400" fill="#f3f5f7"/>
<text x="18" y="35" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#1e2933">Threshold hits are common</text>
<text x="18" y="61" font-family="Arial,sans-serif" font-size="13" fill="#425363">Both branches also find hits in shuffled text.</text>
<text x="18" y="109" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1e2933">Prime-derived streams</text>
<text x="18" y="136" font-family="Arial,sans-serif" font-size="14" fill="#1e2933">Observed: 644 hits</text>
<line x1="44.0" y1="165" x2="296.0" y2="165" stroke="#8798a6" stroke-width="10" stroke-linecap="round"/>
<line x1="165.1" y1="154" x2="165.1" y2="176" stroke="#324f63" stroke-width="2"/>
<circle cx="106.2" cy="165" r="7" fill="#17668c" stroke="#fff" stroke-width="2"/>
<text x="18" y="197" font-family="Arial,sans-serif" font-size="13" fill="#425363">19 shuffles: 625–702 hits</text>
<text x="18" y="251" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1e2933">Two-value LFSR</text>
<text x="18" y="278" font-family="Arial,sans-serif" font-size="14" fill="#1e2933">Observed: 38,826 hits</text>
<line x1="44.0" y1="307" x2="296.0" y2="307" stroke="#8798a6" stroke-width="10" stroke-linecap="round"/>
<line x1="151.6" y1="296" x2="151.6" y2="318" stroke="#324f63" stroke-width="2"/>
<circle cx="160.1" cy="307" r="7" fill="#17668c" stroke="#fff" stroke-width="2"/>
<text x="18" y="339" font-family="Arial,sans-serif" font-size="13" fill="#425363">19 shuffles: 33,694–44,833 hits</text>
<circle cx="22" cy="374" r="6" fill="#17668c"/>
<text x="37" y="379" font-family="Arial,sans-serif" font-size="13" fill="#425363">Observed</text>
<line x1="128" y1="374" x2="159" y2="374" stroke="#8798a6" stroke-width="8" stroke-linecap="round"/>
<text x="171" y="379" font-family="Arial,sans-serif" font-size="13" fill="#425363">Shuffled-search range</text>
