<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 310" role="img" aria-labelledby="title desc">
  <title id="title">LP2 ordinal column route and English score</title>
  <desc id="desc">The highest scoring route starts at the rightmost occupied ordinal column on LP2-22, visits downward, then moves left. Its English score is above most, but below 16 of 256 complete-route shuffled controls; the output is unreadable.</desc>
  <rect width="340" height="310" fill="#f7f8fa"/>
  <g font-family="system-ui, sans-serif" fill="#22303c">
    <text x="16" y="27" font-size="15" font-weight="700">The strongest simple route</text>
    <text x="16" y="50" font-size="13">LP2-22 · rightmost ordinal column first</text>
    <text x="16" y="71" font-size="13">Down each column, then move left</text>
    <path d="M16 85H324" stroke="#d7dce2"/>
    <text x="16" y="109" font-size="13" font-weight="700">First five source positions</text>
  </g>
  <g font-family="ui-monospace, Consolas, monospace" font-size="14" fill="#22303c">
    <text x="16" y="132">line 2</text><text x="94" y="132">24 → W</text>
    <text x="16" y="153">line 2</text><text x="94" y="153">23 → R</text>
    <text x="16" y="174">line 3</text><text x="94" y="174">23 → R</text>
    <text x="192" y="132">line 4</text><text x="270" y="132">23 → J</text>
    <text x="192" y="153">line 1</text><text x="270" y="153">22 → J</text>
  </g>
  <path d="M16 189H324" stroke="#d7dce2"/>
  <g font-family="system-ui, sans-serif" fill="#22303c" font-size="13">
    <text x="16" y="212" font-weight="700">Best of 848 eligible routes</text>
    <text x="16" y="232">Higher English score is farther right</text>
    <path d="M35 250H307" stroke="#8796a0" stroke-width="5" stroke-linecap="round"/>
    <circle cx="121" cy="250" r="6" fill="#627987"/>
    <circle cx="186" cy="250" r="7" fill="#286383"/>
    <text x="16" y="275">Blue: observed −6.890</text>
    <text x="16" y="292" font-weight="700">16 / 256 shuffles met or beat it</text>
  </g>
</svg>
