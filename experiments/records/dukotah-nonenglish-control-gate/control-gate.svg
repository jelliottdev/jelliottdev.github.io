<text x="260" y="122" font-size="13">24/24</text>
<text x="16" y="143" font-size="13">Own model</text>
<rect x="117" y="130" width="137" height="16" fill="#315f78"/>
<text x="260" y="143" font-size="13">24/24</text>
<text x="16" y="170" font-size="14" font-weight="700">Greek</text>
<text x="16" y="189" font-size="13">English</text>
