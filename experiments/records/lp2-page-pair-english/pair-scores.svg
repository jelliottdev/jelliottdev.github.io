<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 320" role="img" aria-labelledby="title desc">
  <title id="title">Page-pair arithmetic and English scores</title>
  <desc id="desc">LP2-18 minus LP2-02 begins with GP indices 6, 5, 10, 4, 12. Its complete text scored minus 6.802. In 193 of 256 matched whole-grid shuffles the strongest candidate scored at least as high.</desc>
  <rect width="340" height="320" fill="#f7f8fa"/>
  <g font-family="ui-monospace, Consolas, monospace" fill="#202c37" font-size="14">
    <text x="15" y="27" font-weight="700">One page as another’s key</text>
    <text x="15" y="54" font-size="13">First five runes in strongest pair</text>
    <text x="15" y="82">LP2-18</text><text x="143" y="82">28 24 11 12 28</text>
    <text x="15" y="108">LP2-02</text><text x="143" y="108">22 19  1  8 16</text>
    <path d="M140 117H319" stroke="#adb5be"/>
    <text x="15" y="138">difference</text><text x="143" y="138"> 6  5 10  4 12</text>
    <text x="15" y="164">GP Latin</text><text x="143" y="164"> G  C  I  R  E</text>
  </g>
  <path d="M15 183H325" stroke="#d7dce2"/>
  <g font-family="system-ui, sans-serif" fill="#202c37" font-size="14">
    <text x="15" y="207" font-weight="700">Best of 4,136 eligible streams</text>
    <text x="15" y="230" font-size="13">Higher English score is farther right</text>
    <path d="M34 252H307" stroke="#80909d" stroke-width="5" stroke-linecap="round"/>
    <circle cx="109" cy="252" r="6" fill="#627987"/>
    <circle cx="87" cy="252" r="7" fill="#286383"/>
    <text x="15" y="282" font-size="13">Blue: observed −6.802</text>
    <text x="15" y="300" font-size="13" font-weight="700">193 / 256 shuffles met or beat it</text>
  </g>
</svg>
