<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 390 230">
<title id="title">Three QuagMirror variants stop before completing their 729-rune source section</title>
<desc id="desc">Original stops after 153 runes, version 4 after 49, and WIP after 500. The fixed source section spans LP2 pages 00 through 02, with page boundaries after runes 262 and 528.</desc>
<rect width="390" height="230" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#26343e}.label{font-size:13px;font-weight:600}.value{font-size:12px}.tick{font-size:10px}</style>
<text x="18" y="29" font-size="18" font-weight="700">How far the drafts run</text>
<text x="18" y="48" font-size="12">Each begins at LP2-00; the source section has 729 runes.</text>
<text x="18" y="97" class="label">Original</text><rect x="95" y="82" width="268" height="16" fill="#eef1f3"/><rect x="95" y="82" width="56.2" height="16" fill="#315f78"/><text x="157.2" y="95" class="value">153</text><text x="18" y="142" class="label">Version 4</text><rect x="95" y="127" width="268" height="16" fill="#eef1f3"/><rect x="95" y="127" width="18.0" height="16" fill="#315f78"/><text x="119.0" y="140" class="value">49</text><text x="18" y="187" class="label">WIP</text><rect x="95" y="172" width="268" height="16" fill="#eef1f3"/><rect x="95" y="172" width="183.8" height="16" fill="#315f78"/><text x="284.8" y="185" class="value">500</text><line x1="191.3" y1="77" x2="191.3" y2="195" stroke="#a6b1b7" stroke-dasharray="3 3"/><text x="191.3" y="68" text-anchor="middle" class="tick">end 00</text><line x1="289.1" y1="77" x2="289.1" y2="195" stroke="#a6b1b7" stroke-dasharray="3 3"/><text x="289.1" y="68" text-anchor="middle" class="tick">end 01</text>
<text x="18" y="217" font-size="11">Fixed debug stops; none reaches the end of LP2-02.</text>
</svg>
