<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 302" role="img" aria-labelledby="t d">
<title id="t">Five STUDY HERE locations in the 464-word reading</title>
<desc id="d">The phrase occurs five times. At the selected cut after word 331, the last 133 ciphertext words sum to the reported prime 26893, but the first 331 sum to 72065, not the reported 71963.</desc>
<rect width="360" height="302" fill="#f5f6f7"/>
<text x="14" y="28" fill="#202a30" font-family="system-ui,sans-serif" font-size="17" font-weight="700">STUDY HERE appears five times</text>
<text x="14" y="50" fill="#52616a" font-family="system-ui,sans-serif" font-size="12">Forward / reverse word positions</text>
<circle cx="21" cy="78" r="5" fill="#788b98"/>
<text x="38" y="82" fill="#202a30" font-family="system-ui,sans-serif" font-size="14" font-weight="400">196 / 268</text>
<circle cx="21" cy="108" r="5" fill="#788b98"/>
<text x="38" y="112" fill="#202a30" font-family="system-ui,sans-serif" font-size="14" font-weight="400">227 / 237</text>
<circle cx="21" cy="138" r="5" fill="#788b98"/>
<text x="38" y="142" fill="#202a30" font-family="system-ui,sans-serif" font-size="14" font-weight="400">262 / 202</text>
<circle cx="21" cy="168" r="5" fill="#788b98"/>
<text x="38" y="172" fill="#202a30" font-family="system-ui,sans-serif" font-size="14" font-weight="400">293 / 171</text>
<rect x="10" y="184" width="340" height="25" fill="#e3eef3"/>
<circle cx="21" cy="198" r="5" fill="#215d79"/>
<text x="38" y="202" fill="#202a30" font-family="system-ui,sans-serif" font-size="14" font-weight="700">331 / 133</text>
<line x1="14" x2="346" y1="230" y2="230" stroke="#b9c4ca"/>
<text x="14" y="251" fill="#202a30" font-family="system-ui,sans-serif" font-size="13">First 331: 72,065 ≠ reported 71,963</text>
<text x="14" y="274" fill="#202a30" font-family="system-ui,sans-serif" font-size="13">Last 133: 26,893 = reported 26,893</text>
<text x="14" y="294" fill="#52616a" font-family="system-ui,sans-serif" font-size="11">The selected pair is one of five in solved LP1 text.</text>
</svg>
