<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 204" role="img" aria-labelledby="title desc">
<title id="title">The 1,894-rune pairing compared with circular shifts</title>
<desc id="desc">The best observed index-of-coincidence score lies within the range of shifted pairings. 1410 of 1893 nonzero shifts tie or exceed it.</desc>
<rect width="370" height="204" fill="#f5f6f7"/>
<text x="18" y="30" font-family="sans-serif" font-size="17" fill="#22333d">Equal length, ordinary alignment</text>
<text x="18" y="54" font-family="sans-serif" font-size="12" fill="#46555e">Best of four operations · ordered equal-rune pairs</text>
<line x1="35" y1="111" x2="335" y2="111" stroke="#65747d" stroke-width="3"/>
<circle cx="150.3" cy="111" r="7" fill="#718b9a"/>
<line x1="127.5" y1="83" x2="127.5" y2="140" stroke="#1e5875" stroke-width="4"/>
<text x="35" y="158" font-family="sans-serif" font-size="12" fill="#46555e">shift range</text>
<text x="335" y="158" text-anchor="end" font-family="sans-serif" font-size="12" fill="#46555e">observed line · median dot</text>
<text x="18" y="188" font-family="sans-serif" font-size="13" fill="#22333d">1410 of 1893 shifted pairings score at least as high</text>
</svg>
