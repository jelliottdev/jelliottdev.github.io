<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 319" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
<title id="title">Wrong keys crossing a fixed reading line</title>
<desc id="desc">Real-ciphertext wrong-key scores above minus 5.5: drift zero 500 of 500, drift two 461 of 500, drift four 230 of 2000, drift twelve zero of 2000, and repository mode zero of 2000. A crossing is not a reading.</desc>
<rect width="320" height="319" fill="#fff"/>
<text x="12" y="24" font-size="16" font-weight="700" fill="#222">Wrong keys above −5.5</text>
<text x="12" y="46" font-size="13" fill="#4d565c">Same score line, different decoders</text>
<text x="12" y="85" font-size="14" fill="#24323a">Drift 0</text>
<rect x="104" y="72" width="128" height="17" fill="#e5eaed"/>
<rect x="104" y="72" width="128.00" height="17" fill="#245b78"/>
<text x="240" y="86" font-size="13" fill="#24323a">500/500</text>
<text x="12" y="129" font-size="14" fill="#24323a">Drift 2</text>
<rect x="104" y="116" width="128" height="17" fill="#e5eaed"/>
<rect x="104" y="116" width="118.02" height="17" fill="#245b78"/>
<text x="240" y="130" font-size="13" fill="#24323a">461/500</text>
<text x="12" y="173" font-size="14" fill="#24323a">Drift 4</text>
<rect x="104" y="160" width="128" height="17" fill="#e5eaed"/>
<rect x="104" y="160" width="14.72" height="17" fill="#245b78"/>
<text x="240" y="174" font-size="13" fill="#24323a">230/2000</text>
<text x="12" y="217" font-size="14" fill="#24323a">Drift 12</text>
<rect x="104" y="204" width="128" height="17" fill="#e5eaed"/>
<rect x="104" y="204" width="0.00" height="17" fill="#245b78"/>
<text x="240" y="218" font-size="13" fill="#24323a">0/2000</text>
<text x="12" y="261" font-size="14" fill="#24323a">Repository</text>
<rect x="104" y="248" width="128" height="17" fill="#e5eaed"/>
<rect x="104" y="248" width="0.00" height="17" fill="#245b78"/>
<text x="240" y="262" font-size="13" fill="#24323a">0/2000</text>
<text x="12" y="297" font-size="13" fill="#4d565c">Crossing this line is not a decipherment.</text>
</svg>
