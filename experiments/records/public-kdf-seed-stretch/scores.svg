<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 380 306">
<title id="title">KDF source replay: planted control versus best LP2 result</title>
<desc id="desc">The planted control scores -4.186 and clears the minus 5.5 bar. The best LP2 decoding scores -6.259 and does not.</desc>
<rect width="380" height="306" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#25333e}.small{font-size:13px}.label{font-size:16px}.value{font-size:16px;font-weight:bold}</style>
<text x="24" y="32" font-size="20" font-weight="700">Key-stretching screen</text>
<text x="24" y="56" class="small">English score · higher is stronger</text>
<line x1="74.5" y1="78" x2="74.5" y2="250" stroke="#e3e9ed"/><text x="74.5" y="270" text-anchor="middle" class="small">-7</text><line x1="151.5" y1="78" x2="151.5" y2="250" stroke="#e3e9ed"/><text x="151.5" y="270" text-anchor="middle" class="small">-6</text><line x1="228.5" y1="78" x2="228.5" y2="250" stroke="#e3e9ed"/><text x="228.5" y="270" text-anchor="middle" class="small">-5</text><line x1="305.5" y1="78" x2="305.5" y2="250" stroke="#e3e9ed"/><text x="305.5" y="270" text-anchor="middle" class="small">-4</text>
<line x1="190.0" y1="78" x2="190.0" y2="250" stroke="#667985" stroke-width="2" stroke-dasharray="5 4"/>
<text x="196.0" y="91" class="small">bar −5.5</text>
<text x="36" y="122" class="label">Planted control</text>
<text x="344" y="122" text-anchor="end" class="value">-4.186</text>
<line x1="36" y1="145" x2="291.2" y2="145" stroke="#315f78" stroke-width="12"/>
<circle cx="291.2" cy="145" r="7" fill="#315f78"/>
<text x="36" y="197" class="label">Best LP2 candidate</text>
<text x="344" y="197" text-anchor="end" class="value">-6.259</text>
<line x1="36" y1="220" x2="131.5" y2="220" stroke="#607c8c" stroke-width="12"/>
<circle cx="131.5" cy="220" r="7" fill="#607c8c"/>
<text x="24" y="297" class="small">The planted message passes; no LP2 candidate does.</text>
</svg>
