<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 397" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
<title id="title">Stage Y byte-source screen</title>
<desc id="desc">The best distinct-byte count from each of six source files lies between 139 and 146. Every one is above the source pass threshold of 120.</desc>
<rect width="340" height="397" fill="#f6f7f8"/>
<text x="16" y="30" fill="#192832" font-size="17" font-weight="700">Grid under six byte sources</text>
<text x="16" y="55" fill="#45545f" font-size="14">Best of every phase, route and operation</text>
<line x1="16" y1="68" x2="324" y2="68" stroke="#cbd4d9"/>
<text x="16" y="91" fill="#45545f" font-size="13">Pass at 120 or fewer distinct bytes</text>
<line x1="171" y1="105" x2="171" y2="335" stroke="#778c99" stroke-width="2" stroke-dasharray="4 4"/>
<text x="16" y="131" fill="#263741" font-size="14">File 17</text>
<line x1="171" y1="126" x2="318" y2="126" stroke="#d8dee2"/>
<circle cx="255.0" cy="126" r="6" fill="#2d5e79"/>
<text x="324" y="131" text-anchor="end" fill="#263741" font-size="14" font-weight="700">140</text>
<text x="16" y="167" fill="#263741" font-size="14">File 21</text>
<line x1="171" y1="162" x2="318" y2="162" stroke="#d8dee2"/>
<circle cx="255.0" cy="162" r="6" fill="#2d5e79"/>
<text x="324" y="167" text-anchor="end" fill="#263741" font-size="14" font-weight="700">140</text>
<text x="16" y="203" fill="#263741" font-size="14">File 43</text>
<line x1="171" y1="198" x2="318" y2="198" stroke="#d8dee2"/>
<circle cx="250.8" cy="198" r="6" fill="#2d5e79"/>
<text x="324" y="203" text-anchor="end" fill="#263741" font-size="14" font-weight="700">139</text>
<text x="16" y="239" fill="#263741" font-size="14">Wisdom hint</text>
<line x1="171" y1="234" x2="318" y2="234" stroke="#d8dee2"/>
<circle cx="267.6" cy="234" r="6" fill="#2d5e79"/>
<text x="324" y="239" text-anchor="end" fill="#263741" font-size="14" font-weight="700">143</text>
<text x="16" y="275" fill="#263741" font-size="14">Page 00 hex</text>
<line x1="171" y1="270" x2="318" y2="270" stroke="#d8dee2"/>
<circle cx="259.2" cy="270" r="6" fill="#2d5e79"/>
<text x="324" y="275" text-anchor="end" fill="#263741" font-size="14" font-weight="700">141</text>
<text x="16" y="311" fill="#263741" font-size="14">Onion hex</text>
<line x1="171" y1="306" x2="318" y2="306" stroke="#d8dee2"/>
<circle cx="280.2" cy="306" r="6" fill="#2d5e79"/>
<text x="324" y="311" text-anchor="end" fill="#263741" font-size="14" font-weight="700">146</text>
<line x1="16" y1="340" x2="324" y2="340" stroke="#cbd4d9"/>
<text x="16" y="365" fill="#45545f" font-size="14">All 96 source × route × operation cells</text>
<text x="16" y="385" fill="#45545f" font-size="14">remain above the declared cutoff.</text>
</svg>
