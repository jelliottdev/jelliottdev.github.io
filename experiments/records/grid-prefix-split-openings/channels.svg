<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 345" role="img" aria-labelledby="title desc">
<title id="title">Five grid suffix channels tested as repeating rune keys</title>
<desc id="desc">Two hundred fifty-six tokens separate by leading digit into channels of length 60, 58, 65, 56, and 17. Their suffixes become GP29 key values. None recovered a 12-rune known opening at any tested page start.</desc>
<style>text{font-family:system-ui,Arial,sans-serif;fill:#26343c}.head{font-size:18px;font-weight:650}.label{font-size:15px;font-weight:600}.detail{font-size:12px;fill:#53636d}.number{font-size:14px;font-weight:700}.rule{stroke:#c7d2d8;stroke-width:1.5}.bar{fill:#547688}.short{fill:#8a9ca6}</style>
<text x="20" y="29" class="head">Separate the 256 printed grid tokens</text>
<text x="20" y="50" class="detail">Keep suffix order within each leading-digit class</text>
<text x="20" y="85" class="label">0</text><rect x="55" y="72" width="240" height="17" rx="2" class="bar"/><text x="307" y="86" class="number">60</text>
<text x="20" y="120" class="label">1</text><rect x="55" y="107" width="232" height="17" rx="2" class="bar"/><text x="307" y="121" class="number">58</text>
<text x="20" y="155" class="label">2</text><rect x="55" y="142" width="260" height="17" rx="2" class="bar"/><text x="327" y="156" class="number">65</text>
<text x="20" y="190" class="label">3</text><rect x="55" y="177" width="224" height="17" rx="2" class="bar"/><text x="307" y="191" class="number">56</text>
<text x="20" y="225" class="label">4</text><rect x="55" y="212" width="68" height="17" rx="2" class="short"/><text x="136" y="226" class="number">17</text><text x="185" y="225" class="detail">hex nibbles; no byte padding</text>
<path d="M20 248H540" class="rule"/>
<text x="20" y="274" class="label">Suffix values → repeating GP29 key</text>
<text x="20" y="295" class="detail">Both signs · every phase · 55 page starts · nine fixed openings</text>
<text x="20" y="326" font-size="18" font-weight="700" fill="#265c72">0 exact 12-rune matches</text>
</svg>
