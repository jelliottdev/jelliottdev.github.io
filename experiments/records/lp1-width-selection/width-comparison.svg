<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 620" role="img" aria-labelledby="title desc">
<title id="title">Six widths, two different rankings</title><desc id="desc">Width 2 minimizes normalized imbalance R. Width 32 has the smallest unadjusted fixed-width tail. These are different selection criteria.</desc>
<rect width="100%" height="100%" fill="white"/>
<style>text{font:14px Arial,sans-serif;fill:#25343a}.small{font-size:12px}</style>
<text x="20" y="28">Six widths, two different rankings</text>
<text x="20" y="51" class="small">Bars: observed R · shared scale 0–1</text>
<text x="20" y="82">Width 2</text>
<text x="360" y="82" text-anchor="end">R = 0.0169</text>
<rect x="20" y="93" width="340" height="14" fill="#eef1f2"/>
<rect x="20" y="93" width="5.760" height="14" fill="#42687b"/>
<text x="20" y="128" class="small">Unadjusted fixed-width tail: 0.12014</text>
<text x="20" y="158">Width 4</text>
<text x="360" y="158" text-anchor="end">R = 0.1468</text>
<rect x="20" y="169" width="340" height="14" fill="#eef1f2"/>
<rect x="20" y="169" width="49.924" height="14" fill="#42687b"/>
<text x="20" y="204" class="small">Unadjusted fixed-width tail: 0.06860</text>
<text x="20" y="234">Width 8</text>
<text x="360" y="234" text-anchor="end">R = 0.3453</text>
<rect x="20" y="245" width="340" height="14" fill="#eef1f2"/>
<rect x="20" y="245" width="117.404" height="14" fill="#42687b"/>
<text x="20" y="280" class="small">Unadjusted fixed-width tail: 0.06636</text>
<text x="20" y="310">Width 16</text>
<text x="360" y="310" text-anchor="end">R = 0.2515</text>
<rect x="20" y="321" width="340" height="14" fill="#eef1f2"/>
<rect x="20" y="321" width="85.511" height="14" fill="#42687b"/>
<text x="20" y="356" class="small">Unadjusted fixed-width tail: 0.00110</text>
<text x="20" y="386">Width 32</text>
<text x="360" y="386" text-anchor="end">R = 0.3119</text>
<rect x="20" y="397" width="340" height="14" fill="#eef1f2"/>
<rect x="20" y="397" width="106.040" height="14" fill="#42687b"/>
<text x="20" y="432" class="small">Unadjusted fixed-width tail: 0.00012</text>
<text x="20" y="462">Width 64</text>
<text x="360" y="462" text-anchor="end">R = 0.7306</text>
<rect x="20" y="473" width="340" height="14" fill="#eef1f2"/>
<rect x="20" y="473" width="248.403" height="14" fill="#42687b"/>
<text x="20" y="508" class="small">Unadjusted fixed-width tail: 0.04090</text>
<text x="20" y="558">The frozen rule selects the smallest R.</text>
<text x="20" y="583" class="small">It does not select the smallest fixed-width tail.</text>
<text x="20" y="605" class="small">The six tail estimates are not adjusted or independent.</text>
</svg>
