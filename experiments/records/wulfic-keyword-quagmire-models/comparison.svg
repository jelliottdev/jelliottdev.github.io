<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 435" role="img" aria-labelledby="title desc">
<title id="title">Six named-keyword Quagmire family outcomes</title>
<desc id="desc">For each of six source key distributions, the 68-cubed named-alphabet triples are divided into powered exclusions, powered non-exclusions and untestable cases. The first four families are fully excluded; the A-Z family is mostly untestable.</desc>
<rect width="340" height="435" fill="#f5f6f7"/>
<text x="16" y="30" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#20262b">Named alphabet screen</text>
<text x="16" y="53" font-family="Arial,sans-serif" font-size="14" fill="#4a545c">Control-qualified share of each key family</text>
<text x="16" y="82" font-family="Arial,sans-serif" font-size="14" fill="#20262b">English runes</text>
<rect x="16" y="91" width="308" height="17" fill="#35627a"/>
<text x="16" y="131" font-family="Arial,sans-serif" font-size="14" fill="#20262b">English primes</text>
<rect x="16" y="140" width="308" height="17" fill="#35627a"/>
<text x="16" y="180" font-family="Arial,sans-serif" font-size="14" fill="#20262b">English A–Z</text>
<rect x="16" y="189" width="308" height="17" fill="#35627a"/>
<text x="16" y="229" font-family="Arial,sans-serif" font-size="14" fill="#20262b">Decimal digits</text>
<rect x="16" y="238" width="308" height="17" fill="#35627a"/>
<text x="16" y="278" font-family="Arial,sans-serif" font-size="14" fill="#20262b">Hex digits</text>
<rect x="16" y="287" width="306" height="17" fill="#35627a"/>
<rect x="322" y="287" width="2" height="17" fill="#dce2e6"/>
<text x="16" y="327" font-family="Arial,sans-serif" font-size="14" fill="#20262b">Letters A–Z</text>
<rect x="16" y="336" width="31" height="17" fill="#35627a"/>
<rect x="47" y="336" width="10" height="17" fill="#7c939f"/>
<rect x="57" y="336" width="267" height="17" fill="#dce2e6"/>
<line x1="16" y1="374" x2="324" y2="374" stroke="#c6cdd2"/>
<rect x="16" y="389" width="12" height="12" fill="#35627a"/>
<text x="33" y="400" font-family="Arial,sans-serif" font-size="13" fill="#4a545c">Excluded</text>
<rect x="122" y="389" width="12" height="12" fill="#7c939f"/>
<text x="139" y="400" font-family="Arial,sans-serif" font-size="13" fill="#4a545c">Open</text>
<rect x="206" y="389" width="12" height="12" fill="#dce2e6"/>
<text x="223" y="400" font-family="Arial,sans-serif" font-size="13" fill="#4a545c">Untestable</text>
<text x="16" y="424" font-family="Arial,sans-serif" font-size="13" fill="#4a545c">No source member reaches the lead threshold.</text>
</svg>
