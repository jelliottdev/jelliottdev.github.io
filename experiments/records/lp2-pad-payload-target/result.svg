<svg xmlns="http://www.w3.org/2000/svg" width="560" height="690" viewBox="0 0 560 690" role="img" aria-labelledby="title desc"><title id="title">The control limits the payload result</title><desc id="desc">Seven of eight planted 256-rune messages were recovered exactly. All eight passed the score bar. The supplied payload gave zero source hits in eight labels, representing six signed-key cases. The result is inconclusive.</desc><rect width="560" height="690" fill="white"/><g font-family="Arial,sans-serif" fill="#242424"><text x="24" y="48" font-size="34" font-weight="bold">A score is not recovery</text><rect x="20" y="76" width="520" height="237" rx="8" fill="#f1f1f1"/><text x="40" y="116" font-size="28" font-weight="bold">Planted 256-rune messages</text><text x="40" y="169" font-size="42">7 / 8 exact recoveries</text><text x="40" y="214" font-size="28">All 8 passed the score bar.</text><text x="40" y="256" font-size="28">One output changed 3 runes</text><text x="40" y="292" font-size="28">and received a better score.</text><rect x="20" y="339" width="520" height="224" rx="8" fill="#f1f1f1"/><text x="40" y="381" font-size="28" font-weight="bold">Supplied numeric payload</text><text x="40" y="434" font-size="42">0 source-defined hits</text><text x="40" y="479" font-size="28">8 labels · 6 signed-key cases</text><text x="40" y="520" font-size="28">Best −7.090; score bar −5.5</text><text x="24" y="610" font-size="34" font-weight="bold">Inconclusive</text><text x="24" y="653" font-size="28">Exact-recovery control failed.</text></g></svg>