<svg xmlns="http://www.w3.org/2000/svg" width="360" height="310" viewBox="0 0 360 310" role="img" aria-labelledby="title desc">
<title id="title">An F can pause the key, or both clocks</title>
<desc id="desc">A twelve-position example places F at positions three, four and ten. Both policies pause the selected key there. The first switches alphabet anyway; the second keeps the same alphabet for the next rune. All runes, including F, are decoded.</desc>
<rect width="360" height="310" fill="white"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#20262b">
<text x="12" y="26" font-size="18" font-weight="600">One marker, two clock rules</text>
<text x="12" y="48" font-size="13">F pauses the selected key in both versions.</text>
<text x="25" y="82" text-anchor="middle" font-size="11" fill="#555f66">1</text>
<text x="25" y="106" text-anchor="middle" font-size="14">·</text>
<text x="53" y="82" text-anchor="middle" font-size="11" fill="#555f66">2</text>
<text x="53" y="106" text-anchor="middle" font-size="14">·</text>
<rect x="68" y="65" width="26" height="172" fill="#e9f0f5"/>
<text x="81" y="82" text-anchor="middle" font-size="11" fill="#555f66">3</text>
<text x="81" y="106" text-anchor="middle" font-size="14">F</text>
<rect x="96" y="65" width="26" height="172" fill="#e9f0f5"/>
<text x="109" y="82" text-anchor="middle" font-size="11" fill="#555f66">4</text>
<text x="109" y="106" text-anchor="middle" font-size="14">F</text>
<text x="137" y="82" text-anchor="middle" font-size="11" fill="#555f66">5</text>
<text x="137" y="106" text-anchor="middle" font-size="14">·</text>
<text x="165" y="82" text-anchor="middle" font-size="11" fill="#555f66">6</text>
<text x="165" y="106" text-anchor="middle" font-size="14">·</text>
<text x="193" y="82" text-anchor="middle" font-size="11" fill="#555f66">7</text>
<text x="193" y="106" text-anchor="middle" font-size="14">·</text>
<text x="221" y="82" text-anchor="middle" font-size="11" fill="#555f66">8</text>
<text x="221" y="106" text-anchor="middle" font-size="14">·</text>
<text x="249" y="82" text-anchor="middle" font-size="11" fill="#555f66">9</text>
<text x="249" y="106" text-anchor="middle" font-size="14">·</text>
<rect x="264" y="65" width="26" height="172" fill="#e9f0f5"/>
<text x="277" y="82" text-anchor="middle" font-size="11" fill="#555f66">10</text>
<text x="277" y="106" text-anchor="middle" font-size="14">F</text>
<text x="305" y="82" text-anchor="middle" font-size="11" fill="#555f66">11</text>
<text x="305" y="106" text-anchor="middle" font-size="14">·</text>
<text x="333" y="82" text-anchor="middle" font-size="11" fill="#555f66">12</text>
<text x="333" y="106" text-anchor="middle" font-size="14">·</text>
<text x="12" y="133" font-size="14" font-weight="600">Pause key; switch alphabet</text>
<text x="25" y="159" text-anchor="middle" font-size="15" font-weight="600" fill="#285c79">A</text>
<text x="53" y="159" text-anchor="middle" font-size="15" font-weight="600" fill="#285c79">B</text>
<text x="81" y="159" text-anchor="middle" font-size="15" font-weight="600" fill="#285c79">A</text>
<text x="109" y="159" text-anchor="middle" font-size="15" font-weight="600" fill="#285c79">B</text>
<text x="137" y="159" text-anchor="middle" font-size="15" font-weight="600" fill="#285c79">A</text>
<text x="165" y="159" text-anchor="middle" font-size="15" font-weight="600" fill="#285c79">B</text>
<text x="193" y="159" text-anchor="middle" font-size="15" font-weight="600" fill="#285c79">A</text>
<text x="221" y="159" text-anchor="middle" font-size="15" font-weight="600" fill="#285c79">B</text>
<text x="249" y="159" text-anchor="middle" font-size="15" font-weight="600" fill="#285c79">A</text>
<text x="277" y="159" text-anchor="middle" font-size="15" font-weight="600" fill="#285c79">B</text>
<text x="305" y="159" text-anchor="middle" font-size="15" font-weight="600" fill="#285c79">A</text>
<text x="333" y="159" text-anchor="middle" font-size="15" font-weight="600" fill="#285c79">B</text>
<text x="12" y="195" font-size="14" font-weight="600">Pause key and alphabet</text>
<text x="25" y="221" text-anchor="middle" font-size="15" font-weight="600" fill="#285c79">A</text>
<text x="53" y="221" text-anchor="middle" font-size="15" font-weight="600" fill="#285c79">B</text>
<text x="81" y="221" text-anchor="middle" font-size="15" font-weight="600" fill="#285c79">A</text>
<text x="109" y="221" text-anchor="middle" font-size="15" font-weight="600" fill="#285c79">A</text>
<text x="137" y="221" text-anchor="middle" font-size="15" font-weight="600" fill="#285c79">A</text>
<text x="165" y="221" text-anchor="middle" font-size="15" font-weight="600" fill="#285c79">B</text>
<text x="193" y="221" text-anchor="middle" font-size="15" font-weight="600" fill="#285c79">A</text>
<text x="221" y="221" text-anchor="middle" font-size="15" font-weight="600" fill="#285c79">B</text>
<text x="249" y="221" text-anchor="middle" font-size="15" font-weight="600" fill="#285c79">A</text>
<text x="277" y="221" text-anchor="middle" font-size="15" font-weight="600" fill="#285c79">B</text>
<text x="305" y="221" text-anchor="middle" font-size="15" font-weight="600" fill="#285c79">B</text>
<text x="333" y="221" text-anchor="middle" font-size="15" font-weight="600" fill="#285c79">A</text>
<text x="12" y="262" font-size="14">A = GP order; B = reversed GP order.</text>
<text x="12" y="285" font-size="13">Blue columns mark F. Every rune is decoded.</text>
</g></svg>
