<svg xmlns="http://www.w3.org/2000/svg" width="360" height="316" viewBox="0 0 360 316" role="img" aria-labelledby="title desc">
<title id="title">Score screen and exact recovery for the long-key beam</title>
<desc id="desc">All 18 planted collision-skip cases pass the English-score bar, but none recover the exact plaintext. None of 54 manuscript searches passes the score bar.</desc>
<rect width="360" height="316" fill="#f7f8fa"/>
<text x="16" y="27" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#202a33">A high score is not full recovery</text>
<rect x="16" y="44" width="12" height="12" fill="#426780"/>
<text x="35" y="55" font-family="Arial,sans-serif" font-size="13" fill="#34434f">Above English-score bar</text>
<rect x="210" y="44" width="12" height="12" fill="#273a48"/>
<text x="229" y="55" font-family="Arial,sans-serif" font-size="13" fill="#34434f">Exact text</text>
<text x="16" y="86" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#202a33">No-skip plants</text>
<rect x="16" y="98" width="200" height="11" fill="#dce3e8"/>
<rect x="16" y="98" width="200.0" height="11" fill="#426780"/>
<text x="226" y="109" font-family="Arial,sans-serif" font-size="14" fill="#202a33">Score 18/18</text>
<rect x="16" y="118" width="200" height="11" fill="#dce3e8"/>
<rect x="16" y="118" width="122.22" height="11" fill="#273a48"/>
<text x="226" y="129" font-family="Arial,sans-serif" font-size="14" fill="#202a33">Exact 11/18</text>
<text x="16" y="158" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#202a33">Collision-skip plants</text>
<rect x="16" y="170" width="200" height="11" fill="#dce3e8"/>
<rect x="16" y="170" width="200.0" height="11" fill="#426780"/>
<text x="226" y="181" font-family="Arial,sans-serif" font-size="14" fill="#202a33">Score 18/18</text>
<rect x="16" y="190" width="200" height="11" fill="#dce3e8"/>
<rect x="16" y="190" width="0.0" height="11" fill="#273a48"/>
<text x="226" y="201" font-family="Arial,sans-serif" font-size="14" fill="#202a33">Exact 0/18</text>
<text x="16" y="230" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#202a33">Unsolved LP2 searches</text>
<rect x="16" y="242" width="200" height="11" fill="#dce3e8"/>
<rect x="16" y="242" width="0.0" height="11" fill="#426780"/>
<text x="226" y="253" font-family="Arial,sans-serif" font-size="14" fill="#202a33">Score 0/54</text>
<text x="16" y="301" font-family="Arial,sans-serif" font-size="13" fill="#45535f">Only the planted cases have a known exact answer.</text>
</svg>
