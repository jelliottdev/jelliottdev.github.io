<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 370" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
<title id="title">Complete-stream decompression of the printed grid</title>
<desc id="desc">Five decoders were run on four complete grid routes. None reached end of a compressed stream. Source calibration found 552 random EOF cases in 100,000 raw DEFLATE trials and zero in the other decoder samples.</desc>
<rect width="340" height="370" fill="#f6f7f8"/>
<text x="16" y="30" fill="#192832" font-size="17" font-weight="700">Can the grid decompress?</text>
<text x="16" y="53" fill="#45545f" font-size="14">Complete 256-byte streams; no offsets</text>
<line x1="16" y1="69" x2="324" y2="69" stroke="#cbd4d9"/>
<text x="146" y="93" text-anchor="middle" fill="#45545f" font-size="13">R</text>
<text x="186" y="93" text-anchor="middle" fill="#45545f" font-size="13">R←</text>
<text x="226" y="93" text-anchor="middle" fill="#45545f" font-size="13">C</text>
<text x="266" y="93" text-anchor="middle" fill="#45545f" font-size="13">C←</text>
<text x="324" y="93" text-anchor="end" fill="#45545f" font-size="13">EOF</text>
<text x="16" y="129" fill="#263741" font-size="14">Raw DEFLATE</text>
<line x1="16" y1="141" x2="324" y2="141" stroke="#e1e5e8"/>
<circle cx="146" cy="124" r="6" fill="#f6f7f8" stroke="#648294" stroke-width="2"/>
<circle cx="186" cy="124" r="6" fill="#f6f7f8" stroke="#648294" stroke-width="2"/>
<circle cx="226" cy="124" r="6" fill="#f6f7f8" stroke="#648294" stroke-width="2"/>
<circle cx="266" cy="124" r="6" fill="#f6f7f8" stroke="#648294" stroke-width="2"/>
<text x="324" y="129" text-anchor="end" fill="#263741" font-size="14" font-weight="700">0/4</text>
<text x="16" y="165" fill="#263741" font-size="14">zlib</text>
<line x1="16" y1="177" x2="324" y2="177" stroke="#e1e5e8"/>
<circle cx="146" cy="160" r="6" fill="#f6f7f8" stroke="#648294" stroke-width="2"/>
<circle cx="186" cy="160" r="6" fill="#f6f7f8" stroke="#648294" stroke-width="2"/>
<circle cx="226" cy="160" r="6" fill="#f6f7f8" stroke="#648294" stroke-width="2"/>
<circle cx="266" cy="160" r="6" fill="#f6f7f8" stroke="#648294" stroke-width="2"/>
<text x="324" y="165" text-anchor="end" fill="#263741" font-size="14" font-weight="700">0/4</text>
<text x="16" y="201" fill="#263741" font-size="14">gzip</text>
<line x1="16" y1="213" x2="324" y2="213" stroke="#e1e5e8"/>
<circle cx="146" cy="196" r="6" fill="#f6f7f8" stroke="#648294" stroke-width="2"/>
<circle cx="186" cy="196" r="6" fill="#f6f7f8" stroke="#648294" stroke-width="2"/>
<circle cx="226" cy="196" r="6" fill="#f6f7f8" stroke="#648294" stroke-width="2"/>
<circle cx="266" cy="196" r="6" fill="#f6f7f8" stroke="#648294" stroke-width="2"/>
<text x="324" y="201" text-anchor="end" fill="#263741" font-size="14" font-weight="700">0/4</text>
<text x="16" y="237" fill="#263741" font-size="14">bzip2</text>
<line x1="16" y1="249" x2="324" y2="249" stroke="#e1e5e8"/>
<circle cx="146" cy="232" r="6" fill="#f6f7f8" stroke="#648294" stroke-width="2"/>
<circle cx="186" cy="232" r="6" fill="#f6f7f8" stroke="#648294" stroke-width="2"/>
<circle cx="226" cy="232" r="6" fill="#f6f7f8" stroke="#648294" stroke-width="2"/>
<circle cx="266" cy="232" r="6" fill="#f6f7f8" stroke="#648294" stroke-width="2"/>
<text x="324" y="237" text-anchor="end" fill="#263741" font-size="14" font-weight="700">0/4</text>
<text x="16" y="273" fill="#263741" font-size="14">LZMA</text>
<line x1="16" y1="285" x2="324" y2="285" stroke="#e1e5e8"/>
<circle cx="146" cy="268" r="6" fill="#f6f7f8" stroke="#648294" stroke-width="2"/>
<circle cx="186" cy="268" r="6" fill="#f6f7f8" stroke="#648294" stroke-width="2"/>
<circle cx="226" cy="268" r="6" fill="#f6f7f8" stroke="#648294" stroke-width="2"/>
<circle cx="266" cy="268" r="6" fill="#f6f7f8" stroke="#648294" stroke-width="2"/>
<text x="324" y="273" text-anchor="end" fill="#263741" font-size="14" font-weight="700">0/4</text>
<text x="16" y="319" fill="#45545f" font-size="13">Open circle: decoder did not reach EOF.</text>
<text x="16" y="344" fill="#45545f" font-size="13">Random EOFs: raw DEFLATE 552 / 100,000;</text>
<text x="16" y="361" fill="#45545f" font-size="13">other sampled decoders 0 / 100,000 each.</text>
</svg>
