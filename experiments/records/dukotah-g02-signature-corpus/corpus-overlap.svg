<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 226" role="img" aria-labelledby="title desc">
<title id="title">The archived and pinned signature corpora overlap</title>
<desc id="desc">105 archived-only paths, 123 shared paths, 10 pinned-only paths. Every shared path has the same source-program verdict and extracted timestamp.</desc>
<rect width="320" height="226" fill="#f7f9fa"/>
<text x="16" y="27" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1d2c35">Two snapshots, one shared core</text>
<text x="16" y="79" font-family="Arial,sans-serif" font-size="13" fill="#34444e">Archived only</text>
<rect x="126" y="64" width="115" height="20" rx="3" fill="#8394a2"/>
<text x="294" y="80" text-anchor="end" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#1d2c35">105</text>
<text x="16" y="126" font-family="Arial,sans-serif" font-size="13" fill="#34444e">In both</text>
<rect x="126" y="111" width="135" height="20" rx="3" fill="#356f91"/>
<text x="294" y="127" text-anchor="end" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#1d2c35">123</text>
<text x="16" y="173" font-family="Arial,sans-serif" font-size="13" fill="#34444e">Pinned only</text>
<rect x="126" y="158" width="11" height="20" rx="3" fill="#aab5bd"/>
<text x="294" y="174" text-anchor="end" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#1d2c35">10</text>
<text x="16" y="216" font-family="Arial,sans-serif" font-size="13" fill="#43535e">Shared: same source result and time</text>
</svg>
