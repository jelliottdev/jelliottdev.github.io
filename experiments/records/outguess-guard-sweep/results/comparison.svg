<svg xmlns="http://www.w3.org/2000/svg" width="480" height="430" viewBox="0 0 480 430" role="img" aria-labelledby="title desc">
<title id="title">OutGuess: baseline compared with the guarded build</title>
<desc id="desc">31 successful exits remain successful, five rejections remain rejections, and 41 abnormal exits become explicit guard rejections. All 77 output byte streams remain identical. Successful exit does not authenticate a payload.</desc>
<rect width="480" height="430" fill="#faf9f5"/>
<g font-family="sans-serif" fill="#222">
<text x="24" y="35" font-size="23">OutGuess build comparison</text>
<text x="24" y="62" font-size="19">77 original JPEGs · same default key</text>
<text x="24" y="102" font-size="20">Successful exit</text>
<rect x="24" y="112" width="279" height="23" fill="#31596b"/>
<text x="313" y="130" font-size="20">31</text>
<text x="24" y="176" font-size="20">Existing rejection</text>
<rect x="24" y="186" width="45" height="23" fill="#85817a"/>
<text x="79" y="204" font-size="20">5</text>
<text x="24" y="250" font-size="20">Abnormal exit → guard</text>
<rect x="24" y="260" width="369" height="23" fill="#996b36"/>
<text x="403" y="278" font-size="20">41</text>
<text x="24" y="331" font-size="21">77/77 output byte streams unchanged</text>
<text x="24" y="359" font-size="19">Ten controls; other output unverified.</text>
<text x="24" y="383" font-size="19">Rejection does not rule out hidden data.</text>
</g></svg>
