<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 288" role="img" aria-labelledby="title desc">
<title id="title">Scope of one-rune key changes</title>
<desc id="desc">Forty-three source keys produce 8,652 single-position and 7,056 rune-type changes. They collapse to 9,856 distinct keys, 83,328 phases, and zero matches to the nine specified openings across 55 pages and two directions.</desc>
<rect width="360" height="288" fill="#f3f4f5"/>
<g font-family="system-ui, sans-serif" fill="#202a30">
<text x="16" y="30" font-size="18" font-weight="700">What was tested</text>
<text x="16" y="59" font-size="15">43 public source keys</text>
<path d="M16 72H344" stroke="#c8d0d4"/>
<text x="16" y="100" font-size="14">One-position change</text><text x="344" y="100" text-anchor="end" font-size="14" font-weight="700">8,652</text>
<text x="16" y="128" font-size="14">One-rune-type change</text><text x="344" y="128" text-anchor="end" font-size="14" font-weight="700">7,056</text>
<path d="M16 141H344" stroke="#c8d0d4"/>
<text x="16" y="168" font-size="14">Distinct altered keys</text><text x="344" y="168" text-anchor="end" font-size="14" font-weight="700">9,856</text>
<text x="16" y="194" font-size="14">Key and phase settings</text><text x="344" y="194" text-anchor="end" font-size="14" font-weight="700">83,328</text>
<path d="M16 208H344" stroke="#c8d0d4"/>
<rect x="16" y="221" width="328" height="48" fill="#dce8ed"/>
<text x="28" y="250" font-size="16" font-weight="700">Exact opening matches</text><text x="332" y="250" text-anchor="end" font-size="20" font-weight="700">0</text>
</g></svg>
