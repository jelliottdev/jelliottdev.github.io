<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 395" role="img"
 aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">Why the first rune of each line looked unusual</title>
<desc id="desc">The observed chi-square is 78.7. A flat shuffle expects 26.9, but a layout-aware shuffle expects 66.5. The observed value is ordinary under layout, p 0.195.</desc>
<style>.title{font:600 20px system-ui,sans-serif;fill:#20272b}.label{font:600 16px system-ui,sans-serif;fill:#20272b}.value{font:600 15px system-ui,sans-serif;fill:#20272b}.note{font:14px system-ui,sans-serif;fill:#526068}.footer{font:14px system-ui,sans-serif;fill:#334249}</style>
<rect width="620" height="395" fill="#f7f8f9"/>
<text x="22" y="35" class="title">First runes of physical lines</text>
<text x="22" y="60" class="note">Departure from the manuscript’s overall rune frequencies (χ²)</text>
<text x="22" y="90" class="label">Flat shuffle</text><rect x="22" y="103" width="130.5" height="28" fill="#91a2ad"/><text x="162.5" y="123" class="value">26.9</text><text x="22" y="151" class="note">Ignores why line breaks fall where they do</text>
<text x="22" y="182" class="label">Reflowed shuffle</text><rect x="22" y="195" width="322.3" height="28" fill="#516f80"/><text x="354.3" y="215" class="value">66.5</text><text x="22" y="243" class="note">Shuffles runes, then breaks lines by fitted glyph widths</text>
<text x="22" y="274" class="label">Manuscript</text><rect x="22" y="287" width="381.5" height="28" fill="#244c63"/><text x="413.5" y="307" class="value">78.7</text><text x="22" y="335" class="note">Unusual against flat shuffle; ordinary after reflow</text>
<line x1="22" y1="358" x2="598" y2="358" stroke="#c4ccd1"/>
<text x="22" y="382" class="footer">Layout-aware p = 0.195 · 2,000 reflows · 594 line starts</text>
</svg>
