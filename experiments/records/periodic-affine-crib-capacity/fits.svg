<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 370" role="img" aria-labelledby="title desc">
<title id="title">Periodic affine fits to fixed openings</title>
<desc id="desc">Five short periods fit none of the 495 page and proposed-opening pairs. At period six, 287 fit, mostly with one compatible key. Periods seven and eight fit 262 and 293 pairs, all with multiple compatible keys.</desc>
<rect width="340" height="370" fill="#f4f5f6"/>
<text x="16" y="26" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#20282e">When can the openings fit?</text>
<text x="16" y="46" font-family="Arial,sans-serif" font-size="13" fill="#4c5960">495 page + crib pairs at each period</text>
<rect x="16" y="62" width="11" height="11" fill="#aab6bd"/><text x="31" y="72" font-family="Arial,sans-serif" font-size="13" fill="#35444d">No key</text>
<rect x="98" y="62" width="11" height="11" fill="#2d6782"/><text x="113" y="72" font-family="Arial,sans-serif" font-size="13" fill="#35444d">One key</text>
<rect x="183" y="62" width="11" height="11" fill="#43545e"/><text x="198" y="72" font-family="Arial,sans-serif" font-size="13" fill="#35444d">Many keys</text>
<text x="16" y="116" font-family="Arial,sans-serif" font-size="14" fill="#25343c">p1</text><rect x="55.0" y="103" width="185.0" height="16" fill="#aab6bd"/><text x="250" y="116" font-family="Arial,sans-serif" font-size="13" fill="#25343c">0 fit</text>
<text x="16" y="146" font-family="Arial,sans-serif" font-size="14" fill="#25343c">p2</text><rect x="55.0" y="133" width="185.0" height="16" fill="#aab6bd"/><text x="250" y="146" font-family="Arial,sans-serif" font-size="13" fill="#25343c">0 fit</text>
<text x="16" y="176" font-family="Arial,sans-serif" font-size="14" fill="#25343c">p3</text><rect x="55.0" y="163" width="185.0" height="16" fill="#aab6bd"/><text x="250" y="176" font-family="Arial,sans-serif" font-size="13" fill="#25343c">0 fit</text>
<text x="16" y="206" font-family="Arial,sans-serif" font-size="14" fill="#25343c">p4</text><rect x="55.0" y="193" width="185.0" height="16" fill="#aab6bd"/><text x="250" y="206" font-family="Arial,sans-serif" font-size="13" fill="#25343c">0 fit</text>
<text x="16" y="236" font-family="Arial,sans-serif" font-size="14" fill="#25343c">p5</text><rect x="55.0" y="223" width="185.0" height="16" fill="#aab6bd"/><text x="250" y="236" font-family="Arial,sans-serif" font-size="13" fill="#25343c">0 fit</text>
<text x="16" y="266" font-family="Arial,sans-serif" font-size="14" fill="#25343c">p6</text><rect x="55.0" y="253" width="77.7" height="16" fill="#aab6bd"/><rect x="132.7" y="253" width="103.2" height="16" fill="#2d6782"/><rect x="235.9" y="253" width="4.1" height="16" fill="#43545e"/><text x="250" y="266" font-family="Arial,sans-serif" font-size="13" fill="#25343c">287 fit</text>
<text x="16" y="296" font-family="Arial,sans-serif" font-size="14" fill="#25343c">p7</text><rect x="55.0" y="283" width="87.1" height="16" fill="#aab6bd"/><rect x="142.1" y="283" width="97.9" height="16" fill="#43545e"/><text x="250" y="296" font-family="Arial,sans-serif" font-size="13" fill="#25343c">262 fit</text>
<text x="16" y="326" font-family="Arial,sans-serif" font-size="14" fill="#25343c">p8</text><rect x="55.0" y="313" width="75.5" height="16" fill="#aab6bd"/><rect x="130.5" y="313" width="109.5" height="16" fill="#43545e"/><text x="250" y="326" font-family="Arial,sans-serif" font-size="13" fill="#25343c">293 fit</text>
<text x="16" y="360" font-family="Arial,sans-serif" font-size="13" fill="#4c5960">A fit is conditional on a proposed opening.</text>
</svg>
