<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" role="img" aria-labelledby="title desc">
<title id="title">Doublets at block boundaries for sizes five, seven and thirteen</title>
<desc id="desc">Observed boundary doublets are compared with fixed-count page randomization ranges. This chart does not identify a cipher.</desc>
<rect width="620" height="250" fill="white"/>
<g font-family="system-ui,sans-serif" fill="#27343c">
<text x="18" y="27" font-size="18" font-weight="600">Doublets at block boundaries</text>
<text x="18" y="47" font-size="12">Page-start anchored; 86 observed doublets across LP2-00–55</text>
<text x="18" y="87" font-size="14">Size 5</text>
<line x1="150" y1="82" x2="510" y2="82" stroke="#dce2e6" stroke-width="2"/>
<rect x="270" y="74" width="168" height="16" fill="#a9bcc5"/>
<circle cx="366" cy="82" r="6" fill="#255f79"/>
<text x="525" y="87" font-size="13">18</text>
<text x="18" y="135" font-size="14">Size 7</text>
<line x1="150" y1="130" x2="510" y2="130" stroke="#dce2e6" stroke-width="2"/>
<rect x="222" y="122" width="156" height="16" fill="#a9bcc5"/>
<circle cx="306" cy="130" r="6" fill="#255f79"/>
<text x="525" y="135" font-size="13">13</text>
<text x="18" y="183" font-size="14">Size 13</text>
<line x1="150" y1="178" x2="510" y2="178" stroke="#dce2e6" stroke-width="2"/>
<rect x="174" y="170" width="120" height="16" fill="#a9bcc5"/>
<circle cx="222" cy="178" r="6" fill="#255f79"/>
<text x="525" y="183" font-size="13">6</text>
<text x="150" y="235" font-size="12">0</text>
<text x="447" y="235" font-size="12">30 matches</text>
</g></svg>
