<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-labelledby="title desc"><title id="title">First actual Emerson lookup</title><desc id="desc">Coordinate 1:2:3:1 selects paragraph one, sentence two, word three, always, and its first letter a.</desc><rect width="360" height="420" fill="#faf9f5"/><g font-family="sans-serif" fill="#243c48"><text x="20" y="32" font-size="20">First lookup: 1:2:3:1</text><text x="20" y="78" font-size="18">Paragraph 1</text><text x="20" y="102" font-size="13">Count from the first prose paragraph</text><path d="M25 112 v18 m-4 -4 l4 4 4 -4" stroke="#416879" fill="none"/><text x="20" y="153" font-size="18">Sentence 2</text><text x="20" y="177" font-size="13">Use the declared punctuation rule</text><path d="M25 187 v18 m-4 -4 l4 4 4 -4" stroke="#416879" fill="none"/><text x="20" y="228" font-size="18">Word 3: always</text><text x="20" y="252" font-size="13">Count words in that sentence</text><path d="M25 262 v18 m-4 -4 l4 4 4 -4" stroke="#416879" fill="none"/><text x="20" y="303" font-size="18">Letter 1: a</text><text x="20" y="327" font-size="13">Count ASCII letters inside the word</text><path d="M20 352 H340" stroke="#bec8ca"/><text x="20" y="377" font-size="13">15 lookups + 7 literal characters = 22 outputs</text><text x="20" y="400" font-size="13">Historical control, not a new decipherment.</text></g></svg>
