<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 454" role="img" aria-labelledby="title desc">
  <title id="title">Ten fixed readings of the 2012 P.S. digit block</title>
  <desc id="desc">Six bare-block routes score 78.5 to 81.5 percent printable digit pairs. Four visually indented column routes score 73.8 to 78.5 percent. All are below the calibrated 95 percent gate. The motifs 3301 and 1033 occur only in separate indented readings.</desc>
  <style>
    text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#22303b}
    .title{font-size:17px;font-weight:700}.sub{font-size:12px;fill:#5d6872}
    .group{font-size:14px;font-weight:700}.label{font-size:13px}.value{font-size:12px;font-weight:700}
    .rule{stroke:#cad3d8}.gate{stroke:#9a3841;stroke-width:2;stroke-dasharray:5 4}
  </style>
  <rect width="360" height="454" fill="#f7f8f9"/>
  <text class="title" x="16" y="31">The readings stay below the gate</text>
  <text class="sub" x="16" y="51">Printable digit pairs, best of two alignments</text>
  <text class="group" x="16" y="81">Bare three-line block</text>
  <g fill="#45718b">
    <rect x="136" y="94" width="132" height="15" rx="2"/><rect x="136" y="120" width="130" height="15" rx="2"/>
    <rect x="136" y="146" width="127" height="15" rx="2"/><rect x="136" y="172" width="130" height="15" rx="2"/>
    <rect x="136" y="198" width="130" height="15" rx="2"/><rect x="136" y="224" width="127" height="15" rx="2"/>
  </g>
  <g class="label"><text x="16" y="107">→ top↓</text><text x="16" y="133">→ bottom↑</text>
    <text x="16" y="159">← top↓</text><text x="16" y="185">← bottom↑</text>
    <text x="16" y="211">Joined</text><text x="16" y="237">Joined reversed</text></g>
  <g class="value" text-anchor="end"><text x="342" y="107">81.5%</text><text x="342" y="133">80.0%</text>
    <text x="342" y="159">78.5%</text><text x="342" y="185">80.0%</text><text x="342" y="211">80.0%</text><text x="342" y="237">78.5%</text></g>
  <path class="rule" d="M16 254H344"/>
  <text class="group" x="16" y="279">With the “P.S. ” indent</text>
  <g fill="#7896a7"><rect x="136" y="293" width="127" height="15" rx="2"/>
    <rect x="136" y="319" width="120" height="15" rx="2"/><rect x="136" y="345" width="127" height="15" rx="2"/>
    <rect x="136" y="371" width="125" height="15" rx="2"/></g>
  <g class="label"><text x="16" y="306">→ top↓</text><text x="16" y="332">→ bottom↑</text>
    <text x="16" y="358">← top↓</text><text x="16" y="384">← bottom↑</text></g>
  <g class="value" text-anchor="end"><text x="342" y="306">78.5%</text><text x="342" y="332">73.8%</text>
    <text x="342" y="358">78.5%</text><text x="342" y="384">76.9%</text></g>
  <line class="gate" x1="290" y1="90" x2="290" y2="390"/>
  <text class="sub" x="16" y="418">“3301” and “1033”: separate indented routes.</text>
  <text class="sub" x="16" y="439">Red line: 95% gate. Bars start at zero.</text>
</svg>
