<svg xmlns="http://www.w3.org/2000/svg" width="580" height="265" viewBox="0 0 580 265" role="img" aria-label="Eight signature blocks map to LP1; none to LP2 in the archived text"><rect width="580" height="265" fill="white"/><g font-family="Arial,sans-serif" fill="#17212b"><text x="26" y="37" font-size="24">Where do the eight signatures appear?</text><text x="26" y="79" font-size="22">LP1 text</text><rect x="160" y="58" width="320" height="30" fill="#5e778e"/><text x="496" y="81" font-size="22">8</text><text x="26" y="127" font-size="22">LP2 text</text><line x1="160" y1="104" x2="160" y2="137" stroke="#5e778e" stroke-width="3"/><text x="177" y="128" font-size="22">0</text><text x="26" y="180" font-size="20">Eight blocks contain seven distinct clock values.</text><text x="26" y="215" font-size="20">No per-page join appears in these text inputs.</text><text x="26" y="247" font-size="20">Scope: extraction check; no pad decoding.</text></g></svg>
