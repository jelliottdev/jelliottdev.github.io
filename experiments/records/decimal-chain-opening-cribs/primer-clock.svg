<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 170" role="img" aria-labelledby="title desc">
  <title id="title">Five-digit primer extended by chain addition</title>
  <desc id="desc">Primer 31415 is followed by 4, 5, 5, 6, 9, 9, 0. Each new digit is the sum modulo ten of the two digits five and four positions earlier.</desc>
  <rect width="480" height="170" fill="#f5f7f8"/>
  <text x="18" y="29" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#26333a">A five-digit primer grows into a key</text>
  <text x="18" y="51" font-family="system-ui,sans-serif" font-size="12" fill="#52616a">Example primer 31415 · digit values are used directly as GP29 shifts</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <text x="33" y="77" font-size="11" fill="#61717a">0</text><text x="70" y="77" font-size="11" fill="#61717a">1</text><text x="107" y="77" font-size="11" fill="#61717a">2</text><text x="144" y="77" font-size="11" fill="#61717a">3</text><text x="181" y="77" font-size="11" fill="#61717a">4</text><text x="218" y="77" font-size="11" fill="#61717a">5</text><text x="255" y="77" font-size="11" fill="#61717a">6</text><text x="292" y="77" font-size="11" fill="#61717a">7</text><text x="329" y="77" font-size="11" fill="#61717a">8</text><text x="366" y="77" font-size="11" fill="#61717a">9</text><text x="403" y="77" font-size="11" fill="#61717a">10</text><text x="440" y="77" font-size="11" fill="#61717a">11</text>
    <path d="M18 86h179v34H18z" fill="#e4eef2" stroke="#bed0d9"/><path d="M203 86h252v34H203z" fill="#e9edf0" stroke="#cbd4d9"/>
    <g font-size="17" font-weight="700" fill="#24566d">
      <text x="33" y="109">3</text><text x="70" y="109">1</text><text x="107" y="109">4</text><text x="144" y="109">1</text><text x="181" y="109">5</text>
      <text x="218" y="109">4</text><text x="255" y="109">5</text><text x="292" y="109">5</text><text x="329" y="109">6</text><text x="366" y="109">9</text><text x="403" y="109">9</text><text x="440" y="109">0</text>
    </g>
  </g>
  <text x="18" y="147" font-family="system-ui,sans-serif" font-size="12" fill="#26333a">Next digit: (3 + 1) mod 10 = 4; then (1 + 4) mod 10 = 5.</text>
</svg>
