<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" role="img" aria-labelledby="title desc">
<title id="title">Block-lookahead rule and observed index of coincidence</title>
<desc id="desc">The block-start rune depends on a future plaintext rune b positions away. Decoded LP2 IoC is about 0.035 for blocks of five and seven, near raw LP2 0.0345; solved LP1 control is 0.0611.</desc>
<rect width="760" height="370" fill="#f6f7f8"/>
<text x="22" y="34" font-family="system-ui,sans-serif" font-size="20" font-weight="650" fill="#26343b">A lookahead only at the block start</text>
<text x="22" y="60" font-family="system-ui,sans-serif" font-size="14" fill="#52616a">Illustrated for b = 5; all arithmetic is modulo 29.</text>
<line x1="75" y1="121" x2="580" y2="121" stroke="#cbd5da" stroke-width="2"/>
<circle cx="80" cy="121" r="21" fill="#315d77"/>
<text x="80" y="127" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="white">P₀</text>
<circle cx="180" cy="121" r="21" fill="#dce5e9"/>
<text x="180" y="127" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#26343b">P1</text>
<circle cx="280" cy="121" r="21" fill="#dce5e9"/>
<text x="280" y="127" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#26343b">P2</text>
<circle cx="380" cy="121" r="21" fill="#dce5e9"/>
<text x="380" y="127" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#26343b">P3</text>
<circle cx="480" cy="121" r="21" fill="#dce5e9"/>
<text x="480" y="127" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#26343b">P4</text>
<circle cx="580" cy="121" r="21" fill="#315d77"/>
<text x="580" y="127" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="white">P₅</text>
<path d="M580 91 C520 49 160 49 80 91" fill="none" stroke="#315d77" stroke-width="2"/>
<path d="M80 91 l-6 -9 m6 9 l10 -3" fill="none" stroke="#315d77" stroke-width="2"/>
<text x="320" y="79" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#315d77">C₀ = P₀ + P₅</text>
<text x="22" y="176" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#26343b">Decoded rune distribution stays close to flat</text>
<line x1="225" y1="305" x2="625" y2="305" stroke="#9eafb7" stroke-width="1"/>
<line x1="225.0" y1="194" x2="225.0" y2="305" stroke="#dbe3e7" stroke-width="1"/>
<text x="225.0" y="325" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#52616a">0.03</text>
<line x1="339.3" y1="194" x2="339.3" y2="305" stroke="#dbe3e7" stroke-width="1"/>
<text x="339.3" y="325" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#52616a">0.04</text>
<line x1="453.6" y1="194" x2="453.6" y2="305" stroke="#dbe3e7" stroke-width="1"/>
<text x="453.6" y="325" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#52616a">0.05</text>
<line x1="567.9" y1="194" x2="567.9" y2="305" stroke="#dbe3e7" stroke-width="1"/>
<text x="567.9" y="325" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#52616a">0.06</text>
<text x="22" y="216" font-family="system-ui,sans-serif" font-size="14" fill="#26343b">Raw LP2</text>
<circle cx="276.2" cy="211" r="6" fill="#748992"/>
<text x="640" y="216" font-family="system-ui,sans-serif" font-size="13" fill="#26343b">0.0345</text>
<text x="22" y="244" font-family="system-ui,sans-serif" font-size="14" fill="#26343b">Decode b = 5</text>
<circle cx="281.9" cy="239" r="6" fill="#315d77"/>
<text x="640" y="244" font-family="system-ui,sans-serif" font-size="13" fill="#26343b">0.0350</text>
<text x="22" y="272" font-family="system-ui,sans-serif" font-size="14" fill="#26343b">Decode b = 7</text>
<circle cx="283.2" cy="267" r="6" fill="#315d77"/>
<text x="640" y="272" font-family="system-ui,sans-serif" font-size="13" fill="#26343b">0.0351</text>
<text x="22" y="300" font-family="system-ui,sans-serif" font-size="14" fill="#26343b">Solved LP1 reading control</text>
<circle cx="580.9" cy="295" r="6" fill="#5e717b"/>
<text x="640" y="300" font-family="system-ui,sans-serif" font-size="13" fill="#26343b">0.0611</text>
<text x="22" y="352" font-family="system-ui,sans-serif" font-size="12" fill="#52616a">The LP1 and LP2 corpora differ; this is descriptive, not a language test.</text>
</svg>
