<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" role="img" aria-labelledby="title desc">
<title id="title">Known keys: whole-page scores</title>
<desc id="desc">The best complete LP2 page score, minus 6.67, sits inside the 5th to 95th percentile range of full-search shuffled controls, minus 6.87 to minus 6.49. All nine genuine 66-rune examples score higher than minus 5.16. Higher scores are more English-like.</desc>
<rect width="340" height="260" fill="#f4f5f6"/>
<text x="16" y="26" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#20282e">Whole-page English score</text>
<text x="16" y="47" font-family="Arial,sans-serif" font-size="13" fill="#4c5960">Higher is more like known readings →</text>
<line x1="70" x2="320" y1="213" y2="213" stroke="#617079" stroke-width="1.5"/>
<line x1="81.4" x2="81.4" y1="209" y2="217" stroke="#617079"/>
<line x1="195.0" x2="195.0" y1="209" y2="217" stroke="#617079"/>
<line x1="308.6" x2="308.6" y1="209" y2="217" stroke="#617079"/>
<text x="81.4" y="237" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#35444d">−7</text>
<text x="195.0" y="237" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#35444d">−6</text>
<text x="308.6" y="237" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#35444d">−5</text>
<text x="16" y="86" font-family="Arial,sans-serif" font-size="13" fill="#35444d">Shuffles</text>
<line x1="95.9" x2="139.4" y1="100" y2="100" stroke="#9ca9b0" stroke-width="12" stroke-linecap="round"/>
<circle cx="113.0" cy="100" r="6" fill="#415660"/>
<text x="16" y="130" font-family="Arial,sans-serif" font-size="13" fill="#35444d">LP2 best</text>
<circle cx="118.3" cy="143" r="7" fill="#285b75"/>
<text x="131.3" y="148" font-family="Arial,sans-serif" font-size="13" fill="#285b75">−6.67</text>
<text x="16" y="174" font-family="Arial,sans-serif" font-size="13" fill="#35444d">Weakest known</text>
<circle cx="290.9" cy="187" r="7" fill="#34454d"/>
<text x="280.9" y="193" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#34454d">−5.16</text>
