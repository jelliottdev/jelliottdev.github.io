<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 365" role="img" aria-labelledby="t de">
<title id="t">Marked lines align with wide spaces below</title>
<desc id="de">Six selected lines containing an apostrophe, quotation mark or numeral are each followed by a 108–110 pixel gap. Twenty-eight unmarked lines in the same fixed regions have 73–75 pixel gaps.</desc>
<rect width="360" height="365" fill="#f7f8f9"/>
<text x="16" y="30" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#24343d">Mark on line → gap below</text>
<text x="16" y="51" font-family="system-ui,sans-serif" font-size="11" fill="#536570">Six source-guided lines on five original pages.</text>
<text x="16" y="82" font-family="system-ui,sans-serif" font-size="12" font-weight="650" fill="#24343d">LP2-04 · line 8</text>
<text x="176" y="82" font-family="system-ui,sans-serif" font-size="12" fill="#536570">apostrophe</text>
<text x="343" y="82" text-anchor="end" font-family="system-ui,sans-serif" font-size="12" font-weight="650" fill="#31566e">109 px</text>
<path d="M16 92H344" stroke="#d3dce0"/>
<text x="16" y="119" font-family="system-ui,sans-serif" font-size="12" font-weight="650" fill="#24343d">LP2-07 · line 1</text>
<text x="176" y="119" font-family="system-ui,sans-serif" font-size="12" fill="#536570">quotation mark</text>
<text x="343" y="119" text-anchor="end" font-family="system-ui,sans-serif" font-size="12" font-weight="650" fill="#31566e">110 px</text>
<path d="M16 129H344" stroke="#d3dce0"/>
<text x="16" y="156" font-family="system-ui,sans-serif" font-size="12" font-weight="650" fill="#24343d">LP2-10 · line 8</text>
<text x="176" y="156" font-family="system-ui,sans-serif" font-size="12" fill="#536570">number</text>
<text x="343" y="156" text-anchor="end" font-family="system-ui,sans-serif" font-size="12" font-weight="650" fill="#31566e">108 px</text>
<path d="M16 166H344" stroke="#d3dce0"/>
<text x="16" y="193" font-family="system-ui,sans-serif" font-size="12" font-weight="650" fill="#24343d">LP2-35 · line 4</text>
<text x="176" y="193" font-family="system-ui,sans-serif" font-size="12" fill="#536570">apostrophe</text>
<text x="343" y="193" text-anchor="end" font-family="system-ui,sans-serif" font-size="12" font-weight="650" fill="#31566e">110 px</text>
<path d="M16 203H344" stroke="#d3dce0"/>
<text x="16" y="230" font-family="system-ui,sans-serif" font-size="12" font-weight="650" fill="#24343d">LP2-42 · line 3</text>
<text x="176" y="230" font-family="system-ui,sans-serif" font-size="12" fill="#536570">quotation mark</text>
<text x="343" y="230" text-anchor="end" font-family="system-ui,sans-serif" font-size="12" font-weight="650" fill="#31566e">110 px</text>
<path d="M16 240H344" stroke="#d3dce0"/>
<text x="16" y="267" font-family="system-ui,sans-serif" font-size="12" font-weight="650" fill="#24343d">LP2-42 · line 6</text>
<text x="176" y="267" font-family="system-ui,sans-serif" font-size="12" fill="#536570">quotation mark</text>
<text x="343" y="267" text-anchor="end" font-family="system-ui,sans-serif" font-size="12" font-weight="650" fill="#31566e">110 px</text>
<path d="M16 277H344" stroke="#d3dce0"/>
<text x="16" y="326" font-family="system-ui,sans-serif" font-size="12" fill="#24343d">28 unmarked lines: 73–75 px</text>
<text x="16" y="348" font-family="system-ui,sans-serif" font-size="10" fill="#536570">LP2-35 apostrophe appears only in the reviewed text.</text>
</svg>
