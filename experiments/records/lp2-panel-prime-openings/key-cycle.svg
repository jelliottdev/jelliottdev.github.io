<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
<title id="title">The sixteen LP2-15 panel-derived prime shifts</title>
<desc id="desc">Spiral steps one to sixteen give primes 2, 3, 5, 7, 13, 23, 43, 79, 149, 263, 463, 829, 1481, 2593, 4507, 7817. Each is reduced modulo 29 for the rune shift.</desc>
<rect width="760" height="400" fill="#f6f6f2"/>
<g font-family="Arial, sans-serif" fill="#253b47">
<text x="25" y="38" font-size="23">LP2-15 spiral as a repeating shift stream</text>
<text x="25" y="66" font-size="15">Step · selected prime · remainder modulo 29</text>
<rect x="25" y="90" width="80" height="105" fill="white" stroke="#cbd4d8"/>
<text x="65" y="113" text-anchor="middle" font-size="15">1</text>
<text x="65" y="144" text-anchor="middle" font-size="19" font-weight="bold">2</text>
<text x="65" y="173" text-anchor="middle" font-size="21" fill="#275b72">2</text>
<rect x="115" y="90" width="80" height="105" fill="white" stroke="#cbd4d8"/>
<text x="155" y="113" text-anchor="middle" font-size="15">2</text>
<text x="155" y="144" text-anchor="middle" font-size="19" font-weight="bold">3</text>
<text x="155" y="173" text-anchor="middle" font-size="21" fill="#275b72">3</text>
<rect x="205" y="90" width="80" height="105" fill="white" stroke="#cbd4d8"/>
<text x="245" y="113" text-anchor="middle" font-size="15">3</text>
<text x="245" y="144" text-anchor="middle" font-size="19" font-weight="bold">5</text>
<text x="245" y="173" text-anchor="middle" font-size="21" fill="#275b72">5</text>
<rect x="295" y="90" width="80" height="105" fill="white" stroke="#cbd4d8"/>
<text x="335" y="113" text-anchor="middle" font-size="15">4</text>
<text x="335" y="144" text-anchor="middle" font-size="19" font-weight="bold">7</text>
<text x="335" y="173" text-anchor="middle" font-size="21" fill="#275b72">7</text>
<rect x="385" y="90" width="80" height="105" fill="white" stroke="#cbd4d8"/>
<text x="425" y="113" text-anchor="middle" font-size="15">5</text>
<text x="425" y="144" text-anchor="middle" font-size="19" font-weight="bold">13</text>
<text x="425" y="173" text-anchor="middle" font-size="21" fill="#275b72">13</text>
<rect x="475" y="90" width="80" height="105" fill="white" stroke="#cbd4d8"/>
<text x="515" y="113" text-anchor="middle" font-size="15">6</text>
<text x="515" y="144" text-anchor="middle" font-size="19" font-weight="bold">23</text>
<text x="515" y="173" text-anchor="middle" font-size="21" fill="#275b72">23</text>
<rect x="565" y="90" width="80" height="105" fill="white" stroke="#cbd4d8"/>
<text x="605" y="113" text-anchor="middle" font-size="15">7</text>
<text x="605" y="144" text-anchor="middle" font-size="19" font-weight="bold">43</text>
<text x="605" y="173" text-anchor="middle" font-size="21" fill="#275b72">14</text>
<rect x="655" y="90" width="80" height="105" fill="white" stroke="#cbd4d8"/>
<text x="695" y="113" text-anchor="middle" font-size="15">8</text>
<text x="695" y="144" text-anchor="middle" font-size="19" font-weight="bold">79</text>
<text x="695" y="173" text-anchor="middle" font-size="21" fill="#275b72">21</text>
<rect x="25" y="218" width="80" height="105" fill="white" stroke="#cbd4d8"/>
<text x="65" y="241" text-anchor="middle" font-size="15">9</text>
<text x="65" y="272" text-anchor="middle" font-size="19" font-weight="bold">149</text>
<text x="65" y="301" text-anchor="middle" font-size="21" fill="#275b72">4</text>
<rect x="115" y="218" width="80" height="105" fill="white" stroke="#cbd4d8"/>
<text x="155" y="241" text-anchor="middle" font-size="15">10</text>
<text x="155" y="272" text-anchor="middle" font-size="19" font-weight="bold">263</text>
<text x="155" y="301" text-anchor="middle" font-size="21" fill="#275b72">2</text>
<rect x="205" y="218" width="80" height="105" fill="white" stroke="#cbd4d8"/>
<text x="245" y="241" text-anchor="middle" font-size="15">11</text>
<text x="245" y="272" text-anchor="middle" font-size="19" font-weight="bold">463</text>
<text x="245" y="301" text-anchor="middle" font-size="21" fill="#275b72">28</text>
<rect x="295" y="218" width="80" height="105" fill="white" stroke="#cbd4d8"/>
<text x="335" y="241" text-anchor="middle" font-size="15">12</text>
<text x="335" y="272" text-anchor="middle" font-size="19" font-weight="bold">829</text>
<text x="335" y="301" text-anchor="middle" font-size="21" fill="#275b72">17</text>
<rect x="385" y="218" width="80" height="105" fill="white" stroke="#cbd4d8"/>
<text x="425" y="241" text-anchor="middle" font-size="15">13</text>
<text x="425" y="272" text-anchor="middle" font-size="19" font-weight="bold">1481</text>
<text x="425" y="301" text-anchor="middle" font-size="21" fill="#275b72">2</text>
<rect x="475" y="218" width="80" height="105" fill="white" stroke="#cbd4d8"/>
<text x="515" y="241" text-anchor="middle" font-size="15">14</text>
<text x="515" y="272" text-anchor="middle" font-size="19" font-weight="bold">2593</text>
<text x="515" y="301" text-anchor="middle" font-size="21" fill="#275b72">12</text>
<rect x="565" y="218" width="80" height="105" fill="white" stroke="#cbd4d8"/>
<text x="605" y="241" text-anchor="middle" font-size="15">15</text>
<text x="605" y="272" text-anchor="middle" font-size="19" font-weight="bold">4507</text>
<text x="605" y="301" text-anchor="middle" font-size="21" fill="#275b72">12</text>
<rect x="655" y="218" width="80" height="105" fill="white" stroke="#cbd4d8"/>
<text x="695" y="241" text-anchor="middle" font-size="15">16</text>
<text x="695" y="272" text-anchor="middle" font-size="19" font-weight="bold">7817</text>
<text x="695" y="301" text-anchor="middle" font-size="21" fill="#275b72">16</text>
<text x="25" y="372" font-size="16">The sixteen steps repeat; offsets 0–15 cover every starting position.</text>
</g></svg>
