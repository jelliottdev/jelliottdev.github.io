<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" role="img" aria-labelledby="title desc">
<title id="title">LP2-56 hash comparison coverage</title>
<desc id="desc">Seventy-five image inputs, 300 rune-text variants, 36 stored-literal-section variants, and one binary payload. Each used three hashes. None matched the target.</desc>
<style>text{font-family:system-ui,Arial,sans-serif;fill:#27343b}.small{font-size:13px;fill:#53616b}.name{font-size:16px;font-weight:600}.number{font-size:15px;font-weight:700}.bar{fill:#527485}.rail{fill:#e6ebed}.zero{fill:#2c6176}</style>
<text x="20" y="31" class="name">Exact bytes tested against LP2-56</text>
<text x="20" y="52" class="small">SHA-512 · SHA3-512 · BLAKE2b-512</text>
<text x="20" y="91" class="name">Original JPEGs</text><rect x="217" y="77" width="300" height="18" rx="2" class="rail"/><rect x="217" y="77" width="75" height="18" rx="2" class="bar"/><text x="539" y="92" class="number">75</text>
<text x="20" y="132" class="name">Rune text variants</text><rect x="217" y="118" width="300" height="18" rx="2" class="rail"/><rect x="217" y="118" width="300" height="18" rx="2" class="bar"/><text x="539" y="133" class="number">300</text>
<text x="20" y="173" class="name">Literal-section variants</text><rect x="217" y="159" width="300" height="18" rx="2" class="rail"/><rect x="217" y="159" width="36" height="18" rx="2" class="bar"/><text x="539" y="174" class="number">36</text>
<text x="20" y="214" class="name">Grid payload</text><rect x="217" y="200" width="300" height="18" rx="2" class="rail"/><rect x="217" y="200" width="3" height="18" rx="1" class="bar"/><text x="539" y="215" class="number">1</text>
<path d="M20 238H620" stroke="#d5dcdf"/><text x="20" y="267" class="zero" font-size="19" font-weight="700">0 matches</text><text x="157" y="267" class="small">1,236 comparisons · 324 distinct byte strings</text>
</svg>
