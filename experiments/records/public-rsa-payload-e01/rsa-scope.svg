<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 244" role="img" aria-labelledby="title desc">
<title id="title">Whole-payload RSA structure test</title>
<desc id="desc">The 4096-bit PGP primary and subkey each had 81 evaluated structure checks and zero hits. The 432-bit 2013 modulus was too small for the 256-byte payload and had zero valid inputs.</desc>
<rect width="360" height="244" fill="#f3f4f5"/>
<g font-family="system-ui, sans-serif" fill="#202a30">
<text x="16" y="28" font-size="17" font-weight="700">Whole 256-byte payload</text>
<text x="16" y="52" font-size="13">Three declared byte readings · public-power test</text>
<path d="M16 65H344" stroke="#cbd2d6"/>
<text x="16" y="90" font-size="14" font-weight="700">4096-bit PGP primary</text>
<text x="16" y="111" font-size="13">81 checks</text><text x="344" y="111" text-anchor="end" font-size="13">0 hits</text>
<rect x="83" y="101" width="195" height="8" fill="#315e77"/>
<text x="16" y="143" font-size="14" font-weight="700">4096-bit PGP subkey</text>
<text x="16" y="164" font-size="13">81 checks</text><text x="344" y="164" text-anchor="end" font-size="13">0 hits</text>
<rect x="83" y="154" width="195" height="8" fill="#315e77"/>
<path d="M16 179H344" stroke="#cbd2d6"/>
<text x="16" y="204" font-size="14" font-weight="700">432-bit 2013 modulus</text>
<text x="16" y="225" font-size="13">No valid whole-payload input: 256 bytes cannot fit.</text>
</g></svg>
