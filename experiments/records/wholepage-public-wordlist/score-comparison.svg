<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 284" role="img" aria-labelledby="title desc">
<title id="title">Full-page scores from the 43 public keys</title>
<desc id="desc">Best LP2 score minus 6.50, median full-search shuffled maximum minus 6.49, weakest of nine real solved-reading control scores minus 5.16. Higher is more English-like. One hundred five of 199 shuffled full searches equal or exceed the LP2 best.</desc>
<rect width="360" height="284" fill="#f3f4f5"/>
<g font-family="system-ui, sans-serif" fill="#202a30">
<text x="16" y="27" font-size="17" font-weight="700">Whole-page English score</text>
<text x="16" y="50" font-size="13">Higher is more English-like</text>
<text x="16" y="78" font-size="14">Best LP2 output</text><text x="344" y="78" text-anchor="end" font-size="14" font-weight="700">−6.50</text>
<rect x="16" y="87" width="247" height="8" fill="#d7dde0"/><rect x="16" y="87" width="62" height="8" fill="#315e77"/>
<text x="16" y="125" font-size="14">Shuffle-search median</text><text x="344" y="125" text-anchor="end" font-size="14" font-weight="700">−6.49</text>
<rect x="16" y="134" width="247" height="8" fill="#d7dde0"/><rect x="16" y="134" width="63" height="8" fill="#748994"/>
<text x="16" y="172" font-size="14">Weakest solved example</text><text x="344" y="172" text-anchor="end" font-size="14" font-weight="700">−5.16</text>
<rect x="16" y="181" width="247" height="8" fill="#d7dde0"/><rect x="16" y="181" width="229" height="8" fill="#557b61"/>
<text x="16" y="207" font-size="12">−7.0</text><text x="263" y="207" text-anchor="end" font-size="12">−5.0</text>
<path d="M16 222H344" stroke="#c9d1d5"/>
<text x="16" y="250" font-size="14" font-weight="700">105 / 199 shuffled searches</text>
<text x="16" y="270" font-size="13">scored at least as high as the LP2 best.</text>
</g></svg>
