<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
<title id="title">Adjacent repeats after three fixed collision edits</title>
<desc id="desc">Original LP2: 86 adjacent repeats across 12,956 runes. Delete later copy: zero repeats and 12,870 runes. Insert F: eight repeats and 13,042 runes. Insert a nonmatching rune: zero repeats and 13,042 runes.</desc>
<rect width="760" height="300" fill="#f6f7f8"/>
<text x="24" y="34" fill="#26343b" font-family="system-ui,sans-serif" font-size="19" font-weight="650">Adjacent equal runes after a forward edit</text>
<text x="24" y="56" fill="#52616a" font-family="system-ui,sans-serif" font-size="13">Same LP2-00–55 input; each page edited separately</text>
<text x="24" y="99" fill="#26343b" font-family="system-ui,sans-serif" font-size="15">Original LP2</text>
<rect x="214" y="85" width="300" height="17" fill="#e1e7ea"/>
<rect x="214" y="85" width="300.00" height="17" fill="#315d77"/>
<text x="526" y="99" fill="#26343b" font-family="system-ui,sans-serif" font-size="15" font-weight="650">86</text>
<text x="604" y="99" fill="#52616a" font-family="system-ui,sans-serif" font-size="14">12,956 runes</text>
<text x="24" y="147" fill="#26343b" font-family="system-ui,sans-serif" font-size="15">Delete later copy</text>
<rect x="214" y="133" width="300" height="17" fill="#e1e7ea"/>
<rect x="214" y="133" width="0.00" height="17" fill="#4e7588"/>
<text x="526" y="147" fill="#26343b" font-family="system-ui,sans-serif" font-size="15" font-weight="650">0</text>
<text x="604" y="147" fill="#52616a" font-family="system-ui,sans-serif" font-size="14">12,870 runes</text>
<text x="24" y="195" fill="#26343b" font-family="system-ui,sans-serif" font-size="15">Insert F</text>
<rect x="214" y="181" width="300" height="17" fill="#e1e7ea"/>
<rect x="214" y="181" width="27.91" height="17" fill="#718b98"/>
<text x="526" y="195" fill="#26343b" font-family="system-ui,sans-serif" font-size="15" font-weight="650">8</text>
<text x="604" y="195" fill="#52616a" font-family="system-ui,sans-serif" font-size="14">13,042 runes</text>
<text x="24" y="243" fill="#26343b" font-family="system-ui,sans-serif" font-size="15">Insert other rune</text>
<rect x="214" y="229" width="300" height="17" fill="#e1e7ea"/>
<rect x="214" y="229" width="0.00" height="17" fill="#9eabb1"/>
<text x="526" y="243" fill="#26343b" font-family="system-ui,sans-serif" font-size="15" font-weight="650">0</text>
<text x="604" y="243" fill="#52616a" font-family="system-ui,sans-serif" font-size="14">13,042 runes</text>
<text x="24" y="281" fill="#52616a" font-family="system-ui,sans-serif" font-size="12">These edits are controls; no LP2 plaintext or reverse-edit rule is supplied.</text>
</svg>
