<svg xmlns="http://www.w3.org/2000/svg" width="390" height="270" viewBox="0 0 390 270" role="img" aria-labelledby="t d">
<title id="t">F rune rates under three streams</title>
<desc id="d">The literal cumulative inverse contains fewer F runes than the raw LP2 stream. This is a descriptive comparison, not a cipher test.</desc>
<rect width="390" height="270" fill="#f5f6f7"/>
<g font-family="Arial,sans-serif" fill="#263740">
<text x="18" y="32" font-size="18" font-weight="bold">How often is the output F?</text>
<text x="18" y="56" font-size="12">Zero-index rune · page-local cumulative rule</text>
<text x="18" y="90" font-size="13">Literal cumulative inverse</text>
<rect x="18" y="100" width="270" height="16" fill="#dfe3e6"/>
<rect x="18" y="100" width="30.6" height="16" fill="#315f78"/>
<text x="298" y="114" font-size="14">0.68%</text>
<text x="18" y="149" font-size="13">Known LP1 readings</text>
<rect x="18" y="159" width="270" height="16" fill="#dfe3e6"/>
<rect x="18" y="159" width="70.8" height="16" fill="#647c88"/>
<text x="298" y="173" font-size="14">1.57%</text>
<text x="18" y="208" font-size="13">Raw LP2 ciphertext</text>
<rect x="18" y="218" width="270" height="16" fill="#dfe3e6"/>
<rect x="18" y="218" width="159.1" height="16" fill="#87939c"/>
<text x="298" y="232" font-size="14">3.54%</text>
<text x="18" y="250" font-size="12">Different corpora; bars are observations, not probabilities.</text>
</g>
</svg>
