<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 310" role="img" aria-labelledby="title desc" style="font-family:Arial,sans-serif">
<title id="title">Feedback model scores on planted and LP2 text</title>
<desc id="desc">Two known-key plants score about minus 4.13 and pass the source's minus 5.2 signal bar. Three LP2 pages score about minus 6.9 and do not pass.</desc>
<rect width="320" height="310" fill="#f4f6f7"/>
<text x="18" y="28" font-size="17" font-weight="700" fill="#202b32">A plant passes; three pages do not</text>
<text x="18" y="49" font-size="13" fill="#45545d">Higher English score is better</text>
<line x1="204.7" x2="204.7" y1="70" y2="275" stroke="#9e5963" stroke-width="2" stroke-dasharray="4 4"/>
<text x="199.7" y="83" text-anchor="end" font-size="13" fill="#8a3d48">Signal bar −5.2</text>
<text x="18" y="109" font-size="14" fill="#24353e">Known plant, seed 0</text>
<circle cx="289.5" cy="122" r="7" fill="#1d5d79"/>
<text x="280.5" y="146" text-anchor="end" font-size="13" fill="#1d5d79">-4.13</text>
<text x="18" y="165" font-size="13" fill="#45545d">Seed 1 plant also scores -4.13</text>
<text x="18" y="183" font-size="14" fill="#24353e">LP2-00</text><circle cx="69.7" cy="196" r="6" fill="#6a8490"/><text x="81.7" y="201" font-size="13" fill="#24353e">-6.90</text><text x="18" y="216" font-size="14" fill="#24353e">LP2-05</text><circle cx="67.6" cy="229" r="6" fill="#6a8490"/><text x="79.6" y="234" font-size="13" fill="#24353e">-6.93</text><text x="18" y="249" font-size="14" fill="#24353e">LP2-20</text><circle cx="70.2" cy="262" r="6" fill="#6a8490"/><text x="82.2" y="267" font-size="13" fill="#24353e">-6.89</text>
<text x="18" y="291" font-size="13" fill="#45545d">Each page searched 20,288 combinations.</text>
</svg>