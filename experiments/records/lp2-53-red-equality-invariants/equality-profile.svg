<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 374" role="img" aria-labelledby="title desc">
  <title id="title">Rune concentration of the LP2-53 red passage and comparison windows</title>
  <desc id="desc">The 51-rune red passage has index of coincidence 0.0298. Seventy-eight same-page black windows range from 0.0259 to 0.0408, median 0.0333. Two thousand four hundred ninety-two windows from archived decoded readings range from 0.0400 to 0.1247, median 0.0604. Dots show medians, except the single red passage dot.</desc>
  <rect width="340" height="374" fill="#f3f5f6"/>
  <rect x="8" y="8" width="324" height="358" rx="3" fill="#fff" stroke="#cbd4d9"/>
  <g font-family="system-ui,sans-serif">
    <text x="20" y="38" fill="#223740" font-size="18" font-weight="700">Red resembles nearby text</text>
    <g fill="#536b75" font-size="16">
      <text x="20" y="62">Rune-pair repeat rate in</text>
      <text x="20" y="83">51-rune windows</text>
      <text x="20" y="104">Line = range; dot = middle value.</text>
    </g>
    <g stroke="#e2e7ea" stroke-width="1">
      <line x1="20" y1="126" x2="20" y2="282"/>
      <line x1="129" y1="126" x2="129" y2="282"/>
      <line x1="238" y1="126" x2="238" y2="282"/>
      <line x1="320" y1="126" x2="320" y2="282"/>
    </g>
    <g fill="#223740" font-size="16">
      <text x="20" y="141">Red passage</text><text x="320" y="141" text-anchor="end">0.0298</text>
      <text x="20" y="195">Black on this page</text><text x="320" y="195" text-anchor="end">0.0259–0.0408</text>
      <text x="20" y="249">Decoded readings</text><text x="320" y="249" text-anchor="end">0.0400–0.1247</text>
    </g>
    <circle cx="47" cy="159" r="7" fill="#2d5c72"/>
    <line x1="36" y1="213" x2="77" y2="213" stroke="#879ba5" stroke-width="6" stroke-linecap="round"/>
    <circle cx="56" cy="213" r="6" fill="#516b78"/>
    <line x1="75" y1="267" x2="306" y2="267" stroke="#b1bdc3" stroke-width="6" stroke-linecap="round"/>
    <circle cx="130" cy="267" r="6" fill="#516b78"/>
    <g fill="#536b75" font-size="16">
      <text x="20" y="304">.02</text><text x="129" y="304" text-anchor="middle">.06</text>
      <text x="238" y="304" text-anchor="middle">.10</text><text x="320" y="304" text-anchor="end">.13</text>
      <text x="20" y="334">Black: 78 · decoded: 2,492 windows</text>
      <text x="20" y="356">Windows overlap; counts describe this set.</text>
    </g>
  </g>
</svg>
