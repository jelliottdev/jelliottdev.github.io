<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 407" role="img" aria-labelledby="title desc">
<title id="title">Seven filter models and the manuscript repeat rate</title>
<desc id="desc">Observed adjacent repeats are 0.664 percent. Key skip, output rewrite and fixed nudge match that rate; no filter, key filter and text filter are near 3.5 percent; a hard ban produces zero.</desc>
<rect width="320" height="407" fill="#f7f8fa"/>
<text x="16" y="28" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#202c34">Where is the repeat blocked?</text>
<text x="16" y="51" font-family="Arial,sans-serif" font-size="13" fill="#4e5e69">Equal adjacent runes · percent of pairs</text>
<rect x="151" y="67" width="145" height="291" fill="#edf1f4"/>
<line x1="151.0" y1="67" x2="151.0" y2="358" stroke="#d1d9de"/>
<text x="151.0" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#52636e">0%</text>
<line x1="187.2" y1="67" x2="187.2" y2="358" stroke="#d1d9de"/>
<text x="187.2" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#52636e">1%</text>
<line x1="223.5" y1="67" x2="223.5" y2="358" stroke="#d1d9de"/>
<text x="223.5" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#52636e">2%</text>
<line x1="259.8" y1="67" x2="259.8" y2="358" stroke="#d1d9de"/>
<text x="259.8" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#52636e">3%</text>
<line x1="296.0" y1="67" x2="296.0" y2="358" stroke="#d1d9de"/>
<text x="296.0" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#52636e">4%</text>
<line x1="175.1" y1="67" x2="175.1" y2="358" stroke="#117491" stroke-width="2" stroke-dasharray="4 3"/>
<text x="16" y="95" font-family="Arial,sans-serif" font-size="13" fill="#26333c">No filter</text>
<circle cx="276.7" cy="91" r="5" fill="#64727c"/>
<line x1="16" y1="110" x2="304" y2="110" stroke="#e0e5e8"/>
<text x="16" y="135" font-family="Arial,sans-serif" font-size="13" fill="#26333c">Key skip</text>
<circle cx="174.0" cy="131" r="5" fill="#245770"/>
<line x1="16" y1="150" x2="304" y2="150" stroke="#e0e5e8"/>
<text x="16" y="175" font-family="Arial,sans-serif" font-size="13" fill="#26333c">Output rewrite</text>
<circle cx="175.2" cy="171" r="5" fill="#245770"/>
<line x1="16" y1="190" x2="304" y2="190" stroke="#e0e5e8"/>
<text x="16" y="215" font-family="Arial,sans-serif" font-size="13" fill="#26333c">Fixed nudge</text>
<circle cx="174.9" cy="211" r="5" fill="#a35546"/>
<line x1="16" y1="230" x2="304" y2="230" stroke="#e0e5e8"/>
<text x="16" y="255" font-family="Arial,sans-serif" font-size="13" fill="#26333c">Key filter</text>
<circle cx="277.3" cy="251" r="5" fill="#64727c"/>
<line x1="16" y1="270" x2="304" y2="270" stroke="#e0e5e8"/>
<text x="16" y="295" font-family="Arial,sans-serif" font-size="13" fill="#26333c">Text filter</text>
<circle cx="276.7" cy="291" r="5" fill="#64727c"/>
<line x1="16" y1="310" x2="304" y2="310" stroke="#e0e5e8"/>
<text x="16" y="335" font-family="Arial,sans-serif" font-size="13" fill="#26333c">Hard ban</text>
<circle cx="151.0" cy="331" r="5" fill="#64727c"/>
<text x="16" y="399" font-family="Arial,sans-serif" font-size="13" fill="#117491">Dashed line: observed 0.664%</text>
</svg>
