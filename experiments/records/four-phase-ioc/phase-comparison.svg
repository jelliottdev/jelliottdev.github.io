<svg xmlns="http://www.w3.org/2000/svg" width="360" viewBox="0 0 360 462" role="img" aria-labelledby="title desc">
<title id="title">Four alternating rune streams and their collision rates</title>
<desc id="desc">Successive rune positions repeat phases zero through three. Each observed LP2 phase is within the middle 95 percent of 1,999 page-shuffled controls. A planted four-stream warning-page control is detected.</desc>
<rect width="360" height="462" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#26343c}.head{font-size:17px;font-weight:700}.small{font-size:12px;fill:#52616a}.label{font-size:13px;font-weight:600}.tick{font-size:11px;fill:#53616a}</style>
<text x="16" y="28" class="head">Four alternating streams</text>
<text x="16" y="49" class="small">Successive rune positions repeat 0, 1, 2, 3.</text>
<rect x="17" y="64" width="33" height="32" rx="3" fill="#dfe9ee" stroke="#bcc9cf"/>
<text x="33.5" y="86" text-anchor="middle" font-size="15">0</text>
<rect x="57" y="64" width="33" height="32" rx="3" fill="#f0f3f5" stroke="#bcc9cf"/>
<text x="73.5" y="86" text-anchor="middle" font-size="15">1</text>
<rect x="97" y="64" width="33" height="32" rx="3" fill="#dfe9ee" stroke="#bcc9cf"/>
<text x="113.5" y="86" text-anchor="middle" font-size="15">2</text>
<rect x="137" y="64" width="33" height="32" rx="3" fill="#f0f3f5" stroke="#bcc9cf"/>
<text x="153.5" y="86" text-anchor="middle" font-size="15">3</text>
<rect x="177" y="64" width="33" height="32" rx="3" fill="#dfe9ee" stroke="#bcc9cf"/>
<text x="193.5" y="86" text-anchor="middle" font-size="15">0</text>
<rect x="217" y="64" width="33" height="32" rx="3" fill="#f0f3f5" stroke="#bcc9cf"/>
<text x="233.5" y="86" text-anchor="middle" font-size="15">1</text>
<rect x="257" y="64" width="33" height="32" rx="3" fill="#dfe9ee" stroke="#bcc9cf"/>
<text x="273.5" y="86" text-anchor="middle" font-size="15">2</text>
<rect x="297" y="64" width="33" height="32" rx="3" fill="#f0f3f5" stroke="#bcc9cf"/>
<text x="313.5" y="86" text-anchor="middle" font-size="15">3</text>
<text x="16" y="134" class="head">LP2 against page shuffles</text>
<text x="16" y="154" class="small">Dot: manuscript. Line: middle 95% of controls.</text>
<line x1="106.0" y1="177" x2="106.0" y2="316" stroke="#e8edef"/>
<text x="106.0" y="336" text-anchor="middle" class="tick">0.0343</text>
<line x1="208.2" y1="177" x2="208.2" y2="316" stroke="#e8edef"/>
<text x="208.2" y="336" text-anchor="middle" class="tick">0.0345</text>
<line x1="310.4" y1="177" x2="310.4" y2="316" stroke="#e8edef"/>
<text x="310.4" y="336" text-anchor="middle" class="tick">0.0347</text>
<text x="16" y="198" class="label">Phase 0</text>
<line x1="129.0" y1="193" x2="281.6" y2="193" stroke="#9caab1" stroke-width="8" stroke-linecap="round"/>
<circle cx="213.7" cy="193" r="6" fill="#21516b" stroke="#fff" stroke-width="2"/>
<text x="16" y="234" class="label">Phase 1</text>
<line x1="133.2" y1="229" x2="284.5" y2="229" stroke="#9caab1" stroke-width="8" stroke-linecap="round"/>
<circle cx="163.3" cy="229" r="6" fill="#21516b" stroke="#fff" stroke-width="2"/>
<text x="16" y="270" class="label">Phase 2</text>
<line x1="128.3" y1="265" x2="277.9" y2="265" stroke="#9caab1" stroke-width="8" stroke-linecap="round"/>
<circle cx="238.1" cy="265" r="6" fill="#21516b" stroke="#fff" stroke-width="2"/>
<text x="16" y="306" class="label">Phase 3</text>
<line x1="133.2" y1="301" x2="280.6" y2="301" stroke="#9caab1" stroke-width="8" stroke-linecap="round"/>
<circle cx="241.2" cy="301" r="6" fill="#21516b" stroke="#fff" stroke-width="2"/>
<line x1="16" y1="358" x2="344" y2="358" stroke="#dce4e8"/>
<text x="16" y="383" class="label">Planted control: detected</text>
<text x="16" y="403" class="small">Four shifted copies of a known reading:</text>
<text x="16" y="421" class="small">phase IoC 0.0640; none of 1,999 shuffles higher.</text>
<text x="16" y="447" class="small">A narrow test of concentration, not every cipher.</text>
</svg>
