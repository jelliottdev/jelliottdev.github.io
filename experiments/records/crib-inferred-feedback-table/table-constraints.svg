<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 278" role="img" aria-labelledby="title desc"><title id="title">Nine fixed slots, twenty free slots</title><desc id="desc">In the only compatible plaintext-feedback case, the twelve-rune opening assigns nine of twenty-nine table inputs. Twenty table outputs remain unconstrained, allowing twenty-nine to the twentieth power complete tables.</desc><rect width="560" height="278" fill="#f3f5f6"/><rect x="12" y="12" width="536" height="254" rx="4" fill="white" stroke="#cbd4d9"/><text x="27" y="42" fill="#223740" font-family="system-ui,sans-serif" font-size="17" font-weight="700">A short fit leaves most of the key unknown</text><text x="27" y="63" fill="#536b75" font-family="system-ui,sans-serif" font-size="12">Example: LP2-49 against the fixed Loss of Divinity opening, plaintext feedback</text><rect x="28" y="78" width="43" height="39" rx="3" fill="#2d5c72" stroke="#2d5c72"/><text x="49.5" y="103" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="14">0</text><rect x="79" y="78" width="43" height="39" rx="3" fill="#2d5c72" stroke="#2d5c72"/><text x="100.5" y="103" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="14">1</text><rect x="130" y="78" width="43" height="39" rx="3" fill="#2d5c72" stroke="#2d5c72"/><text x="151.5" y="103" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="14">2</text><rect x="181" y="78" width="43" height="39" rx="3" fill="#2d5c72" stroke="#2d5c72"/><text x="202.5" y="103" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="14">3</text><rect x="232" y="78" width="43" height="39" rx="3" fill="#e5eaed" stroke="#c1cbd0"/><text x="253.5" y="103" text-anchor="middle" fill="#344c56" font-family="system-ui,sans-serif" font-size="14">4</text><rect x="283" y="78" width="43" height="39" rx="3" fill="#e5eaed" stroke="#c1cbd0"/><text x="304.5" y="103" text-anchor="middle" fill="#344c56" font-f