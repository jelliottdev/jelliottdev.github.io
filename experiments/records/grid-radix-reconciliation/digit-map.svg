<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 295" role="img" aria-labelledby="title desc">
<title id="title">Deleting f renumbers later digits</title>
<desc id="desc">In ordinary order, e is 40, f is 41, g is 42 and x is 59. In the custom base-59 order, f is absent, e remains 40, g becomes 41 and x becomes 58.</desc>
<rect width="360" height="295" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#202d35">
<text x="17" y="29" font-size="19" font-weight="700">What deleting f changes</text>
<text x="17" y="53" font-size="13" fill="#52616b">The printed pairs stay the same.</text>
<text x="17" y="79" font-size="14" font-weight="700">Ordinary digit order</text>
<text x="17" y="174" font-size="14" font-weight="700">Custom base-59 order</text>
</g>
<g font-family="Arial, sans-serif" text-anchor="middle">
<rect x="17" y="92" width="72" height="58" rx="4" fill="#f3f6f7" stroke="#cbd3d7"/>
<rect x="99" y="92" width="72" height="58" rx="4" fill="#f3f6f7" stroke="#cbd3d7"/>
<rect x="181" y="92" width="72" height="58" rx="4" fill="#f3f6f7" stroke="#cbd3d7"/>
<rect x="271" y="92" width="72" height="58" rx="4" fill="#edf2f4" stroke="#9db3bf"/>
<rect x="17" y="187" width="72" height="58" rx="4" fill="#f3f6f7" stroke="#cbd3d7"/>
<rect x="99" y="187" width="72" height="58" rx="4" fill="#fff" stroke="#cbd3d7" stroke-dasharray="4 3"/>
<rect x="181" y="187" width="72" height="58" rx="4" fill="#f3f6f7" stroke="#cbd3d7"/>
<rect x="271" y="187" width="72" height="58" rx="4" fill="#edf2f4" stroke="#9db3bf"/>
<g font-size="21" font-weight="700" fill="#202d35">
<text x="53" y="120">e</text><text x="135" y="120">f</text><text x="217" y="120">g</text><text x="307" y="120">x</text>
<text x="53" y="215">e</text><text x="217" y="215">g</text><text x="307" y="215">x</text>
</g>
<g font-size="14" fill="#52616b">
<text x="53" y="140">40</text><text x="135" y="140">41</text><text x="217" y="140">42</text><text x="307" y="140">59</text>
<text x="53" y="235">40</text><text x="135" y="221" font-size="12">absent</text><text x="217" y="235">41</text><text x="307" y="235">58</text>
</g>
</g>
<text x="17" y="278" font-size="13" font-family="Arial, sans-serif" fill="#52616b">Later lowercase values fall by one.</text>
</svg>
