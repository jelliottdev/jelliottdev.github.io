<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 390 358">
<title id="title">Skip-count separation appears at the 6,000-rune ladder point</title>
<desc id="desc">A planted correct key's skip count stays below the wrong-key 1 percent upper-tail threshold through 3,600 runes, then rises above it at 6,000, 9,000 and 12,956 runes.</desc>
<rect width="390" height="358" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#26343e}.tick{font-size:11px}.note{font-size:12px}</style>
<text x="19" y="30" font-size="18" font-weight="700">When does the skip count separate?</text>
<line x1="20" y1="52" x2="43" y2="52" stroke="#315f78" stroke-width="3"/>
<text x="49" y="56" class="note">correct key</text>
<line x1="175" y1="52" x2="198" y2="52" stroke="#8696a0" stroke-width="3"/>
<text x="204" y="56" class="note">wrong-key 1% tail</text>
<line x1="45" y1="280.0" x2="357" y2="280.0" stroke="#e4e9ec"/><text x="38" y="284.0" text-anchor="end" class="tick">0</text><line x1="45" y1="237.3" x2="357" y2="237.3" stroke="#e4e9ec"/><text x="38" y="241.3" text-anchor="end" class="tick">100</text><line x1="45" y1="194.7" x2="357" y2="194.7" stroke="#e4e9ec"/><text x="38" y="198.7" text-anchor="end" class="tick">200</text><line x1="45" y1="152.0" x2="357" y2="152.0" stroke="#e4e9ec"/><text x="38" y="156.0" text-anchor="end" class="tick">300</text><line x1="45" y1="109.3" x2="357" y2="109.3" stroke="#e4e9ec"/><text x="38" y="113.3" text-anchor="end" class="tick">400</text>
<line x1="287.9" y1="88" x2="287.9" y2="280" stroke="#b8c4ca" stroke-dasharray="4 4"/>
<polyline points="45.0,271.9 81.4,269.3 117.7,264.2 143.6,260.4 169.4,257.8 205.7,245.9 242.1,234.3 287.9,204.9 324.3,173.3 357.0,130.7" fill="none" stroke="#8696a0" stroke-width="2.5" stroke-linejoin="round"/>
<polyline points="45.0,277.4 81.4,274.5 117.7,273.2 143.6,265.5 169.4,260.8 205.7,251.0 242.1,239.9 287.9,195.5 324.3,156.3 357.0,101.7" fill="none" stroke="#315f78" stroke-width="3" stroke-linejoin="round"/>
<circle cx="45.0" cy="277.4" r="3.6" fill="#315f78"/><circle cx="45.0" cy="271.9" r="3.6" fill="#8696a0"/><circle cx="81.4" cy="274.5" r="3.6" fill="#315f78"/><circle cx="81.4" cy="269.3" r="3.6" fill="#8696a0"/><circle cx="117.7" cy="273.2" r="3.6" fill="#315f78"/><circle cx="117.7" cy="264.2" r="3.6" fill="#8696a0"/><circle cx="143.6" cy="265.5" r="3.6" fill="#315f78"/><circle cx="143.6" cy="260.4" r="3.6" fill="#8696a0"/><circle cx="169.4" cy="260.8" r="3.6" fill="#315f78"/><circle cx="169.4" cy="257.8" r="3.6" fill="#8696a0"/><circle cx="205.7" cy="251.0" r="3.6" fill="#315f78"/><circle cx="205.7" cy="245.9" r="3.6" fill="#8696a0"/><circle cx="242.1" cy="239.9" r="3.6" fill="#315f78"/><circle cx="242.1" cy="234.3" r="3.6" fill="#8696a0"/><circle cx="287.9" cy="195.5" r="3.6" fill="#315f78"/><circle cx="287.9" cy="204.9" r="3.6" fill="#8696a0"/><circle cx="324.3" cy="156.3" r="3.6" fill="#315f78"/><circle cx="324.3" cy="173.3" r="3.6" fill="#8696a0"/><circle cx="357.0" cy="101.7" r="3.6" fill="#315f78"/><circle cx="357.0" cy="130.7" r="3.6" fill="#8696a0"/>
<line x1="45" y1="280" x2="357" y2="280" stroke="#70808a"/>
<line x1="45.0" y1="280" x2="45.0" y2="285" stroke="#70808a"/><text x="45.0" y="300" text-anchor="start" class="tick">400</text><line x1="143.6" y1="280" x2="143.6" y2="285" stroke="#70808a"/><text x="143.6" y="300" text-anchor="middle" class="tick">1,200</text><line x1="242.1" y1="280" x2="242.1" y2="285" stroke="#70808a"/><text x="242.1" y="300" text-anchor="middle" class="tick">3,600</text><line x1="287.9" y1="280" x2="287.9" y2="285" stroke="#70808a"/><text x="287.9" y="300" text-anchor="middle" class="tick">6,000</text><line x1="357.0" y1="280" x2="357.0" y2="285" stroke="#70808a"/><text x="357.0" y="300" text-anchor="end" class="tick">12,956</text>
<text x="357" y="323" text-anchor="end" class="note">runes in planted ciphertext · log scale</text>
<text x="19" y="347" class="note">First tested crossing: 6,000; bracket: 3,600–6,000.</text>
</svg>
