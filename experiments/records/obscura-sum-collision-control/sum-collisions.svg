<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" role="img" aria-labelledby="title desc">
<title id="title">OBSCURA word-sum matches and control range</title>
<desc id="desc">The observed 104 matches lie within the central 95 percent control range of 77 to 114. The control mean is 95.2.</desc>
<rect width="360" height="230" fill="#f5f6f7"/>
<text x="16" y="27" font-family="Arial,sans-serif" font-size="16" fill="#202a31" font-weight="700">How selective is a sum match?</text>
<text x="16" y="49" font-family="Arial,sans-serif" font-size="12" fill="#4e5c66">2,928 words · 13 candidate totals</text>
<text x="16" y="67" font-family="Arial,sans-serif" font-size="12" fill="#4e5c66">2,000 page-preserving shuffles</text>
<text x="16" y="102" font-family="Arial,sans-serif" font-size="13" fill="#365669">Control middle range: 77–114</text>
<rect x="62" y="119" width="245" height="24" fill="#b9cbd4"/>
<line x1="182" y1="115" x2="182" y2="148" stroke="#597785" stroke-width="3"/>
<circle cx="241" cy="131" r="8" fill="#1f4f68"/>
<line x1="44" y1="158" x2="326" y2="158" stroke="#82919a" stroke-width="2"/>
<g font-family="Arial,sans-serif" font-size="11" fill="#53616a" text-anchor="middle">
<text x="62" y="178">77</text><text x="182" y="178">95</text><text x="241" y="178">104</text><text x="307" y="178">114</text>
</g>
<text x="16" y="204" font-family="Arial,sans-serif" font-size="12" fill="#597785">Line: control mean 95.2</text>
<text x="16" y="222" font-family="Arial,sans-serif" font-size="12" fill="#1f4f68">Dot: observed 104</text>
</svg>
