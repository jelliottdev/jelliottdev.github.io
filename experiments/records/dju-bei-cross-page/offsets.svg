<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 242" role="img" aria-labelledby="title desc">
<title id="title">DJU-BEI on two pages</title>
<desc id="desc">The same six runes, transliterated DJU-BEI, begin at zero-based rune offset 28 on LP2-27 and offset 70 on LP2-55. Both sources show a hyphen between the third and fourth runes.</desc>
<rect width="360" height="242" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#202d35">
<text x="17" y="29" font-size="19" font-weight="700">One sequence, two pages</text>
<text x="17" y="53" font-size="13" fill="#52616b">Offsets count runes, then reset by page.</text>
<rect x="17" y="71" width="326" height="68" rx="4" fill="#f1f6f8" stroke="#bacbd3"/>
<rect x="17" y="151" width="326" height="68" rx="4" fill="#f1f6f8" stroke="#bacbd3"/>
<text x="31" y="95" font-size="15" font-weight="700">LP2-27 · line 2</text>
<text x="31" y="118" font-size="18" fill="#215a79">DJU-BEI</text>
<text x="329" y="118" text-anchor="end" font-size="14" fill="#52616b">offset 28</text>
<text x="31" y="175" font-size="15" font-weight="700">LP2-55 · line 4</text>
<text x="31" y="198" font-size="18" fill="#215a79">DJU-BEI</text>
<text x="329" y="198" text-anchor="end" font-size="14" fill="#52616b">offset 70</text>
</g>
</svg>
