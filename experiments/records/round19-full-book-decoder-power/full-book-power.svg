<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 298" role="img" aria-labelledby="t d" font-family="Arial, sans-serif">
<title id="t">Known-key full-book recovery</title>
<desc id="d">For a 12,956-rune synthetic message, both exact and permissive decoders recover over 99.8 percent with the correct key; wrong-key controls recover under five percent.</desc>
<rect width="332" height="298" fill="#f8fafb"/>
<text x="16" y="27" font-size="16" font-weight="700" fill="#172e3d">Known-key recovery</text>
<text x="16" y="47" font-size="13" fill="#435865">12,956 runes · 3 correct / 1 wrong per rule</text>
<text x="16" y="75" font-size="14" font-weight="700" fill="#172e3d">Exact skip rule</text>
<text x="16" y="99" font-size="13" fill="#314958">Correct key</text>
<rect x="117" y="88" width="144" height="16" fill="#e3e9ec"/>
<rect x="117" y="88" width="144" height="16" fill="#255d78"/>
<text x="267" y="101" font-size="13" fill="#172e3d">99.98%</text>
<text x="16" y="137" font-size="13" fill="#314958">Wrong key</text>
<rect x="117" y="126" width="144" height="16" fill="#e3e9ec"/>
<rect x="117" y="126" width="5" height="16" fill="#9b7774"/>
<text x="267" y="139" font-size="13" fill="#172e3d">3.77%</text>
<text x="16" y="180" font-size="14" font-weight="700" fill="#172e3d">Permissive drift rule</text>
<text x="16" y="204" font-size="13" fill="#314958">Correct key</text>
<rect x="117" y="193" width="144" height="16" fill="#e3e9ec"/>
<rect x="117" y="193" width="144" height="16" fill="#255d78"/>
<text x="267" y="206" font-size="13" fill="#172e3d">99.82%</text>
<text x="16" y="242" font-size="13" fill="#314958">Wrong key</text>
<rect x="117" y="231" width="144" height="16" fill="#e3e9ec"/>
<rect x="117" y="231" width="7" height="16" fill="#9b7774"/>
<text x="267" y="244" font-size="13" fill="#172e3d">4.88%</text>
<path d="M16 266H304" stroke="#c7d0d5"/>
<text x="16" y="287" font-size="13" fill="#435865">Synthetic text; the key is supplied to decoder</text>
</svg>
