<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 370" role="img" aria-labelledby="title desc">
<title id="title">Restart-boundary agreement test</title>
<desc id="desc">Across five boundary types, observed LP2 agreements sit near the flat null while the lower edge of planted restart controls is much higher.</desc>
<rect width="340" height="370" fill="#fff"/>
<text x="16" y="27" font-size="17" font-weight="700" fill="#252c30">Same-position agreements</text>
<text x="16" y="50" font-size="13" fill="#55636c">Ratio to the random-rune expectation</text>
<rect x="16" y="68" width="14" height="14" fill="#285e79"/>
<text x="36" y="80" font-size="13" fill="#31383d">LP2</text>
<rect x="111" y="68" width="14" height="14" fill="#9eaab2"/>
<text x="131" y="80" font-size="13" fill="#31383d">Planted lower bound</text>
<line x1="120" y1="111" x2="320" y2="111" stroke="#aeb8be"/>
<line x1="220" y1="109" x2="220" y2="332" stroke="#aeb8be" stroke-dasharray="3 4"/>
<text x="118" y="104" font-size="13" fill="#55636c">0</text>
<text x="214" y="104" font-size="13" fill="#55636c">1×</text>
<text x="309" y="104" font-size="13" fill="#55636c">2×</text>
<text x="16" y="144" font-size="14" fill="#252c30">Segment</text>
<rect x="120" y="130" width="98.21" height="8" fill="#285e79"/>
<rect x="120" y="143" width="153.19" height="8" fill="#9eaab2"/>
<text x="16" y="188" font-size="14" fill="#252c30">Paragraph</text>
<rect x="120" y="174" width="97.29" height="8" fill="#285e79"/>
<rect x="120" y="187" width="155.05" height="8" fill="#9eaab2"/>
<text x="16" y="232" font-size="14" fill="#252c30">Clause</text>
<rect x="120" y="218" width="100.78" height="8" fill="#285e79"/>
<rect x="120" y="231" width="162.38" height="8" fill="#9eaab2"/>
<text x="16" y="276" font-size="14" fill="#252c30">Line</text>
<rect x="120" y="262" width="100.84" height="8" fill="#285e79"/>
<rect x="120" y="275" width="162.54" height="8" fill="#9eaab2"/>
<text x="16" y="320" font-size="14" fill="#252c30">Page</text>
<rect x="120" y="306" width="100.23" height="8" fill="#285e79"/>
<rect x="120" y="319" width="161.35" height="8" fill="#9eaab2"/>
<text x="16" y="358" font-size="13" fill="#55636c">Planted bounds use the weaker of two sources.</text>
</svg>
