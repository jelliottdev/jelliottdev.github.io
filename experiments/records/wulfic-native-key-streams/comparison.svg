<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 442" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
<title id="title">Six pinned LP2 key streams versus planted controls</title>
<desc id="desc">For each source key, the best LP2 score on at least 100 runes is below zero, while all planted key controls exceed the +30 reading threshold.</desc>
<rect width="340" height="442" fill="#fff"/>
<text x="16" y="27" font-size="17" font-weight="700" fill="#26333a">Key-source replay</text>
<text x="16" y="50" font-size="15" fill="#59676f">Score threshold: +30</text>
<circle cx="22" cy="72" r="5" fill="#285e79"/>
<text x="33" y="77" font-size="15" fill="#26333a">LP2 best</text>
<line x1="149" y1="72" x2="165" y2="72" stroke="#8999a2" stroke-width="5"/>
<text x="173" y="77" font-size="15" fill="#26333a">Planted range</text>
<line x1="95.0" y1="104" x2="95.0" y2="407" stroke="#d8dee1" stroke-dasharray="2 5"/>
<text x="95.0" y="113" text-anchor="middle" font-size="15" fill="#59676f">−100</text>
<line x1="157.0" y1="104" x2="157.0" y2="407" stroke="#d8dee1" stroke-dasharray="2 5"/>
<text x="157.0" y="113" text-anchor="middle" font-size="15" fill="#59676f">0</text>
<line x1="175.6" y1="104" x2="175.6" y2="407" stroke="#285e79" stroke-dasharray="4 4"/>
<text x="175.6" y="98" text-anchor="middle" font-size="15" fill="#59676f">+30</text>
<line x1="219.0" y1="104" x2="219.0" y2="407" stroke="#d8dee1" stroke-dasharray="2 5"/>
<text x="219.0" y="113" text-anchor="middle" font-size="15" fill="#59676f">+100</text>
<line x1="281.0" y1="104" x2="281.0" y2="407" stroke="#d8dee1" stroke-dasharray="2 5"/>
<text x="281.0" y="113" text-anchor="middle" font-size="15" fill="#59676f">+200</text>
<text x="16" y="127" font-size="15" fill="#26333a">Primes</text>
<line x1="275.0" y1="141" x2="308.0" y2="141" stroke="#8999a2" stroke-width="5" stroke-linecap="round"/>
<circle cx="113.9" cy="141" r="5" fill="#285e79"/>
<text x="16" y="173" font-size="15" fill="#26333a">LP1 word sums</text>
<line x1="259.6" y1="187" x2="296.1" y2="187" stroke="#8999a2" stroke-width="5" stroke-linecap="round"/>
<circle cx="116.4" cy="187" r="5" fill="#285e79"/>
<text x="16" y="219" font-size="15" fill="#26333a">LP1 rune values</text>
<line x1="283.2" y1="233" x2="309.0" y2="233" stroke="#8999a2" stroke-width="5" stroke-linecap="round"/>
<circle cx="109.0" cy="233" r="5" fill="#285e79"/>
<text x="16" y="265" font-size="15" fill="#26333a">Grid bytes</text>
<line x1="190.9" y1="279" x2="211.4" y2="279" stroke="#8999a2" stroke-width="5" stroke-linecap="round"/>
<circle cx="148.5" cy="279" r="5" fill="#285e79"/>
<text x="16" y="311" font-size="15" fill="#26333a">Grid 5-bit</text>
<line x1="216.2" y1="325" x2="236.7" y2="325" stroke="#8999a2" stroke-width="5" stroke-linecap="round"/>
<circle cx="139.5" cy="325" r="5" fill="#285e79"/>
<text x="16" y="357" font-size="15" fill="#26333a">Grid digits</text>
<line x1="229.3" y1="371" x2="260.7" y2="371" stroke="#8999a2" stroke-width="5" stroke-linecap="round"/>
<circle cx="127.7" cy="371" r="5" fill="#285e79"/>
<text x="16" y="425" font-size="15" fill="#59676f">Controls use each key’s available length.</text>
</svg>
