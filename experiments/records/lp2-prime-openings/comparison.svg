<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 350" role="img" aria-labelledby="title desc">
<title id="title">Primes versus primes minus one</title>
<desc id="desc">First four saved LP2-00 candidate indices, offset zero and subtraction. Every ordinary-prime output is one index below the baseline, modulo 29. Neither candidate is a known reading.</desc>
<rect width="440" height="350" fill="#f7f7f3"/>
<g font-family="sans-serif" fill="#263b46">
<text x="20" y="31" font-size="21">One position lower, modulo 29</text>
<text x="20" y="58" font-size="16">LP2-00 · offset 0 · subtraction</text>
<text x="20" y="94" font-size="17">Primes − 1</text>
<text x="279" y="94" font-size="17">Primes</text>
<path d="M20 141H420" stroke="#d7dddf"/>
<text x="60" y="131" font-size="21">14</text>
<text x="176" y="131" font-size="17">− 1 →</text>
<text x="303" y="131" font-size="21">13</text>
<path d="M20 184H420" stroke="#d7dddf"/>
<text x="60" y="174" font-size="21">6</text>
<text x="176" y="174" font-size="17">− 1 →</text>
<text x="303" y="174" font-size="21">5</text>
<path d="M20 227H420" stroke="#d7dddf"/>
<text x="60" y="217" font-size="21">14</text>
<text x="176" y="217" font-size="17">− 1 →</text>
<text x="303" y="217" font-size="21">13</text>
<path d="M20 270H420" stroke="#d7dddf"/>
<text x="60" y="260" font-size="21">26</text>
<text x="176" y="260" font-size="17">− 1 →</text>
<text x="303" y="260" font-size="21">25</text>
<text x="20" y="304" font-size="16">These are candidate alphabet indices,</text>
<text x="20" y="328" font-size="16">not a known reading or a new solution.</text>
</g></svg>
