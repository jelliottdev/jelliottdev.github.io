<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
<title id="title">Equal rune pairs by lag across LP2-00 through LP2-55</title>
<desc id="desc">Lag one has 86 matches, far below the page-shuffle range. Lags two through five are close to the page-shuffle expectation. Intervals are empirical, not cipher-model confidence bounds.</desc>
<rect width="640" height="320" fill="white"/>
<g font-family="system-ui, sans-serif" fill="#263842">
<text x="20" y="29" font-size="19">Equal rune pairs by distance</text>
<text x="20" y="51" font-size="12">LP2-00–55 · within pages · fixed-count page shuffles</text>
<text x="20" y="88" font-size="14">Lag 1</text>
<line x1="126" y1="83" x2="555" y2="83" stroke="#e4e8e7" stroke-width="2"/>
<rect x="467.5" y="75" width="70.4" height="16" fill="#c4d4d1"/>
<line x1="502.8" y1="72" x2="502.8" y2="94" stroke="#607d7a" stroke-width="2"/>
<circle cx="199.8" cy="83" r="6" fill="#245d74"/>
<text x="567" y="88" font-size="13">86</text>
<text x="20" y="134" font-size="14">Lag 2</text>
<line x1="126" y1="129" x2="555" y2="129" stroke="#e4e8e7" stroke-width="2"/>
<rect x="465.8" y="121" width="71.2" height="16" fill="#c4d4d1"/>
<line x1="501.2" y1="118" x2="501.2" y2="140" stroke="#607d7a" stroke-width="2"/>
<circle cx="499.2" cy="129" r="6" fill="#245d74"/>
<text x="567" y="134" font-size="13">435</text>
<text x="20" y="180" font-size="14">Lag 3</text>
<line x1="126" y1="175" x2="555" y2="175" stroke="#e4e8e7" stroke-width="2"/>
<rect x="465.8" y="167" width="68.6" height="16" fill="#c4d4d1"/>
<line x1="499.6" y1="164" x2="499.6" y2="186" stroke="#607d7a" stroke-width="2"/>
<circle cx="498.4" cy="175" r="6" fill="#245d74"/>
<text x="567" y="180" font-size="13">434</text>
<text x="20" y="226" font-size="14">Lag 4</text>
<line x1="126" y1="221" x2="555" y2="221" stroke="#e4e8e7" stroke-width="2"/>
<rect x="462.3" y="213" width="68.6" height="16" fill="#c4d4d1"/>
<line x1="498.0" y1="210" x2="498.0" y2="232" stroke="#607d7a" stroke-width="2"/>
<circle cx="513.0" cy="221" r="6" fill="#245d74"/>
<text x="567" y="226" font-size="13">451</text>
<text x="20" y="272" font-size="14">Lag 5</text>
<line x1="126" y1="267" x2="555" y2="267" stroke="#e4e8e7" stroke-width="2"/>
<rect x="461.5" y="259" width="66.9" height="16" fill="#c4d4d1"/>
<line x1="496.4" y1="256" x2="496.4" y2="278" stroke="#607d7a" stroke-width="2"/>
<circle cx="523.3" cy="267" r="6" fill="#245d74"/>
<text x="567" y="272" font-size="13">463</text>
<text x="126" y="305" font-size="12">0</text>
<text x="516" y="305" font-size="12">500 matches</text>
</g></svg>
