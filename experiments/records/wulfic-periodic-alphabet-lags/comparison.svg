<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352 398" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
<title id="title">Rune agreement at named periodic-alphabet key lengths</title>
<desc id="desc">LP2 agreement at periods 1033, 1729 and 3301 stays near 3.4 to 3.6 percent; even the lowest planted control exceeds 5.2 percent. Exactly 10,030 of 12,935 tested lags meet the source exclusion rule; 2,905 remain open.</desc>
<rect width="352" height="398" fill="#f6f7f8"/>
<text x="16" y="29" fill="#192832" font-size="17" font-weight="700">Periodic alphabets</text>
<text x="16" y="53" fill="#45545f" font-size="15">Same-rune agreement at named lags</text>
<circle cx="21" cy="78" r="5" fill="#2d5e79"/>
<text x="34" y="83" fill="#263741" font-size="15">LP2</text>
<rect x="122" y="72" width="9" height="12" fill="#748d9d"/>
<text x="140" y="83" fill="#263741" font-size="15">Lowest planted rate</text>
<line x1="16" y1="100" x2="336" y2="100" stroke="#ccd3d8"/>
<text x="16" y="125" fill="#45545f" font-size="15">Period</text>
<line x1="110.0" y1="136" x2="110.0" y2="309" stroke="#d5dce0"/>
<text x="110.0" y="333" text-anchor="middle" fill="#45545f" font-size="15">0%</text>
<line x1="170.0" y1="136" x2="170.0" y2="309" stroke="#d5dce0"/>
<text x="170.0" y="333" text-anchor="middle" fill="#45545f" font-size="15">2%</text>
<line x1="230.0" y1="136" x2="230.0" y2="309" stroke="#d5dce0"/>
<text x="230.0" y="333" text-anchor="middle" fill="#45545f" font-size="15">4%</text>
<line x1="290.0" y1="136" x2="290.0" y2="309" stroke="#d5dce0"/>
<text x="290.0" y="333" text-anchor="middle" fill="#45545f" font-size="15">6%</text>
<line x1="260.0" y1="136" x2="260.0" y2="309" stroke="#8aa2b1" stroke-dasharray="4 4"/>
<text x="16" y="175" fill="#263741" font-size="15">1033</text>
<line x1="216.2" y1="170" x2="279.5" y2="170" stroke="#b8c7d0" stroke-width="3"/>
<circle cx="216.2" cy="170" r="6" fill="#2d5e79"/>
<rect x="274.5" y="163" width="10" height="14" fill="#748d9d"/>
<text x="216.2" y="157" text-anchor="middle" fill="#2d5e79" font-size="15">3.5</text>
<text x="16" y="241" fill="#263741" font-size="15">1729</text>
<line x1="218.8" y1="236" x2="266.0" y2="236" stroke="#b8c7d0" stroke-width="3"/>
<circle cx="218.8" cy="236" r="6" fill="#2d5e79"/>
<rect x="261.0" y="229" width="10" height="14" fill="#748d9d"/>
<text x="218.8" y="223" text-anchor="middle" fill="#2d5e79" font-size="15">3.6</text>
<text x="16" y="307" fill="#263741" font-size="15">3301</text>
<line x1="211.3" y1="302" x2="280.7" y2="302" stroke="#b8c7d0" stroke-width="3"/>
<circle cx="211.3" cy="302" r="6" fill="#2d5e79"/>
<rect x="275.7" y="295" width="10" height="14" fill="#748d9d"/>
<text x="211.3" y="289" text-anchor="middle" fill="#2d5e79" font-size="15">3.4</text>
<line x1="16" y1="348" x2="336" y2="348" stroke="#ccd3d8"/>
<text x="16" y="373" fill="#263741" font-size="15">Excluded: 10,030 lags</text>
<text x="336" y="373" text-anchor="end" fill="#45545f" font-size="15">Open: 2,905</text>
</svg>
