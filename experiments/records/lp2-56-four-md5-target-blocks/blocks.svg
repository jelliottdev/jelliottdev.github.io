<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 407" role="img" aria-labelledby="title desc">
<title id="title">LP2-56 as four MD5-sized blocks</title>
<desc id="desc">Four consecutive 16-byte blocks from the printed 64-byte target. No block matches MD5 of any of 324 distinct preserved candidate inputs.</desc>
<rect width="320" height="407" fill="#fff"/>
<g font-family="sans-serif" fill="#202b32">
<text x="12" y="26" font-size="18" font-weight="bold">Four MD5-sized blocks</text>
<text x="12" y="50" font-size="13">LP2-56 · 64 printed bytes</text>
<text x="12" y="70" font-size="13">324 candidate inputs checked per block</text>
<rect x="12" y="84" width="296" height="64" fill="#f2f4f6" stroke="#c7d0d5"/>
<text x="24" y="107" font-size="14">Bytes 0–15</text>
<text x="295" y="107" text-anchor="end" font-size="14" font-weight="bold" fill="#355c70">0 matches</text>
<text x="24" y="131" font-family="monospace" font-size="13">36367763ab73783c7af284446c59466b</text>
<rect x="12" y="156" width="296" height="64" fill="#f2f4f6" stroke="#c7d0d5"/>
<text x="24" y="179" font-size="14">Bytes 16–31</text>
<text x="295" y="179" text-anchor="end" font-size="14" font-weight="bold" fill="#355c70">0 matches</text>
<text x="24" y="203" font-family="monospace" font-size="13">4cd653239a311cb7116d4618dee09a84</text>
<rect x="12" y="228" width="296" height="64" fill="#f2f4f6" stroke="#c7d0d5"/>
<text x="24" y="251" font-size="14">Bytes 32–47</text>
<text x="295" y="251" text-anchor="end" font-size="14" font-weight="bold" fill="#355c70">0 matches</text>
<text x="24" y="275" font-family="monospace" font-size="13">25893dc7500b464fdaf1672d7bef5e89</text>
<rect x="12" y="300" width="296" height="64" fill="#f2f4f6" stroke="#c7d0d5"/>
<text x="24" y="323" font-size="14">Bytes 48–63</text>
<text x="295" y="323" text-anchor="end" font-size="14" font-weight="bold" fill="#355c70">0 matches</text>
<text x="24" y="347" font-family="monospace" font-size="13">1c6e2274568926a49fb4f45132c2a8b4</text>
<text x="12" y="393" font-size="13" fill="#53616a">Complete blocks, in their printed order.</text>
</g></svg>
