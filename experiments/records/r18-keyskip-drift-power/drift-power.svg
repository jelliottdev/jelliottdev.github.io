<text x="16" y="374" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#26333c">Full length · 12,956 runes</text>
<text x="16" y="395" font-family="Arial,sans-serif" font-size="13" fill="#4e5e69">Beam recovery: 99.97% across 3 plants</text>
</svg>
