<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" role="img" aria-labelledby="title desc">
<title id="title">Correct-key detection as windows grow</title>
<desc id="desc">With a planted correct key, rigid detection drops from 70 percent at 25 runes to 0.5 percent at 400 runes. A skip-aware beam detects all 200 plants at each length. At full manuscript length, three planted keys are recovered at over 99.9 percent of rune positions.</desc>
<rect width="320" height="420" fill="#f7f8fa"/>
<text x="16" y="28" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#202c34">Can a correct key survive drift?</text>
<text x="16" y="51" font-family="Arial,sans-serif" font-size="13" fill="#4e5e69">Planted-key detection · 200 trials per length</text>
<text x="16" y="85" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#26333c">Runes</text>
<text x="85" y="85" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#26333c">Rigid alignment</text>
<text x="264" y="85" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#26333c">Beam</text>
<text x="17" y="119" font-family="Arial,sans-serif" font-size="13" fill="#26333c">25</text>
<rect x="84" y="106" width="167" height="17" fill="#e1e7eb"/>
<rect x="84" y="106" width="116.9" height="17" fill="#47687a"/>
<text x="205.9" y="119" font-family="Arial,sans-serif" font-size="13" fill="#26333c">70%</text>
<text x="266" y="119" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#245770">100%</text>
<line x1="16" y1="133" x2="304" y2="133" stroke="#dce3e7"/>
<text x="17" y="158" font-family="Arial,sans-serif" font-size="13" fill="#26333c">50</text>
<rect x="84" y="145" width="167" height="17" fill="#e1e7eb"/>
<rect x="84" y="145" width="76.8" height="17" fill="#47687a"/>
<text x="165.8" y="158" font-family="Arial,sans-serif" font-size="13" fill="#26333c">46%</text>
<text x="266" y="158" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#245770">100%</text>
<line x1="16" y1="172" x2="304" y2="172" stroke="#dce3e7"/>
<text x="17" y="197" font-family="Arial,sans-serif" font-size="13" fill="#26333c">100</text>
<rect x="84" y="184" width="167" height="17" fill="#e1e7eb"/>
<rect x="84" y="184" width="31.7" height="17" fill="#47687a"/>
<text x="120.7" y="197" font-family="Arial,sans-serif" font-size="13" fill="#26333c">19%</text>
<text x="266" y="197" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#245770">100%</text>
<line x1="16" y1="211" x2="304" y2="211" stroke="#dce3e7"/>
<text x="17" y="236" font-family="Arial,sans-serif" font-size="13" fill="#26333c">120</text>
<rect x="84" y="223" width="167" height="17" fill="#e1e7eb"/>
<rect x="84" y="223" width="25.1" height="17" fill="#47687a"/>
<text x="114.0" y="236" font-family="Arial,sans-serif" font-size="13" fill="#26333c">15%</text>
<text x="266" y="236" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#245770">100%</text>
<line x1="16" y1="250" x2="304" y2="250" stroke="#dce3e7"/>
<text x="17" y="275" font-family="Arial,sans-serif" font-size="13" fill="#26333c">200</text>
<rect x="84" y="262" width="167" height="17" fill="#e1e7eb"/>
<rect x="84" y="262" width="5.8" height="17" fill="#47687a"/>
<text x="94.8" y="275" font-family="Arial,sans-serif" font-size="13" fill="#26333c">3.5%</text>
<text x="266" y="275" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#245770">100%</text>
<line x1="16" y1="289" x2="304" y2="289" stroke="#dce3e7"/>
<text x="17" y="314" font-family="Arial,sans-serif" font-size="13" fill="#26333c">400</text>
<rect x="84" y="301" width="167" height="17" fill="#e1e7eb"/>
<rect x="84" y="301" width="0.8" height="17" fill="#47687a"/>
<text x="89.8" y="314" font-family="Arial,sans-serif" font-size="13" fill="#26333c">0.5%</text>
<text x="266" y="314" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#245770">100%</text>
