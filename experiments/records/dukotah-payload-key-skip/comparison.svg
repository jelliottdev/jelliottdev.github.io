<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" role="img" aria-labelledby="title desc">
  <title id="title">Known reading clears the source score bar; the best manuscript result does not</title>
  <desc id="desc">All sixteen planted 85-rune known readings score minus 4.462 and recover exactly. The best of 880 manuscript settings scores minus 6.756, below the source's minus 5.5 bar.</desc>
  <rect width="340" height="240" fill="#f5f6f7"/>
  <text x="18" y="28" fill="#253442" font-family="Arial,sans-serif" font-size="16" font-weight="700">The same decoder, two inputs</text>
  <text x="18" y="53" fill="#45525c" font-family="Arial,sans-serif" font-size="13">Farther right = more English-like by this score</text>
  <line x1="32" y1="88" x2="318" y2="88" stroke="#8d9ca6" stroke-width="2"/>
  <line x1="211" y1="74" x2="211" y2="96" stroke="#344f63" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="211" y1="128" x2="211" y2="144" stroke="#344f63" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="211" y1="196" x2="211" y2="212" stroke="#344f63" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="165" y="70" fill="#344f63" font-family="Arial,sans-serif" font-size="13">source bar −5.5</text>
  <text x="18" y="122" fill="#253442" font-family="Arial,sans-serif" font-size="14" font-weight="700">Known reading</text>
  <line x1="32" y1="136" x2="318" y2="136" stroke="#d0d8dd" stroke-width="2"/>
  <circle cx="284" cy="136" r="7" fill="#2a6283"/>
  <text x="18" y="158" fill="#385a70" font-family="Arial,sans-serif" font-size="13">−4.462 · exact text in 16/16 plants</text>
  <text x="18" y="190" fill="#253442" font-family="Arial,sans-serif" font-size="14" font-weight="700">Best manuscript case</text>
  <line x1="32" y1="204" x2="318" y2="204" stroke="#d0d8dd" stroke-width="2"/>
  <circle cx="121" cy="204" r="7" fill="#637683"/>
  <text x="139" y="209" fill="#45525c" font-family="Arial,sans-serif" font-size="13">−6.756 · 0/880 clear bar</text>
  <text x="31" y="228" fill="#61717b" font-family="Arial,sans-serif" font-size="13">−8</text>
  <text x="298" y="228" fill="#61717b" font-family="Arial,sans-serif" font-size="13">−4</text>
</svg>
