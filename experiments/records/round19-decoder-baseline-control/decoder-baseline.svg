<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 350" role="img" aria-labelledby="title desc">
<title id="title">Correct-key recovery under two decoding rules</title>
<desc id="desc">At 240 and 400 runes with suppression 0.83, the matching decoder recovers 100 percent; the pair-skip decoder recovers 37.9 and 41.2 percent.</desc>
<rect width="340" height="350" fill="#f5f6f7"/>
<g font-family="Arial, sans-serif" fill="#24323b">
<text x="16" y="28" font-size="17" font-weight="700">The wrong skip rule loses text</text>
<text x="16" y="50" font-size="13">Known key · synthetic ciphertext · 7 seeds each</text>
<text x="16" y="90" font-size="15" font-weight="700">240-rune plants</text>
<text x="16" y="115" font-size="13">Matching decoder</text>
<rect x="16" y="124" width="230" height="13" fill="#dce1e4"/>
<rect x="16" y="124" width="230.0" height="13" fill="#2c607a"/>
<text x="254" y="136" font-size="14" font-weight="700">100.0%</text>
<text x="16" y="160" font-size="13">Pair-skip decoder</text>
<rect x="16" y="169" width="230" height="13" fill="#dce1e4"/>
<rect x="16" y="169" width="87.2" height="13" fill="#8a5962"/>
<text x="254" y="181" font-size="14" font-weight="700">37.9%</text>
<text x="16" y="213" font-size="15" font-weight="700">400-rune plants</text>
<text x="16" y="238" font-size="13">Matching decoder</text>
<rect x="16" y="247" width="230" height="13" fill="#dce1e4"/>
<rect x="16" y="247" width="230.0" height="13" fill="#2c607a"/>
<text x="254" y="259" font-size="14" font-weight="700">100.0%</text>
<text x="16" y="283" font-size="13">Pair-skip decoder</text>
<rect x="16" y="292" width="230" height="13" fill="#dce1e4"/>
<rect x="16" y="292" width="94.9" height="13" fill="#8a5962"/>
<text x="254" y="304" font-size="14" font-weight="700">41.2%</text>
<text x="16" y="332" font-size="13">Recovery is exact rune agreement, not score.</text></g></svg>
