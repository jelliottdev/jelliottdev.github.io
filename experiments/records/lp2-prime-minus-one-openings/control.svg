<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" role="img" aria-labelledby="title desc">
<title id="title">Four prime-minus-one decoding steps</title>
<desc id="desc">Known LP2-56 control: subtract shifts 1, 2, 4 and 6 from indices 25, 11, 22 and 15, giving 24, 9, 18 and 9 modulo 29.</desc>
<rect width="440" height="330" fill="#f7f7f3"/>
<g font-family="sans-serif" fill="#263b46">
<text x="20" y="33" font-size="21">Known LP2-56 opening</text>
<text x="20" y="60" font-size="16">Input − (prime − 1) → output index</text>
<path d="M20 115H420" stroke="#d7dddf"/>
<text x="22" y="102" font-size="20">25 − 1</text>
<text x="180" y="102" font-size="20">→ 24</text>
<text x="347" y="102" font-size="22" font-weight="bold">A</text>
<path d="M20 164H420" stroke="#d7dddf"/>
<text x="22" y="151" font-size="20">11 − 2</text>
<text x="180" y="151" font-size="20">→ 9</text>
<text x="347" y="151" font-size="22" font-weight="bold">N</text>
<path d="M20 213H420" stroke="#d7dddf"/>
<text x="22" y="200" font-size="20">22 − 4</text>
<text x="180" y="200" font-size="20">→ 18</text>
<text x="347" y="200" font-size="22" font-weight="bold">E</text>
<path d="M20 262H420" stroke="#d7dddf"/>
<text x="22" y="249" font-size="20">15 − 6</text>
<text x="180" y="249" font-size="20">→ 9</text>
<text x="347" y="249" font-size="22" font-weight="bold">N</text>
<text x="20" y="295" font-size="16">Arithmetic is modulo 29.</text>
<text x="20" y="318" font-size="15">This illustrates a control, not a new solution.</text>
</g></svg>
