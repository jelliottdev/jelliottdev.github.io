<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 238" role="img" aria-labelledby="title desc" style="font-family:Arial,sans-serif"><title id="title">Best English scores by byte-key reading</title><desc id="desc">The best of three source searches ranges from minus 6.745 to minus 6.597. All are below the source flag threshold, minus 5.2.</desc><rect width="320" height="238" fill="#f4f6f7"/><text x="16" y="28" font-size="17" font-weight="700" fill="#1f2932">Grid bytes as keys</text><text x="16" y="49" font-size="13" fill="#37444d">Best English score · higher is better</text><line x1="300" y1="60" x2="300" y2="184" stroke="#9c3e40" stroke-width="2"/><text x="16" y="84" font-size="14">Grid bytes</text><rect x="134" y="69" width="56.1" height="18" fill="#285c73"/><text x="195.1" y="84" font-size="14">-6.720</text><text x="16" y="133" font-size="14">Other bases</text><rect x="134" y="118" width="54.4" height="18" fill="#285c73"/><text x="193.4" y="133" font-size="14">-6.745</text><text x="16" y="182" font-size="14">Onion XOR</text><rect x="134" y="167" width="65.0" height="18" fill="#285c73"/><text x="204.0" y="182" font-size="14">-6.597</text><text x="16" y="210" font-size="13" fill="#37444d">No score reached the −5.2 flag line.</text><text x="16" y="229" font-size="12" fill="#52616a">14,784 source-defined cases · 0 flags</text></svg>
