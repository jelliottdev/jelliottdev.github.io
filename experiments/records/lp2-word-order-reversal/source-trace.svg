<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-labelledby="title desc"><title id="title">Reversed segment order: LP2-31 source positions</title><desc id="desc">First six output positions for each boundary convention. Both start with source runes 266, 267, 268, 258, 259, 260, counted from zero.</desc><rect width="360" height="420" fill="#faf9f5"/><g fill="#243c48" font-family="sans-serif"><text x="18" y="30" font-size="18">LP2-31: read the last segment first</text><text x="18" y="57" font-size="14">Source rune ordinal at each output position</text><text x="18" y="94" font-size="14">Output</text><text x="115" y="94" font-size="14">Split lines</text><text x="232" y="94" font-size="14">Join lines</text><path d="M18 137 H342" stroke="#dce0df"/><text x="18" y="127" font-size="17">0</text><text x="115" y="127" font-size="17">266</text><text x="232" y="127" font-size="17">266</text><path d="M18 169 H342" stroke="#dce0df"/><text x="18" y="159" font-size="17">1</text><text x="115" y="159" font-size="17">267</text><text x="232" y="159" font-size="17">267</text><path d="M18 201 H342" stroke="#dce0df"/><text x="18" y="191" font-size="17">2</text><text x="115" y="191" font-size="17">268</text><text x="232" y="191" font-size="17">268</text><path d="M18 233 H342" stroke="#dce0df"/><text x="18" y="223" font-size="17">3</text><text x="115" y="223" font-size="17">258</text><text x="232" y="223" font-size="17">258</text><path d="M18 265 H342" stroke="#dce0df"/><text x="18" y="255" font-size="17">4</text><text x="115" y="255" font-size="17">259</text><text x="232" y="255" font-size="17">259</text><path d="M18 297 H342" stroke="#dce0df"/><text x="18" y="287" font-size="17">5</text><text x="115" y="287" font-size="17">260</text><text x="232" y="287" font-size="17">260</text><text x="18" y="330" font-size="14">266 → 267 → 268: keep the segment forward.</text><text x="18" y="356" font-size="14">Then jump back to the preceding segment.</text><text x="18" y="382" font-size="14">Positions count from zero; not plaintext.</text><text x="18" y="405" font-size="14">The full outputs differ later in the page.</text></g></svg>
