<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 310" role="img" aria-labelledby="title desc">
  <title id="title">Best scores for three named numeric-key groups</title>
  <desc id="desc">Best scores are minus 6.895 for Mayan rotations, minus 6.679 for hash-derived streams, and minus 6.725 for cuneiform values. All are below the source's minus 5.2 English-score bar.</desc>
  <rect width="340" height="310" fill="#f5f6f7"/>
  <text x="18" y="27" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#243845">Three fixed key groups</text>
  <text x="18" y="52" font-family="Arial,sans-serif" font-size="13" fill="#53626c">Best score in each source search</text>
  <line x1="233" y1="67" x2="233" y2="250" stroke="#315a71" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="233" y="66" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#315a71">source bar −5.2</text>
  <text x="18" y="94" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#263944">Mayan rotations</text>
  <line x1="44" y1="111" x2="314" y2="111" stroke="#d0d9de" stroke-width="2"/>
  <circle cx="119" cy="111" r="7" fill="#53758b"/>
  <text x="44" y="132" font-family="Arial,sans-serif" font-size="13" fill="#3c505e">−6.895 · 0/896</text>
  <text x="18" y="157" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#263944">Hash-derived streams</text>
  <line x1="44" y1="174" x2="314" y2="174" stroke="#d0d9de" stroke-width="2"/>
  <circle cx="133" cy="174" r="7" fill="#53758b"/>
  <text x="44" y="195" font-family="Arial,sans-serif" font-size="13" fill="#3c505e">−6.679 · 0/2,240</text>
  <text x="18" y="220" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#263944">Cuneiform and digits</text>
  <line x1="44" y1="237" x2="314" y2="237" stroke="#d0d9de" stroke-width="2"/>
  <circle cx="130" cy="237" r="7" fill="#53758b"/>
  <text x="44" y="258" font-family="Arial,sans-serif" font-size="13" fill="#3c505e">−6.725 · 0/2,240</text>
  <text x="44" y="292" font-family="Arial,sans-serif" font-size="13" fill="#586872">−8</text>
  <text x="314" y="292" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#586872">−4</text>
</svg>
