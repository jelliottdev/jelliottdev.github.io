<svg xmlns="http://www.w3.org/2000/svg" width="360" height="298" viewBox="0 0 360 298" role="img" aria-labelledby="title desc" style="font-family:Arial,sans-serif;background:#f7f8f9">
<title id="title">Strongest varint gap match by byte version</title>
<desc id="desc">Each of three byte versions has a strongest absolute rank correlation near 0.12, well below the source gate of 0.5. Each bar summarizes eight source comparisons.</desc>
<rect width="360" height="298" fill="#f7f8f9"/>
<text x="18" y="28" font-size="19" font-weight="700" fill="#202b35">Payload as gap values</text>
<text x="18" y="51" font-size="15" fill="#4d5d68">Strongest of 8 comparisons per version</text>
<text x="18" y="80" font-size="16" fill="#26343f">Canonical bytes</text>
<rect x="18" y="89" width="264" height="13" rx="2" fill="#dce3e8"/>
<rect x="18" y="89" width="62.7" height="13" rx="2" fill="#346b86"/>
<text x="340" y="100" font-size="15" fill="#26343f" text-anchor="end">0.119</text>
<text x="18" y="140" font-size="16" fill="#26343f">Decimal-preferred</text>
<rect x="18" y="149" width="264" height="13" rx="2" fill="#dce3e8"/>
<rect x="18" y="149" width="62.7" height="13" rx="2" fill="#346b86"/>
<text x="340" y="160" font-size="15" fill="#26343f" text-anchor="end">0.119</text>
<text x="18" y="200" font-size="16" fill="#26343f">Resolved variant</text>
<rect x="18" y="209" width="264" height="13" rx="2" fill="#dce3e8"/>
<rect x="18" y="209" width="61.7" height="13" rx="2" fill="#346b86"/>
<text x="340" y="220" font-size="15" fill="#26343f" text-anchor="end">0.117</text>
<line x1="282" y1="67" x2="282" y2="218" stroke="#7a3030" stroke-width="2" stroke-dasharray="4 3"/>
<text x="18" y="249" font-size="15" fill="#7a3030">Red line: source gate 0.5</text>
<text x="18" y="272" font-size="15" fill="#4d5d68">No comparison reached it.</text>
</svg>
