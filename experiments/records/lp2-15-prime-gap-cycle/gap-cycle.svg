<line x1="16" y1="220" x2="304" y2="220" stroke="#c4cbd0"/>
<text x="16" y="239" font-family="Arial,sans-serif" font-size="13" fill="#4f5961">First new gap: 5660 mod 28 = 4, not 8.</text>
