<svg xmlns="http://www.w3.org/2000/svg" width="320" height="246" viewBox="0 0 320 246" role="img" aria-labelledby="title desc">
<title id="title">The proposed modulo-28 gap cycle fails at its first prediction</title>
<desc id="desc">The shown tail is 8, 20, 10, 6. Repeating it predicts the next four residues will be 8, 20, 10, 6. The next four generated residues are 4, 2, 20, 2.</desc>
<rect width="320" height="246" fill="#f5f6f7"/>
<text x="16" y="30" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#20252a">The next gap breaks the pattern</text>
<text x="16" y="51" font-family="Arial,sans-serif" font-size="13" fill="#4f5961">Prime gaps reduced modulo 28</text>
<text x="16" y="85" font-family="Arial,sans-serif" font-size="14" fill="#30383e">Shown tail</text>
<rect x="128" y="65" width="39" height="33" rx="4" fill="#fff" stroke="#2b5870" stroke-width="1.5"/>
<text x="147.5" y="87" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#2b5870">8</text>
<rect x="172" y="65" width="39" height="33" rx="4" fill="#fff" stroke="#2b5870" stroke-width="1.5"/>
<text x="191.5" y="87" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#2b5870">20</text>
<rect x="216" y="65" width="39" height="33" rx="4" fill="#fff" stroke="#2b5870" stroke-width="1.5"/>
<text x="235.5" y="87" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#2b5870">10</text>
<rect x="260" y="65" width="39" height="33" rx="4" fill="#fff" stroke="#2b5870" stroke-width="1.5"/>
<text x="279.5" y="87" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#2b5870">6</text>
<text x="16" y="139" font-family="Arial,sans-serif" font-size="14" fill="#30383e">Predicted next</text>
<rect x="128" y="119" width="39" height="33" rx="4" fill="#fff" stroke="#2b5870" stroke-width="1.5"/>
<text x="147.5" y="141" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#2b5870">8</text>
<rect x="172" y="119" width="39" height="33" rx="4" fill="#fff" stroke="#2b5870" stroke-width="1.5"/>
<text x="191.5" y="141" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#2b5870">20</text>
<rect x="216" y="119" width="39" height="33" rx="4" fill="#fff" stroke="#2b5870" stroke-width="1.5"/>
<text x="235.5" y="141" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#2b5870">10</text>
<rect x="260" y="119" width="39" height="33" rx="4" fill="#fff" stroke="#2b5870" stroke-width="1.5"/>
<text x="279.5" y="141" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#2b5870">6</text>
<text x="16" y="193" font-family="Arial,sans-serif" font-size="14" fill="#30383e">Actual next</text>
<rect x="128" y="173" width="39" height="33" rx="4" fill="#fff" stroke="#a44839" stroke-width="1.5"/>
<text x="147.5" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#a44839">4</text>
<rect x="172" y="173" width="39" height="33" rx="4" fill="#fff" stroke="#a44839" stroke-width="1.5"/>
<text x="191.5" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#a44839">2</text>
<rect x="216" y="173" width="39" height="33" rx="4" fill="#fff" stroke="#a44839" stroke-width="1.5"/>
<text x="235.5" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#a44839">20</text>
<rect x="260" y="173" width="39" height="33" rx="4" fill="#fff" stroke="#a44839" stroke-width="1.5"/>
