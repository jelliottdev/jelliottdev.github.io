<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 820 392">
<title id="title">LP2 as a running key: best scores by target</title>
<desc id="desc">All five best scores are below the advancement bar. The 2012 to 2013 texts rank highest at minus 7.032, while the bar is minus 5.5.</desc>
<rect width="820" height="392" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#25333e}.small{font-size:13px}.label{font-size:15px}.value{font-size:14px;font-weight:700}</style>
<text x="24" y="35" font-size="20" font-weight="700">Best score for each target</text>
<text x="24" y="60" class="small">Higher is stronger · five targets × eight key/sign combinations</text>
<line x1="688.6" y1="85" x2="688.6" y2="330" stroke="#71828d" stroke-width="2" stroke-dasharray="5 4"/>
<text x="681.6" y="78" text-anchor="end" class="small">advancement bar −5.5</text>
<text x="24" y="117" class="label">2012–13 puzzle texts</text>
<line x1="260" y1="110" x2="688.6" y2="110" stroke="#e1e7ea" stroke-width="12"/>
<line x1="260" y1="110" x2="469.7" y2="110" stroke="#315f78" stroke-width="12"/>
<circle cx="469.7" cy="110" r="6" fill="#315f78"/>
<text x="483.7" y="115" class="value">-7.032</text>
<text x="24" y="165" class="label">Solved LP1 text</text>
<line x1="260" y1="158" x2="688.6" y2="158" stroke="#e1e7ea" stroke-width="12"/>
<line x1="260" y1="158" x2="459.3" y2="158" stroke="#315f78" stroke-width="12"/>
<circle cx="459.3" cy="158" r="6" fill="#315f78"/>
<text x="473.3" y="163" class="value">-7.105</text>
<text x="24" y="213" class="label">PGP message text</text>
<line x1="260" y1="206" x2="688.6" y2="206" stroke="#e1e7ea" stroke-width="12"/>
<line x1="260" y1="206" x2="454.6" y2="206" stroke="#315f78" stroke-width="12"/>
<circle cx="454.6" cy="206" r="6" fill="#315f78"/>
<text x="468.6" y="211" class="value">-7.138</text>
<text x="24" y="261" class="label">AN END byte sequence</text>
<line x1="260" y1="254" x2="688.6" y2="254" stroke="#e1e7ea" stroke-width="12"/>
<line x1="260" y1="254" x2="457.7" y2="254" stroke="#315f78" stroke-width="12"/>
<circle cx="457.7" cy="254" r="6" fill="#315f78"/>
<text x="471.7" y="259" class="value">-7.116</text>
<text x="24" y="309" class="label">LP2 opening</text>
<line x1="260" y1="302" x2="688.6" y2="302" stroke="#e1e7ea" stroke-width="12"/>
<line x1="260" y1="302" x2="455.5" y2="302" stroke="#315f78" stroke-width="12"/>
<circle cx="455.5" cy="302" r="6" fill="#315f78"/>
<text x="469.5" y="307" class="value">-7.132</text>
<text x="24" y="369" class="small">Comparison scores use the source’s English quadgram model; they do not prove a general impossibility.</text>
</svg>
