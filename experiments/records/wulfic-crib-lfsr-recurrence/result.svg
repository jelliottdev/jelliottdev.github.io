<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" role="img" aria-labelledby="t d" font-family="Arial, sans-serif">
<title id="t">Crib-key corrections and manuscript score</title>
<desc id="d">Four planted-message tests isolate missing J runes and wrong key phase. The best manuscript score is compared with shuffled-page searches. A post-result known-reading plant leads all 11 mixed-grid pages in 12 of 12 cases.</desc>
<rect width="320" height="420" fill="#f8fafb"/>
<text x="16" y="27" font-size="16" font-weight="700" fill="#172e3d">Two fixes on a known message</text>
<text x="96" y="54" font-size="13" fill="#435865">Key starts at 0</text>
<text x="214" y="54" font-size="13" fill="#435865">At the crib</text>
<text x="15" y="89" font-size="13" fill="#293e4c">Drops J</text>
<rect x="96" y="66" width="96" height="42" rx="5" fill="#d6e1e6"/>
<text x="144" y="93" text-anchor="middle" font-size="18" font-weight="700" fill="#173647">6/128</text>
<rect x="214" y="66" width="96" height="42" rx="5" fill="#d6e1e6"/>
<text x="262" y="93" text-anchor="middle" font-size="18" font-weight="700" fill="#173647">0/128</text>
<text x="15" y="141" font-size="13" fill="#293e4c">Keeps J</text>
<rect x="96" y="118" width="96" height="42" rx="5" fill="#d6e1e6"/>
<text x="144" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#173647">4/128</text>
<rect x="214" y="118" width="96" height="42" rx="5" fill="#c4e5d7"/>
<text x="262" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#173647">128/128</text>
<text x="16" y="179" font-size="13" fill="#435865">Runes recovered after the planted crib</text>
<path d="M16 195H304" stroke="#c7d0d5"/>
<text x="16" y="221" font-size="16" font-weight="700" fill="#172e3d">On 11 LP2 pages</text>
<text x="16" y="251" font-size="13" fill="#2c424f">Best found</text>
<rect x="157" y="238" width="47" height="17" fill="#255d78"/>
<text x="272" y="252" font-size="13" fill="#172e3d">18</text>
<text x="16" y="288" font-size="13" fill="#2c424f">Shuffle middle</text>
<rect x="157" y="275" width="50" height="17" fill="#8298a3"/>
<text x="272" y="289" font-size="13" fill="#172e3d">19</text>
<text x="16" y="325" font-size="13" fill="#2c424f">Shuffle highest</text>
<rect x="157" y="312" width="105" height="17" fill="#607f8e"/>
<text x="272" y="326" font-size="13" fill="#172e3d">40</text>
<path d="M16 345H304" stroke="#c7d0d5"/>
<text x="16" y="369" font-size="15" font-weight="700" fill="#172e3d">Known-reading plant</text>
<text x="16" y="392" font-size="14" fill="#172e3d">Score 119; 12/12 lead mixed grid</text>
<text x="16" y="410" font-size="13" fill="#435865">Post-result; different page length</text>
</svg>
