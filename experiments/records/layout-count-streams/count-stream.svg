<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 310" role="img" aria-labelledby="title desc">
  <title id="title">Word counts mapped to GP symbols and compared with shuffled controls</title>
  <desc id="desc">The first six LP2-00 word-slot lengths are 8, 9, 3, 3, 11 and 5. Subtracting one gives GP indices 7, 8, 2, 2, 10 and 4, transliterated W, H, TH, TH, I and R. The best whole-book result scores minus 6.697, within the full-search shuffle range of minus 6.805 to minus 6.627. Seventy-eight of 256 matched searches did as well or better.</desc>
  <rect width="340" height="310" fill="#fff"/>
  <text x="16" y="27" font-size="17" font-family="system-ui,sans-serif" font-weight="650" fill="#202c35">Counts as GP symbols</text>
  <text x="16" y="48" font-size="14" font-family="system-ui,sans-serif" fill="#52616b">First six word slots on LP2-00</text>
  <g font-family="system-ui,sans-serif" font-size="14" fill="#202c35">
    <text x="16" y="79">Length</text><text x="130" y="79">8</text><text x="165" y="79">9</text><text x="200" y="79">3</text><text x="235" y="79">3</text><text x="267" y="79">11</text><text x="305" y="79">5</text>
    <text x="16" y="106">Index −1</text><text x="130" y="106">7</text><text x="165" y="106">8</text><text x="200" y="106">2</text><text x="235" y="106">2</text><text x="267" y="106">10</text><text x="305" y="106">4</text>
    <text x="16" y="133">GP Latin</text><text x="130" y="133">W</text><text x="165" y="133">H</text><text x="197" y="133">TH</text><text x="232" y="133">TH</text><text x="270" y="133">I</text><text x="305" y="133">R</text>
  </g>
  <line x1="16" y1="148" x2="324" y2="148" stroke="#d7dee2"/>
  <text x="16" y="178" font-size="16" font-family="system-ui,sans-serif" font-weight="600" fill="#202c35">Best of eight complete streams</text>
  <text x="16" y="201" font-size="14" font-family="system-ui,sans-serif" fill="#52616b">Higher English score is farther right</text>
  <line x1="68" y1="230" x2="316" y2="230" stroke="#d7dee2" stroke-width="2"/>
  <line x1="87" y1="230" x2="307" y2="230" stroke="#788b95" stroke-width="5" stroke-linecap="round"/>
  <circle cx="202" cy="230" r="5" fill="#405b69"/>
  <circle cx="220" cy="230" r="6" fill="#245c78"/>
  <text x="16" y="258" font-size="14" font-family="system-ui,sans-serif" fill="#52616b">Gray: shuffled range, dot: median</text>
  <text x="16" y="280" font-size="14" font-family="system-ui,sans-serif" fill="#245c78">Blue: observed −6.697</text>
  <text x="16" y="302" font-size="14" font-family="system-ui,sans-serif" font-weight="600" fill="#202c35">78 / 256 controls met or beat it.</text>
</svg>
