<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 430" role="img" aria-labelledby="title desc">
<title id="title">Digit grids and the selected Roman symbol step</title>
<desc id="desc">The selected LP2-15 body has 150 runes and 289 GP digits for a 17-by-17 grid; LP2-16 to 22 have 1,744 runes and 3,481 digits for a 59-by-59 grid. The selected Roman symbols reorder to four L, two X and one V, totaling 225. Two of 80 nearby trials meet the chosen sum and order, using the same seven numbers.</desc>
<rect width="360" height="430" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#202d35">
<text x="18" y="29" font-size="19" font-weight="700">Digit grids</text>
<text x="18" y="57" font-size="14" font-weight="700">LP2-15 body</text>
<text x="18" y="81" font-size="17">150 runes → 289 digits</text>
<text x="18" y="105" font-size="15" fill="#52616b">17 × 17 grid · header excluded</text>
<line x1="18" y1="123" x2="342" y2="123" stroke="#cbd3d7"/>
<text x="18" y="149" font-size="14" font-weight="700">LP2-16–22</text>
<text x="18" y="173" font-size="17">1,744 runes → 3,481 digits</text>
<text x="18" y="197" font-size="15" fill="#52616b">59 × 59 grid · all runes</text>
<line x1="18" y1="219" x2="342" y2="219" stroke="#cbd3d7"/>
<text x="18" y="247" font-size="19" font-weight="700">Selected Roman step</text>
<text x="18" y="278" font-size="15" fill="#52616b">Initial symbols</text>
<text x="18" y="301" font-size="20" font-family="Consolas, monospace">L X L L L X V</text>
<text x="18" y="326" font-size="15" fill="#52616b">Reordered</text>
<text x="18" y="350" font-size="20" font-family="Consolas, monospace">L L L L X X V</text>
<text x="18" y="377" font-size="15">50 + 50 + 50 + 50 + 10 + 10 + 5 = 225</text>
<text x="18" y="401" font-size="14" fill="#52616b">2/80 nearby trials meet both tests.</text>
<text x="18" y="419" font-size="14" fill="#52616b">Both reuse the same seven numbers.</text>
</g>
</svg>
