<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-labelledby="title desc"><title id="title">The stored heading and proposed phrase have different GP sums</title><desc id="desc">Archived heading 786; TEST THE KNOWLEDGE 691 using one TH rune, or 768 when TH is split. These are arithmetic sums, not decoded meanings.</desc><rect width="320" height="300" fill="white"/><g font-family="system-ui,sans-serif" fill="#20272b"><text x="12" y="25" font-size="17" font-weight="600">What actually sums to 691?</text><text x="12" y="59" font-size="15">Archived red heading</text><rect x="12" y="69" width="276.00" height="19" fill="#52616b"/><text x="304" y="59" text-anchor="end" font-size="16" font-weight="600">786</text><text x="12" y="105" font-size="14" fill="#58636b">16 runes</text><text x="12" y="126" font-size="15">TEST THE KNOWLEDGE</text><rect x="12" y="136" width="242.64" height="19" fill="#286078"/><text x="304" y="126" text-anchor="end" font-size="16" font-weight="600">691</text><text x="12" y="172" font-size="14" fill="#58636b">15 runes</text><text x="12" y="193" font-size="15">Same words; T + H separate</text><rect x="12" y="203" width="269.68" height="19" fill="#80909b"/><text x="304" y="193" text-anchor="end" font-size="16" font-weight="600">768</text><text x="12" y="239" font-size="14" fill="#58636b">16 runes</text><text x="12" y="270" font-size="14">691 matches the phrase.</text><text x="12" y="289" font-size="14">It does not match this stored heading.</text></g></svg>
