<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 232" role="img" aria-labelledby="title desc">
  <title id="title">What a direct Hill key must preserve</title>
  <desc id="desc">One matrix maps every ciphertext block to a plaintext block. If a later ciphertext block is a linear combination of two earlier blocks, the plaintext block must have the same combination. The test checks every block, then checks that the map can be invertible.</desc>
  <rect width="640" height="232" fill="#f3f5f6"/>
  <rect x="14" y="15" width="612" height="202" rx="4" fill="#fff" stroke="#cbd4d9"/>
  <text x="31" y="45" fill="#243941" font-family="system-ui,sans-serif" font-size="17" font-weight="700">One key for every block</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle" font-size="16">
    <rect x="32" y="72" width="120" height="55" rx="3" fill="#deebf0" stroke="#85a9b8"/>
    <text x="92" y="104" fill="#173f54">cipher C₁, C₂</text>
    <text x="195" y="106" fill="#607680" font-size="23">→</text>
    <rect x="233" y="72" width="126" height="55" rx="3" fill="#e5eaed" stroke="#9aa9b0"/>
    <text x="296" y="104" fill="#243941">same matrix D</text>
    <text x="404" y="106" fill="#607680" font-size="23">→</text>
    <rect x="445" y="72" width="162" height="55" rx="3" fill="#deebf0" stroke="#85a9b8"/>
    <text x="526" y="104" fill="#173f54">target P₁, P₂</text>
  </g>
  <line x1="33" y1="146" x2="607" y2="146" stroke="#d5dcdf"/>
  <text x="33" y="176" fill="#243941" font-family="system-ui,sans-serif" font-size="15">If C₃ = aC₁ + bC₂, then P₃ must equal aP₁ + bP₂.</text>
  <text x="33" y="201" fill="#607680" font-family="system-ui,sans-serif" font-size="13">The mapped basis must stay independent for D to be invertible.</text>
</svg>
