<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" role="img" aria-label="The Instar Emergence has a persistent 15.65 kilohertz line 39.7 decibels above nearby frequencies; Interconnectedness has an 8.9 decibel peak in the same broad band."><rect width="520" height="250" fill="#f5f7f8"/><g fill="#21313b" font-family="Arial, sans-serif"><text x="20" y="34" font-size="19" font-weight="700">High-frequency line</text><text x="20" y="57" font-size="13">Peak above nearby frequencies, 14–17 kHz</text><text x="20" y="98" font-size="15">The Instar Emergence · 15,645.89 Hz</text><rect x="20" y="110" width="318" height="22" fill="#275a72"/><text x="347" y="127" font-size="14" font-weight="700">+39.7 dB</text><text x="20" y="174" font-size="15">Interconnectedness · 14,497.23 Hz</text><rect x="20" y="186" width="71" height="22" fill="#687985"/><text x="100" y="203" font-size="14" font-weight="700">+8.9 dB</text><text x="20" y="235" font-size="12">Same measurement on pinned 2013 and 2014 tracks; not a watermark test.</text></g></svg>
