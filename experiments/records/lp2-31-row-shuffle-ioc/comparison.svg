<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 430" role="img" aria-labelledby="title desc"><title id="title">Same score, two shuffle rules</title><desc id="desc">The observed period-13 score remains 216 divided by 5300. Whole-page shuffling has 213 of 999 maxima at least as large, corrected p 0.214. Within-row shuffling has 245 of 999, corrected p 0.246. Neither is below 0.05.</desc><rect width="360" height="430" fill="#faf9f5"/><g font-family="sans-serif" fill="#243c48"><text x="20" y="32" font-size="20">Same score, two shuffle rules</text><text x="20" y="60" font-size="14">Observed peak: period 13, IoC 0.04075</text><text x="20" y="82" font-size="13">Periods 2–20 · maximum compared with maximum</text><text x="20" y="122" font-size="17">Whole page</text><rect x="20" y="136" width="300" height="22" fill="#e3e6e5"/><rect x="20" y="136" width="63.964" height="22" fill="#416879"/><text x="20" y="178" font-size="14">213 of 999 shuffled maxima ≥ observed</text><text x="20" y="199" font-size="14">Corrected Monte Carlo p = 0.214</text><text x="20" y="230" font-size="17">Within each archived row</text><rect x="20" y="244" width="300" height="22" fill="#e3e6e5"/><rect x="20" y="244" width="73.574" height="22" fill="#6c604b"/><text x="20" y="286" font-size="14">245 of 999 shuffled maxima ≥ observed</text><text x="20" y="307" font-size="14">Corrected Monte Carlo p = 0.246</text><path d="M20 333 H340" stroke="#bec8ca"/><text x="20" y="357" font-size="13">Each full bar represents all 999 shuffles.</text><text x="20" y="380" font-size="13">Neither result meets the 0.05 threshold.</text><text x="20" y="403" font-size="13">This does not rule out periodic structure.</text></g></svg>
