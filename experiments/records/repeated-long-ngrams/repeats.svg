<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 234" role="img" aria-labelledby="title desc">
<title id="title">Repeated long rune sequences under section-matched controls</title>
<desc id="desc">Of 999 controls, 300 matched the five-rune count, 150 matched the six-rune count, and 361 matched either.</desc>
<rect width="360" height="234" fill="#f3f5f6"/>
<text x="18" y="27" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#172a34">How often controls match the count</text>
<text x="18" y="45" font-family="system-ui,sans-serif" font-size="11" fill="#4e626e">999 section-matched step shuffles · LP2-00–55</text>
<text x="18" y="69" font-family="system-ui,sans-serif" font-size="12" fill="#172a34">Five-rune repeats</text>
<rect x="18" y="77" width="267" height="15" fill="#dce3e7"/>
<rect x="18" y="77" width="80.18" height="15" fill="#58758b"/>
<text x="294" y="90" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#172a34">300</text>
<text x="18" y="121" font-family="system-ui,sans-serif" font-size="12" fill="#172a34">Six-rune repeats</text>
<rect x="18" y="129" width="267" height="15" fill="#dce3e7"/>
<rect x="18" y="129" width="40.09" height="15" fill="#58758b"/>
<text x="294" y="142" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#172a34">150</text>
<text x="18" y="173" font-family="system-ui,sans-serif" font-size="12" fill="#172a34">Either length</text>
<rect x="18" y="181" width="267" height="15" fill="#dce3e7"/>
<rect x="18" y="181" width="96.48" height="15" fill="#315d77"/>
<text x="294" y="194" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#172a34">361</text>
<text x="18" y="223" font-family="system-ui,sans-serif" font-size="11" fill="#4e626e">A larger bar means a less exceptional finding.</text></svg>
