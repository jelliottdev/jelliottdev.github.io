<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
  <title id="title">JPEG byte modes in the archived Liber Primus pages</title>
  <desc id="desc">Among 58 LP2 files, 54 have byte 00 as their mode and four have byte 44. Both one-component and three-component JPEGs occur in each group. LP1 has 15 files with mode 00 and two with mode 28.</desc>
  <rect width="360" height="420" fill="#f6f7f8"/>
  <g fill="#202832" font-family="Arial, sans-serif">
    <text x="18" y="34" font-size="20" font-weight="700">What the JPEG bytes show</text>
    <text x="18" y="58" font-size="13" fill="#53606d">Most frequent stored byte, not image colour</text>
    <text x="18" y="98" font-size="16" font-weight="700">LP2 · 58 files</text>
    <text x="18" y="130" font-size="13" fill="#53606d">JPEG components</text>
    <text x="159" y="130" font-size="13" fill="#53606d">1</text>
    <text x="253" y="130" font-size="13" fill="#53606d">3</text>
  </g>
  <rect x="18" y="144" width="324" height="75" fill="#e6eaed"/>
  <rect x="18" y="225" width="324" height="75" fill="#dce9ef"/>
  <path d="M136 144V300M230 144V300" stroke="#fff" stroke-width="3"/>
  <g fill="#202832" font-family="Arial, sans-serif">
    <text x="34" y="174" font-size="18" font-weight="700">00</text>
    <text x="34" y="196" font-size="12">is mode</text>
    <text x="153" y="189" font-size="29" font-weight="700">22</text>
    <text x="250" y="189" font-size="29" font-weight="700">32</text>
    <text x="34" y="255" font-size="18" font-weight="700">44</text>
    <text x="34" y="277" font-size="12">is mode</text>
    <text x="153" y="270" font-size="29" font-weight="700">1</text>
    <text x="250" y="270" font-size="29" font-weight="700">3</text>
    <text x="18" y="330" font-size="13">44-mode pages: <tspan font-weight="700">00, 04, 24, 26</tspan></text>
    <text x="18" y="366" font-size="16" font-weight="700">LP1 · 17 files</text>
    <text x="18" y="393" font-size="13">15 have mode 00; pages 00 and 02 have mode 28.</text>
  </g>
</svg>
