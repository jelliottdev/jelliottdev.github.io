<svg xmlns="http://www.w3.org/2000/svg" width="360" height="287" viewBox="0 0 360 287" role="img" aria-labelledby="title desc" style="font-family:Arial,sans-serif;background:#f7f8f9">
<title id="title">Actual source search recovers seven of seven ciphertext-history plants but none of the fourteen plaintext or mixed-history plants</title>
<desc id="desc">The source plants use seed 7,11,2. Ciphertext history ignores the seed after its first three runes. Plaintext and mixed history search only equal-symbol seeds and recover zero planted examples.</desc>
<rect width="360" height="287" fill="#f7f8f9"/>
<text x="18" y="29" font-size="19" font-weight="700" fill="#202b35">Can the search recover its plants?</text>
<text x="18" y="52" font-size="15" fill="#4d5d68">Each row: seven planted feedback rules</text>
<text x="18" y="85" font-size="16" fill="#26343f">Visible-rune history</text>
<rect x="18" y="95" width="255" height="14" rx="2" fill="#dbe4e9"/>
<rect x="18" y="95" width="255.0" height="14" rx="2" fill="#346b86"/>
<text x="340" y="108" font-size="16" font-weight="700" fill="#26343f" text-anchor="end">7 / 7</text>
<text x="18" y="142" font-size="16" fill="#26343f">Decoded-rune history</text>
<rect x="18" y="152" width="255" height="14" rx="2" fill="#dbe4e9"/>
<rect x="18" y="152" width="0.0" height="14" rx="2" fill="#346b86"/>
<text x="340" y="165" font-size="16" font-weight="700" fill="#26343f" text-anchor="end">0 / 7</text>
<text x="18" y="199" font-size="16" fill="#26343f">Mixed history</text>
<rect x="18" y="209" width="255" height="14" rx="2" fill="#dbe4e9"/>
<rect x="18" y="209" width="0.0" height="14" rx="2" fill="#346b86"/>
<text x="340" y="222" font-size="16" font-weight="700" fill="#26343f" text-anchor="end">0 / 7</text>
<text x="18" y="251" font-size="15" fill="#4d5d68">True seed: 7, 11, 2</text>
<text x="18" y="272" font-size="15" fill="#4d5d68">Plain/mixed: only constant seed triples</text>
</svg>
