<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 365" role="img" aria-labelledby="title desc">
<title id="title">How far source-defined keys match a fixed opening</title>
<desc id="desc">Of 1,385,600 source configurations, 25,641 match at least three opening runes, 988 at least four, 38 at least five, one at least six, and none all twelve.</desc>
<rect width="690" height="365" fill="#f3f5f6"/>
<style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#213444}.head{font-size:19px;font-weight:650}.sub{font-size:13px;fill:#52636d}.tick{font-size:14px}.num{font-size:14px;font-weight:650}</style>
<text class="head" x="26" y="37">Fixed-opening matches</text>
<text class="sub" x="26" y="60">Nine 12-rune cribs · 55 page starts · 1,385,600 source configurations</text>
<text class="tick" x="27" y="103">At least 1 rune</text>
<rect x="181" y="83" width="448" height="25" fill="#e2e8eb"/>
<rect x="181" y="83" width="446.0" height="25" fill="#31627b"/>
<text class="num" x="660" y="102" text-anchor="end">1,385,600</text>
<text class="tick" x="27" y="141">At least 2 runes</text>
<rect x="181" y="121" width="448" height="25" fill="#e2e8eb"/>
<rect x="181" y="121" width="417.0" height="25" fill="#31627b"/>
<text class="num" x="660" y="140" text-anchor="end">495,280</text>
<text class="tick" x="27" y="179">At least 3 runes</text>
<rect x="181" y="159" width="448" height="25" fill="#e2e8eb"/>
<rect x="181" y="159" width="333.7" height="25" fill="#31627b"/>
<text class="num" x="660" y="178" text-anchor="end">25,641</text>
<text class="tick" x="27" y="217">At least 4 runes</text>
<rect x="181" y="197" width="448" height="25" fill="#e2e8eb"/>
<rect x="181" y="197" width="242.1" height="25" fill="#31627b"/>
<text class="num" x="660" y="216" text-anchor="end">988</text>
<text class="tick" x="27" y="255">At least 5 runes</text>
<rect x="181" y="235" width="448" height="25" fill="#e2e8eb"/>
<rect x="181" y="235" width="151.1" height="25" fill="#31627b"/>
<text class="num" x="660" y="254" text-anchor="end">38</text>
<text class="tick" x="27" y="293">At least 6 runes</text>
<rect x="181" y="273" width="448" height="25" fill="#e2e8eb"/>
<rect x="181" y="273" width="67.5" height="25" fill="#31627b"/>
<text class="num" x="660" y="292" text-anchor="end">1</text>
<text class="tick" x="27" y="331">At least 12 runes</text>
<rect x="181" y="311" width="448" height="25" fill="#e2e8eb"/>
<rect x="181" y="311" width="0.0" height="25" fill="#aab7bd"/>
<text class="num" x="660" y="330" text-anchor="end">0</text>
<text class="sub" x="26" y="355">Bar lengths use a log scale; labels give exact counts. A match is structural feasibility, not readable plaintext.</text>
</svg>
