<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 276" role="img" aria-labelledby="title desc">
<title id="title">Known-text period detection in three source methods</title>
<desc id="desc">The correct period ranks first in four of four mirror, ten of ten remove-then-split, and eight of ten split-then-remove controls. Every saved LP2 score was also recounted, but these controls do not decode LP2.</desc>
<rect width="320" height="276" fill="#f5f7f8"/>
<g font-family="Arial, sans-serif" fill="#263843">
<text x="16" y="29" font-size="17" font-weight="700">Does the known period stand out?</text>
<text x="16" y="50" font-size="12.5" fill="#52646f">Period 5 planted in 600 known runes</text>
<text x="16" y="87" font-size="13.5" font-weight="600">Mirror pattern</text>
<rect x="16" y="97" width="230" height="10" rx="2" fill="#cdd5d9"/>
<rect x="16" y="97" width="230.0" height="10" rx="2" fill="#315d77"/>
<text x="258" y="106" font-size="14" font-weight="700">4/4</text>
<text x="16" y="142" font-size="13.5" font-weight="600">Remove F, then split</text>
<rect x="16" y="152" width="230" height="10" rx="2" fill="#cdd5d9"/>
<rect x="16" y="152" width="230.0" height="10" rx="2" fill="#315d77"/>
<text x="258" y="161" font-size="14" font-weight="700">10/10</text>
<text x="16" y="197" font-size="13.5" font-weight="600">Split, then remove F</text>
<rect x="16" y="207" width="230" height="10" rx="2" fill="#cdd5d9"/>
<rect x="16" y="207" width="184.0" height="10" rx="2" fill="#315d77"/>
<text x="258" y="216" font-size="14" font-weight="700">8/10</text>
<path d="M16 244H304" stroke="#cdd5d9"/>
<text x="16" y="263" font-size="12.5" fill="#52646f">Saved LP2 scores checked: 7,407</text>
</g></svg>
