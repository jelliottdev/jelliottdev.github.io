<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 356" role="img" aria-labelledby="title desc">
<title id="title">No PGP packet or fingerprint key reached the English gate</title>
<desc id="desc">Four groups of candidate repeating keys all scored below the predeclared minus 5.5 threshold. Of 199 full-search shuffled controls, 174 had a maximum at least as high as the observed best.</desc>
<style>.head{font:700 17px Arial,sans-serif;fill:#172b36}.label{font:14px Arial,sans-serif;fill:#243c49}.small{font:13px Arial,sans-serif;fill:#435763}</style>
<rect width="340" height="356" fill="#f8f9fa"/>
<text x="18" y="27" class="head">Four key materials, one rule</text>
<text x="18" y="47" class="small">Higher scores are more English-like</text>
<text x="18" y="76" class="small">−7.1</text><text x="322" y="76" text-anchor="end" class="small">−5.5 threshold</text>
<text x="18" y="100" class="label">Primary packet</text><rect x="18" y="107" width="304" height="12" fill="#e9edef"/><rect x="18" y="107" width="122.43" height="12" fill="#49758b"/><text x="322" y="100" text-anchor="end" class="small">-6.46</text><text x="18" y="152" class="label">Primary fingerprint</text><rect x="18" y="159" width="304" height="12" fill="#e9edef"/><rect x="18" y="159" width="57.39" height="12" fill="#49758b"/><text x="322" y="152" text-anchor="end" class="small">-6.80</text><text x="18" y="204" class="label">Subkey packet</text><rect x="18" y="211" width="304" height="12" fill="#e9edef"/><rect x="18" y="211" width="114.89" height="12" fill="#49758b"/><text x="322" y="204" text-anchor="end" class="small">-6.50</text><text x="18" y="256" class="label">Subkey fingerprint</text><rect x="18" y="263" width="304" height="12" fill="#e9edef"/><rect x="18" y="263" width="95.73" height="12" fill="#49758b"/><text x="322" y="256" text-anchor="end" class="small">-6.60</text>
<line x1="18" y1="294" x2="322" y2="294" stroke="#bdc8ce"/>
<text x="18" y="318" class="label">No output reached −5.5</text>
<text x="18" y="340" class="small">174 of 199 shuffled searches scored higher.</text>
</svg>