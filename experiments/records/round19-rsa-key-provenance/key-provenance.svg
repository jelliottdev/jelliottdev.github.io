<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 382" role="img" aria-labelledby="title desc">
  <title id="title">Where the Round 19 RSA settings came from</title>
  <desc id="desc">Of 738 source settings, 72 use the two Cicada PGP packets, 648 use 20 other archived PGP packets, and 18 use the small 2013 puzzle modulus. Only 54 settings under the Cicada packets were valid, and none matched the tested structure.</desc>
  <rect width="340" height="382" fill="#f5f6f7"/>
  <g font-family="Arial, sans-serif" fill="#202932">
    <text x="16" y="30" font-size="19" font-weight="650">The source’s 738 settings</text>
    <text x="16" y="52" font-size="14">Dark: evaluated · pale: too large</text>
    <text x="16" y="91" font-size="15" font-weight="650">Cicada PGP packets · 2 keys</text>
    <rect x="16" y="104" width="231" height="17" fill="#c8d0d6"/>
    <rect x="16" y="104" width="173" height="17" fill="#355f76"/>
    <text x="16" y="145" font-size="14">54 evaluated · 18 too large</text>
    <text x="16" y="184" font-size="15" font-weight="650">Other archived packets · 20 keys</text>
    <rect x="16" y="197" width="231" height="17" fill="#c8d0d6"/>
    <rect x="16" y="197" width="193" height="17" fill="#84939d"/>
    <text x="16" y="238" font-size="14">540 evaluated · 108 too large</text>
    <text x="16" y="277" font-size="15" font-weight="650">2013 puzzle modulus · 1 key</text>
    <rect x="16" y="290" width="231" height="17" fill="#c8d0d6"/>
    <text x="16" y="331" font-size="14">0 evaluated · 18 too large</text>
    <line x1="16" y1="348" x2="324" y2="348" stroke="#c8d0d6"/>
    <text x="16" y="369" font-size="13">No structural matches · 594 valid settings</text>
  </g>
</svg>
