<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 465" role="img" aria-labelledby="title desc"><title id="title">Known-key search coverage</title><desc id="desc">Two keys give 21 phases. Two arithmetic directions and 56 pages produce 2352 candidates. Nine exact known openings produce 21168 comparisons with zero matches. This does not rule out other plaintexts.</desc><rect width="360" height="465" fill="#faf9f5"/><g font-family="sans-serif" fill="#243c48"><text x="20" y="32" font-size="20">What the search covered</text><text x="20" y="72" font-size="17">Two recorded repeating keys</text><text x="20" y="95" font-size="12.5">Welcome: 8 phases · Second koan: 13 phases</text><path d="M25 104 v17 m-4 -4 l4 4 4 -4" stroke="#416879" fill="none"/><text x="20" y="141" font-size="17">21 phases × 2 directions</text><text x="20" y="164" font-size="12.5">Subtract the key or add the key, modulo 29</text><path d="M25 173 v17 m-4 -4 l4 4 4 -4" stroke="#416879" fill="none"/><text x="20" y="210" font-size="17">42 candidates per page</text><text x="20" y="233" font-size="12.5">56 archived pages: LP2-00–55</text><path d="M25 242 v17 m-4 -4 l4 4 4 -4" stroke="#416879" fill="none"/><text x="20" y="279" font-size="17">2,352 complete candidate streams</text><text x="20" y="302" font-size="12.5">Each compared with 9 fixed 12-rune openings</text><path d="M25 311 v17 m-4 -4 l4 4 4 -4" stroke="#416879" fill="none"/><text x="20" y="348" font-size="17">21,168 exact opening comparisons</text><text x="20" y="371" font-size="12.5">0 matches; every declared case completed</text><path d="M20 397 H340" stroke="#bec8ca"/><text x="20" y="421" font-size="13">No interruptions, later offsets or other keys.</text><text x="20" y="443" font-size="13">A different opening can still be valid plaintext.</text></g></svg>
