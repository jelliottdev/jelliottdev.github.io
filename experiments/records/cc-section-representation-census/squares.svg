<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 365" role="img" aria-labelledby="title desc">
<title id="title">Square lengths across 820 page ranges</title>
<desc id="desc">Eleven square rune counts, eight square prime-digit counts, three square zero-based index-digit counts and four square one-based index-digit counts. Overlapping ranges are descriptive, not probabilities.</desc>
<rect width="320" height="365" fill="#fff"/>
<g font-family="sans-serif" fill="#202b32">
<text x="12" y="26" font-size="18" font-weight="bold">Which lengths form squares?</text>
<text x="12" y="50" font-size="13">820 page ranges · LP2-00–39</text>
<text x="12" y="70" font-size="13">The representation changes the count.</text>
<text x="12" y="103" font-size="14">Runes</text>
<text x="307" y="103" text-anchor="end" font-size="15" font-weight="bold">11</text>
<rect x="12" y="112" width="296" height="16" fill="#edf0f2"/>
<rect x="12" y="112" width="296.00" height="16" fill="#325e75"/>
<text x="12" y="161" font-size="14">GP prime digits</text>
<text x="307" y="161" text-anchor="end" font-size="15" font-weight="bold">8</text>
<rect x="12" y="170" width="296" height="16" fill="#edf0f2"/>
<rect x="12" y="170" width="215.27" height="16" fill="#325e75"/>
<text x="12" y="219" font-size="14">Index digits, 0-based</text>
<text x="307" y="219" text-anchor="end" font-size="15" font-weight="bold">3</text>
<rect x="12" y="228" width="296" height="16" fill="#edf0f2"/>
<rect x="12" y="228" width="80.73" height="16" fill="#325e75"/>
<text x="12" y="277" font-size="14">Index digits, 1-based</text>
<text x="307" y="277" text-anchor="end" font-size="15" font-weight="bold">4</text>
<rect x="12" y="286" width="296" height="16" fill="#edf0f2"/>
<rect x="12" y="286" width="107.64" height="16" fill="#325e75"/>
<text x="12" y="335" font-size="13" fill="#53616a">These ranges overlap.</text>
<text x="12" y="354" font-size="13" fill="#53616a">Counts are not chance probabilities.</text>
</g></svg>
