<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" aria-labelledby="title description">
<title id="title">Lag-six affine matches within LP2 words</title>
<desc id="description">The observed formula has 77 matches. Word shuffles average 44.6 for that formula. The best of all 841 affine formulas in each shuffle averages 65.9.</desc>
<rect width="640" height="270" fill="#fff"/>
<g font-family="system-ui,sans-serif" fill="#27343c">
<text x="18" y="27" font-size="18" font-weight="600">Matches at lag six</text>
<text x="18" y="48" font-size="12">LP2-00–55 · word-internal pairs · 2,000 within-word shuffles</text>
<text x="18" y="85" font-size="13">Observed relation</text>
<rect x="222" y="70" width="319.6" height="20" fill="#255f79"/>
<text x="547.5" y="85" font-size="13">77.0</text>
<text x="18" y="136" font-size="13">Word-shuffle mean</text>
<rect x="222" y="121" width="184.9" height="20" fill="#657c88"/>
<text x="412.9" y="136" font-size="13">44.6</text>
<text x="18" y="187" font-size="13">Best-map shuffle mean</text>
<rect x="222" y="172" width="273.3" height="20" fill="#8b96a0"/>
<text x="501.3" y="187" font-size="13">65.9</text>
<text x="18" y="249" font-size="12">The best-map comparison adjusts 841 formulas at lag six; it does not adjust other lags or word rules.</text>
</g></svg>
