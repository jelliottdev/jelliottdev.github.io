<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 650" role="img" aria-labelledby="title desc">
<title id="title">24 orders, six cyclic classes</title><desc id="desc">Every group contains four cyclic rotations with identical balance score. Lower Q means more similar column totals.</desc>
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#25343a;font-size:13px}.small{font-size:11px}</style>
<text x="18" y="28" font-size="18">24 orders, six balance scores</text>
<text x="18" y="52">A: Warning · B: Welcome</text>
<text x="18" y="73">C: First koan · D: Second koan</text>
<text x="18" y="96">Lower Q means more balanced columns.</text>
<text x="18" y="127">ABCD   BCDA   CDAB   DABC</text>
<rect x="18" y="137" width="81.87" height="14" fill="#42687b"/>
<text x="18" y="170" class="small">Q = 128,256</text>
<text x="18" y="205">ABDC   BDCA   CABD   DCAB</text>
<rect x="18" y="215" width="188.75" height="14" fill="#42687b"/>
<text x="18" y="248" class="small">Q = 295,680</text>
<text x="18" y="283">ACBD   BDAC   CBDA   DACB</text>
<rect x="18" y="293" width="164.24" height="14" fill="#42687b"/>
<text x="18" y="326" class="small">Q = 257,280</text>
<text x="18" y="361">ACDB   BACD   CDBA   DBAC</text>
<rect x="18" y="371" width="260.00" height="14" fill="#42687b"/>
<text x="18" y="404" class="small">Q = 407,296</text>
<text x="18" y="439">ADBC   BCAD   CADB   DBCA</text>
<rect x="18" y="449" width="137.76" height="14" fill="#42687b"/>
<text x="18" y="482" class="small">Q = 215,808</text>
<text x="18" y="517">ADCB   BADC   CBAD   DCBA</text>
<rect x="18" y="527" width="215.55" height="14" fill="#42687b"/>
<text x="18" y="560" class="small">Q = 337,664</text>
<text x="18" y="607">Original ABCD order ties with its rotations.</text>
<text x="18" y="628">Classes are not independent tests.</text>
</svg>
