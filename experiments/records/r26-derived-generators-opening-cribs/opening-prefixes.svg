<title id="title">Longest familiar opening: four of twelve runes</title>
<desc id="desc">Among 48,462 source-defined generator and skip-model configurations, none matched a complete twelve-rune opening on any of 55 pages. The best matched four runes. Counts by longest prefix: one 30680, two 16909, three 842, four 31.</desc>
