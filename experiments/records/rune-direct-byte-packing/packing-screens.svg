<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" role="img" aria-labelledby="title desc">
<title id="title">Direct rune-to-byte screens</title>
<desc id="desc">Three fixed encodings, 56 targets each. None produced complete printable text or a chosen file signature. Prime bytes pass UTF-8 syntax only because every prime is under 128.</desc>
<rect width="360" height="330" fill="#f5f6f7"/>
<text x="16" y="29" font-family="Arial,sans-serif" font-size="17" fill="#202a31" font-weight="700">Direct bytes from LP2 runes</text>
<text x="16" y="50" font-family="Arial,sans-serif" font-size="12" fill="#4e5c66">56 fixed targets per encoding</text>
<g font-family="Arial,sans-serif" fill="#202a31">
<text x="16" y="83" font-size="14" font-weight="700">Five-bit rune index</text>
<text x="16" y="105" font-size="13">0 printable · 0 UTF-8 · 0 file starts</text>
<text x="16" y="146" font-size="14" font-weight="700">Five-bit index, reversed</text>
<text x="16" y="168" font-size="13">0 printable · 0 UTF-8 · 0 file starts</text>
<text x="16" y="209" font-size="14" font-weight="700">One-byte prime values</text>
<text x="16" y="231" font-size="13">0 printable · 56 UTF-8* · 0 file starts</text>
</g>
<path d="M16 119H344 M16 182H344 M16 246H344" stroke="#cbd2d6"/>
<text x="16" y="274" font-family="Arial,sans-serif" font-size="12" fill="#4e5c66">*Syntactically valid because every prime</text>
<text x="16" y="293" font-family="Arial,sans-serif" font-size="12" fill="#4e5c66">is an ASCII byte. Control characters</text>
<text x="16" y="312" font-family="Arial,sans-serif" font-size="12" fill="#4e5c66">prevent complete readable text.</text>
</svg>
