<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 366" role="img" aria-labelledby="title desc">
<title id="title">Shifted-restart difference agreements</title>
<desc id="desc">LP2 is near random expectation at five boundaries; all planted lower bounds lie to the right. Horizontal axis is zoomed from 0.98 to 1.08.</desc>
<rect width="340" height="366" fill="#fff"/>
<text x="16" y="27" font-size="17" font-weight="700" fill="#252c30">Differences within units</text>
<text x="16" y="50" font-size="13" fill="#55636c">Ratio to random-rune expectation</text>
<circle cx="23" cy="76" r="6" fill="#285e79"/>
<text x="37" y="81" font-size="13" fill="#31383d">LP2</text>
<circle cx="112" cy="76" r="6" fill="#9eaab2"/>
<text x="126" y="81" font-size="13" fill="#31383d">Planted lower bound</text>
<line x1="120.0" y1="111" x2="120.0" y2="330" stroke="#cbd2d5" stroke-dasharray="3 4"/>
<text x="120.0" y="105" text-anchor="middle" font-size="13" fill="#55636c">0.98×</text>
<line x1="159.0" y1="111" x2="159.0" y2="330" stroke="#cbd2d5" stroke-dasharray="3 4"/>
<text x="159.0" y="105" text-anchor="middle" font-size="13" fill="#55636c">1.00×</text>
<line x1="237.0" y1="111" x2="237.0" y2="330" stroke="#cbd2d5" stroke-dasharray="3 4"/>
<text x="237.0" y="105" text-anchor="middle" font-size="13" fill="#55636c">1.04×</text>
<line x1="315.0" y1="111" x2="315.0" y2="330" stroke="#cbd2d5" stroke-dasharray="3 4"/>
<text x="315.0" y="105" text-anchor="middle" font-size="13" fill="#55636c">1.08×</text>
<text x="16" y="148" font-size="14" fill="#252c30">Segment</text>
<line x1="157.5" y1="143" x2="207.3" y2="143" stroke="#bfc9ce" stroke-width="2"/>
<circle cx="157.5" cy="143" r="6" fill="#285e79"/>
<circle cx="207.3" cy="143" r="6" fill="#9eaab2"/>
<text x="16" y="192" font-size="14" fill="#252c30">Paragraph</text>
<line x1="154.5" y1="187" x2="207.4" y2="187" stroke="#bfc9ce" stroke-width="2"/>
<circle cx="154.5" cy="187" r="6" fill="#285e79"/>
<circle cx="207.4" cy="187" r="6" fill="#9eaab2"/>
<text x="16" y="236" font-size="14" fill="#252c30">Clause</text>
<line x1="160.7" y1="231" x2="212.5" y2="231" stroke="#bfc9ce" stroke-width="2"/>
<circle cx="160.7" cy="231" r="6" fill="#285e79"/>
<circle cx="212.5" cy="231" r="6" fill="#9eaab2"/>
<text x="16" y="280" font-size="14" fill="#252c30">Line</text>
<line x1="160.1" y1="275" x2="207.0" y2="275" stroke="#bfc9ce" stroke-width="2"/>
<circle cx="160.1" cy="275" r="6" fill="#285e79"/>
<circle cx="207.0" cy="275" r="6" fill="#9eaab2"/>
<text x="16" y="324" font-size="14" fill="#252c30">Page</text>
<line x1="158.6" y1="319" x2="214.0" y2="319" stroke="#bfc9ce" stroke-width="2"/>
<circle cx="158.6" cy="319" r="6" fill="#285e79"/>
<circle cx="214.0" cy="319" r="6" fill="#9eaab2"/>
<text x="16" y="354" font-size="13" fill="#55636c">Zoomed axis; points are complete-count ratios.</text>
</svg>
