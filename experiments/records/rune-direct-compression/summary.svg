<rect x="16" y="76" width="308" height="40" fill="#edf0f2"/>
<text x="28" y="102" font-family="sans-serif" font-size="14" fill="#202b32">zlib</text>
<text x="215" y="102" font-family="sans-serif" font-size="14" fill="#365d71">0 / 168 valid</text>
<rect x="16" y="125" width="308" height="40" fill="#edf0f2"/>
<text x="28" y="151" font-family="sans-serif" font-size="14" fill="#202b32">gzip</text>
<text x="215" y="151" font-family="sans-serif" font-size="14" fill="#365d71">0 / 168 valid</text>
<rect x="16" y="174" width="308" height="40" fill="#edf0f2"/>
