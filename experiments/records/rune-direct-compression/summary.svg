<rect x="16" y="272" width="308" height="40" fill="#edf0f2"/>
<text x="28" y="298" font-family="sans-serif" font-size="14" fill="#202b32">XZ</text>
<text x="215" y="298" font-family="sans-serif" font-size="14" fill="#365d71">0 / 168 valid</text>
<path d="M16 329H324" stroke="#c7d0d5"/>
