<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 350 394">
<title id="title">Four archived autokey seed searches and their source-defined screens</title>
<desc id="desc">Each row shows configurations tested, configurations passing the source singleton gate, and hits exceeding its index-of-coincidence threshold. All four methods have zero source hits. The DEOR variant has no singleton gate.</desc>
<rect width="350" height="394" fill="#fff"/>
<style>text{font-family:Arial,sans-serif;fill:#26343c;font-size:13px}.head{font-size:18px;font-weight:700}.label{font-size:14px;font-weight:700}.muted{fill:#536571}</style>
<text x="16" y="27" class="head">The source search, in four branches</text>
<text x="16" y="49" class="muted">One-rune words must decode to I or A.</text>
<rect x="12" y="67" width="326" height="68" rx="3" fill="#f1f4f6" stroke="#d5dfe5"/>
<rect x="12" y="67" width="4" height="68" fill="#2e6681"/>
<text x="27" y="88" class="label">Named keywords</text>
<text x="27" y="110">4,488 settings  ·  135 pass I/A word check</text>
<text x="27" y="128" class="muted">0 above the source IoC threshold</text>
<rect x="12" y="142" width="326" height="68" rx="3" fill="#f1f4f6" stroke="#d5dfe5"/>
<rect x="12" y="142" width="4" height="68" fill="#2e6681"/>
<text x="27" y="163" class="label">Every two-rune seed</text>
<text x="27" y="185">171,564 settings  ·  5,058 pass I/A word check</text>
<text x="27" y="203" class="muted">0 above the source IoC threshold</text>
<rect x="12" y="217" width="326" height="68" rx="3" fill="#f1f4f6" stroke="#d5dfe5"/>
<rect x="12" y="217" width="4" height="68" fill="#2e6681"/>
<text x="27" y="238" class="label">Every three-rune seed</text>
<text x="27" y="260">4,536,354 settings  ·  0 pass I/A word check</text>
<text x="27" y="278" class="muted">0 above the source IoC threshold</text>
<rect x="12" y="292" width="326" height="68" rx="3" fill="#f1f4f6" stroke="#d5dfe5"/>
<rect x="12" y="292" width="4" height="68" fill="#2e6681"/>
<text x="27" y="313" class="label">P21–30 DEOR variant</text>
<text x="27" y="335">60 settings  ·  No I/A word check</text>
<text x="27" y="353" class="muted">0 above the source IoC threshold</text>
<text x="16" y="379" class="muted">The screen checks IoC &gt; 1.3; a hit is not a reading.</text>
</svg>
