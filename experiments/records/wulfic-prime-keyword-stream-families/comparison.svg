<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 340 356">
<title id="title">Three source searches compared with complete shuffled controls</title>
<desc id="desc">Each row shows the observed maximum index of coincidence and the minimum-to-maximum range of 49 complete-search shuffles. Prime streams reached a higher maximum than 48 of 49 shuffles, but did not produce a reading.</desc>
<rect width="340" height="356" fill="#fff"/>
<style>text{font-family:Arial,sans-serif;fill:#23313a;font-size:13px} .small{fill:#53636f}.bold{font-weight:700}</style>
<text x="16" y="27" class="bold" font-size="17">Highest IoC in each search</text>
<text x="16" y="49" class="small">Blue: manuscript  ·  Gray: 49 shuffled runs</text>
<text x="16" y="84" class="bold">Repeated keywords</text>
<line x1="32" y1="103" x2="309" y2="103" stroke="#d5dde2" stroke-width="2"/>
<line x1="89.2" y1="103" x2="157.2" y2="103" stroke="#8d9ca6" stroke-width="7" stroke-linecap="round"/>
<circle cx="125.9" cy="103" r="7" fill="#236080" stroke="#fff" stroke-width="2"/>
<text x="16" y="129" class="small">Observed 1.119  ·  matched by 18 of 49</text>
<text x="16" y="172" class="bold">Prime streams</text>
<line x1="32" y1="191" x2="309" y2="191" stroke="#d5dde2" stroke-width="2"/>
<line x1="113.7" y1="191" x2="180.8" y2="191" stroke="#8d9ca6" stroke-width="7" stroke-linecap="round"/>
<circle cx="169.5" cy="191" r="7" fill="#236080" stroke="#fff" stroke-width="2"/>
<text x="16" y="217" class="small">Observed 1.174  ·  matched by 1 of 49</text>
<text x="16" y="260" class="bold">Keyword-stepped primes</text>
<line x1="32" y1="279" x2="309" y2="279" stroke="#d5dde2" stroke-width="2"/>
<line x1="202.8" y1="279" x2="283.7" y2="279" stroke="#8d9ca6" stroke-width="7" stroke-linecap="round"/>
<circle cx="254.0" cy="279" r="7" fill="#236080" stroke="#fff" stroke-width="2"/>
<text x="16" y="305" class="small">Observed 1.281  ·  matched by 12 of 49</text>
<text x="24" y="336" class="small">1.00</text>
<text x="276" y="336" class="small">1.35 IoC</text>
</svg>
