<svg xmlns="http://www.w3.org/2000/svg" width="320" height="304" viewBox="0 0 320 304" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif"><title id="title">Keyword plus position step: source score comparison</title><desc id="desc">The best LP2 source word score is 86. The middle of 199 complete shuffled searches is 61, and the highest is 95; 10 shuffles meet or exceed the LP2 value. A planted known reading scores 380, outside this plotting scale.</desc><rect width="320" height="304" fill="#fff"/><text x="12" y="25" font-size="17" font-weight="bold" fill="#162c38">Keyword + position step</text><line x1="12" y1="34" x2="308" y2="34" stroke="#cbd3d7"/><text x="12" y="52" font-size="14">LP2 best</text><rect x="126" y="36" width="137" height="20" fill="#225b77"/><text x="268" y="52" font-size="14" text-anchor="start">86</text><text x="12" y="114" font-size="14">Shuffle middle</text><rect x="126" y="98" width="97" height="20" fill="#9daab0"/><text x="228" y="114" font-size="14" text-anchor="start">61</text><text x="12" y="176" font-size="14">Shuffle highest</text><rect x="126" y="160" width="152" height="20" fill="#6d7b82"/><text x="283" y="176" font-size="14" text-anchor="start">95</text><text x="12" y="221" font-size="14" fill="#26343b">10 of 199 full searches scored ≥ 86.</text><text x="12" y="247" font-size="14" fill="#26343b">Known-reading plant: 380 and exact recovery.</text><text x="12" y="275" font-size="13" fill="#4c5a60">Source word-count score; higher is not proof.</text></svg>
