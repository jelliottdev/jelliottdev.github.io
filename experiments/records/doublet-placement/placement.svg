<svg xmlns="http://www.w3.org/2000/svg" width="690" height="330" viewBox="0 0 690 330" role="img" aria-labelledby="title desc">
<title id="title">Placement of 86 LP2 doublets against length-aware random placement</title>
<desc id="desc">Observed empty pages, page count variance, shortest gap and first-or-last-five event count are compared with random placement of 86 events among within-page edges. These are conditional reference ranges, not cipher-model predictions.</desc>
<rect width="690" height="330" fill="white"/>
<g font-family="system-ui, sans-serif" fill="#263842">
<text x="18" y="31" font-size="18">Where the 86 doublets fall</text>
<text x="18" y="52" font-size="12">Fixed total; edge slots weighted by page length · 10,000 placements</text>
<text x="18" y="96" font-size="13">Pages with no doublet</text>
<line x1="325" y1="91" x2="585" y2="91" stroke="#e4e8e7" stroke-width="2"/>
<rect x="405.0" y="83" width="90.0" height="16" fill="#c3d4d0"/>
<circle cx="455.0" cy="91" r="6" fill="#245d74"/>
<text x="608" y="96" font-size="13">13.00</text>
<text x="18" y="153" font-size="13">Page variance / mean</text>
<line x1="325" y1="148" x2="585" y2="148" stroke="#e4e8e7" stroke-width="2"/>
<rect x="399.4" y="140" width="79.8" height="16" fill="#c3d4d0"/>
<circle cx="450.2" cy="148" r="6" fill="#245d74"/>
<text x="608" y="153" font-size="13">1.20</text>
<text x="18" y="210" font-size="13">Shortest gap, runes</text>
<line x1="325" y1="205" x2="585" y2="205" stroke="#e4e8e7" stroke-width="2"/>
<rect x="339.4" y="197" width="86.7" height="16" fill="#c3d4d0"/>
<circle cx="411.7" cy="205" r="6" fill="#245d74"/>
<text x="608" y="210" font-size="13">6.00</text>
<text x="18" y="267" font-size="13">First or last five edges</text>
<line x1="325" y1="262" x2="585" y2="262" stroke="#e4e8e7" stroke-width="2"/>
<rect x="342.3" y="254" width="121.3" height="16" fill="#c3d4d0"/>
<circle cx="394.3" cy="262" r="6" fill="#245d74"/>
<text x="608" y="267" font-size="13">4.00</text>
<text x="18" y="319" font-size="11">Bands: descriptive central ranges; see article for separate edge controls and model limits.</text>
</g></svg>
