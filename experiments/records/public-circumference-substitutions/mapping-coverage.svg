<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 218" role="img" aria-labelledby="title desc">
  <title id="title">Output alphabet of the circumference rules</title>
  <desc id="desc">Index radius reaches 25 of 29 output runes with nearest rounding and 26 with truncation. Prime radius reaches 18 of 29 with either rounding rule.</desc>
  <rect width="620" height="218" fill="#f2f4f5"/>
  <g font-family="system-ui,sans-serif" fill="#263e4c">
    <text x="24" y="30" font-size="16" font-weight="700">Distinct output runes (of 29)</text>
    <text x="24" y="68" font-size="13">Index · nearest</text><text x="558" y="68" font-size="13">25</text>
    <text x="24" y="109" font-size="13">Index · truncated</text><text x="558" y="109" font-size="13">26</text>
    <text x="24" y="150" font-size="13">Prime · nearest</text><text x="558" y="150" font-size="13">18</text>
    <text x="24" y="191" font-size="13">Prime · truncated</text><text x="558" y="191" font-size="13">18</text>
  </g>
  <g fill="#d2dbe0"><rect x="165" y="53" width="375" height="19"/><rect x="165" y="94" width="375" height="19"/><rect x="165" y="135" width="375" height="19"/><rect x="165" y="176" width="375" height="19"/></g>
  <g fill="#37647a"><rect x="165" y="53" width="323" height="19"/><rect x="165" y="94" width="336" height="19"/><rect x="165" y="135" width="233" height="19"/><rect x="165" y="176" width="233" height="19"/></g>
</svg>
