<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 420" role="img" aria-labelledby="title desc">
  <title id="title">The semantic-seed screen cannot promote a candidate</title>
  <desc id="desc">The 4,274 source scores range from minus 8.11 to minus 6.58. A planted key that recovered 120 of 120 runes scored minus 4.35. The code requires a score of plus 5 for promotion, although its log-probability score cannot exceed zero.</desc>
  <rect width="440" height="420" fill="#f4f6f7"/>
  <g fill="#ffffff" stroke="#c9d1d6" stroke-width="1.5">
    <rect x="20" y="20" width="400" height="103" rx="5"/>
    <rect x="20" y="158" width="400" height="103" rx="5"/>
    <rect x="20" y="296" width="400" height="103" rx="5"/>
  </g>
  <path d="M220 125v29m-7-9 7 9 7-9M220 263v29m-7-9 7 9 7-9" fill="none" stroke="#617786" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#22323b">
    <text x="39" y="52" font-size="16" font-weight="700">Source sweep</text>
    <text x="39" y="84" font-size="23" font-weight="650">4,274 scores</text>
    <text x="39" y="108" font-size="15" fill="#53636d">Best: −6.58 · all below zero</text>
    <text x="39" y="190" font-size="16" font-weight="700">Known-good planted key</text>
    <text x="39" y="222" font-size="23" font-weight="650">120 / 120 runes recovered</text>
    <text x="39" y="246" font-size="15" fill="#53636d">Its screen score: −4.35</text>
    <text x="39" y="328" font-size="16" font-weight="700">Promotion rule in source code</text>
    <text x="39" y="360" font-size="23" font-weight="650">Score ≥ +5 required</text>
    <text x="39" y="384" font-size="15" fill="#53636d">A log-probability score cannot exceed 0</text>
  </g>
  <path d="M368 70l12 12 20-27" fill="none" stroke="#38647e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="384" cy="209" r="18" fill="#edf3f6" stroke="#38647e" stroke-width="2"/>
  <path d="M377 209h14" stroke="#38647e" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="384" cy="347" r="18" fill="#f1f3f4" stroke="#64747d" stroke-width="2"/>
  <path d="M377 340l14 14m0-14-14 14" stroke="#64747d" stroke-width="2.5" stroke-linecap="round"/>
</svg>
