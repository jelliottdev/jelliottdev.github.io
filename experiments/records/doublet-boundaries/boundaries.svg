<svg xmlns="http://www.w3.org/2000/svg" width="640" height="292" viewBox="0 0 640 292" role="img" aria-labelledby="title desc">
<title id="title">Where the 86 LP2 equal-rune pairs occur</title>
<desc id="desc">Sixty are contiguous, three cross only a row wrap, twenty-two cross a hyphen, and one crosses other punctuation. No doublet crosses an apostrophe or soft wrap alone.</desc>
<rect width="640" height="292" fill="white"/>
<g font-family="system-ui, sans-serif" fill="#263842">
<text x="20" y="31" font-size="19">Where the 86 matching pairs occur</text>
<text x="20" y="53" font-size="12">Intervening marks in the archived text · LP2-00–55</text>
<rect x="20.0" y="70" width="414.0" height="29" fill="#285e75"/>
<rect x="434.0" y="70" width="20.7" height="29" fill="#799899"/>
<rect x="454.7" y="70" width="151.8" height="29" fill="#bd8d58"/>
<rect x="606.5" y="70" width="6.9" height="29" fill="#7f6f6a"/>
<rect x="20" y="115" width="14" height="14" fill="#285e75"/>
<text x="44" y="127" font-size="13">No mark between runes</text>
<text x="400" y="127" font-size="13">60</text>
<rect x="20" y="146" width="14" height="14" fill="#799899"/>
<text x="44" y="158" font-size="13">Row wrap only</text>
<text x="400" y="158" font-size="13">3</text>
<rect x="20" y="177" width="14" height="14" fill="#adc2b7"/>
<text x="44" y="189" font-size="13">Apostrophe / soft wrap</text>
<text x="400" y="189" font-size="13">0</text>
<rect x="20" y="208" width="14" height="14" fill="#bd8d58"/>
<text x="44" y="220" font-size="13">Hyphen (possibly with wrap)</text>
<text x="400" y="220" font-size="13">22</text>
<rect x="20" y="239" width="14" height="14" fill="#7f6f6a"/>
<text x="44" y="251" font-size="13">Other punctuation</text>
<text x="400" y="251" font-size="13">1</text>
<text x="20" y="285" font-size="11">Classification uses stored separators; it does not verify marks against the scans.</text>
</g></svg>
