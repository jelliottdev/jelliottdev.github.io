<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" role="img" aria-labelledby="title desc">
<title id="title">Missing decimal-prime strings under three grid layouts</title>
<desc id="desc">The original 32 by 8 layout misses three prime values. The alternative layouts have their own missing counts. Shaded ranges show global first-digit shuffle controls.</desc>
<rect width="660" height="250" fill="white"/>
<g font-family="system-ui,sans-serif" fill="#27343c">
<text x="18" y="27" font-size="18" font-weight="600">Missing prime values by layout</text>
<text x="18" y="47" font-size="12">Four-cell paths · 49 possible decimal-prime values · fixed digit counts</text>
<text x="18" y="90" font-size="13">32 × 8 source</text>
<line x1="250" y1="85" x2="570" y2="85" stroke="#dce2e6" stroke-width="2"/>
<rect x="250" y="77" width="128" height="16" fill="#a9bcc5"/>
<circle cx="346" cy="85" r="6" fill="#255f79"/>
<text x="590" y="90" font-size="13">3</text>
<text x="18" y="138" font-size="13">16 × 16 reshape</text>
<line x1="250" y1="133" x2="570" y2="133" stroke="#dce2e6" stroke-width="2"/>
<rect x="250" y="125" width="96" height="16" fill="#a9bcc5"/>
<circle cx="250" cy="133" r="6" fill="#255f79"/>
<text x="590" y="138" font-size="13">0</text>
<text x="18" y="186" font-size="13">Four 8 × 8 blocks</text>
<line x1="250" y1="181" x2="570" y2="181" stroke="#dce2e6" stroke-width="2"/>
<rect x="250" y="173" width="224" height="16" fill="#a9bcc5"/>
<circle cx="378" cy="181" r="6" fill="#255f79"/>
<text x="590" y="186" font-size="13">4</text>
<text x="250" y="235" font-size="12">0</text>
<text x="532" y="235" font-size="12">10 missing</text>
</g></svg>
