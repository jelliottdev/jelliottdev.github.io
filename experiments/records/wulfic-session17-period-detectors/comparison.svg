<svg xmlns="http://www.w3.org/2000/svg" width="320" height="354" viewBox="0 0 320 354" font-family="Arial, sans-serif" role="img" aria-labelledby="title desc"><title id="title">Two source period screens compared with complete shuffled searches</title><desc id="desc">Test8's highest manuscript key-repeat fraction was 13.2%, below the greater-than-25-percent report line, and 12 of 49 full shuffled searches reached it. Test9 flagged 29 of 34 manuscript pages, versus 29 at the middle of 49 shuffled searches. Both detectors found a planted period13 on the appropriate page.</desc><rect width="320" height="354" fill="#fff"/><text x="12" y="25" font-size="17" font-weight="bold" fill="#172f3d">Period checks</text><text x="12" y="53" font-size="14" fill="#3e515b">Check 8 · Key-lag matches</text><text x="12" y="86" font-size="14">LP2 highest</text><rect x="139" y="67" width="65.8" height="21" fill="#2c6881"/><text x="303" y="84" text-anchor="end" font-size="14">13%</text><text x="12" y="119" font-size="14">Shuffle middle</text><rect x="139" y="100" width="63.3" height="21" fill="#91a3ad"/><text x="303" y="117" text-anchor="end" font-size="14">13%</text><line x1="264" y1="64" x2="264" y2="124" stroke="#a64242" stroke-width="2" stroke-dasharray="4 3"/><text x="12" y="147" font-size="13" fill="#4b5d66">Report only above 25% · LP2: no hits</text><line x1="12" y1="164" x2="308" y2="164" stroke="#c8d2d6"/><text x="12" y="191" font-size="14" fill="#3e515b">Check 9 · Column-score flags</text><text x="12" y="224" font-size="14">LP2 pages</text><rect x="139" y="205" width="92.8" height="21" fill="#2c6881"/><text x="303" y="222" text-anchor="end" font-size="14">29/34</text><text x="12" y="257" font-size="14">Shuffle middle</text><rect x="139" y="238" width="92.8" height="21" fill="#91a3ad"/><text x="303" y="255" text-anchor="end" font-size="14">29/34</text><text x="12" y="295" font-size="14" fill="#243b46">Both checks found a planted period 13.</text><text x="12" y="320" font-size="13" fill="#4b5d66">49 shared full-search shuffles; source rules.</text><text x="12" y="341" font-size="12" fill="#586970">A flagged page is not a decipherment.</text></svg>
