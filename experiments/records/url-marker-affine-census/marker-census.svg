<svg xmlns="http://www.w3.org/2000/svg" width="580" height="650" viewBox="0 0 580 650" role="img" aria-label="One affine map sends rune indices4,14,14,3,20 to HTTPS at one LP2-36 position; HTTP is its prefix. No equal-rune triples means no literal WWW under any static bijective map."><rect width="580" height="650" fill="white"/><g font-family="Arial,sans-serif" fill="#17212b"><text x="24" y="34" font-size="24">Literal markers under a fixed rune map</text><text x="24" y="71" font-size="20">LP2-36 · rune start 226 · P = (24C + 28) mod 29</text><text x="24" y="106" font-size="20">Cipher rune indices → canonical GP letters</text><rect x="24" y="121" width="532" height="57" rx="4" fill="#eef1f4"/><text x="42" y="157" font-size="24">4  14  14  3  20</text><text x="285" y="157" font-size="24">→</text><text x="334" y="157" font-size="24">H  T  T  P  S</text><text x="24" y="211" font-size="20">The repeated index 14 stays repeated as T.</text><text x="24" y="247" font-size="22">Fixed token</text><text x="327" y="247" font-size="22">Literal matches</text><line x1="24" y1="259" x2="556" y2="259" stroke="#c4ccd4"/><text x="42" y="290" font-size="22">WWW</text><text x="427" y="290" font-size="22">0</text><text x="42" y="326" font-size="22">HTTP</text><text x="427" y="326" font-size="22">1</text><text x="42" y="362" font-size="22">HTTPS</text><text x="427" y="362" font-size="22">1</text><text x="42" y="398" font-size="22">ONION</text><text x="427" y="398" font-size="22">0</text><line x1="24" y1="413" x2="556" y2="413" stroke="#c4ccd4"/><text x="24" y="445" font-size="20">HTTP is the prefix of the same HTTPS window.</text><text x="24" y="479" font-size="20">Decoded rune slots (not confirmed plaintext):</text><rect x="24" y="493" width="532" height="68" rx="4" fill="#f3f4f5"/><text x="36" y="520" font-size="20">W H IA TH Y M B A [HTTPS]</text><text x="36" y="548" font-size="20">EO M F X U EO A</text><text x="24" y="590" font-size="20">WWW needs three identical source runes;</text><text x="24" y="615" font-size="20">none occur in the 55 nonempty page streams.</text><text x="24" y="642" font-size="20">One short marker does not confirm a URL.</text></g></svg>
