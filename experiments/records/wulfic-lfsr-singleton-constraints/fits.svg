<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 286" role="img" aria-labelledby="title desc">
<title id="title">Singleton fits grow as the key has more memory</title>
<desc id="desc">Across three LP2 pages, source-defined LFSR streams with one to five memory positions are counted when every visible one-rune word becomes I or A. LP2-28 has just four fits at length five. LP2-21 rises to about 5.8 million parameter fits. These are constraint fits, not decoded readings.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#25313a}.title{font-size:16px;font-weight:700}.note{font-size:14px;fill:#53616b}.label,.cell{font-size:14px}.cell{font-weight:700}</style>
<rect x="1" y="1" width="318" height="284" fill="#fff" stroke="#cbd4d9"/>
<text x="13" y="28" class="title">How many streams fit?</text>
<text x="13" y="53" class="note">Every one-rune word must read I or A.</text>
<text x="13" y="82" class="note">Page</text>
<text x="93" y="82" class="note">L1</text><text x="136" y="82" class="note">L2</text><text x="179" y="82" class="note">L3</text><text x="222" y="82" class="note">L4</text><text x="265" y="82" class="note">L5</text>
<text x="13" y="130" class="label">LP2-28</text>
<rect x="93" y="106" width="39" height="34" fill="#eff3f6" stroke="#cbd4d9"/>
<text x="112.5" y="129" text-anchor="middle" class="cell">0</text>
<rect x="136" y="106" width="39" height="34" fill="#eff3f6" stroke="#cbd4d9"/>
<text x="155.5" y="129" text-anchor="middle" class="cell">0</text>
<rect x="179" y="106" width="39" height="34" fill="#eff3f6" stroke="#cbd4d9"/>
<text x="198.5" y="129" text-anchor="middle" class="cell">0</text>
<rect x="222" y="106" width="39" height="34" fill="#eff3f6" stroke="#cbd4d9"/>
<text x="241.5" y="129" text-anchor="middle" class="cell">0</text>
<rect x="265" y="106" width="39" height="34" fill="#e0e9ee" stroke="#cbd4d9"/>
<text x="284.5" y="129" text-anchor="middle" class="cell">4</text>
<text x="13" y="174" class="label">LP2-24</text>
<rect x="93" y="150" width="39" height="34" fill="#eff3f6" stroke="#cbd4d9"/>
<text x="112.5" y="173" text-anchor="middle" class="cell">0</text>
<rect x="136" y="150" width="39" height="34" fill="#eff3f6" stroke="#cbd4d9"/>
<text x="155.5" y="173" text-anchor="middle" class="cell">0</text>
<rect x="179" y="150" width="39" height="34" fill="#eff3f6" stroke="#cbd4d9"/>
<text x="198.5" y="173" text-anchor="middle" class="cell">0</text>
<rect x="222" y="150" width="39" height="34" fill="#d1dee5" stroke="#cbd4d9"/>
<text x="241.5" y="173" text-anchor="middle" class="cell">24</text>
<rect x="265" y="150" width="39" height="34" fill="#91b0c1" stroke="#cbd4d9"/>
<text x="284.5" y="173" text-anchor="middle" class="cell">27.4k</text>
<text x="13" y="218" class="label">LP2-21</text>
<rect x="93" y="194" width="39" height="34" fill="#eff3f6" stroke="#cbd4d9"/>
<text x="112.5" y="217" text-anchor="middle" class="cell">0</text>
<rect x="136" y="194" width="39" height="34" fill="#eff3f6" stroke="#cbd4d9"/>
<text x="155.5" y="217" text-anchor="middle" class="cell">0</text>
<rect x="179" y="194" width="39" height="34" fill="#dde6ec" stroke="#cbd4d9"/>
<text x="198.5" y="217" text-anchor="middle" class="cell">6</text>
<rect x="222" y="194" width="39" height="34" fill="#9db9c9" stroke="#cbd4d9"/>
<text x="241.5" y="217" text-anchor="middle" class="cell">6.8k</text>
<rect x="265" y="194" width="39" height="34" fill="#5f8ea6" stroke="#cbd4d9"/>
<text x="284.5" y="217" text-anchor="middle" class="cell">5.8m</text>
<line x1="13" y1="249" x2="307" y2="249" stroke="#cbd4d9"/>
<text x="13" y="270" class="note">Fits are candidate settings, not solutions.</text>
</svg>