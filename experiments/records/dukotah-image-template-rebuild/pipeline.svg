<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 430" role="img" aria-labelledby="title desc">
  <title id="title">Fresh image-template rebuild versus archived output</title>
  <desc id="desc">Exact 56 image inputs yield 646 line bands in both runs. The fresh run has 229 template classes versus 226 archived, and 233 count-matching lines versus 232 archived. Rune-label agreement has no held-out lines.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#202a32}
    .small{font-size:13px}.body{font-size:15px}.strong{font-size:17px;font-weight:700}
    .rule{stroke:#ccd4da;stroke-width:1}
  </style>
  <rect width="320" height="430" fill="#fff"/>
  <text class="strong" x="16" y="30">Rebuilding the image read</text>
  <text class="small" x="16" y="53">56 exact LP2 JPEGs · original four-stage code</text>
  <line class="rule" x1="16" x2="304" y1="68" y2="68"/>
  <text class="body" x="16" y="94">1. Find line bands</text>
  <text class="small" x="16" y="117">Archived and fresh: 646</text>
  <rect x="16" y="130" width="288" height="10" rx="5" fill="#dce6eb"/>
  <rect x="16" y="130" width="288" height="10" rx="5" fill="#315c73"/>
  <line class="rule" x1="16" x2="304" y1="163" y2="163"/>
  <text class="body" x="16" y="190">2. Group visible glyph shapes</text>
  <text class="small" x="16" y="214">Archived: 226 classes</text>
  <rect x="16" y="224" width="284" height="10" rx="5" fill="#8296a3"/>
  <text class="small" x="16" y="257">Fresh: 229 classes</text>
  <rect x="16" y="267" width="288" height="10" rx="5" fill="#315c73"/>
  <line class="rule" x1="16" x2="304" y1="298" y2="298"/>
  <text class="body" x="16" y="325">3. Match line lengths to text</text>
  <text class="small" x="16" y="348">Archived: 232 exact-count lines</text>
  <text class="small" x="16" y="369">Fresh: 233 exact-count lines</text>
  <rect x="16" y="390" width="288" height="25" rx="3" fill="#edf1f3"/>
  <text class="small" x="25" y="407">Rune labels: fitted in sample; 0 held out</text>
</svg>
