<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 330" role="img" aria-labelledby="title desc">
<title id="title">Direct readings of F gaps on LP2 pages</title>
<desc id="desc">Of 403 within-page consecutive F gaps, the four direct interpretations map 273, 157, 281, and 140 values, respectively. Every interpretation leaves gaps unmapped, so each needs another rule to form a complete symbol stream.</desc>
<rect width="340" height="330" fill="#fff"/>
<text x="16" y="30" font-family="sans-serif" font-size="18" fill="#202b32">Can every F gap be one rune?</text>
<text x="16" y="53" font-family="sans-serif" font-size="13" fill="#52616a">403 within-page gaps · no values skipped</text>
<text x="16" y="88" font-family="sans-serif" font-size="14" fill="#202b32">Distance → index</text>
<text x="252" y="88" font-family="sans-serif" font-size="14" fill="#365d71">273 / 403</text>
<rect x="16" y="96" width="308" height="14" fill="#d9dfe3"/>
<rect x="16" y="96" width="209" height="14" fill="#35637c"/>
<text x="16" y="143" font-family="sans-serif" font-size="14" fill="#202b32">Distance → prime</text>
<text x="252" y="143" font-family="sans-serif" font-size="14" fill="#365d71">157 / 403</text>
<rect x="16" y="151" width="308" height="14" fill="#d9dfe3"/>
<rect x="16" y="151" width="120" height="14" fill="#35637c"/>
<text x="16" y="198" font-family="sans-serif" font-size="14" fill="#202b32">Between → index</text>
<text x="252" y="198" font-family="sans-serif" font-size="14" fill="#365d71">281 / 403</text>
<rect x="16" y="206" width="308" height="14" fill="#d9dfe3"/>
<rect x="16" y="206" width="215" height="14" fill="#35637c"/>
<text x="16" y="253" font-family="sans-serif" font-size="14" fill="#202b32">Between → prime</text>
<text x="252" y="253" font-family="sans-serif" font-size="14" fill="#365d71">140 / 403</text>
<rect x="16" y="261" width="308" height="14" fill="#d9dfe3"/>
<rect x="16" y="261" width="107" height="14" fill="#35637c"/>
<path d="M16 299H324" stroke="#c7d0d5"/>
<text x="16" y="319" font-family="sans-serif" font-size="13" fill="#52616a">Gray gaps need an additional encoding rule.</text>
</svg>
