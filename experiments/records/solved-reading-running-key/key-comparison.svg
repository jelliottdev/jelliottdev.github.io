<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="title desc">
  <title id="title">Best whole-page scores from three running-key sources</title>
  <desc id="desc">The archived solved-reading key scored minus 5.897, above the maxima of sixteen shuffled keys and four disjoint GP-encoded Emerson windows. Higher is better, but the decoded page was not readable English.</desc>
  <rect width="340" height="280" fill="#fff"/>
  <text x="16" y="28" font-size="17" font-family="system-ui,sans-serif" font-weight="650" fill="#202c35">Best whole-page score</text>
  <text x="16" y="50" font-size="14" font-family="system-ui,sans-serif" fill="#52616b">Higher = more English-like; no reading</text>
  <text x="16" y="81" font-size="15" font-family="system-ui,sans-serif" fill="#202c35">Solved readings</text>
  <line x1="70" y1="103" x2="315" y2="103" stroke="#d7dee2" stroke-width="2"/>
  <circle cx="267" cy="103" r="6" fill="#245c78"/>
  <text x="261" y="91" font-size="15" font-family="system-ui,sans-serif" font-weight="650" fill="#245c78">−5.897</text>
  <text x="16" y="135" font-size="15" font-family="system-ui,sans-serif" fill="#202c35">16 shuffled keys</text>
  <line x1="70" y1="157" x2="315" y2="157" stroke="#d7dee2" stroke-width="2"/>
  <line x1="94" y1="157" x2="211" y2="157" stroke="#758a95" stroke-width="5" stroke-linecap="round"/>
  <circle cx="125" cy="157" r="5" fill="#405b69"/>
  <text x="16" y="187" font-size="15" font-family="system-ui,sans-serif" fill="#202c35">4 other English keys</text>
  <line x1="70" y1="209" x2="315" y2="209" stroke="#d7dee2" stroke-width="2"/>
  <circle cx="93" cy="209" r="4" fill="#858f96"/>
  <circle cx="139" cy="209" r="4" fill="#858f96"/>
  <circle cx="153" cy="209" r="4" fill="#858f96"/>
  <circle cx="184" cy="209" r="4" fill="#858f96"/>
  <line x1="70" y1="232" x2="315" y2="232" stroke="#65747d" stroke-width="1"/>
  <g font-size="13" font-family="system-ui,sans-serif" fill="#4b5a62" text-anchor="middle">
    <text x="70" y="252">−6.50</text><text x="152" y="252">−6.25</text><text x="233" y="252">−6.00</text><text x="315" y="252">−5.75</text>
  </g>
  <text x="16" y="274" font-size="13" font-family="system-ui,sans-serif" fill="#52616b">Dot on shuffle range marks the median.</text>
</svg>
