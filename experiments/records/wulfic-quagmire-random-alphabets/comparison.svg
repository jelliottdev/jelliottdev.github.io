<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 400" role="img" aria-labelledby="title desc">
<title id="title">Stage U Quagmire family decisions</title>
<desc id="desc">Six source key-value families, with four tied-or-independent pooled-or-sectioned tests per family. Each bar distinguishes excluded, not excluded and untestable settings.</desc>
<rect width="340" height="400" fill="#f5f6f7"/>
<text x="16" y="29" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#20262b">Quagmire family check</text>
<text x="16" y="52" font-family="Arial,sans-serif" font-size="14" fill="#4a545c">Four source settings per key family</text>
<text x="16" y="84" font-family="Arial,sans-serif" font-size="14" fill="#20262b">English runes</text>
<rect x="143" y="71" width="140" height="17" fill="#35627a"/>
<text x="289" y="84" font-family="Arial,sans-serif" font-size="13" fill="#20262b">4/4</text>
<text x="16" y="127" font-family="Arial,sans-serif" font-size="14" fill="#20262b">English primes</text>
<rect x="143" y="114" width="140" height="17" fill="#35627a"/>
<text x="289" y="127" font-family="Arial,sans-serif" font-size="13" fill="#20262b">4/4</text>
<text x="16" y="170" font-family="Arial,sans-serif" font-size="14" fill="#20262b">English A–Z</text>
<rect x="143" y="157" width="140" height="17" fill="#35627a"/>
<text x="289" y="170" font-family="Arial,sans-serif" font-size="13" fill="#20262b">4/4</text>
<text x="16" y="213" font-family="Arial,sans-serif" font-size="14" fill="#20262b">Decimal digits</text>
<rect x="143" y="200" width="140" height="17" fill="#35627a"/>
<text x="289" y="213" font-family="Arial,sans-serif" font-size="13" fill="#20262b">4/4</text>
<text x="16" y="256" font-family="Arial,sans-serif" font-size="14" fill="#20262b">Hex digits</text>
<rect x="143" y="243" width="140" height="17" fill="#35627a"/>
<text x="289" y="256" font-family="Arial,sans-serif" font-size="13" fill="#20262b">4/4</text>
<text x="16" y="299" font-family="Arial,sans-serif" font-size="14" fill="#20262b">Letters A–Z</text>
<rect x="143" y="286" width="140" height="17" fill="#dce2e6"/>
<text x="289" y="299" font-family="Arial,sans-serif" font-size="13" fill="#20262b">0/4</text>
<line x1="16" y1="336" x2="324" y2="336" stroke="#c6cdd2"/>
<rect x="16" y="351" width="12" height="12" fill="#35627a"/>
<text x="33" y="362" font-family="Arial,sans-serif" font-size="13" fill="#4a545c">Excluded</text>
<rect x="173" y="351" width="12" height="12" fill="#dce2e6"/>
<text x="190" y="362" font-family="Arial,sans-serif" font-size="13" fill="#4a545c">Untestable</text>
<text x="16" y="388" font-family="Arial,sans-serif" font-size="13" fill="#4a545c">Conditional family screen, not a decryption.</text>
</svg>
