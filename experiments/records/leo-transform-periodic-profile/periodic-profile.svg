<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 270" role="img" aria-labelledby="title desc">
<title id="title">Selected periodic score and the planted positive control</title>
<desc id="desc">The source peak has z 5.95, compared with shuffle median 4.02 and 95th percentile 5.03. A strong planted 13-cycle selects the multiple 143, but scored z 3.51, below most shuffle maxima.</desc>
<rect width="340" height="270" fill="#f3f5f6"/>
<text x="16" y="29" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#24323a">Period found; score unconvincing</text>
<text x="16" y="51" font-family="Arial,sans-serif" font-size="13" fill="#46535a">Highest z over five transforms and periods</text>
<text x="16" y="82" font-family="Arial,sans-serif" font-size="13" fill="#24323a">Shuffle median</text>
<rect x="141" y="70" width="94.0" height="16" fill="#657785"/>
<text x="241.0" y="82" font-family="Arial,sans-serif" font-size="13" fill="#24323a">4.02</text>
<text x="16" y="126" font-family="Arial,sans-serif" font-size="13" fill="#24323a">Shuffle 95th</text>
<rect x="141" y="114" width="117.7" height="16" fill="#657785"/>
<text x="264.7" y="126" font-family="Arial,sans-serif" font-size="13" fill="#24323a">5.03</text>
<text x="16" y="170" font-family="Arial,sans-serif" font-size="13" fill="#24323a">Source peak</text>
<rect x="141" y="158" width="139.2" height="16" fill="#27506a"/>
<text x="286.2" y="170" font-family="Arial,sans-serif" font-size="13" fill="#24323a">5.95</text>
<text x="16" y="214" font-family="Arial,sans-serif" font-size="13" fill="#24323a">Planted cycle</text>
<rect x="141" y="202" width="82.1" height="16" fill="#9a5e42"/>
<text x="229.1" y="214" font-family="Arial,sans-serif" font-size="13" fill="#24323a">3.51</text>
<text x="16" y="252" font-family="Arial,sans-serif" font-size="13" fill="#46535a">499 within-section rune shuffles</text>
</svg>
