<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 330" role="img" aria-labelledby="title desc">
  <title id="title">Static boundary model fit counts on supplied P20 numeric menus</title>
  <desc id="desc">Eight source-defined boundary contexts admit 34,020 state-pair assignments. Six sub-saturated joint affine complexity classes have zero complete fits. The saturated six-plus-six class has five, near an exact null expectation of 4.94; the conditioned chance of five or more is 0.552.</desc>
  <rect width="340" height="330" fill="#f7f8fa"/>
  <g font-family="system-ui, sans-serif" fill="#22303c">
    <text x="16" y="27" font-size="15" font-weight="700">P20: static boundary test</text>
    <text x="16" y="49" font-size="13">Source-supplied numeric state menus</text>
    <rect x="16" y="66" width="308" height="48" rx="3" fill="#e7ebef"/>
    <text x="27" y="87" font-size="14" font-weight="700">8 boundary contexts</text>
    <text x="27" y="105" font-size="13">34,020 permitted state assignments</text>
    <path d="M170 114V134" stroke="#7d8b96" stroke-width="2"/>
    <path d="M165 129L170 135L175 129" fill="none" stroke="#7d8b96" stroke-width="2"/>
    <text x="16" y="157" font-size="14" font-weight="700">Joint affine model fits</text>
    <text x="16" y="182" font-size="13">4+4, 4+5, 5+4, 5+5, 5+6, 6+5</text>
    <text x="306" y="182" text-anchor="end" font-size="14" font-weight="700">0</text>
    <path d="M16 195H324" stroke="#d1d7dd"/>
    <text x="16" y="218" font-size="13">Saturated 6+6</text>
    <text x="306" y="218" text-anchor="end" font-size="14" font-weight="700" fill="#286383">5</text>
    <path d="M16 232H324" stroke="#d1d7dd"/>
    <text x="16" y="255" font-size="14" font-weight="700">Are five surprising?</text>
    <text x="16" y="278" font-size="13">Exact null expectation: 4.94 fits</text>
    <text x="16" y="300" font-size="13">P(5 or more): 0.552</text>
    <text x="16" y="322" font-size="12">Conditional on the bundled input menus</text>
  </g>
</svg>
