<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 344" role="img" aria-labelledby="title desc">
  <title id="title">Two filter models, one visible repeat rate</title>
  <desc id="desc">A skip model and a rewrite model each predict 86 repeats per 12,955 adjacent pairs after fitting. The skip model consumes about 374 additional key draws; the rewrite model consumes zero.</desc>
  <rect width="340" height="344" fill="#f4f5f6"/>
  <text x="16" y="31" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#202b33">Same visible pattern</text>
  <text x="16" y="55" font-family="Arial,sans-serif" font-size="14" fill="#45545d">86 repeats among 12,955 adjacent pairs</text>
  <rect x="16" y="73" width="308" height="106" rx="5" fill="#fff" stroke="#c5ccd0"/>
  <rect x="16" y="191" width="308" height="106" rx="5" fill="#fff" stroke="#c5ccd0"/>
  <rect x="16" y="73" width="5" height="106" fill="#315e78"/>
  <rect x="16" y="191" width="5" height="106" fill="#697982"/>
  <text x="34" y="100" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#202b33">Skip a colliding key draw</text>
  <text x="34" y="125" font-family="Arial,sans-serif" font-size="14" fill="#45545d">Visible repeat rate: 86 / 12,955</text>
  <text x="34" y="151" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#315e78">About 374 extra key draws</text>
  <text x="34" y="218" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#202b33">Rewrite a colliding output</text>
  <text x="34" y="243" font-family="Arial,sans-serif" font-size="14" fill="#45545d">Visible repeat rate: 86 / 12,955</text>
  <text x="34" y="269" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#53646d">No extra key draws</text>
  <text x="16" y="322" font-family="Arial,sans-serif" font-size="13" fill="#53646d">Conditional on an independent uniform key.</text>
</svg>
