<svg xmlns="http://www.w3.org/2000/svg" width="320" height="355" viewBox="0 0 320 355" font-family="Arial, sans-serif" role="img" aria-labelledby="title desc"><title id="title">A known message is found at sampled offsets but missed between them</title><desc id="desc">Four of four on-grid full-reading plants recovered, zero of four off-grid plants recovered. The manuscript best source rank score is 117.9; the middle and highest of 49 full-search shuffles are 131.9 and 164.2; 41 shuffles reach at least the manuscript score.</desc><rect width="320" height="355" fill="#fff"/><text x="12" y="25" font-size="17" font-weight="bold" fill="#152e3b">Running-key source search</text><text x="12" y="52" font-size="14" fill="#3c515e">Full known reading recovered</text><text x="12" y="85" font-size="14">Sampled offset 300</text><rect x="171" y="66" width="108" height="25" fill="#2d6780"/><text x="309" y="85" text-anchor="end" font-size="14" fill="#25343d">4 / 4</text><text x="12" y="125" font-size="14">Unsampled offset 137</text><rect x="171" y="106" width="108" height="25" fill="#e5e9eb"/><text x="309" y="125" text-anchor="end" font-size="14">0 / 4</text><line x1="12" y1="150" x2="308" y2="150" stroke="#c9d0d4"/><text x="12" y="176" font-size="14" fill="#3c515e">Best source rank score</text><text x="12" y="208" font-size="14">LP2 best</text><rect x="140" y="193" width="97.8" height="19" fill="#2d6780"/><text x="302" y="208" text-anchor="end" font-size="14">118</text><text x="12" y="249" font-size="14">Shuffle middle</text><rect x="140" y="234" width="109.5" height="19" fill="#879ba6"/><text x="302" y="249" text-anchor="end" font-size="14">132</text><text x="12" y="290" font-size="14">Shuffle highest</text><rect x="140" y="275" width="136.3" height="19" fill="#5b6d76"/><text x="302" y="290" text-anchor="end" font-size="14">164</text><text x="12" y="320" font-size="14" fill="#243b46">41 of 49 shuffled searches scored as high.</text><text x="12" y="342" font-size="12" fill="#52636a">A source score is not a verified reading.</text></svg>
