<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 444" role="img" aria-labelledby="title desc">
<title id="title">Keyed OutGuess retrievals on 58 LP2 images</title>
<desc id="desc">Count of nonempty outputs for each of six keys; none is authenticated as a message.</desc>
<rect width="320" height="444" fill="#f3f4f6"/>
<text x="16" y="29" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#263238">Nonempty outputs by key</text>
<text x="16" y="51" font-family="Arial,sans-serif" font-size="13" fill="#52606a">Original LP2 JPEGs · 58 images per key</text>
<text x="16" y="83" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#263238">3301</text>
<rect x="16" y="93" width="244" height="14" fill="#dce1e4"/>
<rect x="16" y="93" width="100.97" height="14" fill="#355f75"/>
<text x="268" y="105" font-family="Arial,sans-serif" font-size="13" fill="#263238">24/58</text>
<text x="16" y="136" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#263238">LIBER PRIMUS</text>
<rect x="16" y="146" width="244" height="14" fill="#dce1e4"/>
<rect x="16" y="146" width="239.79" height="14" fill="#355f75"/>
<text x="268" y="158" font-family="Arial,sans-serif" font-size="13" fill="#263238">57/58</text>
<text x="16" y="189" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#263238">GEMATRIA PRIMUS</text>
<rect x="16" y="199" width="244" height="14" fill="#dce1e4"/>
<rect x="16" y="199" width="197.72" height="14" fill="#355f75"/>
<text x="268" y="211" font-family="Arial,sans-serif" font-size="13" fill="#263238">47/58</text>
<text x="16" y="242" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#263238">CIRCUMFERENCE</text>
<rect x="16" y="252" width="244" height="14" fill="#dce1e4"/>
<rect x="16" y="252" width="244.0" height="14" fill="#355f75"/>
<text x="268" y="264" font-family="Arial,sans-serif" font-size="13" fill="#263238">58/58</text>
<text x="16" y="295" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#263238">DIVINITY</text>
<rect x="16" y="305" width="244" height="14" fill="#dce1e4"/>
<rect x="16" y="305" width="143.03" height="14" fill="#355f75"/>
<text x="268" y="317" font-family="Arial,sans-serif" font-size="13" fill="#263238">34/58</text>
<text x="16" y="348" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#263238">SELF-RELIANCE</text>
<rect x="16" y="358" width="244" height="14" fill="#dce1e4"/>
<rect x="16" y="358" width="50.48" height="14" fill="#355f75"/>
<text x="268" y="370" font-family="Arial,sans-serif" font-size="13" fill="#263238">12/58</text>
<line x1="16" y1="397" x2="304" y2="397" stroke="#c4ccd1"/>
<text x="16" y="419" font-family="Arial,sans-serif" font-size="13" fill="#35434a">A bar means bytes were returned.</text>
<text x="16" y="436" font-family="Arial,sans-serif" font-size="13" fill="#35434a">It does not identify a message.</text>
</svg>
