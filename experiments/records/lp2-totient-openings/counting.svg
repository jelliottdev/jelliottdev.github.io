<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" role="img" aria-labelledby="title desc">
<title id="title">Counting coprime integers</title>
<desc id="desc">For eight, count 1, 3, 5 and 7. For nine, count 1, 2, 4, 5, 7 and 8. Crossed numbers share a divisor greater than one with the row input.</desc>
<rect width="440" height="330" fill="#f7f7f3"/>
<g font-family="sans-serif" fill="#263b46">
<text x="18" y="32" font-size="22">What the totient counts</text>
<text x="18" y="60" font-size="16">Count k when gcd(k, n) = 1.</text>
<text x="18" y="97" font-size="19">n = 8: φ(8) = 4</text>
<circle cx="29" cy="133" r="19" fill="white" stroke="#647b86"/>
<text x="29" y="139" text-anchor="middle" font-size="18">1</text>
<circle cx="75" cy="133" r="19" fill="white" stroke="#647b86"/>
<text x="75" y="139" text-anchor="middle" font-size="18">2</text>
<path d="M60 148L90 118" stroke="#9b4035" stroke-width="2"/>
<circle cx="121" cy="133" r="19" fill="white" stroke="#647b86"/>
<text x="121" y="139" text-anchor="middle" font-size="18">3</text>
<circle cx="167" cy="133" r="19" fill="white" stroke="#647b86"/>
<text x="167" y="139" text-anchor="middle" font-size="18">4</text>
<path d="M152 148L182 118" stroke="#9b4035" stroke-width="2"/>
<circle cx="213" cy="133" r="19" fill="white" stroke="#647b86"/>
<text x="213" y="139" text-anchor="middle" font-size="18">5</text>
<circle cx="259" cy="133" r="19" fill="white" stroke="#647b86"/>
<text x="259" y="139" text-anchor="middle" font-size="18">6</text>
<path d="M244 148L274 118" stroke="#9b4035" stroke-width="2"/>
<circle cx="305" cy="133" r="19" fill="white" stroke="#647b86"/>
<text x="305" y="139" text-anchor="middle" font-size="18">7</text>
<circle cx="351" cy="133" r="19" fill="white" stroke="#647b86"/>
<text x="351" y="139" text-anchor="middle" font-size="18">8</text>
<path d="M336 148L366 118" stroke="#9b4035" stroke-width="2"/>
<text x="18" y="199" font-size="19">n = 9: φ(9) = 6</text>
<circle cx="29" cy="235" r="19" fill="white" stroke="#647b86"/>
<text x="29" y="241" text-anchor="middle" font-size="18">1</text>
<circle cx="75" cy="235" r="19" fill="white" stroke="#647b86"/>
<text x="75" y="241" text-anchor="middle" font-size="18">2</text>
<circle cx="121" cy="235" r="19" fill="white" stroke="#647b86"/>
<text x="121" y="241" text-anchor="middle" font-size="18">3</text>
<path d="M106 250L136 220" stroke="#9b4035" stroke-width="2"/>
<circle cx="167" cy="235" r="19" fill="white" stroke="#647b86"/>
<text x="167" y="241" text-anchor="middle" font-size="18">4</text>
<circle cx="213" cy="235" r="19" fill="white" stroke="#647b86"/>
<text x="213" y="241" text-anchor="middle" font-size="18">5</text>
<circle cx="259" cy="235" r="19" fill="white" stroke="#647b86"/>
<text x="259" y="241" text-anchor="middle" font-size="18">6</text>
<path d="M244 250L274 220" stroke="#9b4035" stroke-width="2"/>
<circle cx="305" cy="235" r="19" fill="white" stroke="#647b86"/>
<text x="305" y="241" text-anchor="middle" font-size="18">7</text>
<circle cx="351" cy="235" r="19" fill="white" stroke="#647b86"/>
<text x="351" y="241" text-anchor="middle" font-size="18">8</text>
<circle cx="397" cy="235" r="19" fill="white" stroke="#647b86"/>
<text x="397" y="241" text-anchor="middle" font-size="18">9</text>
<path d="M382 250L412 220" stroke="#9b4035" stroke-width="2"/>
<text x="18" y="289" font-size="16">Crossed numbers are not counted.</text>
<text x="18" y="314" font-size="16">Coprime to n does not mean prime.</text>
</g></svg>
